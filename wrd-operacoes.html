/* ---------- tabelas ---------- */

/* ---------- filtros ---------- */

.filtros { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--min-filtro), 1fr)); gap: var(--esp-2) var(--esp-3); margin: var(--esp-2) 0; align-items: end; }

/* ---------- visão geral ---------- */
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--min-kpi), 1fr)); gap: var(--esp-3); margin-bottom: var(--esp-4); }

.b-val { display: block; height: 100%; background: var(--cor-primaria); border-radius: var(--raio-sm); min-width: var(--esp-0); }

/* ---------- kanban ---------- */
.alternar { display: inline-flex; border: var(--borda) solid var(--n-300); border-radius: var(--raio); overflow: hidden; }
.alternar button { border: 0; background: var(--n-0); padding: 0 var(--esp-4); min-height: var(--altura-busca); cursor: pointer; font-weight: var(--peso-medio); color: var(--n-700); }

/* ---------- modal ---------- */
.modal-fundo { position: fixed; inset: 0; background: var(--sobreposicao); z-index: var(--z-modal); display: flex; align-items: flex-start; justify-content: center; padding: var(--margem-modal) var(--esp-3); overflow-y: auto; }

.sub-abas { display: flex; gap: var(--esp-1); flex-wrap: wrap; margin-bottom: var(--esp-3); }
.sub-abas button { border: var(--borda) solid var(--n-300); background: var(--n-0); border-radius: var(--raio-pilula); padding: var(--esp-1) var(--esp-3); cursor: pointer; font-size: var(--fs-sm); font-weight: var(--peso-medio); color: var(--n-700); }

.kvs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--esp-2) var(--esp-4); margin: 0 0 var(--esp-3); }

.anexos { border: var(--borda) solid var(--n-200); border-radius: var(--raio); padding: var(--esp-2) var(--esp-3); }

.lista-anexos { margin: 0 0 var(--esp-2); padding-left: var(--esp-4); font-size: var(--fs-sm); }
.coments { list-style: none; padding: 0; margin: 0 0 var(--esp-3); display: grid; gap: var(--esp-2); }
.coment { border: var(--borda) solid var(--n-200); border-radius: var(--raio); padding: var(--esp-2) var(--esp-3); }

.prog { display: inline-block; width: var(--largura-progresso); height: var(--esp-2); background: var(--n-100); border-radius: var(--raio-sm); overflow: hidden; vertical-align: middle; }

/* ---------- toasts ---------- */
.toasts { position: fixed; right: var(--esp-4); bottom: var(--esp-4); display: grid; gap: var(--esp-2); z-index: var(--z-aviso); max-width: min(var(--largura-toast), calc(var(--largura-tela) - var(--esp-6))); }
.toast { padding: var(--esp-3) var(--esp-4); border-radius: var(--raio); box-shadow: var(--sombra-lg); background: var(--n-900); color: var(--n-0); font-size: var(--fs-sm); }

/* ---------- entrada ---------- */
.entrada { min-height: var(--altura-tela); display: flex; align-items: center; justify-content: center; padding: var(--esp-4); background: linear-gradient(160deg, var(--cor-primaria-suave), var(--n-50)); }
.entrada-box { background: var(--n-0); border-radius: var(--raio-lg); box-shadow: var(--sombra-lg); padding: var(--esp-6) var(--esp-5); width: 100%; max-width: var(--largura-entrada); text-align: center; }

/* ---------- clientes ---------- */
.lista-cli .cartao.arquivado { opacity: var(--op-arquivado); }
.lista-uni { margin: var(--esp-1) 0 0; padding-left: var(--esp-4); }

/* ---------- cronograma ---------- */
.legenda { display: flex; flex-wrap: wrap; gap: var(--esp-2) var(--esp-4); margin-bottom: var(--esp-2); color: var(--n-700); align-items: center; }
.lg { display: inline-block; width: var(--fs-icone); height: var(--fs-2xs); border-radius: var(--raio-xs); vertical-align: middle; margin-right: var(--esp-1); }
.lg.prev { background: var(--cor-primaria-clara); border: var(--borda) solid var(--cor-primaria-media); }
.lg.efet { background: var(--cor-primaria); height: calc(var(--esp-1) + var(--borda)); }
.lg.atras { background: var(--critico-fundo); border: var(--borda) solid var(--critico); }
.lg.bloq { background: repeating-linear-gradient(135deg, var(--critico-fundo), var(--critico-fundo) var(--raio-xs), var(--critico) var(--raio-xs), var(--critico) var(--listra)); }
.lg.dep { height: var(--borda-forte); background: var(--n-500); }
.lg-hoje { color: var(--critico); font-weight: var(--peso-forte); }

.g-rot { display: flex; align-items: center; padding: 0 var(--esp-2) 0 var(--esp-4); border-bottom: var(--borda) solid var(--n-100); font-size: var(--fs-sm); white-space: nowrap; overflow: hidden; }

.g-rot-s { padding-left: var(--esp-2); background: var(--n-50); }
.g-rot-s.bloq { background: var(--critico-fundo); }
.g-dir { overflow-x: auto; position: relative; }

.g-mes { position: absolute; top: 0; height: var(--gantt-cab-linha); border-left: var(--borda) solid var(--n-300); font-size: var(--fs-xs); font-weight: var(--peso-forte); padding: var(--raio-xs) var(--esp-1); color: var(--n-700); overflow: hidden; white-space: nowrap; }
.g-dia { position: absolute; top: var(--gantt-cab-linha); height: var(--gantt-cab-linha); font-size: var(--fs-2xs); text-align: center; color: var(--n-500); border-left: var(--borda) solid var(--n-100); padding-top: var(--esp-1); }
.g-dia.fds { background: var(--n-100); }
.g-corpo { position: relative; }
.g-fds { position: absolute; top: 0; bottom: 0; background: var(--n-50); }
.g-lmes { position: absolute; top: 0; bottom: 0; border-left: var(--borda) solid var(--n-200); }
.g-linha { position: absolute; left: 0; right: 0; height: var(--rh); border-bottom: var(--borda) solid var(--n-100); }
.g-linha.s { background: var(--azul-03); }

.g-faixa.atras { background: var(--critico-fundo); border-color: var(--critico); }
.g-faixa.bloq { background: repeating-linear-gradient(135deg, var(--critico-fundo), var(--critico-fundo) var(--listra), var(--critico) var(--listra), var(--critico) calc(var(--listra) + var(--borda))); border-color: var(--critico); }
.g-marco { position: absolute; font-size: var(--fs-icone-sm); line-height: var(--lh-icone); color: var(--cor-primaria-escura); z-index: var(--z-topo); pointer-events: none; }

.g-barra { position: absolute; height: var(--fs-icone-sm); border-radius: var(--raio-sm); background: var(--cor-primaria-clara); border: var(--borda) solid var(--cor-primaria-media); cursor: grab; z-index: var(--z-acima); overflow: hidden; touch-action: pan-y; }

.g-barra.bloq { background: repeating-linear-gradient(135deg, var(--cor-primaria-clara), var(--cor-primaria-clara) var(--listra), var(--critico-fundo) var(--listra), var(--critico-fundo) var(--listra-2)); }

/* ---------- relatórios ---------- */
.rel-grade { display: grid; grid-template-columns: minmax(var(--rel-cfg-min), var(--rel-cfg-max)) 1fr; gap: var(--esp-4); align-items: start; }

.campos-rel li.bloqueado { color: var(--n-500); }
.prev-aviso { background: var(--cor-primaria-suave); border: var(--borda) solid var(--cor-primaria-clara); color: var(--cor-primaria-escura); padding: var(--esp-2) var(--esp-3); border-radius: var(--raio); margin-bottom: var(--esp-3); font-size: var(--fs-sm); font-weight: var(--peso-medio); }

.doc { background: var(--n-0); border: var(--borda) solid var(--n-200); box-shadow: var(--sombra); padding: var(--doc-pad-v) var(--doc-pad-h); font-size: var(--doc-fs); color: var(--n-900); overflow-x: auto; }

.doc-emp { color: var(--n-500); }
.doc-selo { margin-left: auto; border: var(--borda-forte) solid var(--alerta); color: var(--alerta); font-weight: var(--peso-forte); padding: var(--esp-0) var(--esp-3); border-radius: var(--raio-sm); letter-spacing: var(--ls-lg); }
.doc h2 { font-size: var(--doc-fs-secao); margin: var(--esp-4) 0 var(--esp-1); color: var(--cor-primaria-escura); border-bottom: var(--borda) solid var(--n-200); padding-bottom: var(--raio-xs); }
.doc-meta { width: 100%; border-collapse: collapse; margin-bottom: var(--esp-2); }

.doc-tab { width: 100%; border-collapse: collapse; margin-bottom: var(--esp-1); }
.doc-tab th { background: var(--cor-primaria); color: var(--n-0); text-align: left; padding: var(--esp-1) var(--esp-1); font-weight: var(--peso-medio); font-size: var(--doc-fs-cab-tabela); }

.doc-tab tr:nth-child(even) td { background: var(--n-50); }
.doc-rod { margin-top: var(--esp-5); border-top: var(--borda) solid var(--n-200); padding-top: var(--esp-1); color: var(--n-500); font-size: var(--doc-fs-rodape); text-align: center; }
#area-impressao { display: none; }
.st-confirmado { background: var(--ok-fundo); color: var(--ok); }
.st-a-validar { background: var(--alerta-fundo); color: var(--alerta); }
.st-hipotese { background: var(--cor-primaria-suave); color: var(--cor-primaria); border-color: var(--cor-primaria-clara); }
.st-nao-informado { background: var(--n-100); color: var(--n-700); }
.manifesto { white-space: pre-wrap; background: var(--n-50); padding: var(--esp-3); border-radius: var(--raio); font-size: var(--fs-xs); font-family: var(--fonte-mono); margin: 0; overflow-x: auto; }
.calc-vivo { margin: 0; font-size: var(--fs-sm); color: var(--n-700); background: var(--n-50); border-left: var(--borda-forte) solid var(--cor-primaria-media); padding: var(--esp-1) var(--esp-2); border-radius: var(--raio-sm); min-height: var(--altura-controle-sm); }
.calc-vivo:empty { display: none; }
.acoes-rapidas { margin-top: var(--esp-2); }
.lista-colunas { margin: 0; padding-left: var(--esp-4); font-size: var(--fs-sm); columns: 2; }
.lista-colunas code { font-family: var(--fonte-mono); color: var(--cor-primaria-escura); }
.form-largo { max-width: var(--largura-form); }
.form-estreito { max-width: var(--largura-form-sm); }
.texto-copia { width: 100%; font-family: var(--fonte-mono); font-size: var(--fs-sm); margin: var(--esp-2) 0; }
.carregando { padding: var(--esp-7) var(--esp-4); text-align: center; color: var(--n-500); font-size: var(--fs-lg); }
.carregando::before { content: ""; display: block; width: var(--icone-carregando); height: var(--icone-carregando); margin: 0 auto var(--esp-3); border: var(--borda-aba) solid var(--cor-primaria-clara); border-top-color: var(--cor-primaria); border-radius: var(--raio-pilula); animation: girar var(--dur-giro) linear infinite; }
@keyframes girar { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .carregando::before { animation: none; } }

/* ---------- responsivo ---------- */
@media (max-width: 1100px) {
  .g3 { grid-template-columns: 1fr; }
  .rel-grade { grid-template-columns: 1fr; }
}
@media (max-width: 760px) {
  .topo-in { flex-wrap: wrap; padding: var(--esp-2) var(--esp-3); gap: var(--esp-2); }
  .topo .modulo { display: none; }
  .busca-global { order: 5; flex-basis: 100%; max-width: none; }
  .topo .usuario { margin-left: auto; }
  main { padding: var(--esp-2) var(--esp-3) var(--esp-6); }
  .g2, .kvs { grid-template-columns: 1fr; }
  .filtros { grid-template-columns: 1fr 1fr; }
  .filtros .busca, .campo-periodo { grid-column: 1 / -1; }
  .kanban { grid-template-columns: repeat(6, var(--largura-coluna-celular)); scroll-snap-type: x mandatory; }
  .col { scroll-snap-align: start; }
  .kpis { grid-template-columns: 1fr 1fr; }
  .kpi { padding: var(--esp-2) var(--esp-3); }
  .kpi .val { font-size: var(--fs-xl); }
  .modal-fundo { padding: 0; }
  .modal, .modal.largo { max-width: none; min-height: var(--altura-tela); border-radius: 0; }
  .modal-cab { border-radius: 0; }
  .modal-corpo { padding: var(--esp-3); }
  .gantt { grid-template-columns: var(--gantt-rotulo-celular) 1fr; }
  .g-rot { padding-left: var(--esp-2); }
  .ed-linha { flex-wrap: wrap; }
  .ed-linha input { flex: 1 1 40%; }
  .doc { padding: var(--esp-4); }
  .cab-tela h1 { font-size: var(--fs-lg); }
  .barra-l { grid-template-columns: minmax(var(--min-rotulo-barra), 40%) 1fr auto; }
}

/* ---------- impressão ---------- */
/* exceção: @page e suas margens não aceitam variáveis CSS */
@page { size: A4; margin: 12mm 12mm 16mm 12mm;
  @bottom-left { content: "WRD Soluções · Módulo Operações"; font-size: 8pt; color: #737881; }
  @bottom-right { content: "Página " counter(page) " de " counter(pages); font-size: 8pt; color: #737881; }
}
@media print {
  body { background: var(--n-0); }
  body.imprimindo-doc #app, body.imprimindo-doc #toasts, body.imprimindo-doc .modal-fundo { display: none !important; }
  body.imprimindo-doc #area-impressao { display: block; }
  body:not(.imprimindo-doc) .topo, body:not(.imprimindo-doc) .nav, body:not(.imprimindo-doc) .filtros-box, body:not(.imprimindo-doc) .btn, body:not(.imprimindo-doc) #toasts { display: none !important; }
  .doc { border: 0; box-shadow: none; padding: 0; font-size: var(--doc-fs-impressao); overflow: visible; }
  .doc-tab tr { page-break-inside: avoid; }
  .doc-tab thead { display: table-header-group; }
  .doc h2 { page-break-after: avoid; }
  .doc-tab th, .doc-tab td, .doc-cab { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}

</style>
</head>

<script>
/* =====================================================================
   WRD NUVEM — sincronização dos módulos WRD (Operações, Comercial, Financeiro) com o Supabase "WRD Sistemas".
   Arquivo compartilhado: cada build.js inclui este arquivo. Sem DOM no cliente e no sincronizador.
   - Login por e-mail e senha (Supabase Auth), uma vez por aparelho; o login do módulo continua como antes.
   - Cada módulo guarda UM estado (tabela estado_modulo); só membros do módulo leem; só a função
     salvar_estado grava, com controle de versão (quem estiver desatualizado recebe CONFLITO e mescla).
   - Mesclagem: registros (listas com id) pelo mais recente (updatedAt); contadores pelo maior valor;
     o resto pelo estado gravado por último. Os módulos não excluem registros (arquivam), então juntar não perde dados.
   A chave abaixo é a chave PUBLICÁVEL do projeto (feita para ficar no navegador); a proteção é feita pelas regras do banco.
   ===================================================================== */
const WRDNuvem = (function () {
  'use strict';
  const CONFIG = { url: 'https://dqaejvkfudewwudghezp.supabase.co', chave: 'sb_publishable_CpC0CZAsU_yDqxvtRgUdsQ_vD9r-pWQ', projeto: 'WRD Sistemas' };
  const clone = o => JSON.parse(JSON.stringify(o));
  const ehObj = o => o && typeof o === 'object' && !Array.isArray(o);
  const carimbo = x => String((x && (x.updatedAt || x.ts || x.createdAt)) || '');
  function erro(msg, code) { const e = new Error(msg); e.code = code; return e; }
  const MSG = {
    'Invalid login credentials': 'E-mail ou senha incorretos.',
    'Email not confirmed': 'Confirme o e-mail: abra a mensagem enviada pelo Supabase e clique no link.',
    'User already registered': 'Este e-mail já tem acesso. Use "Entrar".',
    SEM_ACESSO: 'Seu acesso a este módulo ainda não foi liberado. Peça ao administrador.',
    CONFLITO: 'Os dados mudaram em outro aparelho.'
  };

  /* ---------- cliente REST (Auth + PostgREST), sem biblioteca externa ---------- */
  function cliente(o) {
    const modulo = o.modulo, guarda = o.guarda, guardaSessao = o.guardaSessao || o.guarda, f = o.fetchFn || ((...a) => fetch(...a)), agora = o.agora || (() => Date.now());
    let sessao = null; try { sessao = JSON.parse(guardaSessao.get('nuvem.sessao') || 'null'); } catch (e) { sessao = null; }
    const gravarSessao = s => { sessao = s; if (s) guardaSessao.set('nuvem.sessao', JSON.stringify(s)); else guardaSessao.remove('nuvem.sessao'); };
    const deResposta = j => ({ access_token: j.access_token, refresh_token: j.refresh_token, expires_at: j.expires_at ? j.expires_at * 1000 : agora() + (j.expires_in || 3600) * 1000, user: { id: j.user && j.user.id, email: j.user && j.user.email } });
    async function http(caminho, opc, autenticar) {
      const h = { apikey: CONFIG.chave, 'Content-Type': 'application/json' };
      if (autenticar) { await garantirToken(); h.Authorization = 'Bearer ' + sessao.access_token; }
      let r;
      try { r = await f(CONFIG.url + caminho, Object.assign({}, opc, { headers: Object.assign({}, h, (opc && opc.headers) || {}) })); } catch (e) { throw erro('Sem conexão com a nuvem.', 'OFFLINE'); }
      const txt = await r.text(); let j = null; try { j = txt ? JSON.parse(txt) : null; } catch (e) { j = txt; }
      if (!r.ok) {
        const m = (j && (j.message || j.msg || j.error_description || j.error)) || ('HTTP ' + r.status);
        const code = /CONFLITO/.test(m) ? 'CONFLITO' : /SEM_ACESSO/.test(m) ? 'SEM_ACESSO' : /USUARIO_NAO_CADASTRADO/.test(m) ? 'USUARIO_NAO_CADASTRADO' : r.status === 401 ? 'AUTH' : 'NUVEM';
        if (code === 'AUTH' && autenticar) gravarSessao(null);
        throw erro(MSG[code] || MSG[m] || m, code);
      }
      return j;
    }
    async function garantirToken() {
      if (!sessao) throw erro('Entre com o seu e-mail para usar a nuvem.', 'AUTH');
      if (sessao.expires_at - agora() > 60000) return;
      try { gravarSessao(deResposta(await http('/auth/v1/token?grant_type=refresh_token', { method: 'POST', body: JSON.stringify({ refresh_token: sessao.refresh_token }) }, false))); }
      catch (e) { if (e.code !== 'OFFLINE') gravarSessao(null); throw e; }
    }
    return {
      modulo,
      conectado: () => !!sessao,
      usuario: () => (sessao ? sessao.user : null),
      async entrar(email, senha) { gravarSessao(deResposta(await http('/auth/v1/token?grant_type=password', { method: 'POST', body: JSON.stringify({ email: String(email).trim(), password: senha }) }, false))); return sessao.user; },
      async cadastrar(email, senha) {
        if (String(senha || '').length < 8) throw erro('A senha da nuvem precisa de pelo menos 8 caracteres.', 'SENHA');
        const j = await http('/auth/v1/signup', { method: 'POST', body: JSON.stringify({ email: String(email).trim(), password: senha }) }, false);
        if (j && j.access_token) { gravarSessao(deResposta(j)); return { entrou: true }; }
        return { confirmar: true };
      },
      async sair() { try { if (sessao) await http('/auth/v1/logout', { method: 'POST' }, true); } catch (e) { /* sai mesmo sem conexão */ } gravarSessao(null); },
      async acesso() { const l = await http('/rest/v1/membros?select=modulo,papel', { method: 'GET' }, true); return (l || []).find(x => x.modulo === modulo) || null; },
      async ler() { const l = await http(`/rest/v1/estado_modulo?modulo=eq.${modulo}&select=dados,versao,atualizado_em,aparelho`, { method: 'GET' }, true); return l && l[0] ? l[0] : null; },
      async salvar(dados, versao, aparelho) { return http('/rest/v1/rpc/salvar_estado', { method: 'POST', body: JSON.stringify({ p_modulo: modulo, p_dados: dados, p_versao: versao, p_aparelho: aparelho || null }) }, true); },
      async uso() { return http('/rest/v1/rpc/uso_modulos', { method: 'POST', body: '{}' }, true); },
      /** Demandas aprovadas no Comercial aguardando este módulo (tabela importacoes, status pendente). */
      async pendencias() { return (await http(`/rest/v1/importacoes?modulo=eq.${modulo}&status=eq.pendente&select=*&order=criado_em.asc`, { method: 'GET' }, true)) || []; },
      /** Marca a demanda como recebida por este módulo (o registro da fila permanece). A regra do banco exige status 'importado' e revisado_por = quem está logado. */
      async marcarRecebida(id) { const uid = sessao && sessao.user ? sessao.user.id : null; return http(`/rest/v1/importacoes?id=eq.${encodeURIComponent(id)}`, { method: 'PATCH', headers: { Prefer: 'return=minimal' }, body: JSON.stringify({ status: 'importado', revisado_por: uid, revisado_em: new Date().toISOString() }) }, true); },
      /** Envia um PDF ao bucket privado "documentos" (pasta do módulo). Devolve o caminho guardado no registro. */
      async enviarPdf(blob) {
        await garantirToken();
        const caminho = modulo + '/' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10) + '.pdf';
        let r;
        try { r = await f(CONFIG.url + '/storage/v1/object/documentos/' + caminho, { method: 'POST', headers: { apikey: CONFIG.chave, Authorization: 'Bearer ' + sessao.access_token, 'Content-Type': 'application/pdf' }, body: blob }); }
        catch (e) { throw erro('Sem conexão com a nuvem.', 'OFFLINE'); }
        if (!r.ok) { const t = await r.text(); throw erro(/exceeded|too large|size/i.test(t) ? 'O PDF passa do limite de 25 MB.' : 'Não foi possível enviar o arquivo (' + r.status + ').', 'ENVIO'); }
        return caminho;
      },
      /** Link temporário (1 hora) para abrir um PDF do bucket privado. */
      async linkPdf(caminho) { const j = await http('/storage/v1/object/sign/documentos/' + caminho, { method: 'POST', body: JSON.stringify({ expiresIn: 3600 }) }, true); return CONFIG.url + '/storage/v1' + j.signedURL; },
      /** Publica um evento na tabela eventos (somente de inserção). Quem grava é o próprio usuário logado. */
      async publicarEvento(tipo, entidadeId, payload) {
        const uid = sessao && sessao.user ? sessao.user.id : null;
        return http('/rest/v1/eventos', { method: 'POST', headers: { Prefer: 'return=minimal' }, body: JSON.stringify({ tipo, modulo, entidade_id: entidadeId ? String(entidadeId) : null, payload: payload || {}, criado_por: uid }) }, true);
      },
      async adicionarMembro(email, papel) { return http('/rest/v1/rpc/adicionar_membro', { method: 'POST', body: JSON.stringify({ p_email: email, p_modulo: modulo, p_papel: papel || 'membro' }) }, true); }
    };
  }

  /* ---------- mesclagem de dois estados do mesmo módulo ---------- */
  function mesclarValor(L, R, chave, localMaisNovo) {
    if (Array.isArray(L) && Array.isArray(R) && L.concat(R).every(x => ehObj(x) && x.id != null)) {
      const m = new Map(R.map(x => [x.id, x]));
      for (const x of L) { const y = m.get(x.id); if (!y || carimbo(x) > carimbo(y)) m.set(x.id, x); }
      return [...m.values()];
    }
    if (ehObj(L) && ehObj(R)) {
      const out = {};
      for (const k of new Set([...Object.keys(R), ...Object.keys(L)])) out[k] = k in L ? (k in R ? mesclarValor(L[k], R[k], k, localMaisNovo) : L[k]) : R[k];
      if (/^(seq|contadores|sequencias)$/.test(chave)) for (const k of Object.keys(out)) if (typeof L[k] === 'number' && typeof R[k] === 'number') out[k] = Math.max(L[k], R[k]);
      return out;
    }
    if (chave === 'ultimoOficial' && /^\d+$/.test(L) && /^\d+$/.test(R)) return String(Math.max(+L, +R));
    return localMaisNovo ? L : R;
  }
  /** Junta o estado local (com alterações ainda não enviadas) e o remoto. */
  function mesclar(local, remoto) {
    if (!remoto) return clone(local);
    if (!local) return clone(remoto);
    const out = mesclarValor(clone(local), clone(remoto), '', carimbo(local) > carimbo(remoto));
    out.updatedAt = [carimbo(local), carimbo(remoto)].sort().pop() || out.updatedAt;
    return out;
  }

  /* ---------- sincronizador: estado local (localStorage) <-> nuvem ---------- */
  function sincronizador(o) {
    const cli = o.cliente, local = o.local, aparelho = o.aparelho || '', avisar = o.aoStatus || (() => {}), recarregar = o.aoRecarregar || (() => {});
    const lerMeta = () => { try { return JSON.parse(local.get('nuvem.meta') || 'null') || { versao: 0, pendente: false }; } catch (e) { return { versao: 0, pendente: false }; } };
    const gravarMeta = m => local.set('nuvem.meta', JSON.stringify(m));
    let meta = lerMeta(), enviando = null, geracao = 0, tmr = null, repetir = null, ultimo = null;
    const status = (s, extra) => { const st = Object.assign({ situacao: s, pendente: meta.pendente, versao: meta.versao, ultimo }, extra || {}); avisar(st); return st; };
    const estadoLocal = () => { const r = local.get('state'); return r ? JSON.parse(r) : null; };
    async function puxar() {
      if (enviando) await enviando.catch(() => {});
      status('sincronizando');
      let r; try { r = await cli.ler(); } catch (e) { return falha(e); }
      meta = lerMeta();
      const loc = estadoLocal();
      if (!r) { if (loc) { meta.pendente = true; gravarMeta(meta); return enviar(); } ultimo = new Date(); return status('ok'); }
      if (r.versao === meta.versao) { if (meta.pendente) return enviar(); ultimo = new Date(); return status('ok'); }
      // primeiro uso deste aparelho com dados já guardados nele: junta, nunca substitui

    /* ---------- atividades ---------- */
    const CAMPOS_ATV_LOG = [['titulo', 'Título'], ['responsavelId', 'Responsável', fU], ['inicio', 'Início', fD], ['vencimento', 'Vencimento', fD],
      ['situacao', 'Situação', v => SIT_ATIV[v] || '—'], ['prioridade', 'Prioridade', v => PRIORIDADES[v] || '—'], ['conclusao', 'Conclusão', fD],

    function salvarAtividade(d, o = {}) {

      const s = exigirServico(ex ? ex.servicoId : d.servicoId);

        servicoId: s.id, titulo, descricao: txt(d.descricao), responsavelId: validarUserId(d.responsavelId, 'o responsável', true),

          if (antes.descricao !== ex.descricao) log({ acao: 'atividade.alterado', entidade: 'atividade', entidadeId: ex.id, codigo: ex.codigo, servicoId: s.id, campo: 'Descrição', detalhe: 'Descrição atualizada.' });
          if (antes.anexos.length !== ex.anexos.length) log({ acao: 'atividade.anexo', entidade: 'atividade', entidadeId: ex.id, codigo: ex.codigo, servicoId: s.id, detalhe: `Anexos/evidências: ${antes.anexos.length} → ${ex.anexos.length}.` });

    /* ---------- pendências ---------- */
    const CAMPOS_PEND_LOG = [['descricao', 'Descrição'], ['categoria', 'Categoria'], ['responsabilidade', 'Responsabilidade', v => RESPONSABILIDADE[v] || '—'],

      ['prioridade', 'Prioridade', v => PRIORIDADES[v] || '—'], ['situacao', 'Situação', v => SIT_PEND[v] || '—'], ['impacto', 'Impacto no serviço'],
      ['proximaAcao', 'Próxima ação'], ['visibilidade', 'Visibilidade', v => VISIBILIDADE[v] || '—'], ['atividadeId', 'Atividade vinculada', v => (byId('atividades', v) || {}).codigo || '—']];
    function salvarPendencia(d, o = {}) {

      const c = {

          return { id: ex.id, codigo: ex.codigo };
        }
        const p = stamp(Object.assign({ codigo: proxCodigo('PEN'), resolucao: null, cancelamento: null, ultimaAtualizacaoPor: user().nome }, c), 'pen');
        state.pendencias.push(p);
        log({ acao: 'pendencia.criada', entidade: 'pendencia', entidadeId: p.id, codigo: p.codigo, servicoId: s.id, detalhe: `Pendência incluída (${RESPONSABILIDADE[resp]}): ${desc}. Prazo ${Dates.fmt(p.prazo)}.` });

    }
    function resolverPendencia(id, d) {
      guard('pendencia.resolver');

      const data = validarData(d.data || hoje(), 'a data da resolução', true);

      const descricao = txt(d.descricao); if (!descricao) fail('Descreva como a pendência foi resolvida.');
      const evid = validarAnexos(d.evidencias);

      return mutate(() => {

    /* ---------- plano de ação 5W2H ---------- */
    const CAMPOS_ACAO_LOG = [['what', 'O quê'], ['why', 'Por quê'], ['where', 'Onde'], ['inicio', 'Início', fD], ['termino', 'Término', fD],
      ['responsavelId', 'Quem', fU], ['responsavelExterno', 'Quem (externo)'], ['how', 'Como'], ['custoEstimado', 'Custo estimado', Money.fmt], ['custoRealizado', 'Custo realizado', Money.fmt],
      ['situacao', 'Situação', v => SIT_ACAO[v] || '—'], ['prioridade', 'Prioridade', v => PRIORIDADES[v] || '—'], ['progresso', 'Progresso', v => (v == null ? '—' : v + '%')],
      ['dependeDe', 'Depende de', v => (v || []).map(i => (itemById(i) || {}).codigo || '?').join(', ') || '—']];
    /** Rascunho de ação a partir da pendência: nada é redigitado, o vínculo é mantido. */
    function rascunhoAcaoDePendencia(pendenciaId) {
      guard('ler');
      const p = byId('pendencias', pendenciaId); if (!p) fail('Pendência não encontrada.');
      const s = exigirServico(p.servicoId); const u = byId('unidades', s.unidadeId);
      return { servicoId: s.id, pendenciaId: p.id, what: p.proximaAcao || ('Resolver: ' + p.descricao), why: p.impacto ? `${p.descricao} — impacto: ${p.impacto}` : p.descricao,
        where: u ? [u.nome, u.endereco, u.cidade].filter(Boolean).join(' · ') : '', inicio: hoje(), termino: p.prazo < hoje() ? hoje() : p.prazo,
        responsavelId: p.responsabilidade === 'wrd' ? p.responsavelId : '', responsavelExterno: p.responsabilidade !== 'wrd' ? p.responsavelNome : '', how: '', prioridade: p.prioridade, situacao: 'planejada', progresso: 0 };
    }
    function salvarAcao(d, o = {}) {
      guard('acao.salvar');
      const ex = d.id ? byId('acoes', d.id) : null;
      if (d.id && !ex) fail('Ação não encontrada.');
      const pen = d.pendenciaId ? byId('pendencias', d.pendenciaId) : null;
      if (d.pendenciaId && !pen) fail('Pendência de origem não encontrada.');
      const sid = ex ? ex.servicoId : (pen ? pen.servicoId : d.servicoId);
      const s = exigirServico(sid);
      if (pen && pen.servicoId !== s.id) fail('A pendência precisa ser do mesmo serviço da ação.');
      if (s.arquivado || s.etapa === 'concluido') fail('O serviço está concluído ou arquivado.');
      const what = txt(d.what); if (!what) fail('What: informe o que será feito.');
      const c = {
        servicoId: s.id, pendenciaId: pen ? pen.id : '', what, why: txt(d.why), where: txt(d.where),
        inicio: validarData(d.inicio, 'o início (When)', true), termino: validarData(d.termino, 'o término (When)', true),

      if (c.situacao === 'concluida') { c.progresso = 100; c.conclusao = validarData(d.conclusao || (ex && ex.conclusao) || hoje(), 'a data de conclusão', true); } else c.conclusao = '';
      const mudou = ex && (ex.inicio !== c.inicio || ex.termino !== c.termino);
      const imp = ex ? confirmarImpacto(ex.id, c.inicio, c.termino, o, mudou) : null;
      if (!ex && s.prevEntrega && c.termino > s.prevEntrega && !txt(o.justificativa)) fail(`O término passa da entrega prevista do serviço (${Dates.fmt(s.prevEntrega)}). Informe a justificativa.`, 'JUSTIFICATIVA', { impactaEntrega: true, prevEntrega: s.prevEntrega, dependentes: [] });
      return mutate(() => {
        if (ex) {
          const antes = clone(ex);

        return { id: a.id, codigo: a.codigo };
      });
    }
    /** Alteração de datas vinda do cronograma (mesma regra das telas de cadastro). */

      return salvarAcao(Object.assign(clone(x), { inicio: ini, termino: fim, custoEstimado: x.custoEstimado == null ? '' : x.custoEstimado / 100, custoRealizado: x.custoRealizado == null ? '' : x.custoRealizado / 100 }), o);
    }

    /* ---------- consultas enriquecidas ---------- */
    const nomeCli = id => { const c = byId('clientes', id); return c ? (c.nomeFantasia || c.razaoSocial) : ''; };
    const nomeUni = id => (byId('unidades', id) || {}).nome || '';
    const nomeTipo = id => (byId('tipos', id) || {}).nome || '';
    function atvVencida(a, h) { return !fechado(a) && a.vencimento && a.vencimento < h; }
    function penVencida(p, h) { return PEND_ABERTAS.includes(p.situacao) && p.prazo < h; }
    function penProxima(p, h) { return PEND_ABERTAS.includes(p.situacao) && p.prazo >= h && p.prazo <= Dates.addDays(h, state.config.diasAlerta || 7); }
    function servicoAtrasado(s, h) { return !s.arquivado && !['entregue', 'concluido'].includes(s.etapa) && !!s.prevEntrega && s.prevEntrega < h; }
    function noPeriodo(v, per) { if (!per || (!per.de && !per.ate)) return true; if (!v) return false; return (!per.de || v >= per.de) && (!per.ate || v <= per.ate); }
    function enriquecerServico(s, h) {
      const atv = state.atividades.filter(a => a.servicoId === s.id), pen = state.pendencias.filter(p => p.servicoId === s.id);
      return Object.assign(clone(s), {
        clienteNome: nomeCli(s.clienteId), unidadeNome: nomeUni(s.unidadeId), tipoNome: nomeTipo(s.tipoId), tipoMacro: (byId('tipos', s.tipoId) || {}).macro || '',
        responsavelNome: nomeUser(s.responsavelId), equipeNomes: (s.equipeIds || []).map(nomeUser),
        etapaRotulo: ETAPAS[ETAPA_ORD[s.etapa]].rotulo, condicaoRotulo: CONDICOES[s.condicao].rotulo,
        atividadesAbertas: atv.filter(a => !fechado(a)).length, atividadesVencidas: atv.filter(a => atvVencida(a, h)).length, atividadesTotal: atv.length,
        pendenciasAbertas: pen.filter(p => PEND_ABERTAS.includes(p.situacao)).length, pendenciasVencidas: pen.filter(p => penVencida(p, h)).length,
        atrasado: servicoAtrasado(s, h), noPrazo: s.entregaEfetiva && s.prevEntrega ? s.entregaEfetiva <= s.prevEntrega : null
      });
    }
    function filtroServicoBase(s, f) {
      if (!f.incluirArquivados && s.arquivado) return false;
      if (f.clienteId && s.clienteId !== f.clienteId) return false;

  /** Editor genérico de linhas (contatos, checklist, entregáveis). */
  function editorLinhas(nome, linhas, cols, rotAdd) {
    const linha = (l = {}) => `<div class="ed-linha">${cols.map(c => c.type === 'checkbox' ? `<label class="chk" title="${esc(c.rot)}"><input type="checkbox" data-c="${c.k}"${l[c.k] ? ' checked' : ''}><span class="sr">${esc(c.rot)}</span></label>` : `<input type="${c.type || 'text'}" data-c="${c.k}" value="${esc(l[c.k] || '')}" placeholder="${esc(c.rot)}" aria-label="${esc(c.rot)}"${c.cls ? ` class="${c.cls}"` : ''}>`).join('')}<button type="button" class="btn-x peq" data-rem-linha aria-label="Remover">×</button><input type="hidden" data-c="id" value="${esc(l.id || '')}"></div>`;
    return `<div class="ed-linhas" data-ed="${nome}" data-tpl="${esc(linha())}">${(linhas || []).map(linha).join('')}<button type="button" class="btn btn-sm" data-add-linha>${esc(rotAdd)}</button></div>`;
  }
  document.addEventListener('click', e => {
    const add = e.target.closest('[data-add-linha]');
    if (add) { const ed = add.closest('[data-ed]'); add.insertAdjacentHTML('beforebegin', ed.dataset.tpl); const n = add.previousElementSibling.querySelector('input:not([type=checkbox])'); if (n) n.focus(); return; }
    const rem = e.target.closest('[data-rem-linha]');
    if (rem) rem.closest('.ed-linha').remove();
  });
  function lerLinhas(form, nome) {
    return $$(`[data-ed="${nome}"] .ed-linha`, form).map(l => { const o = {}; $$('[data-c]', l).forEach(i => { o[i.dataset.c] = i.type === 'checkbox' ? i.checked : i.value.trim(); }); if (!o.id) delete o.id; return o; });
  }

  /** Cálculo ao vivo em formulários: recalcula a cada digitação e mostra no elemento [data-calc]. */
  function calcVivo(form, fn) { const alvo = form.querySelector('[data-calc]'); if (!alvo) return; const at = () => { try { alvo.innerHTML = fn() || ''; } catch (e) { alvo.textContent = ''; } }; form.addEventListener('input', at); form.addEventListener('change', at); at(); }
  const diasEntre = (a, b) => (a && b && D.valid(a) && D.valid(b) ? D.diffDays(a, b) : null);
  const calcBox = '<p class="calc-vivo span2" data-calc aria-live="polite"></p>';

  /* ---------- rótulos visuais ---------- */
  const chipPrio = p => `<span class="chip prio-${p}">${esc(core.PRIORIDADES[p])}</span>`;
  const chipCond = (c, motivo) => (c === 'regular' ? '' : `<span class="chip cond-${c}" title="${esc(motivo || '')}">${esc(core.CONDICOES[c].rotulo)}</span>`);
  const chipSitPen = p => `<span class="chip sit-${p.vencida ? 'vencida' : p.situacao}">${esc(p.situacaoRotulo)}${p.vencida ? ' · vencida' : p.proxima ? ' · vence em breve' : ''}</span>`;
  const chipSitAtv = a => `<span class="chip sit-${a.vencida ? 'vencida' : a.situacao}">${esc(a.situacaoRotulo)}${a.vencida ? ' · vencida' : ''}</span>`;
  const chipVis = v => `<span class="chip vis-${v}">${v === 'cliente' ? 'Compartilhável' : 'Interna'}</span>`;

  const DEF_FILTROS = {
    servicos: ['texto', 'clienteId', 'unidadeId', 'tipoId', 'responsavelId', 'prioridade', 'condicao', 'etapa', 'periodo', 'atrasados', 'incluirArquivados'],
    atividades: ['texto', 'clienteId', 'unidadeId', 'servicoId', 'responsavelId', 'prioridade', 'situacaoAtv', 'periodo', 'vencidas'],
    pendencias: ['texto', 'clienteId', 'unidadeId', 'servicoId', 'tipoId', 'responsavelId', 'responsabilidade', 'prioridade', 'situacaoPen', 'visibilidade', 'periodo', 'vencidas', 'proximas', 'bloqueio'],
    acoes: ['texto', 'clienteId', 'servicoId', 'responsavelId', 'prioridade', 'situacaoAcao', 'periodo', 'vencidas'],

  };

      servicoId: () => campo('Serviço', `<select data-f="servicoId">${optsServicos(f.servicoId, 'Todos', { clienteId: f.clienteId, unidadeId: f.unidadeId })}</select>`),

      situacaoAtv: () => campo('Situação', `<select data-f="situacao">${opt('', 'Todas', f.situacao)}${opt('abertas', 'Abertas', f.situacao)}${Object.entries(core.SIT_ATIV).map(([k, v]) => opt(k, v, f.situacao)).join('')}</select>`),
      situacaoPen: () => campo('Situação', `<select data-f="situacao">${opt('', 'Todas', f.situacao)}${opt('abertas', 'Abertas', f.situacao)}${Object.entries(core.SIT_PEND).map(([k, v]) => opt(k, v, f.situacao)).join('')}</select>`),
      situacaoAcao: () => campo('Situação', `<select data-f="situacao">${opt('', 'Todas', f.situacao)}${opt('abertas', 'Abertas', f.situacao)}${Object.entries(core.SIT_ACAO).map(([k, v]) => opt(k, v, f.situacao)).join('')}</select>`),
      responsabilidade: () => campo('Responsabilidade', `<select data-f="responsabilidade">${opts(core.RESPONSABILIDADE, f.responsabilidade, 'Todas')}</select>`),

        <input type="date" data-fp="de" value="${esc(per.de || '')}" aria-label="De"><input type="date" data-fp="ate" value="${esc(per.ate || '')}" aria-label="Até"></fieldset>`,
      atrasados: () => `<label class="chk-f"><input type="checkbox" data-f="atrasados"${f.atrasados ? ' checked' : ''}> Prazo vencido</label>`,
      vencidas: () => `<label class="chk-f"><input type="checkbox" data-f="vencidas"${f.vencidas ? ' checked' : ''}> Somente vencidas</label>`,
      proximas: () => `<label class="chk-f"><input type="checkbox" data-f="proximas"${f.proximas ? ' checked' : ''}> Vencem em breve</label>`,
      bloqueio: () => `<label class="chk-f"><input type="checkbox" data-f="bloqueio"${f.bloqueio ? ' checked' : ''}> Serviço bloqueado</label>`,
      incluirArquivados: () => `<label class="chk-f"><input type="checkbox" data-f="incluirArquivados"${f.incluirArquivados ? ' checked' : ''}> Incluir arquivados</label>${f.comPrevEntrega ? `<label class="chk-f"><input type="checkbox" data-f="comPrevEntrega" checked> Somente com entrega prevista</label>` : ''}`
    };
    const ativos = Object.keys(filtrosDe(tela)).filter(k => !['situacao', 'escala', 'etapa'].includes(k) || (k === 'etapa' && tela === 'servicos')).length;
    const salvos = core.filtrosSalvos(tela);

      <div class="linha filtros-acoes"><button class="btn btn-sm" data-act="limpar-filtros">Limpar filtros</button>
      ${salvos.length ? `<select data-act-sel="aplicar-salvo" aria-label="Filtros salvos">${opt('', 'Filtros salvos…')}${salvos.map(s => opt(s.id, s.nome)).join('')}</select><button class="btn btn-sm" data-act="remover-salvo">Excluir filtro salvo</button>` : ''}
      <button class="btn btn-sm" data-act="salvar-filtro">Salvar filtro atual</button></div></details>`;
  }
  function ligarFiltros(tela) {
    const box = $(`[data-filtros="${tela}"]`); if (!box) return;
    let tmr = null;
    const aplicar = (el) => {
      const k = el.dataset.f;
      const v = el.type === 'checkbox' ? el.checked : el.value;
      const alvo = BASE_KEYS.includes(k) ? UI.FB : (UI.FX[tela] = UI.FX[tela] || {});
      alvo[k] = v;
      if (k === 'clienteId') { UI.FB.unidadeId = ''; UI.FB.servicoId = ''; }
      if (k === 'unidadeId') UI.FB.servicoId = '';
      refresh();
    };
    box.addEventListener('change', e => {
      if (e.target.dataset.f && e.target.dataset.f !== 'texto') aplicar(e.target);
      if (e.target.dataset.fp) {
        const fx = UI.FX[tela] = UI.FX[tela] || {};
        const per = fx.periodo = Object.assign({ campo: Object.keys(core.CAMPOS_DATA[tela] || {})[0] }, fx.periodo || {});
        per[e.target.dataset.fp] = e.target.value;
        refresh();
      }
    });
    box.addEventListener('input', e => {
      if (e.target.dataset.f === 'texto') { clearTimeout(tmr); const el = e.target; tmr = setTimeout(() => { (UI.FX[tela] = UI.FX[tela] || {}).texto = el.value; refresh(); const n = $(`[data-filtros="${tela}"] [data-f="texto"]`); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }, 300); }
    });
  }

  /* =================================================================== */
  /* VISÃO GERAL                                                          */
  /* =================================================================== */
  /* ---------- demandas aprovadas no Comercial (fila da nuvem) ---------- */
  const DEMANDAS = new Map();
  async function carregarDemandas() {
    const box = document.getElementById('demandas-comercial'); if (!box) return;
    if (!NV || !NV.ativo()) { box.innerHTML = '<h2>Demandas aprovadas no Comercial</h2><p class="ajuda">Conecte a nuvem (Configurações › Nuvem e aparelhos) para ver as demandas aprovadas.</p>'; return; }
    try {
      const lista = await NV.pendencias();
      DEMANDAS.clear(); lista.forEach(i => DEMANDAS.set(i.id, i));
      const linhas = lista.map(i => `<tr><td class="nowrap"><b>${esc(i.dados.codigo_oportunidade)}</b></td><td>${esc(i.dados.cliente_nome)} · ${esc(i.dados.unidade_nome)}</td><td>${esc(i.dados.servico_nome)}</td><td class="num">${M.fmt(Number(i.dados.valor_aprovado))}</td><td>${esc(i.dados.pedido)}</td><td class="acoes"><button class="btn btn-sm btn-primario" data-act="receber-demanda" data-id="${esc(i.id)}">Receber na Operação</button></td></tr>`).join('');
      box.innerHTML = `<h2>Demandas aprovadas no Comercial <span class="chip-n">${lista.length}</span></h2>` + (lista.length ? `<div class="tabela-wrap"><table class="tab"><thead><tr><th>Código</th><th>Cliente · unidade</th><th>Serviço</th><th class="num">Valor aprovado</th><th>Pedido</th><th></th></tr></thead><tbody>${linhas}</tbody></table></div>` : '<p class="ajuda">Nenhuma demanda aguardando.</p>');
    } catch (e) { box.innerHTML = `<h2>Demandas aprovadas no Comercial</h2><p class="ajuda">Não foi possível ler as demandas: ${esc(e.message)}</p>`; }
  }
  async function receberDemandaUI(id) {
    const i = DEMANDAS.get(id); if (!i) { toast('Demanda não encontrada. Atualize a tela.', 'erro'); return; }
    const r = await executar(() => core.receberDemanda(Object.assign({ origem_ref: i.origem_ref }, i.dados)), {}, 'Demanda recebida na Operação.');
    if (!r.ok) return;
    // Só marca como recebida depois que a nuvem confirma o serviço; senão a demanda some da fila sem o registro salvo.
    if (!(await NV.salvarAgora())) { toast('Serviço criado neste aparelho, mas a nuvem não confirmou. A demanda continua na fila; tente de novo.', 'erro'); carregarDemandas(); return; }
    try { await NV.marcarRecebida(id); } catch (e) { toast('Serviço salvo, mas a nuvem não confirmou o recebimento: ' + e.message, 'erro'); }
    carregarDemandas();
  }
  function telaVisao(el) {
    setTimeout(carregarDemandas, 0);
    const h = core.hoje();
    UI.periodo = UI.periodo || { de: D.inicioMes(h), ate: D.fimMes(h) };
    const ind = core.indicadores(UI.periodo, {});
    const kpi = k => `<button class="kpi${k.alerta ? ' atencao' : ''}" data-ir='${esc(JSON.stringify(k.filtro))}' title="${esc(k.formula)}">
      <span class="rot">${esc(k.rotulo)}</span>
      <span class="val">${k.unidade === '%' ? (k.valor == null ? '—' : String(k.valor).replace('.', ',') + '%') : k.valor}</span>
      <span class="det">${k.unidade === '%' ? esc(k.contagem) + ' entregas · ' : k.total != null ? `${k.valor} de ${k.total}${k.pct != null ? ' (' + String(k.pct).replace('.', ',') + '%)' : ''} · ` : ''}${esc(k.periodo)}</span></button>`;
    const barras = (lista, extra) => {
      const max = Math.max(1, ...lista.map(x => x.valor));
      if (!lista.length || lista.every(x => !x.valor)) return '<p class="muted peq">Nenhum registro.</p>';

    };
    const urgentes = core.listarPendencias({ situacao: 'abertas', vencidas: true }).slice(0, 8);
    const servAtencao = core.listarServicos({ etapa: 'ativos' }).filter(s => s.atrasado || s.condicao !== 'regular').slice(0, 8);
    const rapidas = [core.can('pendencia.salvar') ? '<button class="btn btn-primario" data-act="nova-pendencia">+ Pendência</button>' : '', core.can('atividade.salvar') ? '<button class="btn" data-act="nova-atividade">+ Atividade</button>' : '', core.can('servico.salvar') ? '<button class="btn" data-act="novo-servico">+ Serviço</button>' : '', core.can('acao.salvar') ? '<button class="btn" data-act="nova-acao">+ Ação 5W2H</button>' : ''].join('');

      <button type="button" class="btn btn-sm" data-act="per-mes">Mês atual</button></form></div>
      <p class="ajuda">Indicadores calculados com os mesmos critérios das listas e relatórios. Clique em um indicador ou barra para abrir os registros de origem. Passe o mouse para ver a fórmula.</p>
      <div class="kpis">${ind.kpis.map(kpi).join('')}</div>
      <div class="grade g3 graficos">

      ${barraFiltros('servicos')}

  function cartaoServico(s) {
    return `<article class="card${s.condicao === 'bloqueado' ? ' bloq' : ''}${s.atrasado ? ' atras' : ''}" draggable="${core.can('servico.mover')}" data-card="${s.id}" tabindex="0" aria-label="${esc(s.codigo + ' ' + s.titulo)}">

      <div class="card-l ${s.atrasado ? 'txt-critico' : ''}">Prazo: ${fd(s.prevEntrega)}${s.atrasado ? ' (vencido)' : ''}${s.entregaEfetiva ? ` · entregue ${fd(s.entregaEfetiva)}` : ''}</div>
      <div class="card-badges">${chipCond(s.condicao, s.motivoCondicao)}

        ${s.pendenciasAbertas ? `<span class="chip ${s.pendenciasVencidas ? 'sit-vencida' : 'sit-aberta'}">${s.pendenciasAbertas} pend. aberta(s)${s.pendenciasVencidas ? ` · ${s.pendenciasVencidas} venc.` : ''}</span>` : ''}
        ${s.aceite ? '<span class="chip sit-resolvida">Aceite registrado</span>' : ''}${s.arquivado ? '<span class="chip">Arquivado</span>' : ''}</div></article>`;

  function kanban(lista) {
    return `<div class="kanban">${core.ETAPAS.map(e => { const c = lista.filter(s => s.etapa === e.id); return `<section class="col" data-col="${e.id}" aria-label="${esc(e.rotulo)}"><h2>${esc(e.rotulo)} <span class="chip-n">${c.length}</span></h2><div class="col-corpo">${c.map(cartaoServico).join('') || '<p class="vazio-col">Nenhum serviço.</p>'}</div></section>`; }).join('')}</div>
      <p class="ajuda">Arraste o cartão para mudar a etapa (no celular, abra o serviço e use “Mover etapa”). Aguardando cliente/terceiro e bloqueado são condições: o cartão continua na etapa.</p>`;
  }
  function ligarKanban() {
    let arrastando = null;
    $$('[data-card]').forEach(c => {
      c.addEventListener('dragstart', e => { arrastando = c.dataset.card; e.dataTransfer.setData('text/plain', arrastando); c.classList.add('arrastando'); });
      c.addEventListener('dragend', () => c.classList.remove('arrastando'));
    });
    $$('[data-col]').forEach(col => {
      col.addEventListener('dragover', e => { if (arrastando) { e.preventDefault(); col.classList.add('alvo'); } });
      col.addEventListener('dragleave', () => col.classList.remove('alvo'));
      col.addEventListener('drop', async e => { e.preventDefault(); col.classList.remove('alvo'); const id = arrastando; arrastando = null; if (id) await moverServico(id, col.dataset.col); });
    });
  }
  async function moverServico(id, etapa) {
    const o = {};
    if (etapa === 'entregue') { const d = await pedirData('Registrar entrega', 'A entrega ao cliente é diferente do encerramento do serviço. Informe a data em que a entrega foi realizada.', 'Data da entrega'); if (!d) return refresh(); o.data = d; }
    if (etapa === 'concluido') { const d = await pedirData('Concluir serviço', 'O encerramento exige que pendências, atividades e ações estejam resolvidas, concluídas ou canceladas.', 'Data de conclusão'); if (!d) return refresh(); o.data = d; }
    const r = await executar(op => core.moverEtapa(id, etapa, op), o, 'Etapa atualizada e registrada no histórico.');
    if (!r.ok && r.e && r.e.code === 'ABERTOS') toast('Em aberto: ' + r.e.extra.codigos.join(', '), 'erro');
    render();
  }
  function tabelaServicos(lista) {

          ${core.can('servico.arquivar') ? `<button class="btn btn-sm${s.arquivado ? '' : ' btn-perigo'}" data-act="${s.arquivado ? 'restaurar' : 'arquivar'}" data-col="servicos" data-id="${s.id}">${s.arquivado ? 'Restaurar' : 'Arquivar'}</button>` : ''}

  function reabrirSeAberto(id, aba) { if ($(`.modal-fundo[data-detalhe="${id}"]`)) { const a = ($(`.modal-fundo[data-detalhe="${id}"] [data-aba-det][aria-pressed="true"]`) || {}).dataset; abrirServico(id, (a && a.abaDet) || aba); } }
  function ligarHistFiltro(root) { const c = $('[data-hist-etapas]', root); if (c) c.onchange = () => $$('tr[data-hacao]', root).forEach(tr => { tr.hidden = c.checked && tr.dataset.hacao !== 'servico.etapa'; }); }

  function telaCronograma(el) {

      ${barraFiltros('cronograma')}
      <div class="legenda peq"><span><i class="lg prev"></i> Previsto</span><span><i class="lg efet"></i> Efetivo (realizado)</span><span><i class="lg atras"></i> Atrasado</span><span><i class="lg bloq"></i> Serviço bloqueado</span><span>◆ Marco / entrega prevista</span><span><i class="lg dep"></i> Dependência (vermelha = em conflito)</span><span class="lg-hoje">│ Hoje</span></div>
      <p class="ajuda">Mesmas atividades e ações das outras telas. Clique numa barra para alterar datas, ou arraste-a (computador). Dependentes nunca são reprogramados sem sua confirmação.</p>
      ${gantt(cr, escala)}`;
    ligarFiltros('cronograma');
    ligarGantt();
  }
  function gantt(cr, escala) {
    const linhas = [];
    for (const l of cr.linhas) { linhas.push({ tipo: 'servico', s: l.servico }); for (const i of l.itens) linhas.push({ tipo: 'item', i, s: l.servico }); }
    if (!linhas.length) return '<div class="cartao vazio">Nenhum serviço com estes filtros.</div>';
    const datas = [cr.hoje];
    for (const l of linhas) { const x = l.tipo === 'servico' ? [l.s.prevInicio, l.s.prevEntrega, l.s.inicioEfetivo, l.s.entregaEfetiva] : [l.i.ini, l.i.fim, l.i.efIni, l.i.efFim]; datas.push(...x.filter(Boolean)); }
    datas.sort();
    let ini = D.addDays(datas[0], -3), fim = D.addDays(datas[datas.length - 1], 7);
    if (escala === 'mensal') { ini = D.inicioMes(ini); fim = D.fimMes(fim); } else { while (D.diaSemana(ini) !== 1) ini = D.addDays(ini, -1); }
    // geometria lida dos tokens CSS (:root) — sem números soltos no código
    const pxDia = token(escala === 'mensal' ? '--gantt-dia-mensal' : '--gantt-dia-semanal'), dias = D.diffDays(ini, fim) + 1, W = dias * pxDia, RH = token('--gantt-linha'), HH = token('--gantt-cab');
    const hBarra = token('--fs-icone-sm'), hFaixa = token('--esp-2'), meioMarco = token('--fs-icone-sm') / 2, folga = token('--esp-1') + token('--esp-0');
    const yBarra = (RH - hBarra) / 2, yFaixa = (RH - hFaixa) / 2, yMarco = (RH - token('--fs-icone-sm')) / 2, yEfet = RH - token('--esp-2') - token('--esp-0');
    const x = d => D.diffDays(ini, d) * pxDia;
    let cab = '';
    // linha 1: meses; linha 2: semanas (semanal: dias)
    for (let d = ini; d <= fim; d = D.addDays(D.fimMes(d), 1)) { const a = x(d), b = Math.min(x(D.fimMes(d)) + pxDia, W); cab += `<div class="g-mes" style="left:${a}px;width:${b - a}px">${['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'][+d.slice(5, 7) - 1]}/${d.slice(2, 4)}</div>`; }
    if (escala === 'semanal') for (let d = ini; d <= fim; d = D.addDays(d, 1)) cab += `<div class="g-dia${[0, 6].includes(D.diaSemana(d)) ? ' fds' : ''}" style="left:${x(d)}px;width:${pxDia}px">${+d.slice(8)}</div>`;
    else for (let d = ini; d <= fim; d = D.addDays(d, 7)) cab += `<div class="g-dia" style="left:${x(d)}px;width:${pxDia * 7}px">${+d.slice(8)}</div>`;
    let grade = '';
    if (escala === 'semanal') for (let d = ini; d <= fim; d = D.addDays(d, 1)) if ([0, 6].includes(D.diaSemana(d))) grade += `<div class="g-fds" style="left:${x(d)}px;width:${pxDia}px"></div>`;
    for (let d = ini; d <= fim; d = D.addDays(D.fimMes(d), 1)) grade += `<div class="g-lmes" style="left:${x(d)}px"></div>`;
    const pos = new Map();
    const rot = [], barras = [];
    linhas.forEach((l, k) => {
      const y = k * RH;
      if (l.tipo === 'servico') {
        const s = l.s;
        rot.push(`<div class="g-rot g-rot-s${s.bloqueado ? ' bloq' : ''}" style="height:${RH}px"><button class="btn-linha" data-abrir="servico" data-id="${s.id}"><b>${esc(s.codigo)}</b> ${esc(s.titulo)}<span class="muted xs"> · ${esc(s.clienteNome)} · ${esc(s.etapaRotulo)}${s.bloqueado ? ' · BLOQUEADO' : ''}</span></button></div>`);
        const a = s.prevInicio || s.dataEntrada || s.inicioEfetivo, b = s.prevEntrega;
        if (a && b && b >= a) barras.push(`<div class="g-faixa${s.bloqueado ? ' bloq' : ''}${s.atrasado ? ' atras' : ''}" style="left:${x(a)}px;top:${y + yFaixa}px;width:${x(b) - x(a) + pxDia}px" title="${esc(s.codigo)}: ${fd(a)} a ${fd(b)}"></div>`);
        if (b) barras.push(`<div class="g-marco${s.atrasado ? ' atras' : ''}" style="left:${x(b) + pxDia / 2 - meioMarco}px;top:${y + yMarco}px" title="Entrega prevista ${fd(b)}">◆</div>`);
        if (s.entregaEfetiva) barras.push(`<div class="g-marco efet" style="left:${x(s.entregaEfetiva) + pxDia / 2 - meioMarco}px;top:${y + yMarco}px" title="Entregue em ${fd(s.entregaEfetiva)}">◆</div>`);
      } else {
        const i = l.i;
        rot.push(`<div class="g-rot" style="height:${RH}px"><button class="btn-linha" data-abrir="${i.tipo}" data-id="${i.id}"><span class="xs muted">${esc(i.codigo)}</span> ${esc(i.titulo)}<span class="muted xs"> · ${esc(i.responsavelNome || '')}${i.conflitos.length ? ' · <span class="txt-critico">conflito</span>' : ''}</span></button></div>`);
        const a = i.ini || i.fim, b = i.fim || i.ini;
        if (!a) return;
        pos.set(i.id, { x1: x(a), x2: x(b) + pxDia, y: y + RH / 2 });
        const cls = ['g-barra', i.tipo, i.atrasado ? 'atras' : '', i.fechado ? 'fechado' : '', l.s.bloqueado ? 'bloq' : ''].filter(Boolean).join(' ');
        barras.push(`<div class="${cls}" data-gbar="${i.id}" data-ini="${a}" data-fim="${b}" data-px="${pxDia}" style="left:${x(a)}px;top:${y + yBarra}px;width:${x(b) - x(a) + pxDia}px" title="${esc(i.codigo)} ${esc(i.titulo)} — previsto ${fd(a)} a ${fd(b)}${i.efFim ? ' · concluído ' + fd(i.efFim) : ''}${i.atrasado ? ' · ATRASADO' : ''}" tabindex="0" role="button">${i.progresso != null && !i.fechado ? `<span class="g-prog" style="width:${i.progresso}%"></span>` : ''}</div>`);
        if (i.efIni) { const ef = i.efFim || (cr.hoje < b ? cr.hoje : (i.efFim || cr.hoje)); if (ef >= i.efIni) barras.push(`<div class="g-efet" style="left:${x(i.efIni)}px;top:${y + yEfet}px;width:${x(ef) - x(i.efIni) + pxDia}px" title="Efetivo: ${fd(i.efIni)} a ${i.efFim ? fd(i.efFim) : 'em andamento'}"></div>`); }
        if (i.marco) barras.push(`<div class="g-marco item" style="left:${x(b) + pxDia - meioMarco}px;top:${y + yBarra}px">◆</div>`);
      }
    });
    let deps = '';
    for (const l of linhas) if (l.tipo === 'item') for (const d of l.i.dependeDe) {
      const p = pos.get(d), q = pos.get(l.i.id); if (!p || !q) continue;
      const conflito = l.i.conflitos.length && q.x1 < p.x2;
      const mx = Math.max(p.x2 + folga, Math.min(q.x1 - folga, p.x2 + folga));
      deps += `<path d="M${p.x2},${p.y} H${mx} V${q.y} H${q.x1}" class="g-dep${conflito ? ' conflito' : ''}" marker-end="url(#seta${conflito ? 'c' : ''})"/>`;
    }
    const H = linhas.length * RH, S = token('--seta-dep');
    const hojeX = x(cr.hoje) + pxDia / 2;
    return `<div class="gantt" style="--rh:${RH}px">
      <div class="g-esq"><div class="g-cabesq" style="height:${HH}px">Serviço / atividade / ação</div>${rot.join('')}</div>
      <div class="g-dir" id="g-dir"><div class="g-in" style="width:${W}px">
        <div class="g-cab" style="height:${HH}px">${cab}</div>
        <div class="g-corpo" style="height:${H}px">${grade}${linhas.map((l, k) => `<div class="g-linha${l.tipo === 'servico' ? ' s' : ''}" style="top:${k * RH}px"></div>`).join('')}
          <div class="g-hoje" style="left:${hojeX}px" title="Hoje ${fd(cr.hoje)}"></div>
          <svg class="g-svg" width="${W}" height="${H}"><defs>${["", "c"].map(k => `<marker id="seta${k}" markerWidth="${S}" markerHeight="${S}" refX="${S - 1}" refY="${S / 2}" orient="auto"><path d="M0,0 L${S},${S / 2} L0,${S} z" class="g-seta ${k}"/></marker>`).join('')}</defs>${deps}</svg>
          ${barras.join('')}</div></div></div></div>`;
  }
  function ligarGantt() {
    const dir = $('#g-dir'); if (!dir) return;
    const hoje = $('.g-hoje', dir); if (hoje) dir.scrollLeft = Math.max(0, parseFloat(hoje.style.left) - 8 * token('--gantt-dia-semanal'));
    let drag = null;
    dir.addEventListener('pointerdown', e => {
      const b = e.target.closest('[data-gbar]'); if (!b || e.button !== 0) return;
      drag = { b, x0: e.clientX, left0: parseFloat(b.style.left), px: +b.dataset.px, mov: false };
      b.setPointerCapture(e.pointerId);
    });
    dir.addEventListener('pointermove', e => {
      if (!drag) return;
      const dx = e.clientX - drag.x0;
      if (Math.abs(dx) > token('--limiar-arrasto')) drag.mov = true;
      if (drag.mov) { drag.b.style.left = (drag.left0 + Math.round(dx / drag.px) * drag.px) + 'px'; drag.b.classList.add('arrastando'); }
    });
    dir.addEventListener('pointerup', async e => {
      if (!drag) return;
      const d = drag; drag = null;
      const id = d.b.dataset.gbar;
      if (!d.mov) { editarDatasItem(id); return; }
      const dias = Math.round((e.clientX - d.x0) / d.px);
      if (!dias) { refresh(); return; }
      const ini = D.addDays(d.b.dataset.ini, dias), fim = D.addDays(d.b.dataset.fim, dias);
      const r = await executar(o => core.alterarDatas(id, ini, fim, o), {}, `Datas alteradas (${dias > 0 ? '+' : ''}${dias} dia(s)).`);
      refresh(); if (!r.ok) return;
    });
    dir.addEventListener('keydown', e => { const b = e.target.closest('[data-gbar]'); if (b && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); editarDatasItem(b.dataset.gbar); } });
  }
  function editarDatasItem(id) {
    const item = id.startsWith('atv_') ? core.listarAtividades({ incluirArquivados: true }).find(x => x.id === id) : core.listarAcoes({ incluirArquivados: true }).find(x => x.id === id);
    if (!item) return;
    const fim = item.vencimento || item.termino;
    const m = modal(`Datas — ${item.codigo}`, `<form class="grade"><p><b>${esc(item.titulo || item.what)}</b><br><span class="muted peq">${esc(item.servicoCodigo)} · ${esc(item.responsavelNome)}</span></p>

      <p class="ajuda">Se houver itens dependentes ou impacto na entrega, o sistema mostra o impacto antes de gravar.</p>
      <div class="linha entre"><button type="button" class="btn btn-sm" data-abrir="${id.startsWith('atv_') ? 'atividade' : 'acao'}" data-id="${id}">Abrir cadastro completo</button><span class="linha"><button type="button" class="btn" data-fechar>Cancelar</button><button class="btn btn-primario">Salvar datas</button></span></div></form>`);
    m.el.querySelector('form').onsubmit = async e => { e.preventDefault(); const r = await executar(o => core.alterarDatas(id, e.target.ini.value, e.target.fim.value, o), {}, 'Datas atualizadas em todas as telas.'); if (r.ok) { m.fechar(); refresh(); } };
    m.el.querySelector('[data-abrir]').addEventListener('click', () => m.fechar());

      else if (tipo === 'acao') abrirAcao(id);

      else if (tipo === 'unidade') formUnidade(ab.dataset.cliente, id);

    }
    const card = t.closest('[data-card]'); if (card) { abrirServico(card.dataset.card); return; }
    const cfgAba = t.closest('[data-cfg-aba]'); if (cfgAba) { UI.cfgAba = cfgAba.dataset.cfgAba; refresh(); return; }
    const a = t.closest('[data-act]'); if (!a || a.tagName === 'SELECT') return;
    const act = a.dataset.act, id = a.dataset.id;
    switch (act) {
      case 'modo': abrirModo(a.dataset.modo); break;
      case 'entrar-demo': try { core.entrarDemo(a.dataset.login); lerNav(); render(); } catch (er) { toast(er.message, 'erro'); } break;
      case 'trocar-modo': if (NV) NV.parar(); core = null; try { sessionStorage.removeItem('wrd.operacoes.modo'); } catch (er) { /* opcional */ } render(); break;
      case 'sair': if (!voltarAoPainel('operacoes')) { core.logout(); $$('.modal-fundo').forEach(x => x.remove()); render(); } break;

      case 'salvar-filtro': { const n = await pedirTexto('Salvar filtro', 'Dê um nome para este conjunto de filtros (fica disponível só para você).', { rotulo: 'Nome do filtro', botao: 'Salvar' }); if (n) { const r = await executar(() => core.salvarFiltro(UI.tela, n, filtrosDe(UI.tela)), {}, 'Filtro salvo.'); if (r.ok) refresh(); } break; }

      case 'anexar-lote': document.querySelectorAll('.modal-fundo').forEach(x => x.remove()); anexarPdfsLote(); break;

      case 'rel-ver': $('#rel-prev').innerHTML = '<div class="carregando" role="status">Gerando pré-visualização…</div>'; await new Promise(r => setTimeout(r, 30)); try { $('#rel-prev').innerHTML = `<div class="prev-aviso">Pré-visualização — ${UI.rel.modelo === 'cliente' ? 'versão para o cliente (somente informações compartilháveis)' : 'versão INTERNA'}</div>` + docRelatorio(montarRelatorio()); } catch (er) { toast(er.message, 'erro'); } break;

        m.el.querySelector('[data-copiar-de]').onclick = async () => { const ta = m.el.querySelector('textarea'); ta.select(); try { await navigator.clipboard.writeText(ta.value); toast('Copiado.', 'ok'); } catch (er) { document.execCommand('copy'); toast('Copiado.', 'ok'); } };
      } catch (er) { toast(er.message, 'erro'); } break;
      case 'backup-exportar': try { baixar(`wrd-operacoes-backup${core.demo ? '-DEMO' : ''}-${hojeArq()}.json`, core.exportarJSON(), 'application/json'); toast('Backup exportado.', 'ok'); } catch (er) { toast(er.message, 'erro'); } break;

  function abrirEntregasProcesso(f) {
    const l = core.entregasProcesso(f.periodo, f), ok = l.filter(x => x.noPrazo).length;
    modal('Entregas do processo no período', `<p class="peq">${fd(f.periodo.de)} a ${fd(f.periodo.ate)} · <b>${ok} de ${l.length}</b> no prazo${l.length ? ` (${String(Math.round(ok * 1000 / l.length) / 10).replace('.', ',')}%)` : ''}. Atividades (conclusão ≤ vencimento), ações 5W2H (conclusão ≤ término) e entregáveis com data prevista (entrega ≤ prevista).</p>

  }

  /* =================================================================
     IMPORTAÇÃO EM LOTE (CSV ou colar do Excel)
     ================================================================= */
  function abrirImportacao(tipoIni) {
    const tipos = Object.entries(core.MODELOS_LOTE).filter(([, m]) => core.can(m.permissao));
    if (!tipos.length) { toast('Seu perfil não permite importar.', 'erro'); return; }
    let tipo = tipos.some(([k]) => k === tipoIni) ? tipoIni : tipos[0][0];
    const colunas = () => core.MODELOS_LOTE[tipo].colunas.map(([id, rot, obr]) => `<li><code>${esc(id)}</code> — ${esc(rot)}${obr ? ' <span class="req">*</span>' : ''}</li>`).join('');
    const m = modal('Importar em lote', `<div class="grade">
      <div class="grade g2">${campo('O que importar', sel('tipo', tipos.map(([k, mm]) => opt(k, mm.rotulo, tipo)).join('')))}
        <div class="campo"><span>Modelo da planilha</span><button type="button" class="btn" data-modelo>Baixar modelo (CSV para Excel)</button></div>${typeof NV !== 'undefined' && NV && NV.pdfNaNuvem() && core.can('servico.salvar') ? '<div class="campo"><span>Arquivos PDF</span><button type="button" class="btn" data-act="anexar-lote">Anexar PDFs em lote</button></div>' : ''}</div>
      <details class="mais"><summary>Colunas aceitas (* obrigatória)</summary><ul class="lista-colunas" data-cols>${colunas()}</ul><p class="ajuda">A 1ª linha precisa ter os nomes das colunas (como no modelo). Datas em dd/mm/aaaa. Colunas desconhecidas são ignoradas.</p></details>
      <div class="campo"><span>Arquivo CSV</span><input type="file" accept=".csv,.txt,text/csv" data-arq-lote><span class="ajuda">No Excel: Arquivo › Salvar como › CSV (separado por ponto e vírgula). Arquivos .xlsx não são lidos diretamente.</span></div>
      ${campo('…ou cole aqui as células copiadas do Excel (com o cabeçalho)', area('texto', '', { rows: 6, ph: 'cliente;unidade;titulo;tipo;responsavel…' }))}
      <div class="campo" data-op-pdfs><span>PDFs do pedido (opcional, para a coluna "arquivo")</span><input type="file" accept="application/pdf,.pdf" multiple data-arq-pdfs><span class="ajuda" data-pdfs-info>Nenhum PDF selecionado. O nome de cada PDF precisa ser igual ao da coluna "arquivo". Até 500 KB cada; para arquivos maiores, use a coluna "localizacao".</span></div>
      <div class="linha" data-op-servicos><label class="chk-f"><input type="checkbox" name="criarFaltantes"> Criar clientes e unidades que faltarem</label><label class="chk-f"><input type="checkbox" name="aceitarDuplicados"> Importar mesmo se parecer duplicado</label></div>
      <div data-op-atv>${campo('Justificativa para atividades que vencem depois da entrega prevista (opcional)', inp('justificativa', ''))}</div>
      <div class="linha fim"><button type="button" class="btn" data-fechar>Cancelar</button><button type="button" class="btn btn-primario" data-conferir>Conferir (nada é gravado)</button></div>
      <div data-resultado></div></div>`, { largo: true });
    const el = m.el, f = sel2 => el.querySelector(sel2);
    const pdfs = {};
    const ajustar = () => { f('[data-op-pdfs]').classList.toggle('oculto', tipo !== 'servicos'); f('[data-op-servicos]').classList.toggle('oculto', tipo !== 'servicos'); f('[data-op-atv]').classList.toggle('oculto', tipo !== 'atividades'); f('[data-cols]').innerHTML = colunas(); f('[data-resultado]').innerHTML = ''; };
    ajustar();
    f('[name=tipo]').onchange = e => { tipo = e.target.value; ajustar(); };
    f('[data-modelo]').onclick = () => { try { baixar(`modelo-importacao-${tipo}.csv`, core.modeloLote(tipo), 'text/csv;charset=utf-8'); } catch (er) { toast(er.message, 'erro'); } };
    f('[data-arq-lote]').onchange = async e => { const arq = e.target.files[0]; if (!arq) return; const buf = await arq.arrayBuffer(); let t = new TextDecoder('utf-8').decode(buf); if (t.includes('\ufffd')) t = new TextDecoder('windows-1252').decode(buf); f('[name=texto]').value = t; toast(`Arquivo "${arq.name}" carregado. Clique em Conferir.`, 'info'); };
    f('[data-arq-pdfs]').onchange = async e => {
      for (const arq of Array.from(e.target.files)) {
        if (arq.size > 500 * 1024) { toast(`"${arq.name}" passa de 500 KB e não foi selecionado. Use a coluna localizacao.`, 'erro'); continue; }
        const conteudo = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(arq); });
        pdfs[arq.name.trim().toLowerCase()] = { nome: arq.name, conteudo };
      }
      const nomes = Object.values(pdfs).map(p => p.nome);
      f('[data-pdfs-info]').textContent = nomes.length ? `${nomes.length} PDF(s) selecionado(s): ${nomes.join(', ')}` : 'Nenhum PDF selecionado.';
      e.target.value = '';
    };
    const opcoes = simular => ({ simular, arquivos: pdfs, criarFaltantes: f('[name=criarFaltantes]').checked, aceitarDuplicados: f('[name=aceitarDuplicados]').checked, justificativa: f('[name=justificativa]').value });
    const tabela = rel => `<table class="tab"><thead><tr><th>Linha</th><th>Resultado</th><th>Código</th><th>Registro / motivo</th></tr></thead><tbody>${rel.linhas.map(x => `<tr><td class="num">${x.linha}</td><td>${x.ok ? '<span class="chip sit-resolvida">OK</span>' : x.duplicado ? '<span class="chip sit-aguardando">Já existe</span>' : '<span class="chip sit-vencida">Erro</span>'}</td><td class="nowrap">${esc(x.codigo || '')}</td><td>${esc(x.ok ? x.texto : x.erro)}</td></tr>`).join('')}</tbody></table>`;
    f('[data-conferir]').onclick = async () => {
      const texto = f('[name=texto]').value;
      f('[data-resultado]').innerHTML = '<div class="carregando" role="status">Conferindo as linhas…</div>';
      await new Promise(r => setTimeout(r, 30));
      let rel;
      try { rel = core.importarLote(tipo, texto, opcoes(true)); } catch (er) { f('[data-resultado]').innerHTML = `<p class="msg-aviso">${esc(er.message)}</p>`; return; }
      f('[data-resultado]').innerHTML = `<div class="prev-aviso">Prévia (nada foi gravado): <b>${rel.ok}</b> de ${rel.total} linha(s) válida(s)${rel.erros ? ` · ${rel.erros} com problema (não serão importadas)` : ''} · separador: ${esc(rel.separador)}${rel.colunasIgnoradas.length ? ` · colunas ignoradas: ${esc(rel.colunasIgnoradas.join(', '))}` : ''}</div>
        <div class="tabela-wrap">${tabela(rel)}</div>
        <div class="linha fim">${rel.ok ? `<button type="button" class="btn btn-primario" data-gravar>Importar ${rel.ok} linha(s) válida(s)</button>` : '<span class="muted">Corrija as linhas e confira de novo.</span>'}</div>`;
      const g = f('[data-gravar]');
      if (g) g.onclick = async () => {
        if (!(await confirmar('Importar', `Gravar ${rel.ok} registro(s)? As linhas com problema ficam de fora.`, 'Importar'))) return;
        const r = await executar(() => core.importarLote(tipo, texto, opcoes(false)));
        if (!r.ok) return;
        f('[data-resultado]').innerHTML = `<div class="bloco ok"><b>Importação concluída:</b> ${r.r.ok} registro(s) gravado(s)${r.r.erros ? `, ${r.r.erros} recusado(s)` : ''}. Tudo ficou no histórico.</div><div class="tabela-wrap">${tabela(r.r)}</div>`;
        toast(`${r.r.ok} registro(s) importado(s).`, 'ok'); refresh();
      };
    };
  }

  /* =================================================================
     CONTRATO DE PLUG — window.NEXO_MODULE (nexo-plug/1)
     Comunicação externa somente por window.parent.postMessage e JSON.
     ================================================================= */
  const extListeners = {};
  const semCore = () => ({ erro: 'Módulo sem sessão: abra o módulo e faça login.', codigo: 'AUTH' });
  const NEXO = {
    manifest: MANIFEST,
    getState() { if (!core) return semCore(); try { return core.snapshot(); } catch (e) { return { erro: e.message, codigo: e.code || 'ERRO' }; } },
    getKPIs(de, ate) {
      if (!core) return semCore();
      try {
        const ind = core.indicadores(de && ate ? { de, ate } : null, {});
        return { periodo: ind.periodo, geradoEm: new Date().toISOString(), demo: core.demo, indicadores: MANIFEST.indicadores.map(i => { const k = ind.kpis.find(x => x.id === i.id) || {}; return Object.assign({}, i, { valor: k.valor == null ? null : k.valor, contagem: k.contagem || (k.total != null ? `${k.valor} de ${k.total}` : null), formula: k.formula, periodoDescricao: k.periodo }); }) };
      } catch (e) { return { erro: e.message, codigo: e.code || 'ERRO' }; }
    },
    export(formato) {
      if (!core) return semCore();
      try {
        if (formato === 'json') return JSON.stringify(core.snapshot());
        if (formato === 'csv') { const l = core.listarPendencias({}); return core.csvLista(['id', 'codigo', 'cliente', 'unidade', 'servico', 'descricao', 'responsabilidade', 'responsavel', 'identificacao', 'prazo', 'situacao', 'visibilidade', 'updatedAt'], l.map(p => [p.id, p.codigo, p.clienteNome, p.unidadeNome, p.servicoCodigo, p.descricao, p.responsabilidade, p.responsavelExibicao, p.identificacao, p.prazo, p.situacao, p.visibilidade, p.updatedAt])); }
        if (formato === 'pdf') { if (!core.can('exportar')) return { erro: 'Acesso negado: o perfil não permite exportar.', codigo: 'PERMISSAO' }; window.print(); return true; }
        return { erro: 'Formato não suportado. Use: ' + MANIFEST.exporta.join(', ') };
      } catch (e) { return { erro: e.message, codigo: e.code || 'ERRO' }; }
    },
    on(evento, fn) { (extListeners[evento] = extListeners[evento] || []).push(fn); return () => { extListeners[evento] = (extListeners[evento] || []).filter(f => f !== fn); }; },
    emit(evento, payload) {
      const msg = { contrato: MANIFEST.contrato, modulo: MANIFEST.id, versao: MANIFEST.versao, evento, payload: payload || {}, demo: core ? core.demo : false, ts: new Date().toISOString() };
      [...(extListeners[evento] || []), ...(extListeners['*'] || [])].forEach(fn => { try { fn(msg.payload, evento); } catch (e) { console.error(e); } });
      try { if (window.parent && window.parent !== window) window.parent.postMessage(msg, '*'); } catch (e) { /* sem painel */ }
    }
  };
  window.NEXO_MODULE = NEXO;
  // Pedidos do painel (somente leitura): { contrato:'nexo-plug/1', pedido:'manifest'|'getKPIs'|'getState'|'export', args:[], id }
  window.addEventListener('message', e => {
    if (window.parent === window || e.source !== window.parent) return;
    const d = e.data || {};
    if (d.contrato !== MANIFEST.contrato || !d.pedido) return;
    const mapa = { manifest: () => MANIFEST, getKPIs: () => NEXO.getKPIs(...(d.args || [])), getState: () => NEXO.getState(), export: () => (d.args && d.args[0] === 'pdf' ? { erro: 'PDF só pela interface do módulo.' } : NEXO.export(...(d.args || []))) };
    const fn = mapa[d.pedido];
    window.parent.postMessage({ contrato: MANIFEST.contrato, modulo: MANIFEST.id, resposta: d.pedido, id: d.id, dados: fn ? fn() : { erro: 'Pedido desconhecido.' } }, '*');
  });

  /* ---------- início ---------- */
  function iniciar() {
    let m = null;
    try { m = sessionStorage.getItem('wrd.operacoes.modo'); } catch (e) { /* aba privada */ }
    if (m === 'real' || m === 'demo') abrirModo(m); else render();
  }
  iniciar();
})();

</script>
</body>
</html>
