table.tab th { background: var(--n-100); text-align: left; font-weight: var(--peso-medio); color: var(--n-700); padding: var(--esp-2); border-bottom: var(--borda) solid var(--n-200); white-space: nowrap; }
table.tab td { padding: var(--esp-2); border-bottom: var(--borda) solid var(--n-100); vertical-align: top; }
table.tab tr.clicavel { cursor: pointer; }
table.tab tr.clicavel:hover td { background: var(--cor-primaria-suave); }
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--min-kpi), 1fr)); gap: var(--esp-3); margin-bottom: var(--esp-4); }
.kpi { text-align: left; background: var(--n-0); border: var(--borda) solid var(--n-200); border-left: var(--borda-destaque) solid var(--cor-primaria); border-radius: var(--raio-lg); padding: var(--esp-3) var(--esp-4); box-shadow: var(--sombra); display: flex; flex-direction: column; gap: var(--esp-0); }
.kpi .rot { font-size: var(--fs-sm); color: var(--n-700); font-weight: var(--peso-medio); }
.kpi .val { font-size: var(--fs-2xl); font-weight: var(--peso-forte); font-variant-numeric: tabular-nums; }
.kpi .det { font-size: var(--fs-xs); color: var(--n-500); }
.kpi.atencao { border-left-color: var(--critico); }
.kpi.atencao .val { color: var(--critico); }

/* ---------- modal e avisos ---------- */
.modal-fundo { position: fixed; inset: 0; background: var(--sobreposicao); z-index: var(--z-modal); display: flex; align-items: flex-start; justify-content: center; padding: var(--margem-modal) var(--esp-3); overflow-y: auto; }
.modal { background: var(--n-0); border-radius: var(--raio-lg); box-shadow: var(--sombra-lg); width: 100%; max-width: var(--largura-modal); }
.modal.largo { max-width: var(--largura-modal-largo); }
.modal-cab { display: flex; align-items: center; justify-content: space-between; gap: var(--esp-2); padding: var(--esp-3) var(--esp-4); border-bottom: var(--borda) solid var(--n-200); position: sticky; top: 0; background: var(--n-0); border-radius: var(--raio-lg) var(--raio-lg) 0 0; z-index: var(--z-meio); }
.modal-cab h2 { margin: 0; font-size: var(--fs-lg); }
.modal-corpo { padding: var(--esp-4); }
.modal-rodape { display: flex; gap: var(--esp-2); justify-content: flex-end; flex-wrap: wrap; padding: var(--esp-3) var(--esp-4); border-top: var(--borda) solid var(--n-200); position: sticky; bottom: 0; background: var(--n-0); }
.toasts { position: fixed; right: var(--esp-4); bottom: var(--esp-4); display: grid; gap: var(--esp-2); z-index: var(--z-aviso); max-width: min(var(--largura-toast), calc(var(--largura-tela) - var(--esp-6))); }
.toast { padding: var(--esp-3) var(--esp-4); border-radius: var(--raio); box-shadow: var(--sombra-lg); background: var(--n-900); color: var(--n-0); font-size: var(--fs-sm); white-space: pre-wrap; }
.toast.ok { background: var(--ok); }
.toast.erro { background: var(--critico); }
.carregando { padding: var(--esp-6); text-align: center; color: var(--n-500); }
.progresso-barra { height: var(--esp-2); background: var(--n-100); border-radius: var(--raio-pilula); overflow: hidden; }
.progresso-barra span { display: block; height: 100%; background: var(--cor-primaria); width: var(--p); }

/* ---------- entrada (igual ao padrão WRD) ---------- */
.entrada { min-height: var(--altura-tela); display: flex; align-items: center; justify-content: center; padding: var(--esp-4); background: linear-gradient(160deg, var(--cor-primaria-suave), var(--n-50)); }
.entrada-box { background: var(--n-0); border-radius: var(--raio-lg); box-shadow: var(--sombra-lg); padding: var(--esp-6) var(--esp-5); width: 100%; max-width: var(--largura-entrada); text-align: center; }
.entrada-box form, .entrada-box .grade { text-align: left; }
.logo-entrada { height: var(--logo-entrada); margin-bottom: var(--esp-2); }
.entrada h1 { margin: 0 0 var(--esp-2); font-size: var(--fs-xl); }

/* ---------- barra de contexto permanente (cliente › unidade › área) ---------- */
.ctx { position: sticky; top: var(--altura-controle-lg); z-index: var(--z-busca); background: var(--cor-primaria-suave); border-bottom: var(--borda) solid var(--cor-primaria-clara); }
.ctx-in { max-width: var(--largura-max); margin: 0 auto; padding: var(--esp-1) var(--esp-4); display: flex; gap: var(--esp-3); align-items: center; flex-wrap: wrap; font-size: var(--fs-sm); }
.ctx-in b { color: var(--cor-primaria-escura); }
.ctx .progresso-barra { flex: 1 1 120px; min-width: var(--largura-progresso); }
.ctx-salvo { font-size: var(--fs-xs); color: var(--n-500); }

/* ---------- vistoria (tela principal) ---------- */
.areas { display: flex; gap: var(--esp-2); overflow-x: auto; padding-bottom: var(--esp-2); margin-bottom: var(--esp-2); }
.area-btn { flex: none; border: var(--borda) solid var(--n-300); background: var(--n-0); border-radius: var(--raio); padding: var(--esp-2) var(--esp-3); cursor: pointer; text-align: left; min-height: var(--toque); min-width: var(--largura-campo-curto); }
.area-btn b { display: block; font-size: var(--fs-sm); }
.area-btn span { font-size: var(--fs-xs); color: var(--n-500); }
.area-btn[aria-pressed="true"] { border-color: var(--cor-primaria); background: var(--cor-primaria-suave); box-shadow: inset 0 calc(var(--borda-aba) * var(--neg)) 0 var(--cor-primaria); }
.area-btn.nova { border-style: dashed; color: var(--cor-primaria); font-weight: var(--peso-forte); }
.lista-itens { max-width: var(--largura-lista-item); }
.sis { background: var(--n-0); border: var(--borda) solid var(--n-200); border-radius: var(--raio-lg); margin-bottom: var(--esp-3); }
.sis > summary { padding: var(--esp-3) var(--esp-4); cursor: pointer; font-weight: var(--peso-forte); color: var(--cor-primaria-escura); display: flex; gap: var(--esp-2); align-items: center; justify-content: space-between; min-height: var(--toque); }
.item { border-top: var(--borda) solid var(--n-100); padding: var(--esp-3) var(--esp-4); }
.item.foco { background: var(--cor-primaria-suave); }
.item-cab { display: flex; gap: var(--esp-2); align-items: flex-start; justify-content: space-between; }
.item-txt { flex: 1; min-width: 0; cursor: pointer; }
.item-cod { font-size: var(--fs-xs); font-weight: var(--peso-forte); color: var(--cor-primaria); }
.item-ref { font-size: var(--fs-xs); color: var(--n-500); }
.item-meta { display: flex; gap: var(--esp-2); flex-wrap: wrap; margin-top: var(--esp-1); }
.sit { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--esp-2); margin-top: var(--esp-2); }
.sit button { min-height: var(--toque); border: var(--borda-forte) solid var(--n-300); background: var(--n-0); border-radius: var(--raio); font-weight: var(--peso-forte); font-size: var(--fs-lg); cursor: pointer; color: var(--n-700); }
.sit button[data-s="C"][aria-pressed="true"] { background: var(--sit-c); border-color: var(--sit-c); color: var(--n-0); }
.sit button[data-s="NC"][aria-pressed="true"] { background: var(--sit-nc); border-color: var(--sit-nc); color: var(--n-0); }
.sit button[data-s="NA"][aria-pressed="true"] { background: var(--sit-na); border-color: var(--sit-na); color: var(--n-0); }
.sit button[data-s="NV"][aria-pressed="true"] { background: var(--sit-nv); border-color: var(--sit-nv); color: var(--n-0); }
.sit button[disabled] { cursor: not-allowed; opacity: var(--op-desabilitado); }
.btn-cam { min-width: var(--toque); min-height: var(--toque); font-size: var(--fs-icone); }
.pend { color: var(--alerta); font-weight: var(--peso-forte); font-size: var(--fs-xs); }
.contagens { display: flex; gap: var(--esp-2); flex-wrap: wrap; font-size: var(--fs-sm); }
.acoes-fixas { position: sticky; bottom: 0; background: var(--n-0); border-top: var(--borda) solid var(--n-200); padding: var(--esp-2) var(--esp-3); display: flex; gap: var(--esp-2); z-index: var(--z-acima); margin: 0 calc(var(--esp-4) * var(--neg)); }
.acoes-fixas .btn { flex: 1; min-height: var(--toque); }

/* ---------- fotos ---------- */
.fotos { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--mini), 1fr)); gap: var(--esp-2); }
.foto { position: relative; border: var(--borda) solid var(--n-200); border-radius: var(--raio); overflow: hidden; background: var(--n-100); cursor: pointer; padding: 0; text-align: left; }
.foto img { display: block; width: 100%; aspect-ratio: var(--proporcao-quadrada); object-fit: cover; background: var(--n-100); }
.foto img.sem-arquivo { object-fit: contain; }
.foto .selo { position: absolute; left: var(--esp-1); top: var(--esp-1); }
.foto .env { position: absolute; right: var(--esp-1); top: var(--esp-1); }
.foto .leg { display: block; font-size: var(--fs-2xs); padding: var(--esp-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: var(--n-0); }
.foto.fora { opacity: var(--op-fechado); }
.foto-acoes { display: flex; gap: var(--esp-2); flex-wrap: wrap; margin: var(--esp-2) 0; }
.foto-acoes .btn { min-height: var(--toque); flex: 1 1 auto; }
.foto-grande { width: 100%; max-height: var(--anot-max); object-fit: contain; background: var(--n-900); border-radius: var(--raio); display: block; }
.camera { position: fixed; inset: 0; background: var(--n-900); z-index: var(--z-aviso); display: flex; flex-direction: column; }
.camera video { flex: 1; min-height: 0; width: 100%; object-fit: contain; background: var(--n-900); }
.camera-barra { display: flex; align-items: center; justify-content: space-between; gap: var(--esp-3); padding: var(--esp-3); color: var(--n-0); }
.camera-disparo { width: var(--camera-botao); height: var(--camera-botao); border-radius: var(--raio-pilula); border: var(--borda-destaque) solid var(--n-0); background: var(--critico); cursor: pointer; }
.camera .btn { min-height: var(--toque); }
.camera-mini { display: flex; gap: var(--esp-1); overflow-x: auto; padding: 0 var(--esp-3) var(--esp-2); }
.camera-mini img { height: var(--mini-sm); border-radius: var(--raio-sm); }
.anotador { position: relative; background: var(--n-900); border-radius: var(--raio); overflow: auto; max-height: var(--anot-max); touch-action: none; }
.anotador canvas { display: block; max-width: 100%; margin: 0 auto; touch-action: none; }
.fila-lista { max-height: var(--altura-lista-busca); overflow: auto; }
.estado-envio { white-space: nowrap; }

/* ---------- relatórios (tela) ---------- */
.rel-grade { display: grid; grid-template-columns: minmax(var(--rel-cfg-min), var(--rel-cfg-max)) 1fr; gap: var(--esp-4); align-items: start; }
.rel-prev { min-width: 0; overflow-x: auto; }
.doc { background: var(--n-0); border: var(--borda) solid var(--n-200); box-shadow: var(--sombra); padding: var(--doc-pad-v) var(--doc-pad-h); font-size: var(--doc-fs); color: var(--pci-texto); }
.doc-cab { display: flex; align-items: center; gap: var(--esp-4); border-bottom: var(--borda-aba) solid var(--pci-marinho); padding-bottom: var(--esp-3); margin-bottom: var(--esp-3); }
.doc-cab img { height: var(--logo-doc); }
.doc-tit { font-size: var(--doc-fs-titulo); font-weight: var(--peso-forte); color: var(--pci-marinho); }
.doc-meta { font-size: var(--fs-xs); color: var(--pci-rotulo); }
.doc h2 { color: var(--pci-marinho); font-size: var(--rel-fs-h2); border-bottom: var(--borda-forte) solid var(--pci-marinho); padding-bottom: var(--esp-1); margin: var(--esp-5) 0 var(--esp-2); }
.doc h3 { color: var(--pci-marinho); font-size: var(--rel-fs-h3); margin: var(--esp-4) 0 var(--esp-2); }
.doc h4 { color: var(--pci-texto); font-size: var(--rel-fs-h4); margin: var(--esp-3) 0 var(--esp-1); }
.rel-tab { width: 100%; border-collapse: collapse; margin: var(--esp-2) 0 var(--esp-3); font-size: var(--rel-fs-sm); }
.rel-tab th, .rel-tab td { border: var(--borda) solid var(--pci-linha); padding: var(--esp-1) var(--esp-2); vertical-align: top; text-align: left; }
.rel-tab thead th, .rel-kv th, .rel-legal th { background: var(--pci-fundo-cab); color: var(--pci-marinho); }
.rel-kv th, .rel-legal th { width: var(--rel-th-larg); }
.rel-tab-wrap { overflow-x: auto; }
.cl { display: inline-block; padding: var(--esp-0) var(--esp-2); border-radius: var(--raio-sm); font-size: var(--rel-fs-xs); font-weight: var(--peso-forte); color: var(--pci-texto); white-space: nowrap; }
.cl-ncl, .cel-ncl { background: var(--classe-ncl); }
.cl-ver, .cel-ver { background: var(--classe-ver); }
.cl-rec, .cel-rec { background: var(--classe-rec); }
.cl-conf, .cel-conf { background: var(--classe-conf); }
.cl-na, .cel-na { background: var(--classe-na); }
.rel-status { font-size: var(--rel-fs-xs); font-weight: var(--peso-forte); padding: 0 var(--esp-1); border-radius: var(--raio-sm); white-space: nowrap; }
.st-confirmado { background: var(--ok-fundo); color: var(--ok); }
.st-avalidar, .st-hipótese, .st-hipotese { background: var(--alerta-fundo); color: var(--alerta); }
.st-nãoinformado, .st-naoinformado { background: var(--critico-fundo); color: var(--critico); }
.rel-ni { color: var(--critico); font-weight: var(--peso-forte); font-size: var(--rel-fs-xs); }
.rel-nota { color: var(--pci-rotulo); font-size: var(--rel-fs-xs); }
.rel-onde { font-weight: var(--peso-normal); color: var(--pci-rotulo); font-size: var(--rel-fs-sm); }
.rel-prio { display: inline-block; font-size: var(--rel-fs-xs); font-weight: var(--peso-forte); color: var(--pci-marinho); }
.rel-aviso { border: var(--borda-forte) solid var(--alerta); background: var(--alerta-fundo); color: var(--alerta); padding: var(--esp-2) var(--esp-3); margin: var(--esp-2) 0 var(--esp-3); }
.rel-apont { border-left: var(--borda-destaque) solid var(--pci-marinho); padding-left: var(--esp-3); margin: var(--esp-3) 0 var(--esp-4); }
.rel-apont p { margin: var(--esp-1) 0; }
.rel-fotos { display: grid; gap: var(--rel-gap); margin: var(--esp-2) 0; break-inside: avoid; }
.rel-fotos.f-h { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.rel-fotos.f-v { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.rel-foto { margin: 0; break-inside: avoid; border: var(--borda) solid var(--pci-linha); padding: var(--esp-1); }
.rel-foto img { display: block; width: 100%; height: auto; }
.rel-foto figcaption { font-size: var(--rel-fs-xs); color: var(--pci-texto); margin-top: var(--esp-1); }
.rel-sem-arq { padding: var(--esp-5) var(--esp-2); text-align: center; background: var(--classe-na); font-size: var(--rel-fs-xs); }
.rel-crono td, .rel-crono th { text-align: center; }
.rel-crono td:first-child, .rel-crono th:first-child { text-align: left; }
.cr-marca { background: var(--pci-marinho); color: var(--n-0); }
.rel-assin { margin-top: var(--rel-assin-esp); width: var(--rel-assin-larg); text-align: center; font-size: var(--rel-fs-sm); }
.rel-linha-assin { border-top: var(--borda) solid var(--pci-texto); margin-bottom: var(--esp-1); }

/* ---------- capa do relatório (padrão WRD aprovado em 21/10/2026) ---------- */
.capa { width: var(--capa-larg); max-width: 100%; display: grid; grid-template-rows: var(--capa-h-logos) var(--capa-h-bloco) var(--capa-h-filete) auto auto var(--capa-h-rodape); background: var(--n-0); color: var(--pci-texto); margin: 0 auto var(--esp-5); border: var(--borda) solid var(--pci-linha); }
.capa-logos { display: flex; align-items: center; padding: 0 var(--capa-pad); border-bottom: var(--borda) solid var(--pci-linha); }
.capa-logo { height: var(--capa-logo-h); }
.capa-bloco { position: relative; overflow: hidden; background: repeating-linear-gradient(135deg, var(--capa-hachura) 0, var(--capa-hachura) var(--borda), transparent var(--borda), transparent var(--esp-3)), linear-gradient(160deg, var(--pci-marinho), var(--pci-marinho-escuro)); color: var(--n-0); padding: var(--capa-pad-topo) var(--capa-pad) var(--capa-pad); display: flex; flex-direction: column; justify-content: flex-start; }
.capa-diamantes { position: absolute; right: var(--capa-diam-dir); top: var(--capa-pad); width: var(--capa-diam); height: var(--capa-diam); }
.capa-diamantes polygon { fill: none; stroke: var(--capa-diamante); stroke-width: var(--borda-forte); }
.capa-barra { width: var(--capa-barra-l); height: var(--capa-barra-h); background: var(--pci-vermelho); margin-bottom: var(--capa-gap); }
.capa-sobre { font-size: var(--capa-sobre-fs); letter-spacing: var(--capa-ls); color: var(--pci-texto-claro); }
.capa-tit { font-size: var(--capa-tit-fs); line-height: var(--capa-tit-lh); color: var(--n-0); margin: var(--capa-gap) 0; font-weight: var(--peso-forte); position: relative; }
.capa-sub { font-size: var(--capa-sub-fs); color: var(--pci-texto-claro); margin: 0 var(--capa-recuo-sub) var(--capa-gap) 0; position: relative; }
.capa-cli { font-size: var(--capa-cli-fs); font-weight: var(--peso-forte); margin-top: auto; position: relative; }
.capa-cli2 { font-size: var(--capa-cli2-fs); color: var(--pci-texto-claro); position: relative; }
.capa-filete { background: var(--pci-vermelho); }
.capa-dados { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--capa-gap); padding: var(--capa-gap) var(--capa-pad) 0; }
.capa-cel { border-top: var(--capa-filete-cel) solid var(--pci-marinho); padding-top: var(--esp-1); }
.capa-rot { font-size: var(--capa-rot-fs); font-weight: var(--peso-forte); color: var(--pci-rotulo); letter-spacing: var(--ls-md); }
.capa-val { font-size: var(--capa-val-fs); font-weight: var(--peso-forte); color: var(--pci-marinho); }
.capa-comp { font-size: var(--capa-comp-fs); color: var(--pci-rotulo); }
.capa-rt { padding: var(--capa-gap) var(--capa-pad); }
.capa-rt-nome { font-size: var(--capa-rt-fs); font-weight: var(--peso-forte); color: var(--pci-marinho); }
.capa-rodape { background: var(--pci-rodape); display: flex; align-items: center; justify-content: space-between; padding: 0 var(--capa-pad); font-size: var(--capa-comp-fs); color: var(--pci-rotulo); }
.capa-rodape b { color: var(--pci-marinho); }

/* ---------- responsivo (celular primeiro na vistoria) ---------- */
@media (max-width: 1100px) {
  .g3 { grid-template-columns: 1fr 1fr; }
  .rel-grade { grid-template-columns: 1fr; }
}
@media (max-width: 760px) {
  .topo-in { padding: var(--esp-2) var(--esp-3); gap: var(--esp-2); }
  .topo .modulo { display: none; }
  .topo .usuario span { display: none; }
  main { padding: var(--esp-2) var(--esp-3) var(--esp-7); }
  .g2, .g3 { grid-template-columns: 1fr; }
  .kpis { grid-template-columns: 1fr 1fr; }
  .kpi { padding: var(--esp-2) var(--esp-3); }
  .kpi .val { font-size: var(--fs-xl); }
  .modal-fundo { padding: 0; }
  .modal, .modal.largo { max-width: none; min-height: var(--altura-tela); border-radius: 0; }
  .modal-cab { border-radius: 0; }
  .modal-corpo { padding: var(--esp-3); }
  .ctx-in { padding: var(--esp-1) var(--esp-3); }
  .item { padding: var(--esp-3); }
  .acoes-fixas { margin: 0 calc(var(--esp-3) * var(--neg)); }
  .doc { padding: var(--esp-3); }
  .cab-tela h1 { font-size: var(--fs-lg); }
}

/* ---------- impressão ---------- */
/* exceção: @page e suas margens não aceitam variáveis CSS; o texto do cabeçalho/rodapé é injetado pelo relatório */
@page { size: A4; margin: 18mm 14mm 16mm 14mm; }
@page capa { margin: 0; }
@page corpo { margin: 18mm 14mm 16mm 14mm;
  @top-left { font-size: 8pt; color: #143884; font-weight: bold; }
  @top-right { font-size: 8pt; color: #6B7686; }
  @bottom-left { font-size: 8pt; color: #6B7686; }
  @bottom-right { font-size: 8pt; color: #6B7686; }
}
@page paisagem { size: A4 landscape; margin: 14mm 12mm 14mm 12mm;
  @top-left { font-size: 8pt; color: #143884; font-weight: bold; }
  @top-right { font-size: 8pt; color: #6B7686; }
  @bottom-left { font-size: 8pt; color: #6B7686; }
  @bottom-right { font-size: 8pt; color: #6B7686; }
}
@media print {
  body { background: var(--n-0); }
  body.imprimindo-doc #app, body.imprimindo-doc #toasts, body.imprimindo-doc .modal-fundo, body.imprimindo-doc .camera { display: none !important; }
  body.imprimindo-doc #area-impressao { display: block; }
  body:not(.imprimindo-doc) #area-impressao { display: none; }
  .doc { border: 0; box-shadow: none; padding: 0; font-size: var(--rel-fs); }
  .capa { page: capa; width: var(--capa-larg); height: var(--capa-alt); border: 0; margin: 0; break-after: page; }
  .rel-corpo, .tipo-nc, .tipo-fotografico { page: corpo; }
  .doc-ppci:not(.tipo-completo) { page: corpo; }
  .pag-paisagem { page: paisagem; break-before: page; }
  .rel-corpo + .pag-paisagem + .rel-corpo { break-before: page; }
  .rel-tab tr, .rel-apont h3, .rel-foto { break-inside: avoid; }
  .rel-tab thead { display: table-header-group; }
  .doc h2, .doc h3, .doc h4 { break-after: avoid; }
  .capa, .capa *, .rel-tab th, .rel-tab td, .cl, .cr-marca, .rel-aviso, .rel-status { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
#area-impressao { display: none; }

/* ---------- comentários do item ---------- */
.com { border-left: var(--borda-forte) solid var(--n-200); padding: var(--esp-1) 0 var(--esp-1) var(--esp-2); margin-bottom: var(--esp-2); }
.com .meta { display: flex; gap: var(--esp-2); flex-wrap: wrap; align-items: center; font-size: var(--fs-xs); color: var(--n-500); }
.com .txt { margin: var(--esp-1) 0; white-space: pre-wrap; overflow-wrap: anywhere; }

/* ---------- indicadores: linhas com barra ---------- */
.sc-row { display: grid; grid-template-columns: minmax(var(--sc-rotulo), 1.2fr) minmax(var(--sc-barra), 2fr) var(--sc-valor); gap: var(--esp-1) var(--esp-2); align-items: center; font-size: var(--fs-sm); margin: var(--esp-2) 0; }
.sc-row .lbl { overflow-wrap: anywhere; }
.sc-row .val { text-align: right; font-variant-numeric: tabular-nums; font-weight: var(--peso-medio); }
.sc-row .note { grid-column: 1 / -1; font-size: var(--fs-xs); color: var(--n-500); }
.trk { height: var(--esp-2); background: var(--n-100); border-radius: var(--raio-pilula); overflow: hidden; }
.trk .fill { display: block; height: 100%; background: var(--cor-primaria); border-radius: var(--raio-pilula); }
.trk .fill.nc { background: var(--critico); }
.clicavel { cursor: pointer; }
.clicavel:hover td { background: var(--cor-primaria-suave); }
.tab td.n, .tab th.n { text-align: right; font-variant-numeric: tabular-nums; }
@media (max-width: 760px) { .sc-row { grid-template-columns: 1fr 1fr; } .sc-row .val { text-align: left; } }
.indice-valor { font-family: var(--cond); font-size: var(--fs-2xl); color: var(--cor-primaria); font-variant-numeric: tabular-nums; }

/* ---------- rolagem horizontal também no topo da tabela ---------- */
.rolagem-topo { overflow-x: auto; overflow-y: hidden; height: var(--esp-4); margin-bottom: var(--esp-1); }
.rolagem-topo > div { height: var(--borda); }

/* Ajustes de uso em celular (revisão de simplicidade): texto do item ocupa a linha; botões quebram o texto em vez de vazar. */
.btn { white-space: normal; max-width: 100%; text-align: center; }
.item-txt { flex: 1 1 260px; }
.item-cab > .btn-cam { flex: 0 0 auto; }
.item-cab { flex-wrap: wrap; }
.menu-sec { margin: var(--esp-2) 0; }
.menu-sec > summary { list-style: none; display: inline-block; }
.menu-sec > summary::-webkit-details-marker { display: none; }
.menu-sec-corpo { display: flex; flex-wrap: wrap; gap: var(--esp-2); margin-top: var(--esp-2); }

</style>

<script>
/* =====================================================================
   WRD NUVEM — sincronização dos módulos WRD (Operações, Comercial, Financeiro) com o Supabase "WRD Sistemas".
   Arquivo compartilhado: cada build.js inclui este arquivo. Sem DOM no cliente e no sincronizador.
   - Login por e-mail e senha (Supabase Auth), uma vez por aparelho; o login do módulo continua como antes.
   - Cada módulo guarda UM estado (tabela estado_modulo); só membros do módulo leem; só a função
     salvar_estado grava, com controle de versão (quem estiver desatualizado recebe CONFLITO e mescla).
   - Mesclagem: registros (listas com id) pelo mais recente (updatedAt); contadores pelo maior valor;
     o resto pelo estado gravado por último. Os módulos não excluem registros (arquivam), então juntar não perde dados.
   A chave abaixo é a chave PUBLICÁVEL do projeto (feita para ficar no navegador); a proteção é feita pelas regras do banco.
   ===================================================================== */
const WRDNuvem = (function () {
  'use strict';
  const CONFIG = { url: 'https://dqaejvkfudewwudghezp.supabase.co', chave: 'sb_publishable_CpC0CZAsU_yDqxvtRgUdsQ_vD9r-pWQ', projeto: 'WRD Sistemas' };
  const clone = o => JSON.parse(JSON.stringify(o));
  const ehObj = o => o && typeof o === 'object' && !Array.isArray(o);
  const carimbo = x => String((x && (x.updatedAt || x.ts || x.createdAt)) || '');
  function erro(msg, code) { const e = new Error(msg); e.code = code; return e; }
  const MSG = {
    'Invalid login credentials': 'E-mail ou senha incorretos.',
    'Email not confirmed': 'Confirme o e-mail: abra a mensagem enviada pelo Supabase e clique no link.',
    'User already registered': 'Este e-mail já tem acesso. Use "Entrar".',
    SEM_ACESSO: 'Seu acesso a este módulo ainda não foi liberado. Peça ao administrador.',
    CONFLITO: 'Os dados mudaram em outro aparelho.'
  };

  /* ---------- cliente REST (Auth + PostgREST), sem biblioteca externa ---------- */
  function cliente(o) {
    const modulo = o.modulo, guarda = o.guarda, guardaSessao = o.guardaSessao || o.guarda, f = o.fetchFn || ((...a) => fetch(...a)), agora = o.agora || (() => Date.now());
    let sessao = null; try { sessao = JSON.parse(guardaSessao.get('nuvem.sessao') || 'null'); } catch (e) { sessao = null; }
    const gravarSessao = s => { sessao = s; if (s) guardaSessao.set('nuvem.sessao', JSON.stringify(s)); else guardaSessao.remove('nuvem.sessao'); };
    const deResposta = j => ({ access_token: j.access_token, refresh_token: j.refresh_token, expires_at: j.expires_at ? j.expires_at * 1000 : agora() + (j.expires_in || 3600) * 1000, user: { id: j.user && j.user.id, email: j.user && j.user.email } });
    async function http(caminho, opc, autenticar) {
      const h = { apikey: CONFIG.chave, 'Content-Type': 'application/json' };
      if (autenticar) { await garantirToken(); h.Authorization = 'Bearer ' + sessao.access_token; }
      let r;
      try { r = await f(CONFIG.url + caminho, Object.assign({ headers: h }, opc)); } catch (e) { throw erro('Sem conexão com a nuvem.', 'OFFLINE'); }
      const txt = await r.text(); let j = null; try { j = txt ? JSON.parse(txt) : null; } catch (e) { j = txt; }
      if (!r.ok) {
        const m = (j && (j.message || j.msg || j.error_description || j.error)) || ('HTTP ' + r.status);
        const code = /CONFLITO/.test(m) ? 'CONFLITO' : /SEM_ACESSO/.test(m) ? 'SEM_ACESSO' : /USUARIO_NAO_CADASTRADO/.test(m) ? 'USUARIO_NAO_CADASTRADO' : r.status === 401 ? 'AUTH' : 'NUVEM';
        if (code === 'AUTH' && autenticar) gravarSessao(null);
        throw erro(MSG[code] || MSG[m] || m, code);
      }
      return j;
    }
    async function garantirToken() {
      if (!sessao) throw erro('Entre com o seu e-mail para usar a nuvem.', 'AUTH');
      if (sessao.expires_at - agora() > 60000) return;
      try { gravarSessao(deResposta(await http('/auth/v1/token?grant_type=refresh_token', { method: 'POST', body: JSON.stringify({ refresh_token: sessao.refresh_token }) }, false))); }
      catch (e) { if (e.code !== 'OFFLINE') gravarSessao(null); throw e; }
    }
    return {
      modulo,
      conectado: () => !!sessao,
      usuario: () => (sessao ? sessao.user : null),
      async entrar(email, senha) { gravarSessao(deResposta(await http('/auth/v1/token?grant_type=password', { method: 'POST', body: JSON.stringify({ email: String(email).trim(), password: senha }) }, false))); return sessao.user; },
      async cadastrar(email, senha) {
        if (String(senha || '').length < 8) throw erro('A senha da nuvem precisa de pelo menos 8 caracteres.', 'SENHA');
        const j = await http('/auth/v1/signup', { method: 'POST', body: JSON.stringify({ email: String(email).trim(), password: senha }) }, false);
        if (j && j.access_token) { gravarSessao(deResposta(j)); return { entrou: true }; }
        return { confirmar: true };
      },
      async sair() { try { if (sessao) await http('/auth/v1/logout', { method: 'POST' }, true); } catch (e) { /* sai mesmo sem conexão */ } gravarSessao(null); },
      async acesso() { const l = await http('/rest/v1/membros?select=modulo,papel', { method: 'GET' }, true); return (l || []).find(x => x.modulo === modulo) || null; },
      async ler() { const l = await http(`/rest/v1/estado_modulo?modulo=eq.${modulo}&select=dados,versao,atualizado_em,aparelho`, { method: 'GET' }, true); return l && l[0] ? l[0] : null; },
      async salvar(dados, versao, aparelho) { return http('/rest/v1/rpc/salvar_estado', { method: 'POST', body: JSON.stringify({ p_modulo: modulo, p_dados: dados, p_versao: versao, p_aparelho: aparelho || null }) }, true); },
      async uso() { return http('/rest/v1/rpc/uso_modulos', { method: 'POST', body: '{}' }, true); },
      /** Envia um PDF ao bucket privado "documentos" (pasta do módulo). Devolve o caminho guardado no registro. */
      async enviarPdf(blob) {
        await garantirToken();
        const caminho = modulo + '/' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10) + '.pdf';
        let r;
        try { r = await f(CONFIG.url + '/storage/v1/object/documentos/' + caminho, { method: 'POST', headers: { apikey: CONFIG.chave, Authorization: 'Bearer ' + sessao.access_token, 'Content-Type': 'application/pdf' }, body: blob }); }
        catch (e) { throw erro('Sem conexão com a nuvem.', 'OFFLINE'); }
        if (!r.ok) { const t = await r.text(); throw erro(/exceeded|too large|size/i.test(t) ? 'O PDF passa do limite de 25 MB.' : 'Não foi possível enviar o arquivo (' + r.status + ').', 'ENVIO'); }
        return caminho;
      },
      /** Link temporário (1 hora) para abrir um PDF do bucket privado. */
      async linkPdf(caminho) { const j = await http('/storage/v1/object/sign/documentos/' + caminho, { method: 'POST', body: JSON.stringify({ expiresIn: 3600 }) }, true); return CONFIG.url + '/storage/v1' + j.signedURL; },
      /** Publica um evento na tabela eventos (somente de inserção). Quem grava é o próprio usuário logado. */
      async publicarEvento(tipo, entidadeId, payload) {
        const uid = sessao && sessao.user ? sessao.user.id : null;
        return http('/rest/v1/eventos', { method: 'POST', headers: { Prefer: 'return=minimal' }, body: JSON.stringify({ tipo, modulo, entidade_id: entidadeId ? String(entidadeId) : null, payload: payload || {}, criado_por: uid }) }, true);
      },
      async adicionarMembro(email, papel) { return http('/rest/v1/rpc/adicionar_membro', { method: 'POST', body: JSON.stringify({ p_email: email, p_modulo: modulo, p_papel: papel || 'membro' }) }, true); }
    };
  }

  /* ---------- mesclagem de dois estados do mesmo módulo ---------- */
  function mesclarValor(L, R, chave, localMaisNovo) {
    if (Array.isArray(L) && Array.isArray(R) && L.concat(R).every(x => ehObj(x) && x.id != null)) {
      const m = new Map(R.map(x => [x.id, x]));
      for (const x of L) { const y = m.get(x.id); if (!y || carimbo(x) > carimbo(y)) m.set(x.id, x); }
      return [...m.values()];
    }
    if (ehObj(L) && ehObj(R)) {
      const out = {};
      for (const k of new Set([...Object.keys(R), ...Object.keys(L)])) out[k] = k in L ? (k in R ? mesclarValor(L[k], R[k], k, localMaisNovo) : L[k]) : R[k];
      if (/^(seq|contadores|sequencias)$/.test(chave)) for (const k of Object.keys(out)) if (typeof L[k] === 'number' && typeof R[k] === 'number') out[k] = Math.max(L[k], R[k]);
      return out;
    }
    if (chave === 'ultimoOficial' && /^\d+$/.test(L) && /^\d+$/.test(R)) return String(Math.max(+L, +R));
    return localMaisNovo ? L : R;
  }
  /** Junta o estado local (com alterações ainda não enviadas) e o remoto. */
  function mesclar(local, remoto) {
    if (!remoto) return clone(local);
    if (!local) return clone(remoto);
    const out = mesclarValor(clone(local), clone(remoto), '', carimbo(local) > carimbo(remoto));
    out.updatedAt = [carimbo(local), carimbo(remoto)].sort().pop() || out.updatedAt;
    return out;
  }

  /* ---------- sincronizador: estado local (localStorage) <-> nuvem ---------- */
  function sincronizador(o) {
    const cli = o.cliente, local = o.local, aparelho = o.aparelho || '', avisar = o.aoStatus || (() => {}), recarregar = o.aoRecarregar || (() => {});
    const lerMeta = () => { try { return JSON.parse(local.get('nuvem.meta') || 'null') || { versao: 0, pendente: false }; } catch (e) { return { versao: 0, pendente: false }; } };
    const gravarMeta = m => local.set('nuvem.meta', JSON.stringify(m));
    let meta = lerMeta(), enviando = null, geracao = 0, tmr = null, repetir = null, ultimo = null;
    const status = (s, extra) => { const st = Object.assign({ situacao: s, pendente: meta.pendente, versao: meta.versao, ultimo }, extra || {}); avisar(st); return st; };
    const estadoLocal = () => { const r = local.get('state'); return r ? JSON.parse(r) : null; };
    async function puxar() {
      if (enviando) await enviando.catch(() => {});
      status('sincronizando');
      let r; try { r = await cli.ler(); } catch (e) { return falha(e); }
      meta = lerMeta();
      const loc = estadoLocal();
      if (!r) { if (loc) { meta.pendente = true; gravarMeta(meta); return enviar(); } ultimo = new Date(); return status('ok'); }
      if (r.versao === meta.versao) { if (meta.pendente) return enviar(); ultimo = new Date(); return status('ok'); }
      // primeiro uso deste aparelho com dados já guardados nele: junta, nunca substitui
      if (meta.versao === 0 && loc) meta.pendente = true;
      if (!meta.pendente || !loc) {
        local.set('state', JSON.stringify(r.dados)); meta = { versao: r.versao, pendente: false }; gravarMeta(meta); ultimo = new Date();
        recarregar({ origem: r.aparelho || '', atualizadoEm: r.atualizado_em }); return status('ok', { recebido: true });
      }
      local.set('state', JSON.stringify(mesclar(loc, r.dados))); meta = { versao: r.versao, pendente: true }; gravarMeta(meta);
      recarregar({ mesclado: true }); return enviar();
    }
    // Dentro do painel integrado, avisa que a nuvem mudou para o painel atualizar os indicadores.
    function avisarPainel() { try { if (window.parent && window.parent !== window) window.parent.postMessage({ wrd: 'nuvem', modulo: cli.modulo }, '*'); } catch (e) { /* sem painel */ } }

/* =====================================================================
   ADAPTADOR DE ARMAZENAMENTO (IndexedDB, isolado por namespace)
   Banco "wrd.<namespace>": estado (JSON), arquivos (originais e derivados),
   miniaturas, fila de envio. Fotos NUNCA ficam dentro do estado JSON.
   ===================================================================== */
function abrirArmazem(namespace) {
  const nome = 'wrd.' + namespace;
  return new Promise((ok, erro) => {
    const rq = indexedDB.open(nome, 1);
    rq.onupgradeneeded = () => {
      const db = rq.result;
      ['estado', 'arquivos', 'miniaturas', 'fila', 'kv'].forEach(s => { if (!db.objectStoreNames.contains(s)) db.createObjectStore(s); });
    };
    rq.onerror = () => erro(rq.error);
    rq.onblocked = () => erro(new Error('Banco de dados bloqueado por outra aba deste módulo. Feche as outras abas.'));
    rq.onsuccess = () => {
      const db = rq.result;
      const tx = (store, modo, fn) => new Promise((res, rej) => {
        const t = db.transaction(store, modo), s = t.objectStore(store); let out;
        try { out = fn(s); } catch (e) { rej(e); return; }
        t.oncomplete = () => res(out && 'result' in out ? out.result : out);
        t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('Gravação cancelada (espaço insuficiente?)'));

        nome, db,
        get: (store, k) => tx(store, 'readonly', s => s.get(k)),
        put: (store, k, v) => tx(store, 'readwrite', s => s.put(v, k)),
        del: (store, k) => tx(store, 'readwrite', s => s.delete(k)),
        keys: (store) => tx(store, 'readonly', s => s.getAllKeys()),
        all: (store) => tx(store, 'readonly', s => s.getAll()),
        count: (store) => tx(store, 'readonly', s => s.count()),
        fechar: () => db.close()

    };
  });
}

async function criarNucleo(opts) {

<script>
/* =====================================================================
   EVIDÊNCIAS (parte do núcleo comum): arquivos de foto, miniaturas,

function criarEvidencias(core) {
  const arm = core.arm;

  const ouvintes = [];

  async function enfileirar(hash, info, ctx) {

    const res = { ok: [], duplicadas: 0, recusadas: [] };

    const conferir = async (id, hash) => !!core.foto(id) && !!(await arm.get('arquivos', hash));
    const lista = Array.from(arquivos);
    for (let n = 0; n < lista.length; n++) {
      const f = lista[n];
      try {
        if (!/^image\//.test(f.type || '') && !/\.(jpe?g|png|webp|heic|heif|gif|bmp)$/i.test(f.name || '')) { res.recusadas.push({ nome: f.name, motivo: 'não é imagem' }); continue; }

        const foto = core.registrarFoto(Object.assign({}, ctx, { hash: info.hash, tipo: info.tipo, tamanho: info.tamanho, largura: info.largura, altura: info.altura, nomeArquivo: f.name || '', capturadaEm: f.lastModified ? new Date(f.lastModified).toISOString() : null }));

}

/* ---------------------------------------------------------------------
   ADAPTADOR REAL: NUVEM WRD (Supabase Storage, bucket privado "fotos").
   Caminho = <modulo>/<hash SHA-256>. Confirmação = o arquivo é baixado de volta e o hash é conferido.
   409 (já existe) também passa pela conferência. Sem busca prévia no servidor (consultar não deduplica):
   o envio é repetido e confirmado pelo hash, nunca marcado sem conferir.
   --------------------------------------------------------------------- */
function criarAdaptadorNuvem(o) {
  const { url, chave, modulo, token } = o;
  const caminho = hash => `${modulo}/${hash}`;
  const cab = t => ({ apikey: chave, Authorization: 'Bearer ' + t });
  const semRede = () => { const e = new Error('Sem conexão com a nuvem.'); e.code = 'OFFLINE'; return e; };
  async function baixar(hash) {
    const t = await token(); let r;
    try { r = await fetch(`${url}/storage/v1/object/fotos/${caminho(hash)}`, { headers: cab(t) }); } catch (e) { throw semRede(); }
    if (r.status === 404 || r.status === 400) return null;
    if (!r.ok) throw new Error('Não foi possível baixar a foto da nuvem (' + r.status + ').');
    return r.blob();
  }
  return {
    id: 'nuvem', nome: 'Nuvem WRD (Supabase)', real: true, simulado: false,
    async consultar() { return { existe: false }; },
    async enviar({ hash, blob }) {
      const t = await token(); let r;
      try { r = await fetch(`${url}/storage/v1/object/fotos/${caminho(hash)}`, { method: 'POST', headers: Object.assign(cab(t), { 'Content-Type': blob.type || 'application/octet-stream', 'x-upsert': 'false' }), body: blob }); }
      catch (e) { throw semRede(); }
      // Duplicata: o Supabase responde 409 ou 400 com 'already exists', conforme a versão. Em ambos os casos o arquivo é conferido pelo hash abaixo.
      let corpo = ''; if (!r.ok) corpo = await r.text().catch(() => '');
      const duplicado = r.status === 409 || /already exists|duplicate/i.test(corpo);
      if (!r.ok && !duplicado) throw new Error('A nuvem recusou o arquivo (' + r.status + '): ' + corpo.slice(0, 120));
      const volta = await baixar(hash);
      if (!volta) throw new Error('A nuvem não confirmou o arquivo.');
      const calc = await sha256Arquivo(volta);
      if (calc !== hash) throw new Error('Integridade: o arquivo guardado na nuvem não confere com o hash.');
      return { confirmado: true, hash: calc, idServidor: caminho(hash) };
    },
    baixar
  };
}

/* ---------------------------------------------------------------------
   SERVIDOR SIMULADO — só para teste. Guarda o que "recebeu" num banco
   próprio do navegador (wrd.checklist-ppci.servidor-simulado[.demo]),
   calcula o hash do que recebeu (verificação de integridade) e conta
   quantas vezes cada arquivo chegou (prova de não duplicação).
   Falhas, perda de resposta e lentidão são configuráveis.
   --------------------------------------------------------------------- */
function criarServidorSimulado(demo) {

      ["HID-05", "Alcance de jato do esguicho regulável não inferior a 10 m", {"orgao":"CBPMESP","estado":"SP","documento":"IT 22/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5477).","requisito":"4.11.2.3","conteudo":"O alcance do jato para esguicho regulável, produzido por qualquer sistema adotado conforme a Tabela 2, não deve ser inferior a 10 m, medido da saída do esguicho ao ponto de queda do jato, com o jato paralelo ao solo e com o esguicho regulado para jato compacto.","status":"CONFIRMADO","nota":"Verificado por script em 26/10/2026 no PDF oficial do portal (IT 22, SHA-256 dfd708b658b9462b…). Arquivo: sp-it/5477.pdf."}],
      ["HID-06", "Qualquer ponto da área protegida alcançado por um esguicho", {"orgao":"CBPMESP","estado":"SP","documento":"IT 22/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5477).","requisito":"4.8.2","conteudo":"Os hidrantes ou mangotinhos devem ser distribuídos de tal forma que qualquer ponto da área a ser protegida seja alcançado por um esguicho (sistemas tipo 1, 2, 3, ou 4) ou dois esguichos (sistema tipo 5), considerando-se o comprimento da(s) mangueira(s) de incêndio por meio de seu trajeto real e o alcance mínimo do jato de água igual a 10 m, devendo ter contato visual sem barrei","status":"CONFIRMADO","nota":"Verificado por script em 26/10/2026 no PDF oficial do portal (IT 22, SHA-256 dfd708b658b9462b…). Arquivo: sp-it/5477.pdf."}],
      ["HID-07", "Pressão máxima de trabalho nos esguichos não superior a 100 mca", {"orgao":"CBPMESP","estado":"SP","documento":"IT 22/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5477).","requisito":"4.8.8","conteudo":"O sistema deve ser dimensionado de forma que a pressão máxima de trabalho nos esguichos não ultrapasse 100 mca (1.000 kPa).","status":"CONFIRMADO","nota":"Verificado por script em 26/10/2026 no PDF oficial do portal (IT 22, SHA-256 dfd708b658b9462b…). Arquivo: sp-it/5477.pdf."}],
      ["HID-08", "Válvulas que comprometem o abastecimento, quando fechadas, do tipo indicadoras", {"orgao":"CBPMESP","estado":"SP","documento":"IT 22/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5477).","requisito":"4.11.5.3","conteudo":"As válvulas que comprometem o abastecimento de água a qualquer ponto do sistema, quando estiverem em posição fechada, devem ser do tipo indicadoras. Recomendase a utilização de dispositivos de travamento para manter as válvulas na posição totalmente aberta.","status":"CONFIRMADO","nota":"Verificado por script em 26/10/2026 no PDF oficial do portal (IT 22, SHA-256 dfd708b658b9462b…). Arquivo: sp-it/5477.pdf."}],
      ["HID-09", "Reserva de incêndio em reservatório construído conforme o Anexo B", {"orgao":"CBPMESP","estado":"SP","documento":"IT 22/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5477).","requisito":"4.9.3","conteudo":"Deve ser previsto reservatório construído conforme o Anexo B.","status":"CONFIRMADO","nota":"Verificado por script em 26/10/2026 no PDF oficial do portal (IT 22, SHA-256 dfd708b658b9462b…). Arquivo: sp-it/5477.pdf."}],
      ["HID-10", "Reserva de incêndio não utilizada em conjunto com reservatórios subterrâneos ou ao nível do piso e elevados", {"orgao":"CBPMESP","estado":"SP","documento":"IT 22/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5477).","requisito":"4.9.8","conteudo":"Não é permitida a utilização da reserva de incêndio pelo emprego conjugado de reservatórios subterrâneos ou ao nível do piso térreo e elevados. Os reservatórios devem ser dotados de meios que assegurem uma reserva efetiva e ofereçam condições seguras para inspeção.","status":"CONFIRMADO","nota":"Verificado por script em 26/10/2026 no PDF oficial do portal (IT 22, SHA-256 dfd708b658b9462b…). Arquivo: sp-it/5477.pdf."}],
      ["HID-11", "Manuseio do sistema por pessoal habilitado e treinado (IT 17, bombeiro civil ou integrante do CBPMESP)", {"orgao":"CBPMESP","estado":"SP","documento":"IT 22/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5477).","requisito":"4.1.3","conteudo":"O manuseio do sistema deve ser feito por pessoal devidamente habilitado e treinado de acordo com a IT 17 - Brigada de incêndio, bombeiro civil, ou integrante do Corpo de Bombeiros da Polícia Militar do Estado de São Paulo (CBPMESP) em caso de incêndios e emergências.","status":"CONFIRMADO","nota":"Verificado por script em 26/10/2026 no PDF oficial do portal (IT 22, SHA-256 dfd708b658b9462b…). Arquivo: sp-it/5477.pdf."}],
      ["HID-12", "Estacionamentos descobertos ou sobre pavimentos ocupados protegidos por hidrantes", {"orgao":"CBPMESP","estado":"SP","documento":"IT 22/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5477).","requisito":"4.12.7.1","conteudo":"Estacionamentos de veículos, localizados em áreas descobertas e sobre pavimentos ocupados, devem possuir proteção por hidrantes.","status":"CONFIRMADO","nota":"Verificado por script em 26/10/2026 no PDF oficial do portal (IT 22, SHA-256 dfd708b658b9462b…). Arquivo: sp-it/5477.pdf."}]

      ["MAN-02", "Comprimento total das mangueiras suficiente para vencer desvios e obstáculos até cada ponto de hidrante", {"orgao":"CBPMESP","estado":"SP","documento":"IT 22/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5477).","requisito":"4.11.3.1","conteudo":"O comprimento total das mangueiras que servem cada saída a um ponto de hidrante ou mangotinho deve ser suficiente para vencer todos os desvios e obstáculos que existem, considerando também toda a influência que a ocupação final é capaz de exercer, não excedendo os comprimentos máximos estabelecidos na Tabela 2. Para sistemas de hidrantes, deve-se preferencialmente utilizar lanc","status":"CONFIRMADO","nota":"Verificado por script em 26/10/2026 no PDF oficial do portal (IT 22, SHA-256 dfd708b658b9462b…). Arquivo: sp-it/5477.pdf."}],

      ["BOM-03", "Bomba com NPSH calculado quando em sucção negativa", {"orgao":"CBPMESP","estado":"SP","documento":"IT 22/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5477).","requisito":"4.8.15","conteudo":"Nos casos de bombas de incêndio consideradas na condição de sucção negativa, item C.1.12 desta IT, deve ser calculado o Net Positive Suction Head (NPSH). Este deve ser maior ou igual ao NPSH requerido pela bomba de incêndio. Para cálculo do NPSH disponível na tubulação de sucção deve-se considerar 1,5 vezes a vazão nominal do sistema.","status":"CONFIRMADO","nota":"Verificado por script em 26/10/2026 no PDF oficial do portal (IT 22, SHA-256 dfd708b658b9462b…). Arquivo: sp-it/5477.pdf."}]

    ["DET", "Detecção e alarme", ["Central com falha","Bateria sem autonomia comprovada","Acionador obstruído","Acionador danificado","Alarme não audível em todas as áreas","Relatório de manutenção ausente","Central fora de local vigiado"], [
      ["DET-01", "Duas fontes de alimentação do sistema (rede e auxiliar: bateria, nobreak ou gerador)", {"orgao":"CBPMESP","estado":"SP","documento":"IT 19/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5474).","requisito":"4.3","conteudo":"Todo sistema deve ter duas fontes de alimentação. A principal é a rede do sistema elétrico da edificação, e a auxiliar é constituída por baterias, nobreak ou gerador. Quando a fonte de alimentação auxiliar for constituída por bateria de acumuladores ou nobreak, esta deve ter autonomia mínima de 24 horas em regime de supervisão, sendo que no regime de alarme deve ser de, no míni","status":"CONFIRMADO","nota":"Verificado por script em 26/10/2026 no PDF oficial do portal (IT 19, SHA-256 c23b8cd26ef913fd…). Arquivo: sp-it/5474.pdf."}],
      ["DET-02", "Central e painel repetidor em local com constante vigilância humana e de fácil visualização", {"orgao":"CBPMESP","estado":"SP","documento":"IT 19/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5474).","requisito":"4.5","conteudo":"A central de detecção e alarme e o painel repetidor devem ficar em local onde haja constante vigilância humana e de fácil visualização.","status":"CONFIRMADO","nota":"Verificado por script em 26/10/2026 no PDF oficial do portal (IT 19, SHA-256 c23b8cd26ef913fd…). Arquivo: sp-it/5474.pdf."}],
      ["DET-03", "Central com dispositivo de teste dos indicadores luminosos e dos sinalizadores acústicos", {"orgao":"CBPMESP","estado":"SP","documento":"IT 19/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5474).","requisito":"4.4","conteudo":"As centrais de detecção e alarme devem ter dispositivo de teste dos indicadores luminosos e dos sinalizadores acústicos.","status":"CONFIRMADO","nota":"Verificado por script em 26/10/2026 no PDF oficial do portal (IT 19, SHA-256 c23b8cd26ef913fd…). Arquivo: sp-it/5474.pdf."}],
      ["DET-04", "Alarme geral acionado pela central e audível em toda a edificação", {"orgao":"CBPMESP","estado":"SP","documento":"IT 19/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5474).","requisito":"4.6","conteudo":"A central deve acionar o alarme geral da edificação, devendo ser audível em toda edificação.","status":"CONFIRMADO","nota":"Verificado por script em 26/10/2026 no PDF oficial do portal (IT 19, SHA-256 c23b8cd26ef913fd…). Arquivo: sp-it/5474.pdf."}],
      ["DET-05", "Distância máxima de 30 m, de qualquer ponto da área protegida, até o acionador manual mais próximo", {"orgao":"CBPMESP","estado":"SP","documento":"IT 19/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5474).","requisito":"4.7","conteudo":"A distância máxima a ser percorrida por uma pessoa, em qualquer ponto da área protegida até o acionador manual mais próximo, não deve ser superior a 30 metros.","status":"CONFIRMADO","nota":"Verificado por script em 26/10/2026 no PDF oficial do portal (IT 19, SHA-256 c23b8cd26ef913fd…). Arquivo: sp-it/5474.pdf."}],
      ["DET-06", "Acionadores manuais a 0,90 m a 1,35 m do piso acabado", {"orgao":"CBPMESP","estado":"SP","documento":"IT 19/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5474).","requisito":"4.8","conteudo":"Os acionadores manuais devem ser instalados a uma altura de 0,90 m a 1,35 m do piso acabado até a base inferior do componente, podendo ser embutido ou sobreposto à parede, preferencialmente localizados junto aos hidrantes.","status":"CONFIRMADO","nota":"Verificado por script em 26/10/2026 no PDF oficial do portal (IT 19, SHA-256 c23b8cd26ef913fd…). Arquivo: sp-it/5474.pdf."}],
      ["DET-07", "Pelo menos um acionador manual em cada pavimento de edifício com mais de um pavimento", {"orgao":"CBPMESP","estado":"SP","documento":"IT 19/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5474).","requisito":"4.9","conteudo":"Nos edifícios com mais de um pavimento, deve ser previsto pelo menos um acionador manual em cada pavimento. Os mezaninos estarão dispensados desta exigência, caso o acionador manual do piso principal dê cobertura para a área do mezanino, conforme item 4.7.","status":"CONFIRMADO","nota":"Verificado por script em 26/10/2026 no PDF oficial do portal (IT 19, SHA-256 c23b8cd26ef913fd…). Arquivo: sp-it/5474.pdf."}],
      ["DET-08", "Acionadores com indicação de funcionamento (verde) e de alarme (vermelho)", {"orgao":"CBPMESP","estado":"SP","documento":"IT 19/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5474).","requisito":"4.17","conteudo":"Os acionadores manuais instalados na edificação devem obrigatoriamente conter a indicação de funcionamento (cor verde) e alarme (cor vermelha) indicando o funcionamento e supervisão do sistema, quando a central do sistema for do tipo convencional. Quando a central for do tipo inteligente pode ser dispensada a presença dos leds nos acionadores, desde que haja na central uma supe","status":"CONFIRMADO","nota":"Verificado por script em 26/10/2026 no PDF oficial do portal (IT 19, SHA-256 c23b8cd26ef913fd…). Arquivo: sp-it/5474.pdf."}],
      ["DET-09", "Manutenção preventiva e corretiva por técnicos habilitados e treinados", {"orgao":"CBPMESP","estado":"SP","documento":"IT 19/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5474).","requisito":"5.1","conteudo":"A manutenção preventiva e corretiva dos sistemas de detecção e alarme de incêndio deve ser realizada por técnicos habilitados e treinados.","status":"CONFIRMADO","nota":"Verificado por script em 26/10/2026 no PDF oficial do portal (IT 19, SHA-256 c23b8cd26ef913fd…). Arquivo: sp-it/5474.pdf."}],
      ["DET-10", "Relatório de manutenção periódica (NBR 17240) disponível na edificação para a vistoria", {"orgao":"CBPMESP","estado":"SP","documento":"IT 19/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5474).","requisito":"5.2","conteudo":"O relatório de manutenção periódica, estabelecido pela NBR 17240, deve permanecer disponível na edificação para verificação no ato da vistoria. 6 REFERÊNCIAS NORMATIVAS E BIBLIOGRÁFICAS ASSOCIAÇÃO BRASILEIRA DE NORMAS TÉCNICAS (ABNT). NBR ISO 7240-1 - Sistemas de detecção e alarme de incêndio Parte 1: Generalidades e definições. Rio de Janeiro: ABNT; _______.NBR ISO 7240-2 - Si","status":"CONFIRMADO","nota":"Verificado por script em 26/10/2026 no PDF oficial do portal (IT 19, SHA-256 c23b8cd26ef913fd…). Arquivo: sp-it/5474.pdf."}]

    ["ILU", "Iluminação de emergência", ["Luminária inoperante","Luminária ausente","Nível de iluminamento abaixo do mínimo","Luminária danificada","Espaçamento excessivo","Bateria sem autonomia"], [
      ["ILU-01", "Distância entre pontos de iluminação de emergência até 15 m, e até a parede 7,5 m", {"orgao":"CBPMESP","estado":"SP","documento":"IT 18/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5473).","requisito":"4.4.1.1","conteudo":"A distância máxima entre os pontos de iluminação de emergência de aclaramento não deve ultrapassar 15 m e entre o ponto de iluminação e a parede 7,5 m. Outro distanciamento entre pontos pode ser adotado, desde que atenda aos parâmetros da NBR 10898.","status":"CONFIRMADO","nota":"Verificado por script em 26/10/2026 no PDF oficial do portal (IT 18, SHA-256 27d381ffe6e4cf00…). Arquivo: sp-it/5473.pdf."}],
      ["ILU-02", "Iluminamento mínimo de 3 lux em locais planos e 5 lux em locais com desnível", {"orgao":"CBPMESP","estado":"SP","documento":"IT 18/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5473).","requisito":"5.2","conteudo":"Deve-se garantir um nível mínimo de iluminamento de 3 lux em locais planos (corredores, halls, áreas de refúgio) e 5 lux em locais com desnível (escadas ou passagens com obstáculos)","status":"CONFIRMADO","nota":"Verificado por script em 26/10/2026 no PDF oficial do portal (IT 18, SHA-256 27d381ffe6e4cf00…). Arquivo: sp-it/5473.pdf."}],
      ["ILU-03", "Sistema centralizado por bateria ou bloco autônomo quando o GMG não comuta no tempo da NBR 10898", {"orgao":"CBPMESP","estado":"SP","documento":"IT 18/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5473).","requisito":"4.1.6","conteudo":"Nas edificações atendidas por grupo motogerador, quando o tempo de comutação do sistema for superior ao estabelecido pela NBR 10898, deve ser previsto sistema centralizado por bateria ou bloco autônomo.","status":"CONFIRMADO","nota":"Verificado por script em 26/10/2026 no PDF oficial do portal (IT 18, SHA-256 27d381ffe6e4cf00…). Arquivo: sp-it/5473.pdf."}],
      ["ILU-04", "Luminárias acima das portas de saída em ambientes com lotação superior a 100 pessoas (ocupações F-3, F-5, F-6, F-7, F-10 e F-11)", {"orgao":"CBPMESP","estado":"SP","documento":"IT 18/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5473).","requisito":"4.4.2.2","conteudo":"As luminárias de emergência localizadas acima das portas de saída (intermediárias e finais) em ambientes fechados com lotação superior a 100 pessoas para as ocupações F-3, F-5, F-6, F-7 e F-10, F-11 devem ser do tipo balizamento, mantendo-se permanentemente acesas durante a utilização do ambiente (funcionamento: normal e emergência).","status":"CONFIRMADO","nota":"Verificado por script em 26/10/2026 no PDF oficial do portal (IT 18, SHA-256 27d381ffe6e4cf00…). Arquivo: sp-it/5473.pdf."}],
      ["ILU-05", "Componentes da fonte centralizada em local não acessível ao público, sem risco de incêndio", {"orgao":"CBPMESP","estado":"SP","documento":"IT 18/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5473).","requisito":"4.2.1","conteudo":"Os componentes da fonte de energia centralizada de alimentação do sistema de iluminação de emergência, bem como seus comandos devem ser instalados em local não acessível ao público, sem risco de incêndio, ventilado e que não ofereça risco de acidentes aos usuários.","status":"CONFIRMADO","nota":"Verificado por script em 26/10/2026 no PDF oficial do portal (IT 18, SHA-256 27d381ffe6e4cf00…). Arquivo: sp-it/5473.pdf."}],
      ["ILU-06", "Painel de controle com baterias reguladas por válvulas em local ventilado e protegido do acúmulo de gases", {"orgao":"CBPMESP","estado":"SP","documento":"IT 18/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5473).","requisito":"4.2.2","conteudo":"Se houver baterias reguladas por válvulas, o painel de controle pode ser instalado no mesmo local das baterias. O local da instalação deverá ser em lugar ventilado e protegido do acúmulo de gases.","status":"CONFIRMADO","nota":"Verificado por script em 26/10/2026 no PDF oficial do portal (IT 18, SHA-256 27d381ffe6e4cf00…). Arquivo: sp-it/5473.pdf."}],
      ["ILU-07", "Baterias para sistemas autônomos seladas (chumbo-ácido) ou níquel-cádmio, isentas de manutenção", {"orgao":"CBPMESP","estado":"SP","documento":"IT 18/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5473).","requisito":"4.3.1","conteudo":"As baterias para sistemas autônomos devem ser de chumbo-ácido selada ou níquel-cádmio, isenta de manutenção.","status":"CONFIRMADO","nota":"Verificado por script em 26/10/2026 no PDF oficial do portal (IT 18, SHA-256 27d381ffe6e4cf00…). Arquivo: sp-it/5473.pdf."}]

    ["SIN", "Sinalização de emergência", ["Placa ausente","Placa danificada ou ilegível","Altura inadequada","Sinalização de piso ausente","Material não fotoluminescente","Tubulação sem pintura de identificação"], [

      ["SIN-02", "Sinalização de proibição e de alerta a altura mínima de 1,8 m do piso acabado", {"orgao":"CBPMESP","estado":"SP","documento":"IT 20/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5475).","requisito":"5.1.1","conteudo":"Sinalização de proibição A sinalização de proibição apropriada deve ser instalada em local visível e a uma altura mínima de 1,8 m medida do piso acabado à base da sinalização, distribuída em mais de um ponto dentro da área de risco, de modo que pelo menos uma delas possa ser claramente visível de qualquer posição dentro da área, distanciadas em no máximo 15 m entre si.","status":"CONFIRMADO","nota":"Verificado por script em 26/10/2026 no PDF oficial do portal (IT 20, SHA-256 273a80212047cf83…). Arquivo: sp-it/5475.pdf."}],

    ["ROT", "Rotas e saídas de emergência", ["Rota obstruída","Porta trancada durante a jornada","Corrimão ausente","Degraus fora da medida","Sentido de abertura contrário à fuga","Porta com fechadura de material plástico"], [

      ["ROT-02", "Portas das salas com capacidade acima de 100 pessoas abrem no sentido do trânsito de saída", {"orgao":"CBPMESP","estado":"SP","documento":"IT 11/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5457).","requisito":"4.5.4.1","conteudo":"As portas das salas com capacidade acima de 100 pessoas e as portas de suas rotas de saída, acessos e descargas, devem abrir no sentido do trânsito de saída (ver Figura 2).","status":"CONFIRMADO","nota":"Verificado por script em 26/10/2026 no PDF oficial do portal (IT 11, SHA-256 96d2968f38a1158a…). Arquivo: sp-it/5457.pdf."}],
      ["ROT-03", "Portas que dividem corredores de rotas de fuga abrem no sentido do fluxo de saída", {"orgao":"CBPMESP","estado":"SP","documento":"IT 11/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5457).","requisito":"4.5.4.2","conteudo":"As portas que dividem corredores que compõem rotas de fuga, devem abrir no sentido do fluxo de saída.","status":"CONFIRMADO","nota":"Verificado por script em 26/10/2026 no PDF oficial do portal (IT 11, SHA-256 96d2968f38a1158a…). Arquivo: sp-it/5457.pdf."}],
      ["ROT-04", "Portas das antecâmaras e escadas com dispositivos que as mantêm fechadas, mas destrancadas", {"orgao":"CBPMESP","estado":"SP","documento":"IT 11/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5457).","requisito":"4.5.4.5","conteudo":"As portas das antecâmaras, escadas e similares devem ser providas de dispositivos mecânicos e automáticos, de modo a permanecerem fechadas, mas destrancadas no sentido do fluxo de saída, sendo admissível que se mantenham abertas desde que disponham de dispositivo de fechamento, quando necessário, conforme estabelecido na NBR 11742.","status":"CONFIRMADO","nota":"Verificado por script em 26/10/2026 no PDF oficial do portal (IT 11, SHA-256 96d2968f38a1158a…). Arquivo: sp-it/5457.pdf."}],
      ["ROT-05", "Proibido o uso de peças plásticas em fechaduras, espelhos, maçanetas e dobradiças nas portas das rotas de saída", {"orgao":"CBPMESP","estado":"SP","documento":"IT 11/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5457).","requisito":"4.5.4.7","conteudo":"É vedada a utilização de peças plásticas em fechaduras, espelhos, maçanetas, dobradiças e outros, nas portas dos seguintes locais: rotas de saídas; entrada em unidades autônomas; salas com capacidade acima de 100 pessoas.","status":"CONFIRMADO","nota":"Verificado por script em 26/10/2026 no PDF oficial do portal (IT 11, SHA-256 96d2968f38a1158a…). Arquivo: sp-it/5457.pdf."}],

      ["ROT-07", "Distância mínima de 10 m entre as portas de acesso de duas escadas de emergência (exceto casos previstos na norma)", {"orgao":"CBPMESP","estado":"SP","documento":"IT 11/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5457).","requisito":"4.5.3.4","conteudo":"No caso de duas ou mais escadas de emergência, a distância de trajeto entre as suas portas de acesso deve ser, no mínimo, de 10 m, exceto quando o corredor de acesso possuir comprimento inferior a este valor.","status":"CONFIRMADO","nota":"Verificado por script em 26/10/2026 no PDF oficial do portal (IT 11, SHA-256 96d2968f38a1158a…). Arquivo: sp-it/5457.pdf."}],
      ["ROT-08", "Saída alternativa com largura mínima de 1,20 m quando houver catraca na rota de fuga", {"orgao":"CBPMESP","estado":"SP","documento":"IT 11/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5457).","requisito":"4.5.1.5","conteudo":"Quando for utilizada catraca na rota de fuga deve ser prevista saída alternativa com largura mínima de 1,20 m.","status":"CONFIRMADO","nota":"Verificado por script em 26/10/2026 no PDF oficial do portal (IT 11, SHA-256 96d2968f38a1158a…). Arquivo: sp-it/5457.pdf."}],

      ["ROT-11", "Não é permitido porta em rampa; a porta fica em patamar plano", {"orgao":"CBPMESP","estado":"SP","documento":"IT 11/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5457).","requisito":"4.6.2.5","conteudo":"Não é permitida a colocação de portas em rampas; estas devem estar situadas sempre em patamares planos, com largura não inferior à da folha da porta de cada lado do vão.","status":"CONFIRMADO","nota":"Verificado por script em 26/10/2026 no PDF oficial do portal (IT 11, SHA-256 96d2968f38a1158a…). Arquivo: sp-it/5457.pdf."}],

      ["GLP-06", "Placa na entrada do imóvel indicando a classe da área de armazenamento", {"orgao":"CBPMESP","estado":"SP","documento":"IT 28/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5488).","requisito":"4.2.8.19","conteudo":"Na entrada do imóvel onde está localizada a área de armazenamento de recipientes transportáveis, deve ser exibida placa que indica a classe existente e a capacidade de armazenamento de GLP, em quilogramas.","status":"CONFIRMADO","nota":"Verificado por script em 26/10/2026 no PDF oficial do portal (IT 28, SHA-256 be8c3bb64243e26b…). Arquivo: sp-it/5488.pdf."}],

      ["GLP-08", "Área de armazenamento delimitada por pintura no piso ou cerca metálica/vazada", {"orgao":"CBPMESP","estado":"SP","documento":"IT 28/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5488).","requisito":"4.2.8.5","conteudo":"A delimitação da área de armazenamento deve ser por meio de pintura no piso ou cerca de tela metálica, gradil metálico ou elemento vazado de concreto, cerâmica ou outro material resistente ao fogo, para assegurar ampla ventilação. Áreas de armazenamento superiores à classe III, devem ter demarcados, com pintura no piso, os locais para os lotes de recipientes.","status":"CONFIRMADO","nota":"Verificado por script em 26/10/2026 no PDF oficial do portal (IT 28, SHA-256 be8c3bb64243e26b…). Arquivo: sp-it/5488.pdf."}],

      ["GLP-10", "Armazenamento coberto com pé-direito mínimo de 2,6 m", {"orgao":"CBPMESP","estado":"SP","documento":"IT 28/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5488).","requisito":"4.2.8.4","conteudo":"A área de armazenamento coberta deve ter no mínimo 2,6 m de pé-direito, possuir espaço livre permanente entre o topo da pilha de recipientes e a cobertura de, no mínimo, 1,2 m.","status":"CONFIRMADO","nota":"Verificado por script em 26/10/2026 no PDF oficial do portal (IT 28, SHA-256 be8c3bb64243e26b…). Arquivo: sp-it/5488.pdf."}]

      ["ELE-02", "Todo circuito com condutor de proteção (fio-terra) em toda a sua extensão", {"orgao":"CBPMESP","estado":"SP","documento":"IT 41/2025","edicao":"Edição 2025, portal CBPMESP, início 17/03/2026 (postCod 5867).","requisito":"5.1.4","conteudo":"Todo circuito deve dispor de condutor de proteção \"fioterra\" em toda sua extensão. Um condutor de proteção pode ser comum a mais de um circuito. E todas as massas da instalação devem estar ligadas a condutores de proteção.","status":"CONFIRMADO","nota":"Verificado por script em 26/10/2026 no PDF oficial do portal (IT 41, SHA-256 110c1cb7e99e0700…). Arquivo: sp-it/5867.pdf."}],
      ["ELE-03", "Dispositivo diferencial residual (DR) que seccione automaticamente a alimentação do circuito", {"orgao":"CBPMESP","estado":"SP","documento":"IT 41/2025","edicao":"Edição 2025, portal CBPMESP, início 17/03/2026 (postCod 5867).","requisito":"5.1.6","conteudo":"Deve existir um ou mais dispositivo(s) diferencial(is) residual(is) (DR) que deve(m) seccionar automaticamente a alimentação do(s) circuito(s) ou equipamento(s) por ele(s) protegido(s) sempre que ocorrer uma falta entre parte viva e massa ou entre parte viva e condutor de proteção, no circuito ou equipamento.","status":"CONFIRMADO","nota":"Verificado por script em 26/10/2026 no PDF oficial do portal (IT 41, SHA-256 110c1cb7e99e0700…). Arquivo: sp-it/5867.pdf."}],

      ["BRI-05", "Profissional que forma ou atualiza a brigada credenciado no CBPMESP", {"orgao":"CBPMESP","estado":"SP","documento":"IT 17/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5472).","requisito":"4.4.7.1","conteudo":"O profissional habilitado deverá obrigatoriamente ser credenciado no Corpo de Bombeiros do Estado de São Paulo, conforme Portaria do Comandante do CBPMESP.","status":"CONFIRMADO","nota":"Verificado por script em 26/10/2026 no PDF oficial do portal (IT 17, SHA-256 3105202c2b03e28b…). Arquivo: sp-it/5472.pdf."}],

      ["BRI-09", "Brigadista com identificação constante, como uniforme, brassard ou colete", {"orgao":"CBPMESP","estado":"SP","documento":"IT 17/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5472).","requisito":"4.8.1.2","conteudo":"O brigadista deve utilizar constantemente em lugar visível uma identificação que o reconheçam como membro da brigada.","status":"CONFIRMADO","nota":"Verificado por script em 26/10/2026 no PDF oficial do portal (IT 17, SHA-256 3105202c2b03e28b…). Arquivo: sp-it/5472.pdf."}],

    ["ESP", "Centros esportivos e de exibição (IT 12)", ["Saída insuficiente","Barra antipânico ausente","Porta de correr na saída","Área de viatura sem reserva","Chave mestra indisponível"], [
      ["ESP-01", "Arquibancada com inclinação de 32 graus ou mais com guarda-corpos à frente de cada fileira", {"orgao":"CBPMESP","estado":"SP","documento":"IT 12/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5458).","requisito":"2.1.3.3","conteudo":"Nos setores cuja inclinação superar ou igualar-se a 32 graus, é obrigatória a instalação de guarda-corpos na frente de cada fila de assentos (ver Figura 3). A altura dessas barreiras deve ser, no mínimo, de 0,70 m do piso e sua resistência mecânica mínima de 1,5 kN/m.","status":"CONFIRMADO","nota":"Verificado por script em 27/10/2026 no PDF oficial do portal (IT 12, SHA-256 bee5a5847cc12d7d…). Arquivo: sp-it/5458.pdf."}],
      ["ESP-02", "Setores de público em pé dotados de barreiras antiesmagamento", {"orgao":"CBPMESP","estado":"SP","documento":"IT 12/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5458).","requisito":"2.1.1.8","conteudo":"Os setores das arquibancadas para público em pé devem ser dotados de barreiras antiesmagamento - ver Capítulo \"Guarda-corpos (barreiras) e corrimãos\".","status":"CONFIRMADO","nota":"Verificado por script em 27/10/2026 no PDF oficial do portal (IT 12, SHA-256 bee5a5847cc12d7d…). Arquivo: sp-it/5458.pdf."}],
      ["ESP-03", "Saídas com no mínimo 1,20 m de largura (1,10 m em edificação existente)", {"orgao":"CBPMESP","estado":"SP","documento":"IT 12/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5458).","requisito":"2.2.1.7","conteudo":"As saídas devem possuir, no mínimo, 1,20 m de largura. Para edificações existentes se aceita 1,10 m.","status":"CONFIRMADO","nota":"Verificado por script em 27/10/2026 no PDF oficial do portal (IT 12, SHA-256 bee5a5847cc12d7d…). Arquivo: sp-it/5458.pdf."}],
      ["ESP-04", "Portas e portões de saída com sistema de destravamento rápido (barra antipânico)", {"orgao":"CBPMESP","estado":"SP","documento":"IT 12/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5458).","requisito":"2.2.1.19","conteudo":"As portas e os portões de saída devem ser providos de sistema de destravamento rápido (Exemplo: barra antipânico), não sendo permitido qualquer tipo de travamento no sentido de saída do recinto.","status":"CONFIRMADO","nota":"Verificado por script em 27/10/2026 no PDF oficial do portal (IT 12, SHA-256 bee5a5847cc12d7d…). Arquivo: sp-it/5458.pdf."}],
      ["ESP-05", "Sem portas ou portões de correr ou de enrolar nas saídas", {"orgao":"CBPMESP","estado":"SP","documento":"IT 12/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5458).","requisito":"2.2.1.28","conteudo":"Portas e portões de correr ou de enrolar não devem ser usados nas saídas (proibido), pois são incapazes de serem abertos quando há pressão exercida na direção do fluxo da multidão; e, também, por possuírem mecanismos ou trilhos que são suscetíveis a travamentos (emperramentos).","status":"CONFIRMADO","nota":"Verificado por script em 27/10/2026 no PDF oficial do portal (IT 12, SHA-256 bee5a5847cc12d7d…). Arquivo: sp-it/5458.pdf."}],
      ["ESP-06", "Circulações iluminadas e sinalizadas com indicação do sentido da saída", {"orgao":"CBPMESP","estado":"SP","documento":"IT 12/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5458).","requisito":"2.2.1.29","conteudo":"As circulações devem ser iluminadas e sinalizadas com indicação clara do sentido da saída, de acordo com o estabelecido e adotado na IT 18 e IT 20.","status":"CONFIRMADO","nota":"Verificado por script em 27/10/2026 no PDF oficial do portal (IT 12, SHA-256 bee5a5847cc12d7d…). Arquivo: sp-it/5458.pdf."}],
      ["ESP-07", "Acesso adequado aos serviços de emergência, incluindo o local da prática esportiva", {"orgao":"CBPMESP","estado":"SP","documento":"IT 12/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5458).","requisito":"2.2.9.3","conteudo":"Acesso de viaturas Deve-se prever no recinto acesso e saída adequados aos serviços de emergência (incluindo o local da prática desportiva: arena, campo, quadra, pista etc.), obedecendo aos critérios da IT 06. As vias de acesso e saída dos serviços de emergência devem ser separadas dos acessos e saídas usadas pelo público. Devem ser garantidos dois acessos de veículos de emergên","status":"CONFIRMADO","nota":"Verificado por script em 27/10/2026 no PDF oficial do portal (IT 12, SHA-256 bee5a5847cc12d7d…). Arquivo: sp-it/5458.pdf."}],

    ["CHV", "Chuveiros automáticos e depósitos (IT 23 e IT 24)", ["Alarme de fluxo não ligado","Conexão de teste de alarme ausente","Válvula ou manômetro inacessível","Bomba sem pressão positiva","Registro de recalque sem identificação","Paletes sem proteção por chuveiros"], [
      ["CHV-01", "Sistema de chuveiros automáticos elaborado conforme as normas técnicas", {"orgao":"CBPMESP","estado":"SP","documento":"IT 23/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5478).","requisito":"4.1","conteudo":"Os sistemas de proteção por chuveiros automáticos devem ser elaborados de acordo com critérios estabelecidos em normas técnicas brasileiras, sendo aceita a norma NFPA 13 da National Fire Protection Association, se o assunto não for por elas contemplado. A área de operação, tabelas e demais parâmetros técnicos devem seguir os critérios contidos nesta IT.","status":"CONFIRMADO","nota":"Verificado por script em 27/10/2026 no PDF oficial do portal (IT 23, SHA-256 fec15d419ee13c05…). Arquivo: sp-it/5478.pdf."}],

      ["CHV-03", "Conexão de teste de alarme em cada sistema (térreas) e em cada pavimento (múltiplos pavimentos)", {"orgao":"CBPMESP","estado":"SP","documento":"IT 23/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5478).","requisito":"5.9","conteudo":"Em edificações de múltiplos pavimentos, a conexão de teste de alarme de cada pavimento deve fazer parte do controle setorial, conforme a Figura 1. Figura 1 - Chave de comando secundário Legenda 1) válvula de bloqueio 2) manômetro: O mostrador do manômetro deve ter capacidade para indicar pressões de até no mínimo duas vezes a pressão nominal de operação da bomba, mas não menos ","status":"CONFIRMADO","nota":"Verificado por script em 27/10/2026 no PDF oficial do portal (IT 23, SHA-256 fec15d419ee13c05…). Arquivo: sp-it/5478.pdf."}],
      ["CHV-04", "Alarme de incêndio ativado pelo fluxo de água de um chuveiro de menor orifício", {"orgao":"CBPMESP","estado":"SP","documento":"IT 23/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5478).","requisito":"5.1","conteudo":"O alarme de incêndio deve ser ativado pelo fluxo de água equivalente ao fluxo em um chuveiro automático de menor orifício instalado no sistema. O alarme sonoro deve ser acionado no máximo 2 min após o início do fluxo e ser identificado na central de alarme.","status":"CONFIRMADO","nota":"Verificado por script em 27/10/2026 no PDF oficial do portal (IT 23, SHA-256 fec15d419ee13c05…). Arquivo: sp-it/5478.pdf."}],
      ["CHV-05", "Válvulas e manômetros do sistema acessíveis para operação, inspeção e manutenção", {"orgao":"CBPMESP","estado":"SP","documento":"IT 23/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5478).","requisito":"7.2","conteudo":"As válvulas e manômetros do sistema devem estar acessíveis para operação, inspeção e manutenção. Esses acessórios não precisam necessariamente estar em local aberto, podendo ser instalados em abrigos com portas, painéis removíveis ou tampas. Os acessórios não podem estar obstruídos permanentemente por paredes, dutos, colunas ou similares.","status":"CONFIRMADO","nota":"Verificado por script em 27/10/2026 no PDF oficial do portal (IT 23, SHA-256 fec15d419ee13c05…). Arquivo: sp-it/5478.pdf."}],

      ["CHV-07", "Reserva de incêndio calculada pelo risco mais grave em edificação de ocupação mista", {"orgao":"CBPMESP","estado":"SP","documento":"IT 23/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5478).","requisito":"4.5","conteudo":"Nos casos de edificações com ocupação mista, a reserva de incêndio deve ser calculada em função da vazão do risco mais grave e do tempo de funcionamento do risco predominante. 5 SISTEMA DE ALARME E CONEXÕES DE TESTE","status":"CONFIRMADO","nota":"Verificado por script em 27/10/2026 no PDF oficial do portal (IT 23, SHA-256 fec15d419ee13c05…). Arquivo: sp-it/5478.pdf."}],

      ["LIQ-04", "Identificação e sinalização dos tanques conforme norma brasileira aplicável", {"orgao":"CBPMESP","estado":"SP","documento":"IT 25 parte 2/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5482).","requisito":"17.5.1","conteudo":"Identificação e segurança patrimonial Uma sinalização ou marcação que atenda à Norma Brasileira aplicável ou outra internacionalmente aceita deve ser aplicada aos tanques de armazenamento que contenham líquidos igníferos (inflamáveis e combustíveis). A sinalização não precisa ser aplicada diretamente ao tanque, mas deve situar-se em local onde possa ser prontamente visualizada,","status":"CONFIRMADO","nota":"Verificado por script em 27/10/2026 no PDF oficial do portal (IT 25 P2, SHA-256 cff88b08ea824c3d…). Arquivo: sp-it/5482.pdf."}],

    ["GAS", "Sistema fixo de gases para combate a incêndio (IT 26)", ["Válvula de bloqueio do CO2 ausente","Placa de advertência ausente","Sinalização de evacuação não observada","Projeto sem as informações exigidas"], [
      ["GAS-01", "Área ocupada com CO2: válvula de bloqueio mecânica no acesso principal", {"orgao":"CBPMESP","estado":"SP","documento":"IT 26/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5486).","requisito":"4.10","conteudo":"Em área normalmente ocupada, protegida por sistema fixo de CO2, deve ser instalada no acesso principal, uma válvula de bloqueio mecânica na tubulação de CO2, para evitar descargas acidentais na presença de pessoas. Quando a válvula de bloqueio de CO2 estiver fechada, a operação de bloqueio deve ser sinalizada no painel de controle do sistema.","status":"CONFIRMADO","nota":"Verificado por script em 27/10/2026 no PDF oficial do portal (IT 26, SHA-256 77aa694eb8acd2cb…). Arquivo: sp-it/5486.pdf."}],
      ["GAS-02", "Área ocupada com CO2: placa de advertência no acesso principal", {"orgao":"CBPMESP","estado":"SP","documento":"IT 26/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5486).","requisito":"4.11","conteudo":"Em área normalmente ocupada, protegida por sistema fixo de CO2, deve ser instalada no acesso principal, uma placa com os dizeres: \"Área protegida com CO2 - gás asfixiante\".","status":"CONFIRMADO","nota":"Verificado por script em 27/10/2026 no PDF oficial do portal (IT 26, SHA-256 77aa694eb8acd2cb…). Arquivo: sp-it/5486.pdf."}],
