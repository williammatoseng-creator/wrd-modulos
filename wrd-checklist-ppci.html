    ["GNA", "Gás natural e GNV (IT 29)", ["Extintor sobre rodas ausente em posto de GNV","Ilha de abastecimento ausente","Placas de advertência ausentes","Manutenção da rede não comprovada"], [
      ["GNA-01", "Projeto, instalação e manutenção de todo o sistema de gás natural", {"orgao":"CBPMESP","estado":"SP","documento":"IT 29/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5489).","requisito":"4.1.2","conteudo":"O projeto, instalação e manutenção de todo o sistema (rede, medidores, demais componentes e equipamentos) deve ser elaborado por empresa e/ou profissional habilitado e registrado no órgão de classe, com emissão do comprovante de responsabilidade técnica nos termos da IT 01.","status":"CONFIRMADO","nota":"Verificado por script em 27/10/2026 no PDF oficial do portal (IT 29, SHA-256 94dfa488b1fc691d…). Arquivo: sp-it/5489.pdf."}],
      ["GNA-02", "Posto de GNV protegido por unidade extintora sobre rodas de pó BC 80-B:C", {"orgao":"CBPMESP","estado":"SP","documento":"IT 29/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5489).","requisito":"4.2.1","conteudo":"Devem ser protegidos por uma unidade extintora sobrerrodas de pó BC, capacidade 80-B:C, além do sistema de proteção contra incêndio exigido para os demais riscos.","status":"CONFIRMADO","nota":"Verificado por script em 27/10/2026 no PDF oficial do portal (IT 29, SHA-256 94dfa488b1fc691d…). Arquivo: sp-it/5489.pdf."}],
      ["GNA-03", "Ilha de proteção mecânica em cada ponto de abastecimento", {"orgao":"CBPMESP","estado":"SP","documento":"IT 29/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5489).","requisito":"4.2.2","conteudo":"Em cada ponto de abastecimento deve ser construída uma ilha (meio fio com a função de proteção mecânica), com altura mínima de 0,20 m (em relação ao piso), conforme NBR 12236.","status":"CONFIRMADO","nota":"Verificado por script em 27/10/2026 no PDF oficial do portal (IT 29, SHA-256 94dfa488b1fc691d…). Arquivo: sp-it/5489.pdf."}],
      ["GNA-04", "Placas de advertência quanto às regras de segurança no local de abastecimento", {"orgao":"CBPMESP","estado":"SP","documento":"IT 29/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5489).","requisito":"4.2.3","conteudo":"O local de abastecimento deve possuir placas de advertência quanto às regras de segurança a serem adotadas pelos usuários, prevendo distâncias seguras de permanência, além de esclarecimentos tais como: \"Proibido fumar\", \"Desligar o rádio e outros equipamentos elétricos\", \"Não utilizar aparelhos celulares\".","status":"CONFIRMADO","nota":"Verificado por script em 27/10/2026 no PDF oficial do portal (IT 29, SHA-256 94dfa488b1fc691d…). Arquivo: sp-it/5489.pdf."}],
      ["GNA-05", "Estação de armazenagem com extintores conforme os parâmetros de GLP da IT 28", {"orgao":"CBPMESP","estado":"SP","documento":"IT 29/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5489).","requisito":"4.3.2","conteudo":"Para a proteção por extintores devem ser adotados os mesmos parâmetros para GLP descritos na IT 28.","status":"CONFIRMADO","nota":"Verificado por script em 27/10/2026 no PDF oficial do portal (IT 29, SHA-256 94dfa488b1fc691d…). Arquivo: sp-it/5489.pdf."}]

    ["FOG", "Fogos de artifício (IT 30)", ["Piso não adequado na loja","Estoque sem alvenaria com TRRF","Produto a menos de 15 cm do piso","Janela sem tela metálica","Placa de advertência ausente"], [
      ["FOG-01", "Piso de toda a loja de material não abrasivo, antiestático e incombustível", {"orgao":"CBPMESP","estado":"SP","documento":"IT 30/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5490).","requisito":"4.2.5.5","conteudo":"O piso de toda a loja deve ser de material não-abrasivo, anti-estático, incombustível e, que não permita acúmulo de água.","status":"CONFIRMADO","nota":"Verificado por script em 27/10/2026 no PDF oficial do portal (IT 30, SHA-256 cf3b6cf30eb99dab…). Arquivo: sp-it/5490.pdf."}],
      ["FOG-02", "Estoque de fogos em alvenaria com TRRF", {"orgao":"CBPMESP","estado":"SP","documento":"IT 30/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5490).","requisito":"4.2.5.7","conteudo":"Os compartimentos destinados ao estoque de fogos de artifício devem ser construídos em alvenaria com TRRF de 120 minutos com acesso por meio de porta corta-fogo (PCF P-60).","status":"CONFIRMADO","nota":"Verificado por script em 27/10/2026 no PDF oficial do portal (IT 30, SHA-256 cf3b6cf30eb99dab…). Arquivo: sp-it/5490.pdf."}],
      ["FOG-03", "Instalações elétricas dimensionadas conforme a classificação de área", {"orgao":"CBPMESP","estado":"SP","documento":"IT 30/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5490).","requisito":"4.2.5.8","conteudo":"As instalações elétricas devem ser dimensionadas conforme norma de classificação específica de área, de acordo com a NBR IEC 60079, com apresentação do comprovante de responsabilidade técnica.","status":"CONFIRMADO","nota":"Verificado por script em 27/10/2026 no PDF oficial do portal (IT 30, SHA-256 cf3b6cf30eb99dab…). Arquivo: sp-it/5490.pdf."}],
      ["FOG-04", "Armazenamento e exposição em móveis ou prateleiras de aço", {"orgao":"CBPMESP","estado":"SP","documento":"IT 30/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5490).","requisito":"4.2.5.11","conteudo":"O armazenamento e exposição de produtos deverão ser em móveis ou prateleiras de aço ou qualquer outro material não combustível, exceto vidros e outros materiais que provoquem estilhaços.","status":"CONFIRMADO","nota":"Verificado por script em 27/10/2026 no PDF oficial do portal (IT 30, SHA-256 cf3b6cf30eb99dab…). Arquivo: sp-it/5490.pdf."}],
      ["FOG-05", "Produtos armazenados com afastamento mínimo de 15 cm do piso", {"orgao":"CBPMESP","estado":"SP","documento":"IT 30/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5490).","requisito":"4.2.5.16","conteudo":"Os produtos armazenados (fogos) devem possuir afastamento mínimo de 15 centímetros do piso, 15 centímetros das paredes e 50 centímetros do teto, dispostos em prateleiras incombustíveis (pilhas) de, no máximo, 2 metros de altura.","status":"CONFIRMADO","nota":"Verificado por script em 27/10/2026 no PDF oficial do portal (IT 30, SHA-256 cf3b6cf30eb99dab…). Arquivo: sp-it/5490.pdf."}],
      ["FOG-06", "Placa de advertência na entrada da área de armazenamento", {"orgao":"CBPMESP","estado":"SP","documento":"IT 30/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5490).","requisito":"4.2.5.18","conteudo":"Na entrada da área de armazenamento deve haver uma placa de 20 centímetros x 15 centímetros, com fundo amarelo e letras pretas, com os dizeres: \"explosivos - perigo\". Em toda loja deve haver placas de \"proibido fumar\". Toda a sinalização de emergência deve atender aos critérios da IT 20.","status":"CONFIRMADO","nota":"Verificado por script em 27/10/2026 no PDF oficial do portal (IT 30, SHA-256 cf3b6cf30eb99dab…). Arquivo: sp-it/5490.pdf."}],
      ["FOG-07", "Janelas para o exterior protegidas por tela metálica galvanizada", {"orgao":"CBPMESP","estado":"SP","documento":"IT 30/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5490).","requisito":"4.2.6","conteudo":"As janelas para o exterior devem ser protegidas por tela metálica galvanizada, com malha máxima de 12,7 milímetros x 12,7 milímetros e bitola do fio de, no mínimo, 16 BWG.","status":"CONFIRMADO","nota":"Verificado por script em 27/10/2026 no PDF oficial do portal (IT 30, SHA-256 cf3b6cf30eb99dab…). Arquivo: sp-it/5490.pdf."}]

    ["HEL", "Heliponto e heliporto (IT 31)", ["Fumo próximo ao pouso","Balizamento sem autonomia mínima","Extintor sem abrigo","EPI da brigada insuficiente"], [

      ["HEL-04", "Proteção durante reabastecimento e partida com equipamento portátil e pessoal treinado", {"orgao":"CBPMESP","estado":"SP","documento":"IT 31/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5491).","requisito":"4.4.4.1","conteudo":"Durante as operações de reabastecimento e de partida, a proteção do helicóptero deve ser feita com equipamento portátil apropriado, manuseado por pessoal treinado conforme IT 17.","status":"CONFIRMADO","nota":"Verificado por script em 27/10/2026 no PDF oficial do portal (IT 31, SHA-256 c67552eb212302c5…). Arquivo: sp-it/5491.pdf."}],

    ["SAP", "Cobertura de sapê, piaçava e similares (IT 33)", ["Área acima do limite da IT","Mais de dois pavimentos","Sem análise da Comissão Técnica acima de 900 m²","Mais de 50 pessoas sem medida exigida"], [
      ["SAP-01", "Edificação de até 200 m² com medidas de segurança do item 4.5.1", {"orgao":"CBPMESP","estado":"SP","documento":"IT 33/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5493).","requisito":"4.5.1","conteudo":"Para as edificações com área construída de até 200 m², independentemente da área de cobertura, devem ser exigidos extintores portáteis, sinalização e saídas de emergência.","status":"CONFIRMADO","nota":"Verificado por script em 27/10/2026 no PDF oficial do portal (IT 33, SHA-256 430c634fc9c60c3e…). Arquivo: sp-it/5493.pdf."}],
      ["SAP-02", "Edificação acima de 200 m² com medidas de segurança do item 4.5.2", {"orgao":"CBPMESP","estado":"SP","documento":"IT 33/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5493).","requisito":"4.5.2","conteudo":"Para as edificações com área construída superior a 200 m², independentemente da área de cobertura do sapé, devem ser exigidas as seguintes medidas de segurança: a. extintores portáteis; b. sinalização; c. extintores sobrerrodas; d. saídas de emergência; e. possuir C.M.A.R. classe II-A, acima e abaixo da cobertura. Admite-se classe II-B, no caso de edificações totalmente abertas","status":"CONFIRMADO","nota":"Verificado por script em 27/10/2026 no PDF oficial do portal (IT 33, SHA-256 430c634fc9c60c3e…). Arquivo: sp-it/5493.pdf."}],
      ["SAP-03", "Edificação acima de 750 m² com medidas adicionais do item 4.5.3", {"orgao":"CBPMESP","estado":"SP","documento":"IT 33/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5493).","requisito":"4.5.3","conteudo":"Edificações com área superior a 750 m², além das medidas de segurança exigidas no item 4.5.2, devem, ainda, contar com sistema de hidrantes e de alarme de incêndio, sendo dispensados os extintores sobrerrodas. A proteção estrutural deve atender à IT 08.","status":"CONFIRMADO","nota":"Verificado por script em 27/10/2026 no PDF oficial do portal (IT 33, SHA-256 430c634fc9c60c3e…). Arquivo: sp-it/5493.pdf."}],
      ["SAP-04", "Edificação com no máximo dois pavimentos", {"orgao":"CBPMESP","estado":"SP","documento":"IT 33/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5493).","requisito":"4.6.1","conteudo":"As edificações enquadradas nesta IT devem possuir, no máximo, dois pavimentos (térreo e primeiro andar).","status":"CONFIRMADO","nota":"Verificado por script em 27/10/2026 no PDF oficial do portal (IT 33, SHA-256 430c634fc9c60c3e…). Arquivo: sp-it/5493.pdf."}],
      ["SAP-05", "Edificação acima de 900 m² submetida à análise da Comissão Técnica", {"orgao":"CBPMESP","estado":"SP","documento":"IT 33/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5493).","requisito":"4.6.3","conteudo":"As edificações com área construída acima de 900 m² devem ser submetidas à análise de Comissão Técnica Ordinária. 5 REFERÊNCIAS NORMATIVAS E BIBLIOGRÁFICAS BRASIL. Constituição da República Federativa do Brasil, 5 de outubro de 1988, Brasília: Senado Federal, 2016, artigo 144, § 5°. SÃO PAULO (Estado). Constituição do Estado de São Paulo, de 5 de outubro de 1989; _______. Decret","status":"CONFIRMADO","nota":"Verificado por script em 27/10/2026 no PDF oficial do portal (IT 33, SHA-256 430c634fc9c60c3e…). Arquivo: sp-it/5493.pdf."}],
      ["SAP-06", "Com população total acima de 50 pessoas: iluminação de emergência e barras antipânico nas saídas", {"orgao":"CBPMESP","estado":"SP","documento":"IT 33/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5493).","requisito":"4.4.4","conteudo":"No caso em que a população total, incluindo clientes e funcionários, for superior a 50 pessoas, será obrigatória a instalação de sistema de iluminação de emergência, projetado e executado segundo normas técnicas oficiais, bem como barras antipânico nas saídas de emergência.","status":"CONFIRMADO","nota":"Verificado por script em 27/10/2026 no PDF oficial do portal (IT 33, SHA-256 430c634fc9c60c3e…). Arquivo: sp-it/5493.pdf."}]

      ["TRI-01", "Estação contígua a ocupação comercial atendendo às exigências específicas da IT 45", {"orgao":"CBPMESP","estado":"SP","documento":"IT 45/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5505).","requisito":"4.1.2","conteudo":"Nos casos de ocupação comercial contígua da estação ou onde a estação esteja integrada com edificação de ocupação que não seja a de trânsito de passageiros do sistema de transporte sobre trilhos, deverão ser observadas as exigências específicas das respectivas Instruções Técnicas.","status":"CONFIRMADO","nota":"Verificado por script em 27/10/2026 no PDF oficial do portal (IT 45, SHA-256 19d06e68d8e7df65…). Arquivo: sp-it/5505.pdf."}],
      ["TRI-02", "Materiais de construção das estações incombustíveis, garantidos por ensaios", {"orgao":"CBPMESP","estado":"SP","documento":"IT 45/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5505).","requisito":"4.2.1.1","conteudo":"Os materiais usados na construção das estações devem ser do tipo incombustível, garantidos por ensaios de resistência ao fogo, e devem atender à ABNT NBR 14432.","status":"CONFIRMADO","nota":"Verificado por script em 27/10/2026 no PDF oficial do portal (IT 45, SHA-256 19d06e68d8e7df65…). Arquivo: sp-it/5505.pdf."}],

      ["TRI-04", "Cadeiras e bancos de estação fechada construídos com materiais incombustíveis", {"orgao":"CBPMESP","estado":"SP","documento":"IT 45/2025","edicao":"Edição 2025, portal CBPMESP, início 10/12/2025 (postCod 5505).","requisito":"4.2.3.1","conteudo":"Em estações fechadas, as cadeiras, bancos etc., devem ser construídos com materiais incombustíveis, de forma que: a. o pico de calor emitido por uma só cadeira ou banco não ultrapasse 80 kW; b. o pico total de energia emitido para uma só cadeira ou banco durante os primeiros 10 minutos do ensaio do seu material não exceda 25 MJ/m²; c. armários com chaves (lockers) sejam de mate","status":"CONFIRMADO","nota":"Verificado por script em 27/10/2026 no PDF oficial do portal (IT 45, SHA-256 19d06e68d8e7df65…). Arquivo: sp-it/5505.pdf."}],

<script>
/* =====================================================================
   INDICADORES DA VISTORIA — cálculo puro (sem tela, sem armazenamento).
   Entrada: uma linha por item aplicável da inspeção:
     { situacao: 'C'|'NC'|'NA'|'NV'|'' , justificativa: bool, fotos: n, comentarios: n,
       dados: bool, prioridade: 'P1'|'P2'|'P3'|'', sistemaId, sistemaNome }
   Regras:
   - Não há pesos nem índice ponderado: são contagens e razões das situações registradas.
     (O índice ponderado depende de decisão do William sobre os pesos; não entra aqui.)
   - Pendente e NV ficam fora das razões de conformidade e são contados à parte.
   - "Dados" = observação preenchida ou teste funcional registrado.
   ===================================================================== */
'use strict';
const INDICADORES = (() => {
  const pct = (a, b) => (b ? Math.round(a / b * 1000) / 10 : null);
  const ROTULO_SENS = [
    ['N.A. fora do cálculo (conformes ÷ conformes + não conformes)', 'fora'],
    ['N.A. contado como conforme', 'comoConforme'],
    ['N.A. contado como não conforme', 'comoNc']
  ];

  /* Confiabilidade documental: quanto da situação registrada tem prova. */
  function confiabilidade(rows) {
    const C = rows.filter(r => r.situacao === 'C'), NC = rows.filter(r => r.situacao === 'NC'), NA = rows.filter(r => r.situacao === 'NA');
    const avaliados = rows.filter(r => r.situacao).length;
    const linha = (rotulo, n, de, nota) => ({ rotulo, n, de, pct: pct(n, de), nota });
    return [
      linha('Conformes com registro (foto, comentário ou dado)', C.filter(r => r.fotos || r.comentarios || r.dados).length, C.length, 'Sem registro, a conformidade declarada não tem prova na vistoria.'),
      linha('Conformes com foto', C.filter(r => r.fotos).length, C.length, 'Imagem anexada ao item conforme.'),
      linha('Não conformes com evidência (foto ou comentário)', NC.filter(r => r.fotos || r.comentarios).length, NC.length, 'Registro que descreve a falha.'),
      linha('Não conformes com prioridade definida', NC.filter(r => r.prioridade).length, NC.length, 'Prioridade necessária para o plano de ação.'),
      linha('Itens avaliados (com situação registrada)', avaliados, rows.length, 'Pendentes reduzem a cobertura.'),
      linha('N.A. justificados', NA.filter(r => r.justificativa).length, NA.length, 'N.A. sem justificativa não pode ser encerrado.')
    ];
  }

  /* Sensibilidade do resultado ao tratamento dos N.A. (base: só conformes, não conformes e N.A.). */
  function sensibilidade(rows) {
    const c = rows.filter(r => r.situacao === 'C').length, n = rows.filter(r => r.situacao === 'NC').length, a = rows.filter(r => r.situacao === 'NA').length;
    const valores = {
      fora: c + n ? pct(c, c + n) : null,
      comoConforme: c + n + a ? pct(c + a, c + n + a) : null,
      comoNc: c + n + a ? pct(c, c + n + a) : null
    };
    const usados = Object.values(valores).filter(v => v !== null);
    const amplitude = usados.length ? Math.round((Math.max(...usados) - Math.min(...usados)) * 10) / 10 : null;
    return {
      base: { conformes: c, naoConformes: n, naoAplicaveis: a },
      valores: ROTULO_SENS.map(([rotulo, k]) => ({ rotulo, pct: valores[k] })),
      amplitude,
      excluidos: { naoVerificados: rows.filter(r => r.situacao === 'NV').length, pendentes: rows.filter(r => !r.situacao).length }
    };
  }

  /* Matriz por sistema: situação, conformidade (conformes ÷ conformes + não conformes) e prioridades das NC. */
  function matrizSistemas(rows) {
    const mapa = new Map();
    rows.forEach(r => {
      if (!mapa.has(r.sistemaId)) mapa.set(r.sistemaId, { sistemaId: r.sistemaId, nome: r.sistemaNome, total: 0, C: 0, NC: 0, NA: 0, NV: 0, pend: 0, P1: 0, P2: 0, P3: 0 });
      const m = mapa.get(r.sistemaId);
      m.total++;
      if (!r.situacao) m.pend++; else m[r.situacao]++;
      if (r.situacao === 'NC' && r.prioridade) m[r.prioridade]++;
    });
    return [...mapa.values()].map(m => ({ ...m, pctConformidade: pct(m.C, m.C + m.NC) }));
  }

  /* Índice ponderado (regra R26): conformes ponderados ÷ (conformes + não conformes) ponderados.
     N.A. fica fora da conta; pendentes e não verificados também, e aparecem como cobertura. */
  function indicePonderado(rows) {
    let conforme = 0, avaliadoNum = 0, total = 0, avaliado = 0, nv = 0;
    rows.forEach(r => {
      const w = r.peso || 1;
      total += w;
      if (r.situacao === 'NV') nv++;
      if (r.situacao === 'C' || r.situacao === 'NC' || r.situacao === 'NA') avaliado += w;
      if (r.situacao === 'C' || r.situacao === 'NC') { avaliadoNum += w; if (r.situacao === 'C') conforme += w; }
    });
    return {
      indice: pct(conforme, avaliadoNum),
      cobertura: pct(avaliado, total),
      base: { pesoConforme: conforme, pesoConformeOuNc: avaliadoNum, pesoTotal: total },
      parcial: rows.some(r => !r.situacao),
      naoVerificados: nv
    };
  }

  return { confiabilidade, sensibilidade, matrizSistemas, indicePonderado, pct };
})();

</script>
<script>
/* =====================================================================
   RELATÓRIOS PPCI — padrão WRD (relatório Davi Caminhões PCI-201102-1 R05)
   Capa azul-marinho com filete vermelho, "Atendimento legal" por apontamento
   (NC-L / VER / REC / CONF / N/A), base legal no "Por quê" do 5W2H.

   ===================================================================== */
'use strict';
function criarRelatorios(core, evid) {
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

  const dataBR = iso => { if (!iso) return ''; const [a, m, d] = String(iso).slice(0, 10).split('-'); return d ? `${d}/${m}/${a}` : iso; };
  const token = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const TIPOS = {
    completo: 'Relatório técnico completo', nc: 'Resumo de não conformidades', fotografico: 'Relatório fotográfico', '5w2h': 'Plano de ação 5W2H', cronograma: 'Cronograma de adequação'
  };

  /* ---------- dados e contagens (fonte única) ---------- */
  function dados(inspecaoId) {
    const insp = core.inspecao(inspecaoId); if (!insp) throw new Error('Inspeção não encontrada.');
    const emp = core.empresa(insp.empresaId), uni = core.unidade(insp.unidadeId);
    const ocs = core.listarOcorrencias({ inspecaoId: insp.id });
    const itens = core.itensDaInspecao(insp).map(x => { const o = ocs.filter(c => c.areaId === x.area.id && c.itemId === x.item.id); return Object.assign(x, { ocs: o, cl: PPCI.classeDoItem(x.resp, o) }); });
    const fotos = core.listarFotos({ inspecaoId: insp.id });
    const inspetor = core.state.usuarios.find(u => u.id === insp.inspetorId);
    const codigo = insp.proposta ? `PCI-${insp.proposta}` : 'PCI-(proposta não informada)';
    return { insp, emp, uni, ocs, itens, fotos, inspetor, codigo, rev: insp.revisao, sintese: sintese(itens, ocs) };
  }
  function sintese(itens, ocs) {
    const s = { itens: itens.length, CONF: 0, 'NC-L': 0, VER: 0, REC: 0, NA: 0, pendente: 0, ocorrencias: { total: ocs.length, 'NC-L': 0, VER: 0, REC: 0, P1: 0, P2: 0, P3: 0, abertas: 0, encerradas: 0 } };
    itens.forEach(x => { if (!x.resp || !x.resp.situacao) s.pendente++; else if (x.resp.situacao === 'NA') s.NA++; else s[x.cl.classe]++; });
    ocs.forEach(o => { s.ocorrencias[o.classeLegal] = (s.ocorrencias[o.classeLegal] || 0) + 1; if (o.prioridade) s.ocorrencias[o.prioridade]++; if (o.situacao === 'encerrada') s.ocorrencias.encerradas++; else s.ocorrencias.abertas++; });
    return s;
  }
  const refTxt = r => r ? `${r.documento}${r.requisito ? ', ' + r.requisito : ''}` : '';
  const statusRef = r => r ? `<span class="rel-status st-${(r.status || '').replace(/\W+/g, '').toLowerCase()}">${esc(r.status)}</span>` : '';
  const chipClasse = c => c && PPCI.CLASSES[c] ? `<span class="cl cl-${PPCI.CLASSES[c].css}">${esc(PPCI.CLASSES[c].rotulo)}</span>` : '';

  /* ---------- imagens (carregadas uma a uma, versão reduzida para relatório) ---------- */
  async function prepararFotos(lista, progresso, paraWord) {
    const out = []; let n = 0;
    for (const f of lista) {
      const hash = f.versaoRelatorio && f.versaoRelatorio !== 'original' ? f.versaoRelatorio : f.hash;
      const b = await evid.imagemRelatorio(hash, paraWord ? 1000 : 1400);
      n++; if (progresso) progresso(n, lista.length);
      if (!b) { out.push({ f, ausente: true }); continue; }
      if (paraWord) { const buf = new Uint8Array(await b.arrayBuffer()); let s = ''; for (let i = 0; i < buf.length; i += 0x8000) s += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000)); out.push({ f, b64: btoa(s), nome: `img${String(n).padStart(4, '0')}.jpg` }); }
      else out.push({ f, url: URL.createObjectURL(b) });
    }
    return out;
  }
  function legenda(d, f, num) {
    const it = f.itemId ? d.insp.modelo.sistemas.flatMap(s => s.itens).find(i => i.id === f.itemId) : null;
    const sis = it ? d.insp.modelo.sistemas.find(s => s.itens.includes(it)) : null;
    const area = d.insp.areas.find(a => a.id === f.areaId);
    const oc = f.ocorrenciaId ? d.ocs.find(o => o.id === f.ocorrenciaId) : null;
    const partes = [CLASSE_FOTO[f.classificacao], sis && sis.nome, area && area.nome, it && it.codigo, oc && oc.codigo].filter(Boolean);
    return `<b>Foto ${num}</b> — ${esc(partes.join(' · '))}${f.legenda ? `<br>${esc(f.legenda)}` : ''}${f.localizacao ? `<br>Local: ${esc(f.localizacao)}` : ''}${f.versaoRelatorio !== 'original' ? '<br><i>Versão anotada; original preservado no aparelho.</i>' : ''}`;
  }
  /* Horizontais com horizontais (2 por linha), verticais com verticais (3 por linha); proporção preservada, legenda junto da imagem. */
  function gradeFotos(d, lista, ctx) {
    if (!lista.length) return '';
    const hor = lista.filter(p => (p.f.largura || 4) >= (p.f.altura || 3)), ver = lista.filter(p => !hor.includes(p));
    const fig = p => {
      const num = ++ctx.n;
      if (p.ausente) return `<figure class="rel-foto ausente"><div class="rel-sem-arq">Arquivo não disponível neste aparelho (hash ${esc(p.f.hash.slice(0, 12))}…)</div><figcaption>${legenda(d, p.f, num)}</figcaption></figure>`;
      const src = ctx.word ? `file:///C:/wrd/${p.nome}` : p.url;
      const w = ctx.word ? ((p.f.largura || 4) >= (p.f.altura || 3) ? 310 : 200) : 0, h = ctx.word ? Math.round(w * (p.f.altura || 3) / (p.f.largura || 4)) : 0;
      return `<figure class="rel-foto"><img src="${src}"${ctx.word ? ` width="${w}" height="${h}"` : ''} alt="Foto ${num}"><figcaption>${legenda(d, p.f, num)}</figcaption></figure>`;
    };
    const linhas = (arr, porLinha, cls) => { let h = ''; for (let i = 0; i < arr.length; i += porLinha) h += `<div class="rel-fotos ${cls}">${arr.slice(i, i + porLinha).map(fig).join('')}</div>`; return h; };
    if (ctx.word) { const tab = (arr, k) => { let h = ''; for (let i = 0; i < arr.length; i += k) h += `<tr>${arr.slice(i, i + k).map(p => `<td class="w-foto">${fig(p)}</td>`).join('')}</tr>`; return h ? `<table class="w-fotos">${h}</table>` : ''; }; return tab(hor, 2) + tab(ver, 3); }
    return linhas(hor, 2, 'f-h') + linhas(ver, 3, 'f-v');
  }

  /* ---------- peças comuns ---------- */
  function cabDoc(d, titulo) {

  function capa(d) {

        <svg class="capa-diamantes" viewBox="0 0 400 400" aria-hidden="true"><polygon points="200,10 390,200 200,390 10,200"/><polygon points="200,70 330,200 200,330 70,200"/><polygon points="200,130 270,200 200,270 130,200"/></svg>
        <div class="capa-barra"></div>
        <div class="capa-sobre">RELATÓRIO TÉCNICO DE INSPEÇÃO &nbsp;|&nbsp; ${esc(d.codigo)}</div>

        ${cel('DOCUMENTO', `${esc(d.codigo)} · ${esc(d.rev)}`, revAnt)}
        ${cel('DATA DA INSPEÇÃO', dataBR(i.data) || NI, `Emissão ${dataBR(hojeISO())}`)}
        ${cel('PROPOSTA DE ORIGEM', i.proposta ? esc(i.proposta) : NI, '')}

  const sistemasUsados = d => d.insp.modelo.sistemas.filter(s => d.itens.some(x => x.sistema.id === s.id));

  /* ---------- relatório completo ---------- */
  function completo(d, F, ctx) {

        const it = itemPorId(d, o.itemId), r = (xs.find(x => x.item.id === o.itemId && x.area.id === o.areaId) || {}).resp;

          ${o.situacao !== 'aberta' ? `<p><b>Situação do tratamento:</b> ${esc(SIT_NC[o.situacao])}${o.verificacao ? ` — verificado por ${esc(o.verificacao.verificadoPor)} em ${dataBR(o.verificacao.data)}` : ''}.</p>` : ''}
          ${gradeFotos(d, fotos, ctx)}</div>`);
      });
      xs.filter(x => x.resp && x.resp.situacao === 'NV').forEach(x => blocos.push(`<div class="rel-apont"><h3>${esc(x.item.codigo)} — não verificado <span class="rel-onde">(${esc(x.area.nome)})</span></h3>

  /* Agrupado por sistema → área → ocorrência/item; só fotos selecionadas para o relatório. */
  function fotografico(d, F, ctx, classes) {
    const blocos = [];
    const rotulos = { nao_conformidade: 'Evidências de não conformidade', conformidade: 'Evidências de conformidade', correcao: 'Evidências da correção (depois)', geral: 'Registro geral' };
    classes.forEach(cl => {
      const fs = F.filter(p => p.f.classificacao === cl); if (!fs.length) return;
      let h = `<h2>${rotulos[cl]}</h2>`;
      const porSis = new Map();
      fs.forEach(p => { const it = p.f.itemId && itemPorId(d, p.f.itemId); const sis = it ? d.insp.modelo.sistemas.find(s => s.itens.includes(it)) : null; const k = sis ? sis.id : '_'; if (!porSis.has(k)) porSis.set(k, []); porSis.get(k).push(p); });
      for (const [sid, lista] of porSis) {
        h += `<h3>${sid === '_' ? 'Sem item vinculado' : esc(sisPorId(d, sid).nome)}</h3>`;
        const porGrupo = new Map();
        lista.forEach(p => { const k = `${nomeArea(d, p.f.areaId)}${p.f.ocorrenciaId ? ' · ' + ((d.ocs.find(o => o.id === p.f.ocorrenciaId) || {}).codigo || '') : p.f.itemId ? ' · ' + itemPorId(d, p.f.itemId).codigo : ''}`; if (!porGrupo.has(k)) porGrupo.set(k, []); porGrupo.get(k).push(p); });
        for (const [k, l] of porGrupo) h += `<h4>${esc(k)}</h4>${gradeFotos(d, l, ctx)}`;
      }
      blocos.push(h);
    });
    return `${cabDoc(d, TIPOS.fotografico)}${avisoRascunho(d)}<p>${F.length} foto(s) selecionada(s) para publicação, agrupadas por sistema, área e ocorrência ou item. As legendas trazem apenas os dados registrados na inspeção.</p>${blocos.join('') || '<p>Nenhuma foto selecionada.</p>'}`;
  }

  /* ---------- montagem ---------- */
  async function montar(tipo, inspecaoId, opcoes, progresso) {
    opcoes = opcoes || {};
    const d = dados(inspecaoId), paraWord = !!opcoes.word;
    let sel;
    if (tipo === 'fotografico') { const cls = opcoes.classes || ['nao_conformidade', 'conformidade']; sel = fotosSel(d, f => cls.includes(f.classificacao)); }
    else if (tipo === 'nc') sel = opcoes.fotos === false ? [] : fotosSel(d, f => !!f.ocorrenciaId && f.classificacao !== 'conformidade');
    else if (tipo === 'completo') sel = opcoes.fotos === false ? [] : fotosSel(d, f => f.classificacao !== 'geral' && f.classificacao !== 'correcao');
    else sel = [];
    const F = await prepararFotos(sel, progresso, paraWord);
    const ctx = { n: 0, word: paraWord };
    let corpo;
    if (tipo === 'completo') corpo = completo(d, F, ctx);
    else if (tipo === 'nc') corpo = resumoNC(d, F, ctx);
    else if (tipo === 'fotografico') corpo = fotografico(d, F, ctx, opcoes.classes || ['nao_conformidade', 'conformidade']);
    else if (tipo === '5w2h') corpo = `<div class="pag-paisagem">${cabDoc(d, TIPOS['5w2h'])}${avisoRascunho(d)}${tab5w2h(d)}</div>`;
    else if (tipo === 'cronograma') corpo = `<div class="pag-paisagem">${cabDoc(d, TIPOS.cronograma)}${avisoRascunho(d)}${tabCronograma(d)}</div>`;
    else throw new Error('Tipo de relatório desconhecido.');
    const html = `${paraWord ? '' : estiloPagina(d)}<article class="doc doc-ppci tipo-${tipo}">${corpo}</article>`;
    return { html, d, fotos: F, urls: F.map(p => p.url).filter(Boolean) };
  }

  async function word(tipo, inspecaoId, opcoes, progresso) {
    const r = await montar(tipo, inspecaoId, Object.assign({}, opcoes, { word: true }), progresso);
    let html = r.html.replace(/<section class="capa">[\s\S]*?<\/section>/, capaWord(r.d)).replace(/<svg[\s\S]*?<\/svg>/g, '').replace(/src="data:image\/png;base64,[^"]+"/g, 'src="file:///C:/wrd/logo.png" width="90"');
    const doc = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>${esc(r.d.codigo)}</title><style>${cssWord()}</style></head><body>${html}</body></html>`;
    const B = '----=_WRD_PPCI_' + Date.now().toString(36);
    const b64utf8 = s => { const u = new TextEncoder().encode(s); let o = ''; for (let i = 0; i < u.length; i += 0x8000) o += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(o); };
    const quebra = s => s.replace(/.{1,76}/g, '$&\r\n');
    const partes = [`--${B}\r\nContent-Type: text/html; charset="utf-8"\r\nContent-Transfer-Encoding: base64\r\nContent-Location: file:///C:/wrd/relatorio.htm\r\n\r\n${quebra(b64utf8(doc))}`];
    partes.push(`--${B}\r\nContent-Type: image/png\r\nContent-Transfer-Encoding: base64\r\nContent-Location: file:///C:/wrd/logo.png\r\n\r\n${quebra(LOGO_AZUL.split(',')[1])}`);
    r.fotos.filter(p => p.b64).forEach(p => partes.push(`--${B}\r\nContent-Type: image/jpeg\r\nContent-Transfer-Encoding: base64\r\nContent-Location: file:///C:/wrd/${p.nome}\r\n\r\n${quebra(p.b64)}`));
    const mht = `MIME-Version: 1.0\r\nContent-Type: multipart/related; boundary="${B}"; type="text/html"\r\n\r\n${partes.join('\r\n')}\r\n--${B}--\r\n`;
    return { blob: new Blob([mht], { type: 'application/msword' }), d: r.d, fotos: r.fotos.length };
  }

  /* ---------- exportações estruturadas e texto ---------- */
  function csvItens(inspecaoId) {
    const d = dados(inspecaoId);
    return core.csv(['inspecao_id', 'area', 'sistema', 'item', 'texto', 'situacao', 'atendimento_legal', 'justificativa', 'observacao', 'teste', 'referencia', 'status_referencia', 'atualizado_em'],
      d.itens.map(x => [d.insp.id, x.area.nome, x.sistema.nome, x.item.codigo, x.item.texto, x.resp && x.resp.situacao ? SITUACOES[x.resp.situacao] : 'Pendente', x.cl.classe || x.cl.rotulo, x.resp ? x.resp.justificativa : '', x.resp ? x.resp.obs : '', x.resp && x.resp.teste ? TESTE[x.resp.teste.resultado] : TESTE.nao_testado, refTxt(x.item.ref), x.item.ref.status, x.resp ? x.resp.updatedAt : '']));
  }
  function csvNC(inspecaoId) {
    const d = dados(inspecaoId);
    return core.csv(['id', 'codigo', 'sistema', 'area', 'item', 'tipo', 'descricao', 'localizacao', 'equipamento', 'motivo', 'classe_legal', 'referencia', 'status_referencia', 'recomendacao', 'comprovacao', 'prioridade', 'justificativa_prioridade', 'responsavel', 'prazo', 'semana', 'como', 'quanto', 'situacao', 'fotos', 'updatedAt'],
      d.ocs.map(o => [o.id, o.codigo, (sisPorId(d, o.sistemaId) || {}).nome, nomeArea(d, o.areaId), itemPorId(d, o.itemId).codigo, o.tipo, o.descricao, o.localizacao, o.equipamento, o.motivo, o.classeLegal, refTxt(o.referencia), o.referencia.status, o.recomendacao, o.comprovacao, o.prioridade, o.justificativaPrioridade, o.responsavel, o.prazo, rotSemana(semana(d, o.prazo)), o.como, o.quanto, SIT_NC[o.situacao], d.fotos.filter(f => f.ocorrenciaId === o.id).length, o.updatedAt]));
  }
  function jsonInspecao(inspecaoId) {
    const d = dados(inspecaoId);
    return JSON.stringify({ contrato: 'nexo-plug/1', modulo: 'wrd-checklist-ppci', schemaVersion: SCHEMA_VERSION, exportadoEm: new Date().toISOString(), codigo: d.codigo, revisao: d.rev, empresa: d.emp, unidade: d.uni, inspecao: d.insp, ocorrencias: d.ocs, fotos: d.fotos.map(f => Object.assign({}, f, { observacao: 'arquivo não incluído; identificado pelo hash SHA-256' })), sintese: d.sintese }, null, 2);
  }
  function texto(inspecaoId) {
    const d = dados(inspecaoId), s = d.sintese;
    const linhas = [`${d.codigo} ${d.rev} — Inspeção PPCI`, `${d.emp.nome} — ${d.uni.nome}`, `Data: ${dataBR(d.insp.data)} · Inspetor: ${d.inspetor ? d.inspetor.nome : d.insp.inspetorNome}`, `Modelo: ${d.insp.modelo.nome} v${d.insp.modelo.versao}`, '',
      `Resultado: ${s.itens} verificações — ${s.CONF} CONF, ${s['NC-L']} NC-L, ${s.VER} VER, ${s.REC} REC, ${s.NA} não aplicáveis, ${s.pendente} pendentes.`, `Ocorrências: ${s.ocorrencias.total} (${s.ocorrencias.P1} P1, ${s.ocorrencias.P2} P2, ${s.ocorrencias.P3} P3).`, ''];
    d.ocs.forEach(o => linhas.push(`${o.codigo} [${o.classeLegal}${o.prioridade ? ' · ' + o.prioridade : ''}] ${nomeArea(d, o.areaId)} · ${itemPorId(d, o.itemId).codigo}: ${o.tipo || o.descricao || ''}${o.recomendacao ? ' → ' + o.recomendacao : ''}${o.prazo ? ' (prazo ' + dataBR(o.prazo) + ')' : ''} — ${refTxt(o.referencia)}`));
    if (d.insp.situacao !== 'encerrada' || s.pendente) linhas.push('', 'Atenção: documento preliminar (inspeção não encerrada ou com pendências).');
    return linhas.join('\n');
  }

  return { TIPOS, montar, word, csvItens, csvNC, jsonInspecao, texto, dados, sintese };
}

</script>
<script>
/* =====================================================================
   INTERFACE — WRD Check List PPCI
   Celular primeiro: a tela principal é a VISTORIA (ação mais frequente).
   ===================================================================== */
(function () {
  'use strict';
  const NS_BASE = 'checklist-ppci';
  let core = null, evid = null, rel = null, modo = null, nuvemGravar = null;
  const UI = { tela: 'inicio', inspId: null, areaId: null, filtro: 'todos', busca: '', novaClasse: null, pagFotos: 60, filtroFotos: {}, filtroNC: { situacao: 'abertas' }, relTipo: 'completo', modeloSel: null };
  const $ = (s, r) => (r || document).querySelector(s);
  /* Peso do sistema no índice: o do modelo; se o modelo for anterior ao peso, usa o padrão do módulo. */
  const pesoSistema = s => s.peso || PPCI.PESO_PADRAO[s.codigo] || 1;
  /* Rolagem horizontal também no topo das tabelas largas, sincronizada com a de baixo. */
  function rolagemSuperior(raiz) {
    raiz.querySelectorAll('.tabela-wrap').forEach(w => {
      if (w.dataset.topo || w.scrollWidth <= w.clientWidth + 1) return;
      const topo = document.createElement('div'); topo.className = 'rolagem-topo'; topo.setAttribute('aria-hidden', 'true');
      const interna = document.createElement('div'); interna.style.width = w.scrollWidth + 'px'; topo.appendChild(interna);
      w.parentNode.insertBefore(topo, w);
      let trava = false;
      topo.addEventListener('scroll', () => { if (trava) return; trava = true; w.scrollLeft = topo.scrollLeft; trava = false; });
      w.addEventListener('scroll', () => { if (trava) return; trava = true; topo.scrollLeft = w.scrollLeft; trava = false; });
      w.dataset.topo = '1';
    });
  }
  const $$ = (s, r) => [...(r || document).querySelectorAll(s)];
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const dataBR = iso => { if (!iso) return ''; const [a, m, d] = String(iso).slice(0, 10).split('-'); return d ? `${d}/${m}/${a}` : iso; };
  const horaBR = iso => iso ? new Date(iso).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : '';
  const opt = (v, r, sel) => `<option value="${esc(v)}"${String(sel) === String(v) ? ' selected' : ''}>${esc(r)}</option>`;
  const campo = (rot, html, o) => `<label class="campo${o && o.cls ? ' ' + o.cls : ''}"><span>${rot}${o && o.req ? ' <span class="req">*</span>' : ''}</span>${html}${o && o.ajuda ? `<span class="ajuda">${o.ajuda}</span>` : ''}</label>`;
  const inp = (n, v, o) => `<input name="${n}" type="${(o && o.type) || 'text'}" value="${esc(v)}"${o && o.req ? ' required' : ''}${(o && o.extra) || ''}>`;
  const area = (n, v, o) => `<textarea name="${n}" rows="${(o && o.rows) || 2}"${(o && o.extra) || ''}>${esc(v)}</textarea>`;
  const fv = (f, n) => { const el = f.querySelector(`[name="${n}"]`); return el ? (el.type === 'checkbox' ? el.checked : el.value) : ''; };
  const token = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const prefKey = () => `wrd.${NS_BASE}.${modo}.ui`;
  function salvarPrefs() { try { localStorage.setItem(prefKey(), JSON.stringify({ tela: UI.tela, inspId: UI.inspId, areaId: UI.areaId, filtro: UI.filtro })); } catch (e) { /* sem localStorage */ } }
  /* Ao abrir, nunca volta direto para Clientes ou Configurações: a tela de trabalho é Inspeções/Vistoria. */
  function lerPrefs() { try { Object.assign(UI, JSON.parse(localStorage.getItem(prefKey()) || '{}')); } catch (e) { /* ignora */ } if (['cadastros', 'config'].includes(UI.tela)) UI.tela = 'inicio'; }

  function toast(msg, tipo) { const t = document.createElement('div'); t.className = 'toast ' + (tipo || ''); t.setAttribute('role', tipo === 'erro' ? 'alert' : 'status'); t.textContent = msg; $('#toasts').appendChild(t); setTimeout(() => t.remove(), tipo === 'erro' ? 7000 : 3200); }
  function tentar(fn) { try { const r = fn(); if (r && r.catch) r.catch(e => { console.error(e); toast(e.message, 'erro'); }); return r; } catch (e) { console.error(e); toast(e.message, 'erro'); return undefined; } }
  function modal(titulo, corpo, o) {
    o = o || {};
    const f = document.createElement('div'); f.className = 'modal-fundo';
    f.innerHTML = `<div class="modal${o.largo ? ' largo' : ''}" role="dialog" aria-modal="true" aria-label="${esc(titulo)}"><div class="modal-cab"><h2>${esc(titulo)}</h2><button class="btn-x" data-fechar aria-label="Fechar">×</button></div><div class="modal-corpo">${corpo}</div>${o.rodape ? `<div class="modal-rodape">${o.rodape}</div>` : ''}</div>`;
    document.body.appendChild(f); document.body.classList.add('com-modal');
    const fechar = () => { f.remove(); if (!$('.modal-fundo')) document.body.classList.remove('com-modal'); if (o.aoFechar) o.aoFechar(); };
    f.fechar = fechar; f.querySelector('[data-fechar]').onclick = fechar;
    f.addEventListener('mousedown', e => { if (e.target === f) fechar(); });
    return f;
  }
  function confirmar(titulo, texto, rotuloOk) { return new Promise(res => { const m = modal(titulo, `<p class="pre">${esc(texto)}</p>`, { rodape: `<button class="btn" data-n>Cancelar</button><button class="btn btn-primario" data-s>${esc(rotuloOk || 'Confirmar')}</button>`, aoFechar: () => res(false) }); m.querySelector('[data-n]').onclick = () => m.fechar(); m.querySelector('[data-s]').onclick = () => { res(true); m.remove(); if (!$('.modal-fundo')) document.body.classList.remove('com-modal'); }; }); }
  function baixar(nome, conteudo, tipo) { const b = conteudo instanceof Blob ? conteudo : new Blob([conteudo], { type: tipo || 'application/octet-stream' }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = nome; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); }
  async function copiar(t) { try { await navigator.clipboard.writeText(t); toast('Texto copiado.', 'ok'); } catch (e) { const m = modal('Copiar texto', `<p class="peq">Selecione e copie (Ctrl+C):</p><textarea rows="14" readonly>${esc(t)}</textarea>`); m.querySelector('textarea').select(); } }

  /* =================================================================== */
  /* ABERTURA (padrão WRD) E LOGIN                                        */
  /* =================================================================== */
  function telaModo() {
    return `<div class="entrada"><div class="entrada-box"><img src="${LOGO_AZUL}" alt="WRD Soluções" class="logo-entrada"><h1>WRD Check List PPCI</h1>
      <p>Inspeção dos sistemas de prevenção e combate a incêndio, com fotos, não conformidades, plano de ação e relatório no padrão WRD.</p>
      <div class="grade"><button class="btn btn-primario btn-grande" data-act="modo" data-modo="real">Entrar no sistema</button>
      <button class="btn btn-grande" data-act="modo" data-modo="demo">Abrir demonstração (dados fictícios)</button></div>
      <p class="ajuda">A demonstração usa um armazenamento separado e nunca se mistura com os dados reais.</p><p class="ajuda">Versão 2.1.0 · build 27/10/2026, 08:36</p></div></div>`;
  }
  function telaLogin() {
    const primeiro = !core.hasUsers();
    if (core.demo && !primeiro) return `<div class="entrada"><div class="entrada-box"><img src="${LOGO_AZUL}" alt="WRD Soluções" class="logo-entrada"><h1>WRD Check List PPCI — DEMONSTRAÇÃO</h1><p>Dados fictícios. Escolha o perfil para conhecer o sistema:</p><div class="grade">${core.usuariosDemo().map(u => `<button class="btn btn-grande" data-act="entrar-demo" data-login="${esc(u.login)}">${esc(u.nome)} — ${esc(u.perfil)}</button>`).join('')}</div><p><button class="btn-link peq" data-act="trocar-modo">Voltar</button></p></div></div>`;
    return `<div class="entrada"><div class="entrada-box"><img src="${LOGO_AZUL}" alt="WRD Soluções" class="logo-entrada"><h1>WRD Check List PPCI${core.demo ? ' — DEMONSTRAÇÃO' : ''}</h1>
      ${primeiro ? `<p>Primeiro acesso: crie o usuário <b>administrador</b>.</p>
        <form id="form-setup" class="grade">${campo('Nome', inp('nome', '', { req: true }), { req: true })}${campo('Cargo', inp('cargo', ''))}${campo('Registro profissional', inp('crea', ''), { ajuda: 'Ex.: CREA-SP nº … (aparece no relatório como responsável técnico).' })}${campo('Login', inp('login', '', { req: true, extra: ' autocomplete="username"' }), { req: true, ajuda: '3 a 30 caracteres: letras, números, ponto, hífen.' })}${campo('Senha', inp('senha', '', { type: 'password', req: true, extra: ' autocomplete="new-password" minlength="6"' }), { req: true, ajuda: 'Mínimo de 6 caracteres.' })}
        <button class="btn btn-primario btn-grande">Criar administrador e entrar</button></form>`
        : `<form id="form-login" class="grade">${campo('Login', inp('login', '', { req: true, extra: ' autocomplete="username"' }))}${campo('Senha', inp('senha', '', { type: 'password', req: true, extra: ' autocomplete="current-password"' }))}
        <button class="btn btn-primario btn-grande">Entrar</button></form>`}
      <p><button class="btn-link peq" data-act="trocar-modo">Voltar</button></p></div></div>`;
  }
  function ligarLogin() {
    const fs = $('#form-setup'), fl = $('#form-login');
    if (fs) fs.onsubmit = e => { e.preventDefault(); tentar(() => { core.setupAdmin({ nome: fv(fs, 'nome'), cargo: fv(fs, 'cargo'), crea: fv(fs, 'crea'), login: fv(fs, 'login'), senha: fv(fs, 'senha') }); aposLogin(); }); };
    if (fl) fl.onsubmit = e => { e.preventDefault(); tentar(() => { core.login(fv(fl, 'login'), fv(fl, 'senha')); aposLogin(); }); };
  }
  function aposLogin() {
    lerPrefs();
    if (UI.inspId && !core.inspecao(UI.inspId)) { UI.inspId = null; UI.areaId = null; }
    if (!UI.inspId) { const ult = core.listarInspecoes({ situacao: 'em_andamento' }).filter(i => i.posicao).sort((a, b) => (b.posicao.em || '').localeCompare(a.posicao.em || ''))[0]; if (ult) { UI.inspId = ult.id; UI.areaId = ult.posicao.areaId; UI.tela = 'vistoria'; } else UI.tela = 'inicio'; }
    render();
  }
  /* Integração com a nuvem WRD (login, sincronização, conflito). O estado do módulo é o mesmo que o nuvem.js já sincroniza. */
  const NV = typeof WRDNuvem !== 'undefined' ? WRDNuvem.integrar({
    modulo: 'checklist_ppci', titulo: 'WRD Check List PPCI', nomeModulo: 'Check List PPCI', ns: 'wrd.' + NS_BASE, logo: LOGO_AZUL,
    storageReal: () => storageReal(),
    toast: (m, t) => toast(m, t), confirmar: (t, m, b) => confirmar(t, m, b), abrirModal: (t, h) => modal(t, h), fmtTs: ts => (ts ? new Date(ts).toLocaleString('pt-BR') : ''),
    aoPronto: storage => { nuvemGravar = storage; registrarNuvemAdaptador(); entrarNaNuvem(); if (core.user()) aposLogin(); else render(); },
    aoRecarregar: info => { if (!core || modo !== 'real') return; render(); if (!info.mesclado) toast(`Dados atualizados${info.origem ? ' (alterados no ' + info.origem.toLowerCase() + ')' : ''}.`, 'ok'); },
    aoDesconectar: () => { nuvemGravar = null; render(); },
    aoVoltar: () => { nuvemGravar = null; core = null; modo = null; try { sessionStorage.removeItem(`wrd.${NS_BASE}.modo`); } catch (e) { /* aba privada */ } render(); },
    render: () => render()
  }) : null;
  /* Estado do módulo para o nuvem.js: a leitura pega o estado atual; a escrita (vinda da nuvem) substitui sem reenviar. */
  function storageReal() {
    const chave = k => 'wrd.' + NS_BASE + '.' + k;
    return {
      get: k => { if (k === 'state') return core ? JSON.stringify(core.state) : null; try { return localStorage.getItem(chave(k)); } catch (e) { return null; } },
      set: (k, v) => {
        if (k !== 'state') { try { localStorage.setItem(chave(k), v); } catch (e) { /* sem armazenamento */ } return; }
        if (!core || v === JSON.stringify(core.state)) return;
        try { core.substituirEstado(JSON.parse(v)); } catch (e) { toast('Não foi possível aplicar os dados da nuvem: ' + e.message, 'erro'); }
      },
      remove: k => { if (k !== 'state') { try { localStorage.removeItem(chave(k)); } catch (e) { /* sem armazenamento */ } } }
    };
  }
  /* Token da sessão da nuvem (o nuvem.js renova quando necessário). */
  async function tokenNuvem() {
    const guarda = { get: k => localStorage.getItem('wrd.' + NS_BASE + '.nuvem:' + k), set: (k, v) => localStorage.setItem('wrd.' + NS_BASE + '.nuvem:' + k, v), remove: k => localStorage.removeItem('wrd.' + NS_BASE + '.nuvem:' + k) };
    try { await WRDNuvem.cliente({ modulo: 'checklist_ppci', guarda }).acesso(); } catch (e) { if (e.code === 'OFFLINE') throw e; }
    let s = null; try { s = JSON.parse(guarda.get('nuvem.sessao') || 'null'); } catch (e) { s = null; }
    if (!s || !s.access_token) { const e = new Error('Sessão da nuvem expirada: entre de novo.'); e.code = 'AUTH'; throw e; }
    return s.access_token;
  }
  /* Com a nuvem ligada, o envio de fotos usa o bucket privado "fotos" e a nuvem vira o adaptador padrão. */
  /* Dentro do painel integrado, "Sair" devolve o controle ao painel; a conexão com a nuvem continua valendo. */
  function voltarAoPainel(modulo) {
    try { if (window.parent && window.parent !== window) { window.parent.postMessage({ wrd: 'voltar', modulo }, '*'); return true; } } catch (e) { /* fora do painel */ }
    return false;
  }
  // Com a conta da nuvem já conectada, o módulo entra no perfil correspondente sem pedir a senha de novo. Se não houver perfil, cai na tela de login.
  function entrarNaNuvem() {
    if (!core || core.user() || !NV || !NV.usuarioEmail) return;
    const email = NV.usuarioEmail() || '';
    try { core.entrarPelaNuvem(email); return; } catch (e) { /* sem perfil correspondente */ }
    if (core.hasUsers() || !email) return;
    // Módulo vazio: cria o administrador com o e-mail da conta da nuvem. A senha é aleatória; o acesso passa a ser pelo painel.
    const base = email.split('@')[0].split('').map(c => (/[A-Za-z0-9.]/.test(c) ? c : '.')).join('').slice(0, 30);
    const login = base.length >= 3 ? base : 'admin';
    const senha = Array.from(crypto.getRandomValues(new Uint8Array(24))).map(b => b.toString(36)).join('');
    try { core.setupAdmin({ nome: login, login, senha, email }); } catch (e) { /* segue para o formulário de primeiro acesso */ }
  }
  function registrarNuvemAdaptador() {
    if (!evid || evid.adaptadores().some(a => a.id === 'nuvem')) return;
    evid.registrarAdaptador(criarAdaptadorNuvem({ url: WRDNuvem.CONFIG.url, chave: WRDNuvem.CONFIG.chave, modulo: 'checklist_ppci', token: tokenNuvem }));
    if (core.state.config.adaptadorEnvio === 'nenhum') { core.state.config.adaptadorEnvio = 'nuvem'; core.salvarAgora(); }
  }

  async function abrirModo(m) {
    modo = m;
    try { sessionStorage.setItem(`wrd.${NS_BASE}.modo`, m); } catch (e) { /* aba privada */ }
    $('#app').innerHTML = '<div class="carregando" role="status">Abrindo o armazenamento do aparelho…</div>';
    try {
      core = await criarNucleo({ namespace: m === 'demo' ? NS_BASE + '.demo' : NS_BASE, demo: m === 'demo', dominio: PPCI, aoGravar: () => { if (nuvemGravar) nuvemGravar.set('state', JSON.stringify(core.state)); } });
      evid = criarEvidencias(core); rel = criarRelatorios(core, evid);
      if (m === 'demo' && !core.hasUsers()) await semearDemo(core, evid);
      await evid.iniciar();
      evid.onMudanca(() => atualizarIndicadoresEnvio());
      core.onEvento((ev, p) => { NEXO.emit('ppci.' + ev, p); if (ev === 'nucleo.salvo') atualizarSalvo(); if (ev === 'nucleo.erro_salvar') toast('Não foi possível salvar no aparelho: ' + p.mensagem, 'erro'); if (ev === 'nucleo.recebido' && UI.tela) renderTela(); });
      NEXO.emit('ppci.modulo.pronto', { modo: m });
      if (m === 'real' && NV && NV.abrir()) { render(); return; }
      if (core.user()) aposLogin(); else render();

  function modalNovaInspecao() {

  function telaVistoria(el) {

      ${a ? `<div class="linha entre"><div class="chips" role="group" aria-label="Filtro de itens">${[['todos', 'Todos'], ['pendentes', 'Pendentes'], ['NC', 'Não conformes']].map(([k, r]) => `<button class="chip-btn" data-act="filtro" data-f="${k}" aria-pressed="${UI.filtro === k}">${r}</button>`).join('')}</div>

  function listaItens(i, a, podeEditar) {

      });
      if (!its.length) return '';
      const pend = s.itens.filter(it => { const r = i.respostas[core.chave(a.id, it.id)]; return !r || !r.situacao; }).length;

  /* Câmera do módulo (rajada): várias fotos seguidas sem sair da tela. */
  async function abrirCamera(ctx, depois) {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { toast('Este navegador não libera a câmera para o módulo; usando a câmera do aparelho (uma foto por vez).', 'erro'); capturar('camera', Object.assign({}, ctx, { origem: 'camera' }), depois); return; }
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1440 } }, audio: false }); }
    catch (e) { toast('Câmera não autorizada (' + e.name + '). Usando a câmera do aparelho.', 'erro'); capturar('camera', Object.assign({}, ctx, { origem: 'camera' }), depois); return; }
    const c = document.createElement('div'); c.className = 'camera'; c.setAttribute('role', 'dialog'); c.setAttribute('aria-label', 'Câmera — rajada');
    c.innerHTML = `<video autoplay playsinline muted></video><div class="camera-mini" id="cam-mini"></div><div class="camera-barra"><span id="cam-n">0 foto(s)</span><button class="camera-disparo" aria-label="Fotografar" data-cam="foto"></button><button class="btn" data-cam="fim">Concluir</button></div>`;
    document.body.appendChild(c); const video = c.querySelector('video'); video.srcObject = stream;
    const fila = []; let salvando = Promise.resolve();
    const fim = async () => { stream.getTracks().forEach(t => t.stop()); c.remove(); await salvando; if (depois) depois(); if (UI.tela === 'vistoria' && ctx.itemId) refreshItem(ctx.itemId); };
    c.addEventListener('click', async e => {
      const b = e.target.closest('[data-cam]'); if (!b) return;

      const cv = document.createElement('canvas'); cv.width = video.videoWidth; cv.height = video.videoHeight; cv.getContext('2d').drawImage(video, 0, 0);
      const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.92));
      const arq = new File([blob], `rajada-${Date.now()}.jpg`, { type: 'image/jpeg', lastModified: Date.now() });

      const im = document.createElement('img'); const u = URL.createObjectURL(blob); im.src = u; im.onload = () => setTimeout(() => URL.revokeObjectURL(u), 2000); $('#cam-mini', c).prepend(im);
      salvando = salvando.then(() => evid.adicionarArquivos([arq], ctx)).catch(er => toast(er.message, 'erro'));
    });
  }

  /* Anotação: desenha sobre uma CÓPIA; o original continua intacto (hash preservado). */
  async function abrirAnotador(fotoId, depois) {
    const f = core.foto(fotoId); const blob = await evid.lerArquivo(f.hash); if (!blob) { toast('Original não disponível.', 'erro'); return; }
    const bmp = await createImageBitmap(blob); const esc1 = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const cv = document.createElement('canvas'); cv.width = Math.round(bmp.width * esc1); cv.height = Math.round(bmp.height * esc1);
    const g = cv.getContext('2d'); g.drawImage(bmp, 0, 0, cv.width, cv.height); bmp.close();
    const cores = { vermelho: token('--pci-vermelho'), amarelo: token('--classe-ver'), branco: token('--n-0') };
    let ferramenta = 'caneta', cor = cores.vermelho, desenhando = false, ini = null, base = null; const hist = [];
    const m = modal('Anotar foto (cria uma cópia; o original é preservado)', `<div class="chips" id="anot-ferr">${[['caneta', 'Caneta'], ['seta', 'Seta'], ['circulo', 'Círculo'], ['retangulo', 'Retângulo'], ['texto', 'Texto']].map(([k, r]) => `<button class="chip-btn" data-t="${k}" aria-pressed="${k === ferramenta}">${r}</button>`).join('')}
      ${Object.entries(cores).map(([k, v]) => `<button class="chip-btn" data-c="${k}" aria-pressed="${v === cor}">${k}</button>`).join('')}<button class="chip-btn" data-u>Desfazer</button></div><div class="anotador" id="anot"></div>`,
      { largo: true, rodape: '<button class="btn" data-x>Cancelar</button><button class="btn btn-primario" data-ok>Salvar versão anotada</button>', aoFechar: () => { cv.width = cv.height = 0; } });
    $('#anot', m).appendChild(cv);
    const ponto = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * cv.width / r.width, y: (e.clientY - r.top) * cv.height / r.height }; };
    const largura = () => Math.max(3, Math.round(cv.width / 250));
    cv.addEventListener('pointerdown', e => {
      e.preventDefault(); hist.push(g.getImageData(0, 0, cv.width, cv.height)); if (hist.length > 12) hist.shift();
      ini = ponto(e); g.strokeStyle = g.fillStyle = cor; g.lineWidth = largura(); g.lineCap = 'round';
      if (ferramenta === 'texto') { const t = prompt('Texto da anotação:'); if (t) { g.font = `bold ${largura() * 7}px sans-serif`; g.fillText(t, ini.x, ini.y); } else hist.pop(); return; }
      desenhando = true; base = g.getImageData(0, 0, cv.width, cv.height); g.beginPath(); g.moveTo(ini.x, ini.y); cv.setPointerCapture(e.pointerId);
    });

      if (!desenhando) return; const p = ponto(e);

      g.putImageData(base, 0, 0); g.beginPath();
      if (ferramenta === 'retangulo') g.strokeRect(ini.x, ini.y, p.x - ini.x, p.y - ini.y);
      else if (ferramenta === 'circulo') { g.ellipse((ini.x + p.x) / 2, (ini.y + p.y) / 2, Math.abs(p.x - ini.x) / 2, Math.abs(p.y - ini.y) / 2, 0, 0, Math.PI * 2); g.stroke(); }
      else if (ferramenta === 'seta') { const ang = Math.atan2(p.y - ini.y, p.x - ini.x), L = largura() * 5; g.moveTo(ini.x, ini.y); g.lineTo(p.x, p.y); g.lineTo(p.x - L * Math.cos(ang - 0.45), p.y - L * Math.sin(ang - 0.45)); g.moveTo(p.x, p.y); g.lineTo(p.x - L * Math.cos(ang + 0.45), p.y - L * Math.sin(ang + 0.45)); g.stroke(); }
    });

      const t = e.target.closest('[data-t]'), c = e.target.closest('[data-c]');
      if (t) { ferramenta = t.dataset.t; $$('[data-t]', m).forEach(x => x.setAttribute('aria-pressed', x === t)); }
      if (c) { cor = cores[c.dataset.c]; $$('[data-c]', m).forEach(x => x.setAttribute('aria-pressed', x === c)); }

      if (e.target.closest('[data-ok]')) { const b = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.9)); try { await evid.adicionarDerivada(f.id, b, 'Anotação'); toast('Versão anotada salva; o original foi preservado.', 'ok'); m.fechar(); abrirFoto(f.id, depois); } catch (er) { toast(er.message, 'erro'); } }
    });
  }

    el.innerHTML = `<div class="cab-tela"><h1>Indicadores da vistoria</h1><label class="campo"><span>Inspeção</span><select id="indInsp">${lista.map(x => opt(x.id, `${dataBR(x.data)} — ${core.empresa(x.empresaId).nome} › ${core.unidade(x.unidadeId).nome}`, i.id)).join('')}</select></label></div>

        <p class="peq">Conformes ponderados ÷ (conformes + não conformes) ponderados. N.A. fica fora da conta.${ip.parcial ? ' <b>Índice parcial: há itens pendentes.</b>' : ''}</p>
        <p class="peq muted">Não é declaração de conformidade legal. Os pesos são parâmetros do modelo WRD, a validar pelo responsável técnico. Critério: ${esc(PPCI.PESO_CRITERIO)}</p>

      <div class="cartao"><h2>Sensibilidade aos N.A.</h2><p class="peq">Base: ${sens.base.conformes} conforme(s), ${sens.base.naoConformes} não conforme(s), ${sens.base.naoAplicaveis} N.A. Fora da conta: ${sens.excluidos.naoVerificados} não verificado(s) e ${sens.excluidos.pendentes} pendente(s).</p>${sens.valores.map(linhaSens).join('')}<p class="peq">${amp}</p></div>

  function modelosVigentes(lista) {
    const num = v => String(v || '0').split('.').map(Number), maior = (a, b) => { const x = num(a), y = num(b); for (let k = 0; k < Math.max(x.length, y.length); k++) { const d = (x[k] || 0) - (y[k] || 0); if (d) return d; } return 0; };

  }

  /* =================================================================
     CONTRATO DE PLUG — window.NEXO_MODULE (nexo-plug/1)
     Comunicação externa somente por window.parent.postMessage e JSON.
     ================================================================= */
  const extListeners = {};
  const semCore = () => ({ erro: 'Módulo sem sessão: abra o módulo e faça login.', codigo: 'AUTH' });
  const NEXO = {
    manifest: MANIFEST,
    getState() { if (!core || !core.user()) return semCore(); try { return core.snapshot(); } catch (e) { return { erro: e.message, codigo: e.code || 'ERRO' }; } },
    getKPIs() {
      if (!core || !core.user()) return semCore();
      try { const k = core.indicadores(evid.resumo()); return { geradoEm: new Date().toISOString(), demo: core.demo, indicadores: MANIFEST.indicadores.map(i => Object.assign({}, i, { valor: k[i.id] == null ? null : k[i.id] })) }; }
      catch (e) { return { erro: e.message, codigo: e.code || 'ERRO' }; }
    },
    export(formato) {
      if (!core || !core.user()) return semCore();
      try {
        if (formato === 'json') return JSON.stringify(core.snapshot());
        if (formato === 'csv') { const l = core.listarOcorrencias({}); return core.csv(['id', 'codigo', 'inspecaoId', 'empresaId', 'tipo', 'classe', 'prioridade', 'prazo', 'situacao', 'updatedAt'], l.map(o => [o.id, o.codigo, o.inspecaoId, o.empresaId, o.tipo, o.classeLegal, o.prioridade, o.prazo, o.situacao, o.updatedAt])); }
        if (formato === 'pdf') { UI.tela = 'relatorios'; renderTela(); return { ok: true, mensagem: 'Abra o relatório e use "Imprimir / salvar PDF".' }; }
        return { erro: 'Formato não suportado. Use: ' + MANIFEST.exporta.join(', ') };
      } catch (e) { return { erro: e.message, codigo: e.code || 'ERRO' }; }
    },
    on(evento, fn) { (extListeners[evento] = extListeners[evento] || []).push(fn); return () => { extListeners[evento] = (extListeners[evento] || []).filter(f => f !== fn); }; },
    emit(evento, payload) {
      const msg = { contrato: MANIFEST.contrato, modulo: MANIFEST.id, versao: MANIFEST.versao, evento, payload: payload || {}, demo: core ? core.demo : false, ts: new Date().toISOString() };
      [...(extListeners[evento] || []), ...(extListeners['*'] || [])].forEach(fn => { try { fn(msg.payload, evento); } catch (e) { console.error(e); } });
      try { if (window.parent && window.parent !== window) window.parent.postMessage(msg, '*'); } catch (e) { /* sem painel */ }
    }
  };
  window.NEXO_MODULE = NEXO;
  window.addEventListener('message', e => {
    if (window.parent === window || e.source !== window.parent) return;
    const d = e.data || {}; if (d.contrato !== MANIFEST.contrato || !d.pedido) return;
    const mapa = { manifest: () => MANIFEST, getKPIs: () => NEXO.getKPIs(), getState: () => NEXO.getState(), export: () => (d.args && d.args[0] === 'pdf' ? { erro: 'PDF só pela interface do módulo.' } : NEXO.export(...(d.args || []))) };
    const fn = mapa[d.pedido];
    window.parent.postMessage({ contrato: MANIFEST.contrato, modulo: MANIFEST.id, resposta: d.pedido, id: d.id, dados: fn ? fn() : { erro: 'Pedido desconhecido.' } }, '*');
  });
  /* Diagnóstico para os testes automatizados (somente leitura). */
  window.__ppci = { get core() { return core; }, get evid() { return evid; }, get rel() { return rel; }, UI, abrirModo, renderTela, ind: INDICADORES, pesoPadrao: codigo => PPCI.PESO_PADRAO[codigo], rolagemSuperior: () => rolagemSuperior(document.getElementById('tela') || document) };
  /* Ao mudar a largura da tela, as rolagens de topo são refeitas. */
  window.addEventListener('resize', () => {
    document.querySelectorAll('.rolagem-topo').forEach(t => t.remove());
    document.querySelectorAll('.tabela-wrap[data-topo]').forEach(w => { delete w.dataset.topo; });
