.aviso-alerta { background: var(--alerta-fundo); border: var(--borda) solid var(--alerta); color: var(--alerta); }
.aviso-critico { background: var(--critico-fundo); border: var(--borda) solid var(--critico); color: var(--critico); }
.aviso-ok { background: var(--ok-fundo); border: var(--borda) solid var(--ok); color: var(--ok); }

.resumo-valores { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: var(--esp-2); margin: var(--esp-3) 0; }
.resumo-valores div { background: var(--n-50); border-radius: var(--raio); padding: var(--esp-2) var(--esp-3); }
.resumo-valores span { display: block; font-size: var(--fs-xs); color: var(--n-500); }
.resumo-valores b { font-size: var(--fs-lg); font-variant-numeric: tabular-nums; }
dl.info { display: grid; grid-template-columns: max-content 1fr; gap: var(--esp-1) var(--esp-3); margin: 0; font-size: var(--fs-sm); }
dl.info dt { color: var(--n-500); }
dl.info dd { margin: 0; }

/* ---------- modal ---------- */
.modal-fundo { position: fixed; inset: 0; background: var(--sobreposicao); z-index: var(--z-modal); display: flex; align-items: flex-start; justify-content: center; padding: var(--esp-5) var(--esp-3); overflow-y: auto; }
.modal { background: var(--n-0); border-radius: var(--raio-lg); box-shadow: var(--sombra-lg); width: 100%; max-width: var(--largura-modal); display: flex; flex-direction: column; }
.modal.largo { max-width: var(--largura-modal-largo); }
.modal.estreito { max-width: var(--largura-modal-estreito); }
.modal-cab { display: flex; align-items: center; justify-content: space-between; padding: var(--esp-3) var(--esp-4); border-bottom: var(--borda) solid var(--n-200); gap: var(--esp-2); }
.modal-cab h2 { font-size: var(--fs-lg); margin: 0; color: var(--cor-primaria-escura); }
.modal-corpo { padding: var(--esp-4); display: flex; flex-direction: column; gap: var(--esp-3); }
.modal-rod { padding: var(--esp-3) var(--esp-4); border-top: var(--borda) solid var(--n-200); display: flex; justify-content: flex-end; gap: var(--esp-2); flex-wrap: wrap; background: var(--n-50); border-radius: 0 0 var(--raio-lg) var(--raio-lg); }
.fechar { background: none; border: 0; font-size: var(--fs-icone); line-height: var(--lh-icone); cursor: pointer; color: var(--n-500); padding: var(--esp-1); }
.erro-form { color: var(--critico); font-size: var(--fs-sm); font-weight: var(--peso-medio); }

.toasts { position: fixed; right: var(--esp-4); bottom: var(--esp-4); z-index: var(--z-aviso); display: flex; flex-direction: column; gap: var(--esp-2); max-width: min(var(--largura-toast), calc(var(--largura-tela) - var(--esp-6))); }
.toast { background: var(--n-900); color: var(--n-0); border-radius: var(--raio); padding: var(--esp-3) var(--esp-4); box-shadow: var(--sombra-lg); font-size: var(--fs-sm); }
.toast.erro { background: var(--critico); }
.toast.ok { background: var(--ok); }

/* ---------- tela de abertura e login (padrão dos módulos WRD, igual ao WRD Operações) ---------- */
.entrada { min-height: var(--altura-tela); display: flex; align-items: center; justify-content: center; padding: var(--esp-4); background: linear-gradient(160deg, var(--cor-primaria-suave), var(--n-50)); }
.entrada-box { background: var(--n-0); border-radius: var(--raio-lg); box-shadow: var(--sombra-lg); padding: var(--esp-6) var(--esp-5); width: 100%; max-width: var(--largura-entrada); text-align: center; }
.entrada-box form, .entrada-box .grade { text-align: left; }
.entrada-box .grade + .ajuda, .entrada-box .btn-link { margin-top: var(--esp-3); }
.logo-entrada { height: var(--logo-entrada); margin-bottom: var(--esp-2); }
.entrada h1 { margin: 0 0 var(--esp-2); font-size: var(--fs-xl); color: var(--cor-primaria-escura); }
.btn-grande { min-height: var(--altura-controle-lg); font-size: var(--fs-lg); width: 100%; }

/* ---------- documento (relatório) ---------- */
.doc { background: var(--n-0); color: var(--n-900); max-width: var(--doc-largura); margin: 0 auto; padding: var(--doc-pad); border: var(--borda) solid var(--n-200); box-shadow: var(--sombra); font-size: var(--doc-fs); }
.doc-cab { display: grid; grid-template-columns: auto 1fr auto; gap: var(--esp-4); align-items: center; border-bottom: var(--borda-aba) solid var(--cor-primaria); padding-bottom: var(--esp-3); margin-bottom: var(--esp-3); }
.doc-cab img { height: var(--logo-doc); }
.doc-tit { font-size: var(--doc-fs-titulo); font-weight: var(--peso-forte); color: var(--cor-primaria-escura); }
.doc-subtit { color: var(--n-500); font-size: var(--doc-fs-sub); }
.doc-meta { border-collapse: collapse; font-size: var(--doc-fs-tabela); }
.doc-meta th { text-align: right; color: var(--n-500); font-weight: var(--peso-normal); padding: var(--esp-px) var(--esp-2); }
.doc-meta td { font-weight: var(--peso-medio); padding: var(--esp-px) 0; }
.doc-filtros { background: var(--n-50); border: var(--borda) solid var(--n-200); border-radius: var(--raio-sm); padding: var(--esp-2) var(--esp-3); font-size: var(--doc-fs-tabela); margin-bottom: var(--esp-3); }
.doc h3 { font-size: var(--doc-fs-secao); color: var(--cor-primaria-escura); margin: var(--esp-4) 0 var(--esp-2); border-left: var(--borda-destaque) solid var(--cor-primaria); padding-left: var(--esp-2); }
.doc table { width: 100%; border-collapse: collapse; font-size: var(--doc-fs-tabela); }
.doc table.larga { font-size: var(--doc-fs-larga); }
.doc th { background: var(--cor-primaria); color: var(--n-0); text-align: left; padding: var(--esp-1) var(--esp-1-5); font-weight: var(--peso-medio); }
.doc td { padding: var(--esp-xs) var(--esp-1-5); border-bottom: var(--borda) solid var(--n-200); }
.doc tbody tr:nth-child(even) td { background: var(--n-50); }
.doc tfoot td { font-weight: var(--peso-forte); border-top: var(--borda-forte) solid var(--cor-primaria); background: var(--cor-primaria-suave); }
.doc .doc-notas { margin-top: var(--esp-4); font-size: var(--fs-2xs); color: var(--n-700); border-top: var(--borda) solid var(--n-200); padding-top: var(--esp-2); }
.doc .doc-notas p { margin: var(--esp-0) 0; }
.doc-rod { margin-top: var(--esp-4); border-top: var(--borda) solid var(--n-300); padding-top: var(--esp-2); font-size: var(--doc-fs-larga); color: var(--n-500); display: flex; justify-content: space-between; gap: var(--esp-3); }
.doc .assin { margin-top: var(--esp-6); display: flex; justify-content: flex-end; }
.doc .assin div { border-top: var(--borda) solid var(--n-700); min-width: var(--largura-assinatura); text-align: center; padding-top: var(--esp-1); font-size: var(--doc-fs-tabela); }
#area-impressao { display: none; }
.cab-impressao { display: none; align-items: center; gap: var(--esp-4); border-bottom: var(--borda-aba) solid var(--cor-primaria); padding-bottom: var(--esp-2); margin-bottom: var(--esp-3); font-size: var(--fs-sm); color: var(--n-700); }
.cab-impressao img { height: var(--logo-impressao); }
.cab-impressao b { color: var(--cor-primaria-escura); font-size: var(--fs-lg); display: block; }

/* ---------- responsivo ---------- */
@media screen and (max-width: 760px) {
  .topo .modulo, .topo .usuario span { display: none; }
  .topo img { height: var(--logo-topo-celular); }
  .nav { top: var(--altura-topo-celular); }
  main { padding: var(--esp-2) var(--esp-3) var(--esp-6); }
  .acoes-rapidas { padding: var(--esp-2) var(--esp-3) 0; display: grid; grid-template-columns: repeat(2, 1fr); }
  .g2, .g3, .g4 { grid-template-columns: minmax(0, 1fr); }
  .span2 { grid-column: auto; }
  .filtros { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .filtros .busca { grid-column: span 2; }
  .so-desktop { display: none !important; }
  .filtros-mais { display: block; grid-column: 1 / -1; }
  .filtros-mais > summary { display: list-item; cursor: pointer; color: var(--cor-primaria); font-weight: var(--peso-medio); font-size: var(--fs-sm); padding: var(--esp-1) 0; }
  .filtros-mais-in { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--esp-2); margin-top: var(--esp-2); }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--esp-2); }
  .kpi { padding: var(--esp-2) var(--esp-3); }
  .kpi .val { font-size: var(--fs-lg); }
  .modal-fundo { padding: 0; }
  .modal, .modal.largo, .modal.estreito { max-width: none; min-height: var(--altura-tela); border-radius: 0; }
  .modal-rod { position: sticky; bottom: 0; border-radius: 0; }
  table.resp thead { display: none; }
  table.resp, table.resp tbody, table.resp tr, table.resp td, table.resp tfoot { display: block; width: 100%; }
  table.resp tr { border-bottom: var(--borda) solid var(--n-200); padding: var(--esp-2) 0; }
  table.resp td { border: 0; padding: var(--esp-0) var(--esp-3); display: flex; justify-content: space-between; gap: var(--esp-3); text-align: right; }
  table.resp td::before { content: attr(data-l); color: var(--n-500); font-weight: var(--peso-medio); text-align: left; flex-shrink: 0; }
  table.resp td.acoes { justify-content: flex-end; }
  table.resp td.acoes::before { content: none; }
  table.resp td.vazio { justify-content: center; }
  table.resp td.vazio::before { content: none; }
  .doc { padding: var(--esp-3); font-size: var(--fs-impressao); }
  .doc-cab { grid-template-columns: 1fr; }
  .tabela-wrap.doc-tab { overflow-x: auto; }
}

/* ---------- impressão A4 ---------- */
@page { size: A4; margin: 14mm 12mm 16mm 12mm;
  @bottom-right { content: "Página " counter(page) " de " counter(pages); font-size: 8pt; }
  @bottom-left { content: "WRD Soluções · Módulo Financeiro"; font-size: 8pt; }
}
@media print {
  body { background: var(--n-0); font-size: var(--fs-impressao); }
  .topo, .nav, .acoes-rapidas, .faixa-aviso, .toasts, .modal-fundo, .filtros, .no-print, .btn, .sub-abas { display: none !important; }
  .faixa-demo { display: block !important; }
  main { padding: 0; max-width: none; }
  .cartao { box-shadow: none; border: var(--borda) solid var(--n-300); }
  .kpi, .conta-card, .grafico svg, .grade.g2 > .cartao { break-inside: avoid; }
  .cab-impressao { display: flex !important; }
  .tabela-wrap { overflow: visible; border: 0; }
  table.tab th { position: static; }
  tr { break-inside: avoid; }
  thead { display: table-header-group; }
  body.imprimindo-doc > *:not(#area-impressao) { display: none !important; }
  body.imprimindo-doc #area-impressao { display: block; }
  #area-impressao .doc { border: 0; box-shadow: none; padding: 0; max-width: none; font-size: var(--doc-fs-impressao); }
  .doc .tabela-wrap { overflow: visible !important; border: 0; }
  .doc table { font-size: var(--doc-fs-larga); }
  .doc table.larga { font-size: var(--doc-fs-larga-impressao); }
  .doc table.larga th, .doc table.larga td { padding: var(--esp-xs) var(--esp-xs); }
  .doc .assin { break-inside: avoid; margin-top: var(--esp-5); }
  .doc th { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .doc tfoot td, .doc tbody tr:nth-child(even) td, .doc-filtros, .etq, .st, .kpi { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}

/* ---------- utilitários (substituem estilos inline do JS; !important reproduz a precedência do inline) ---------- */
.u-m0 { margin: 0 !important; }
.u-mt0 { margin-top: 0 !important; }
.u-mt1 { margin: var(--esp-1) 0 0 !important; }
.u-mt15 { margin-top: var(--esp-1-5) !important; }
.u-mt2 { margin: var(--esp-2) 0 0 !important; }
.u-mt3 { margin-top: var(--esp-3) !important; }
.u-fs-md { font-size: var(--fs-md) !important; }
.u-fs-lg { font-size: var(--fs-lg) !important; }
.u-check { flex-direction: row !important; gap: var(--esp-1-5) !important; align-items: center !important; }
.u-nowrap { flex-wrap: nowrap !important; }
.u-pre { white-space: pre-wrap !important; }
.u-codigo { white-space: pre-wrap !important; background: var(--n-50) !important; padding: var(--esp-3) !important; border-radius: var(--raio) !important; margin: 0 !important; }
.u-centro { text-align: center !important; }
.u-muted { color: var(--n-500) !important; }
.u-recuo { padding-left: var(--recuo-lista) !important; }
.u-texto-longo { min-height: var(--altura-texto-longo) !important; }
.u-pagina { max-width: var(--largura-max) !important; margin: 0 auto !important; }
.u-filtros-periodo { grid-template-columns: repeat(auto-fill, minmax(var(--min-filtro-periodo), 1fr)) !important; }
.u-span-tudo { grid-column: 1 / -1 !important; }
.u-fill-saida { fill: var(--saida) !important; }
.u-fill-entrada { fill: var(--entrada) !important; }
.u-fill-sec-clara { fill: var(--cor-secundaria-clara) !important; }
.u-fill-pri-clara { fill: var(--cor-primaria-clara) !important; }
.u-link { cursor: pointer !important; color: var(--cor-primaria) !important; }
.u-sem-borda { border: 0 !important; }

/* Método PRIME — quatro cortes do faturamento (destaque) */
.prime-bloco { border: 2px solid var(--cor-primaria); background: linear-gradient(180deg, var(--cor-primaria-suave), var(--n-0) 60%); }
.prime-selo { display: inline-block; background: var(--cor-primaria-escura); color: #fff; font-size: var(--fs-xs); font-weight: var(--peso-forte); letter-spacing: .12em; padding: 3px 9px; border-radius: 999px; margin-right: var(--esp-2); vertical-align: middle; }
.prime-faturamento { font-size: var(--fs-md); margin: var(--esp-1) 0 var(--esp-3); }
.prime-grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: var(--esp-3); margin-bottom: var(--esp-3); }
.prime-corte { background: var(--n-0); border: var(--borda) solid var(--n-200); border-radius: var(--raio-lg); padding: var(--esp-3); display: flex; flex-direction: column; gap: var(--esp-1); }
.prime-rot { font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: var(--ls-lg); color: var(--n-500); }
.prime-nome { font-weight: var(--peso-forte); color: var(--cor-primaria-escura); }
.prime-val { font-size: var(--fs-xl); font-weight: var(--peso-forte); }
.prime-regra { font-size: var(--fs-xs); color: var(--n-500); }
.prime-uso { display: flex; flex-direction: column; gap: 2px; font-size: var(--fs-xs); border-top: var(--borda) solid var(--n-200); padding-top: var(--esp-1); margin-top: var(--esp-1); }
.prime-uso.dentro span:last-child { color: var(--ok); }
.prime-uso.acima span:last-child { color: var(--critico); font-weight: var(--peso-forte); }
.prime-val { text-align: left; }

</style>

<script>
/* =====================================================================

   - Mesclagem: registros (listas com id) pelo mais recente (updatedAt); contadores pelo maior valor;

   A chave abaixo é a chave PUBLICÁVEL do projeto (feita para ficar no navegador); a proteção é feita pelas regras do banco.

const WRDNuvem = (function () {
  'use strict';
  const CONFIG = { url: 'https://dqaejvkfudewwudghezp.supabase.co', chave: 'sb_publishable_CpC0CZAsU_yDqxvtRgUdsQ_vD9r-pWQ', projeto: 'WRD Sistemas' };

    CONFLITO: 'Os dados mudaram em outro aparelho.'

  /* ---------- cliente REST (Auth + PostgREST), sem biblioteca externa ---------- */
  function cliente(o) {
    const modulo = o.modulo, guarda = o.guarda, guardaSessao = o.guardaSessao || o.guarda, f = o.fetchFn || ((...a) => fetch(...a)), agora = o.agora || (() => Date.now());
    let sessao = null; try { sessao = JSON.parse(guardaSessao.get('nuvem.sessao') || 'null'); } catch (e) { sessao = null; }
    const gravarSessao = s => { sessao = s; if (s) guardaSessao.set('nuvem.sessao', JSON.stringify(s)); else guardaSessao.remove('nuvem.sessao'); };
    const deResposta = j => ({ access_token: j.access_token, refresh_token: j.refresh_token, expires_at: j.expires_at ? j.expires_at * 1000 : agora() + (j.expires_in || 3600) * 1000, user: { id: j.user && j.user.id, email: j.user && j.user.email } });
    async function http(caminho, opc, autenticar) {

      if (autenticar) { await garantirToken(); h.Authorization = 'Bearer ' + sessao.access_token; }
      let r;
      try { r = await f(CONFIG.url + caminho, Object.assign({ headers: h }, opc)); } catch (e) { throw erro('Sem conexão com a nuvem.', 'OFFLINE'); }
      const txt = await r.text(); let j = null; try { j = txt ? JSON.parse(txt) : null; } catch (e) { j = txt; }
      if (!r.ok) {

        return http('/rest/v1/eventos', { method: 'POST', headers: { Prefer: 'return=minimal' }, body: JSON.stringify({ tipo, modulo, entidade_id: entidadeId ? String(entidadeId) : null, payload: payload || {}, criado_por: uid }) }, true);

      async adicionarMembro(email, papel) { return http('/rest/v1/rpc/adicionar_membro', { method: 'POST', body: JSON.stringify({ p_email: email, p_modulo: modulo, p_papel: papel || 'membro' }) }, true); }
    };
  }

  /* ---------- mesclagem de dois estados do mesmo módulo ---------- */
  function mesclarValor(L, R, chave, localMaisNovo) {
    if (Array.isArray(L) && Array.isArray(R) && L.concat(R).every(x => ehObj(x) && x.id != null)) {
      const m = new Map(R.map(x => [x.id, x]));
      for (const x of L) { const y = m.get(x.id); if (!y || carimbo(x) > carimbo(y)) m.set(x.id, x); }
      return [...m.values()];
    }
    if (ehObj(L) && ehObj(R)) {
      const out = {};
      for (const k of new Set([...Object.keys(R), ...Object.keys(L)])) out[k] = k in L ? (k in R ? mesclarValor(L[k], R[k], k, localMaisNovo) : L[k]) : R[k];
      if (/^(seq|contadores|sequencias)$/.test(chave)) for (const k of Object.keys(out)) if (typeof L[k] === 'number' && typeof R[k] === 'number') out[k] = Math.max(L[k], R[k]);
      return out;
    }
    if (chave === 'ultimoOficial' && /^\d+$/.test(L) && /^\d+$/.test(R)) return String(Math.max(+L, +R));
    return localMaisNovo ? L : R;
  }
  /** Junta o estado local (com alterações ainda não enviadas) e o remoto. */
  function mesclar(local, remoto) {
    if (!remoto) return clone(local);
    if (!local) return clone(remoto);
    const out = mesclarValor(clone(local), clone(remoto), '', carimbo(local) > carimbo(remoto));
    out.updatedAt = [carimbo(local), carimbo(remoto)].sort().pop() || out.updatedAt;
    return out;
  }

  /* ---------- sincronizador: estado local (localStorage) <-> nuvem ---------- */
  function sincronizador(o) {
    const cli = o.cliente, local = o.local, aparelho = o.aparelho || '', avisar = o.aoStatus || (() => {}), recarregar = o.aoRecarregar || (() => {});
    const lerMeta = () => { try { return JSON.parse(local.get('nuvem.meta') || 'null') || { versao: 0, pendente: false }; } catch (e) { return { versao: 0, pendente: false }; } };
    const gravarMeta = m => local.set('nuvem.meta', JSON.stringify(m));
    let meta = lerMeta(), enviando = null, geracao = 0, tmr = null, repetir = null, ultimo = null;
    const status = (s, extra) => { const st = Object.assign({ situacao: s, pendente: meta.pendente, versao: meta.versao, ultimo }, extra || {}); avisar(st); return st; };
    const estadoLocal = () => { const r = local.get('state'); return r ? JSON.parse(r) : null; };
    async function puxar() {
      if (enviando) await enviando.catch(() => {});
      status('sincronizando');
      let r; try { r = await cli.ler(); } catch (e) { return falha(e); }
      meta = lerMeta();
      const loc = estadoLocal();
      if (!r) { if (loc) { meta.pendente = true; gravarMeta(meta); return enviar(); } ultimo = new Date(); return status('ok'); }
      if (r.versao === meta.versao) { if (meta.pendente) return enviar(); ultimo = new Date(); return status('ok'); }
      // primeiro uso deste aparelho com dados já guardados nele: junta, nunca substitui
      if (meta.versao === 0 && loc) meta.pendente = true;
      if (!meta.pendente || !loc) {
        local.set('state', JSON.stringify(r.dados)); meta = { versao: r.versao, pendente: false }; gravarMeta(meta); ultimo = new Date();
        recarregar({ origem: r.aparelho || '', atualizadoEm: r.atualizado_em }); return status('ok', { recebido: true });
      }
      local.set('state', JSON.stringify(mesclar(loc, r.dados))); meta = { versao: r.versao, pendente: true }; gravarMeta(meta);
      recarregar({ mesclado: true }); return enviar();
    }
    // Dentro do painel integrado, avisa que a nuvem mudou para o painel atualizar os indicadores.
    function avisarPainel() { try { if (window.parent && window.parent !== window) window.parent.postMessage({ wrd: 'nuvem', modulo: cli.modulo }, '*'); } catch (e) { /* sem painel */ } }
    async function enviar() {
      if (enviando) return enviando;
      const g = geracao, dados = estadoLocal();
      if (!dados || !meta.pendente) return status('ok');
      status('enviando');
      enviando = (async () => {
        try {
          const v = await cli.salvar(dados, meta.versao, aparelho);
          meta = { versao: v, pendente: g !== geracao }; gravarMeta(meta); ultimo = new Date(); enviando = null;
          if (meta.pendente) return enviar();
          avisarPainel();
          return status('ok');
        } catch (e) {
          enviando = null;
          if (e.code === 'CONFLITO') return puxar();
          return falha(e);
        }
      })();
      return enviando;
    }
    function falha(e) {
      clearTimeout(repetir);
      if (e.code === 'OFFLINE' || e.code === 'NUVEM') repetir = setTimeout(() => (meta.pendente ? enviar() : puxar()), 30000);
      return status(e.code === 'OFFLINE' ? 'offline' : 'erro', { erro: e.message, code: e.code });
    }
    return {
      puxar, enviar,
      /** Chamado a cada gravação local do módulo. */
      marcarAlteracao() { geracao++; meta.pendente = true; gravarMeta(meta); status('pendente'); clearTimeout(tmr); tmr = setTimeout(() => enviar(), o.atraso == null ? 1500 : o.atraso); },
      atualizar() { return meta.pendente ? enviar() : puxar(); },
      situacao: () => ({ pendente: meta.pendente, versao: meta.versao, ultimo })
    };
  }

  /* ---------- integração com a tela (navegador): entrada na nuvem, botão Atualizar e aba "Nuvem e aparelhos" ----------
     O módulo informa: modulo, titulo, nomeModulo, ns, logo, storageReal() (adaptador local dos dados reais),

  }

  return { CONFIG, cliente, sincronizador, mesclar, integrar, MSG };
})();

<script>
/* Método PRIME: os quatro cortes de todo faturamento.
   Cálculo único, usado pelo painel e pelo Financeiro, para que os dois mostrem sempre os mesmos números.
   Valores em centavos (inteiros). Faturamento = principal recebido no mês (títulos a receber, baixas não estornadas).
   Uso: QuadroPrime.calcular({ titulos, baixas, movimentosSocios }, 'AAAA-MM') */
(function (g) {
  'use strict';
  const CORTES = [
    { id: 'lucro', rotulo: 'Lucro da empresa', pct: 10, tipo: 'reserva', regra: 'Separado e intocável. É o lucro da empresa.' },
    { id: 'prolabore', rotulo: 'Pró-labore', pct: 50, tipo: 'teto', regra: 'Teto para a retirada do seu trabalho no próprio negócio.' },
    { id: 'impostos', rotulo: 'Impostos', pct: 18, tipo: 'reserva', regra: 'Reserva para impostos. Esse dinheiro nunca foi seu.' },
    { id: 'operacao', rotulo: 'Operação', pct: 22, tipo: 'teto', regra: 'Máximo para rodar a operação: fornecedores, ferramentas e estrutura.' }
  ];

  function calcular(dados, mes) {
    const titulos = new Map((dados.titulos || []).map(t => [t.id, t]));
    let faturamento = 0, operacaoGasta = 0, prolaboreRetirado = 0;
    // Mesma regra de movimentos() do Financeiro: pagamento de título a pagar e tarifa separada entram como despesa.
    for (const b of dados.baixas || []) {
      if (b.estornada || !b.data || b.data.slice(0, 7) !== mes) continue;
      const t = titulos.get(b.tituloId);
      if (!t) continue;
      if (t.tipo === 'receber') faturamento += Number(b.principal || 0);
      else operacaoGasta += Number(b.valorEfetivo || 0);
      if (b.taxaSeparada) operacaoGasta += Number(b.taxaSeparada);
    }
    for (const m of dados.movimentosSocios || []) {
      if (!m.estornado && m.tipo === 'retirada' && m.data && m.data.slice(0, 7) === mes) prolaboreRetirado += Number(m.valor || 0);
    }
    const cortes = CORTES.map(c => {
      const valor = Math.round(faturamento * c.pct / 100);
      const realizado = c.id === 'operacao' ? operacaoGasta : c.id === 'prolabore' ? prolaboreRetirado : null;
      return Object.assign({}, c, {
        valor,
        realizado,
        saldo: realizado === null ? null : valor - realizado,
        situacao: realizado === null ? null : (realizado > valor ? 'acima' : 'dentro')
      });
    });
    return {
      mes,
      faturamento,
      cortes,
      // Comparação com a conta tradicional: faturamento − despesas pagas. Ali o lucro é o que sobra por último.
      tradicional: { despesasPagas: operacaoGasta, lucroSobra: faturamento - operacaoGasta },
      prime: { lucroSeparado: cortes[0].valor }
    };
  }

  g.QuadroPrime = { CORTES, calcular };
  if (typeof module !== 'undefined' && module.exports) module.exports = g.QuadroPrime;
})(typeof window !== 'undefined' ? window : globalThis);

</script>

    { area: 'Anexos em lote', regra: 'Tamanho máximo de 25 MB por PDF, apenas arquivos .pdf; o link do arquivo é temporário (1 hora).', fonte: 'Definido pelo executor (limite de tamanho do armazenamento do bucket; plano gratuito não conferido)', status: 'HIPÓTESE' },

    { area: 'Anexos em lote', regra: 'O registro sugerido pelo nome do arquivo usa o código ou o número de proposta/nota fiscal que aparece no nome; a escolha final é sempre do usuário.', fonte: 'Definido pelo executor', status: 'A VALIDAR' }
  ];
  const FORMAS_PAGAMENTO = ['PIX','Boleto', 'Transferência', 'Cartão de crédito', 'Cartão de débito', 'Dinheiro', 'Cheque', 'Débito automático', 'Outra'];

  /* =================================================================== */
  function createCore(opts) {
    const storage = opts.storage;
    const sessStore = opts.sessionStore || null;
    const clock = opts.clock || (() => new Date());
    const demo = !!opts.demo;
    const listeners = {};
    let pend = [];
    let ver = 0, cache = { ver: -1 };
    const nowISO = () => clock().toISOString();

    function emptyState() {
      const ts = nowISO();
      return {
        schemaVersion: SCHEMA_VERSION, modulo: MODULO_ID, demo, createdAt: ts, updatedAt: ts,
        config: { empresa: 'WRD Soluções', cnpj: '', timezone: 'America/Sao_Paulo', responsavel: '', seqRelatorio: 0, modoTaxa: 'liquido', inicioRelatorio: 600001, seqRelatorioNum: 0, relatoriosEmitidos: {} },
        users: [], contas: [], pessoas: [], projetos: [],
        categorias: CATEGORIAS_INICIAIS.map(([id, tipo, nome]) => ({ id, tipo, nome, ativa: true, createdAt: ts, updatedAt: ts, schemaVersion: SCHEMA_VERSION })),
        titulos: [], baixas: [], transferencias: [], movimentosSocios: [], recorrencias: [], historico: []
      };
    }

    function validarEstrutura(s) {
      if (!s || typeof s !== 'object') fail('Arquivo inválido: não é um objeto JSON.');
      if (s.modulo !== MODULO_ID) fail('Arquivo inválido: não pertence ao Módulo Financeiro WRD.');
      if (typeof s.schemaVersion !== 'number' || s.schemaVersion > SCHEMA_VERSION) fail(`Versão de dados não suportada (${s.schemaVersion}). Este módulo lê até a versão ${SCHEMA_VERSION}.`);
      for (const k of ['contas', 'pessoas', 'projetos', 'categorias', 'titulos', 'baixas', 'transferencias', 'movimentosSocios', 'historico']) {
        if (!Array.isArray(s[k])) fail(`Arquivo inválido: falta a lista "${k}".`);
      }
      s.users = Array.isArray(s.users) ? s.users : [];
      s.recorrencias = Array.isArray(s.recorrencias) ? s.recorrencias : [];
      s.config = Object.assign(emptyState().config, s.config || {});
      if (!s.config.relatoriosEmitidos || typeof s.config.relatoriosEmitidos !== 'object') s.config.relatoriosEmitidos = {};
      return s;
    }

    function load() {
      const raw = storage.get('state');
      if (!raw) return emptyState();
      let s;
      try { s = JSON.parse(raw); } catch (e) { fail('Os dados salvos neste navegador estão corrompidos e não puderam ser lidos.', 'CORROMPIDO'); }
      return validarEstrutura(s);
    }

    let state = load();
    let session = null;

    /* ---------- eventos ---------- */
    function on(evt, fn) { (listeners[evt] = listeners[evt] || []).push(fn); return () => { listeners[evt] = (listeners[evt] || []).filter(f => f !== fn); }; }
    function emit(evt, payload) {
      [...(listeners[evt] || []), ...(evt !== 'change' ? (listeners['*'] || []) : [])].forEach(fn => { try { fn(payload, evt); } catch (e) { console.error(e); } });
    }

    /* ---------- transação: tudo ou nada ---------- */
    function mutate(fn) {
      const snap = JSON.stringify(state);
      pend = []; ver++;
      try {
        const r = fn();
        state.updatedAt = nowISO();
        storage.set('state', JSON.stringify(state));
        ver++;
        const ev = pend; pend = [];
        ev.forEach(([e, p]) => emit(e, p));
        emit('change', {});
        return r;
      } catch (e) {
        state = JSON.parse(snap); pend = []; ver++;
        if (e && (e.name === 'QuotaExceededError' || e.code === 22 || e.name === 'NS_ERROR_DOM_QUOTA_REACHED')) {
          throw AppError('O espaço de armazenamento do navegador acabou. Exporte um backup e remova anexos grandes.', 'ARMAZENAMENTO');
        }
        throw e;
      }
    }
    const queue = (evt, payload) => pend.push([evt, payload]);

    function stamp(obj, prefix) {
      const ts = nowISO();
      return Object.assign({ id: uid(prefix), createdAt: ts, updatedAt: ts, schemaVersion: SCHEMA_VERSION }, obj);
    }

    function idx() {
      if (cache.ver === ver) return cache;
      const pagoPor = new Map(), baixasPor = new Map(), by = {};
      for (const b of state.baixas) {
        if (!baixasPor.has(b.tituloId)) baixasPor.set(b.tituloId, []);
        baixasPor.get(b.tituloId).push(b);
        if (!b.estornada) pagoPor.set(b.tituloId, (pagoPor.get(b.tituloId) || 0) + b.principal);
      }
      for (const k of ['pessoas', 'categorias', 'contas', 'projetos', 'titulos', 'users', 'baixas', 'transferencias', 'movimentosSocios']) by[k] = new Map(state[k].map(x => [x.id, x]));
      cache = { ver, pagoPor, baixasPor, by };
      return cache;
    }
    const byId = (coll, id) => (id ? idx().by[coll].get(id) || null : null);

    function hoje() { return Dates.hojeEm(state.config.timezone || 'America/Sao_Paulo', clock()); }

    /* ---------- autenticação e permissões ---------- */
    function hashSenha(salt, senha) { let h = salt + ':' + senha; for (let i = 0; i < 500; i++) h = sha256(h + ':' + salt); return h; }
    function restoreSession() {
      if (!sessStore) return null;
      try {
        const s = JSON.parse(sessStore.get('session') || 'null');
        if (!s) return null;
        const u = state.users.find(x => x.id === s.userId && x.ativo);
        return u ? { userId: u.id, nome: u.nome, login: u.login, perfil: u.perfil, inicio: s.inicio } : null;
      } catch (e) { return null; }
    }
    session = restoreSession();

    function user() {
      if (!session) return null;
      const u = state.users.find(x => x.id === session.userId && x.ativo);
      if (!u) { session = null; return null; }
      session.perfil = u.perfil; session.nome = u.nome;
      return Object.assign({}, session, { perfilRotulo: PERFIS[u.perfil].rotulo });
    }
    function can(acao) {
      const u = user(); if (!u) return false;
      const p = PERFIS[u.perfil]; if (!p) return false;
      return p.acoes === '*' || p.acoes.includes(acao);
    }
    function guard(acao) {
      const u = user();
      if (!u) fail('Acesso negado: faça login para continuar.', 'AUTH');
      if (!can(acao)) fail(`Acesso negado: o perfil "${PERFIS[u.perfil].rotulo}" não permite esta ação.`, 'PERMISSAO');
      return u;
    }
    function log(acao, entidade, entidadeId, detalhe) {
      const u = user();
      state.historico.push({ id: uid('hist'), ts: nowISO(), usuario: u ? u.login : 'sistema', usuarioNome: u ? u.nome : 'Sistema', acao, entidade, entidadeId: entidadeId || null, detalhe: detalhe || '', schemaVersion: SCHEMA_VERSION, createdAt: nowISO(), updatedAt: nowISO() });
    }

    function validarUsuario(d, existente) {
      const nome = String(d.nome || '').trim(), login = norm(d.login).replace(/\s/g, '');
      if (!nome) fail('Informe o nome do usuário.');
      if (!/^[a-z0-9._-]{3,30}$/.test(login)) fail('Login deve ter de 3 a 30 caracteres: letras, números, ponto, hífen ou sublinhado.');
      if (state.users.some(u => u.login === login && (!existente || u.id !== existente.id))) fail('Já existe um usuário com este login.');
      if (!PERFIS[d.perfil]) fail('Perfil inválido.');
      if (!existente || d.senha) { if (String(d.senha || '').length < 6) fail('A senha deve ter pelo menos 6 caracteres.'); }
      return { nome, login };
    }
    function hasUsers() { return state.users.some(u => u.ativo); }
    function setupAdmin(d) {
      if (state.users.length) fail('O administrador inicial já foi criado. Faça login.');
      const { nome, login: lg } = validarUsuario(Object.assign({}, d, { perfil: 'admin' }));
      const salt = uid('s');
      const u = stamp({ nome, login: lg, perfil: 'admin', email: String(d.email || '').trim(), salt, hash: hashSenha(salt, d.senha), ativo: true }, 'usr');
      // grava antes do login para que o histórico tenha o autor
      state.users.push(u);
      session = { userId: u.id, nome: u.nome, login: u.login, perfil: u.perfil, inicio: nowISO() };
      try {
        mutate(() => log('usuario.criado', 'usuario', u.id, `Administrador inicial "${lg}" criado.`));
      } catch (e) { state.users = state.users.filter(x => x.id !== u.id); session = null; throw e; }
      if (sessStore) sessStore.set('session', JSON.stringify(session));
      return user();
    }
    function login(lg, senha) {
      const u = state.users.find(x => x.login === norm(lg).replace(/\s/g, '') && x.ativo);
      if (!u || hashSenha(u.salt, String(senha || '')) !== u.hash) fail('Usuário ou senha inválidos.', 'AUTH');
      session = { userId: u.id, nome: u.nome, login: u.login, perfil: u.perfil, inicio: nowISO() };
      if (sessStore) sessStore.set('session', JSON.stringify(session));
      return user();
    }
    function logout() { session = null; if (sessStore) sessStore.remove('session'); }
    /** Só na DEMONSTRAÇÃO (dados fictícios, armazenamento separado): entrar escolhendo o perfil, sem senha gravada no código. */
    function usuariosDemo() { if (!demo) fail('Disponível só na demonstração.', 'PERMISSAO'); return state.users.filter(u => u.ativo).map(u => ({ login: u.login, nome: u.nome, perfil: PERFIS[u.perfil].rotulo })); }
    function entrarDemo(lg) {
      if (!demo) fail('Entrada sem senha só existe na demonstração.', 'PERMISSAO');
      const u = state.users.find(x => x.login === lg && x.ativo); if (!u) fail('Usuário de demonstração não encontrado.', 'AUTH');
      session = { userId: u.id, nome: u.nome, login: u.login, perfil: u.perfil, inicio: nowISO() };
      if (sessStore) sessStore.set('session', JSON.stringify(session));
      return user();
    }
    /** Entrada pela conta da nuvem: quem entrou no painel com o e-mail de um perfil deste módulo entra direto, sem nova senha. Só no modo real. Se o módulo tiver um único perfil ativo, ele é usado. */
    function entrarPelaNuvem(email) {
      if (demo) fail('Entrada pela nuvem só existe no modo real.', 'PERMISSAO');
      const e = String(email || '').trim().toLowerCase();
      const ativos = state.users.filter(x => x.ativo);
      const u = (e && ativos.find(x => String(x.email || '').trim().toLowerCase() === e)) || (ativos.length === 1 ? ativos[0] : null);
      if (!u) fail('Nenhum perfil deste módulo tem o e-mail da sua conta. Informe o e-mail no perfil em Configurações › Usuários.', 'AUTH');
      session = { userId: u.id, inicio: nowISO() }; if (sessStore) sessStore.set('session', JSON.stringify(session)); return user();
    }
    function listarUsuarios() { guard('usuario.salvar'); return state.users.map(u => ({ id: u.id, nome: u.nome, login: u.login, perfil: u.perfil, ativo: u.ativo, createdAt: u.createdAt, updatedAt: u.updatedAt })); }
    function salvarUsuario(d) {
      guard('usuario.salvar');
      const ex = d.id ? state.users.find(u => u.id === d.id) : null;
      if (d.id && !ex) fail('Usuário não encontrado.');
      const { nome, login: lg } = validarUsuario(d, ex);
      const ativo = d.ativo !== false;
      const adminsAtivos = state.users.filter(u => u.perfil === 'admin' && u.ativo);
      if (ex && ex.perfil === 'admin' && ex.ativo && (d.perfil !== 'admin' || !ativo) && adminsAtivos.length <= 1) fail('É preciso manter pelo menos um administrador ativo.');
      return mutate(() => {
        if (ex) {
          const mud = [];
          if (ex.nome !== nome) mud.push('nome'); if (ex.login !== lg) mud.push('login'); if (ex.perfil !== d.perfil) mud.push(`perfil ${ex.perfil}→${d.perfil}`); if (ex.ativo !== ativo) mud.push(ativo ? 'reativado' : 'inativado');
          Object.assign(ex, { nome, login: lg, perfil: d.perfil, ativo, updatedAt: nowISO() });
          if (d.senha) { ex.salt = uid('s'); ex.hash = hashSenha(ex.salt, d.senha); mud.push('senha redefinida'); }
          log('usuario.atualizado', 'usuario', ex.id, `Usuário "${lg}": ${mud.join(', ') || 'sem mudanças'}.`);
          return { id: ex.id };
        }
        const salt = uid('s');
        const u = stamp({ nome, login: lg, perfil: d.perfil, salt, hash: hashSenha(salt, d.senha), ativo }, 'usr');
        state.users.push(u);
        log('usuario.criado', 'usuario', u.id, `Usuário "${lg}" (${PERFIS[d.perfil].rotulo}) criado.`);
        return { id: u.id };
      });
    }
    function alterarSenha(atual, nova) {
      const s = guard('senha.propria');
      const u = state.users.find(x => x.id === s.userId);
      if (hashSenha(u.salt, String(atual || '')) !== u.hash) fail('Senha atual incorreta.');
      if (String(nova || '').length < 6) fail('A nova senha deve ter pelo menos 6 caracteres.');
      mutate(() => { u.salt = uid('s'); u.hash = hashSenha(u.salt, nova); u.updatedAt = nowISO(); log('usuario.senha', 'usuario', u.id, 'Senha alterada pelo próprio usuário.'); });
    }

    /* ---------- configuração ---------- */
    function salvarConfig(d) {
      guard('config.salvar');
      if (d.modoTaxa !== undefined && !MODOS_TAXA[d.modoTaxa]) fail('Modo de tratamento da taxa inválido.');
      const inicio = parseInt(d.inicioRelatorio, 10);
      if (d.inicioRelatorio !== undefined && d.inicioRelatorio !== '' && !(String(d.inicioRelatorio).trim() === String(inicio) && inicio >= 100000 && inicio <= 999999)) fail('Numeração dos relatórios: informe um número de 6 dígitos.');
      if (d.timezone) { try { new Intl.DateTimeFormat('pt-BR', { timeZone: d.timezone }); } catch (e) { fail('Fuso horário inválido.'); } }
      return mutate(() => {
        const c = state.config;
        ['empresa', 'cnpj', 'timezone', 'responsavel'].forEach(k => { if (d[k] !== undefined) c[k] = String(d[k]).trim(); });
        if (d.modoTaxa !== undefined) c.modoTaxa = d.modoTaxa;
        if (d.inicioRelatorio !== undefined && d.inicioRelatorio !== '') c.inicioRelatorio = inicio;
        if (!c.empresa) c.empresa = 'WRD Soluções';
        log('config.atualizada', 'config', null, 'Configurações gerais alteradas.');
        return Object.assign({}, c);
      });
    }
    /** Número do relatório pela regra de propostas WRD (NNNNNN-R, revisão no sufixo).
     * Mesmo relatório (tipo e filtros) reemitido no mesmo dia mantém o número e sobe a revisão. */
    function emitirNumeroRelatorio(tipo, filtros) {
      guard('relatorio.emitir');
      return mutate(() => {
        const cfg = state.config, reg = cfg.relatoriosEmitidos;
        const assinatura = hoje() + '|' + (tipo || '') + '|' + JSON.stringify(filtros || {});
        let n;
        if (reg[assinatura]) { reg[assinatura].rev++; n = `${reg[assinatura].base}-${reg[assinatura].rev}`; }
        else {
          const usados = new Set(Object.values(reg).map(r => r.base));
          let num = Math.max(cfg.seqRelatorioNum || 0, (cfg.inicioRelatorio || 600001) - 1) + 1;
          while (usados.has(String(num).padStart(6, '0'))) num++;
          if (num > 999999) fail('A numeração dos relatórios chegou a 999999. Ajuste o início em Configurações.');
          cfg.seqRelatorioNum = num;
          const base = String(num).padStart(6, '0');
          reg[assinatura] = { base, rev: 1 }; n = base + '-1';
        }
        log('relatorio.emitido', 'relatorio', n, `Relatório ${n} emitido.`);
        return n;
      });
    }

    /* ---------- cadastros ---------- */
    function salvarPessoa(d, o = {}) {
      guard('pessoa.salvar');
      const nome = String(d.nome || '').trim();
      if (!nome) fail('Informe o nome.');
      if (!['cliente', 'fornecedor', 'ambos'].includes(d.tipo)) fail('Informe se é cliente, fornecedor ou ambos.');
      const ex = d.id ? byId('pessoas', d.id) : null;
      if (d.id && !ex) fail('Cadastro não encontrado.');
      if (!o.confirmar) {
        const doc = soDigitos(d.documento);
        const dup = state.pessoas.find(p => p.id !== d.id && (norm(p.nome) === norm(nome) || (doc && soDigitos(p.documento) === doc)));
        if (dup) fail(`Já existe um cadastro parecido: "${dup.nome}"${dup.documento ? ' (' + dup.documento + ')' : ''}. Salvar mesmo assim?`, 'DUPLICIDADE');
      }
      const campos = { tipo: d.tipo, nome, documento: String(d.documento || '').trim(), contato: String(d.contato || '').trim(), email: String(d.email || '').trim(), telefone: String(d.telefone || '').trim(), obs: String(d.obs || '').trim(), ativo: d.ativo !== false };
      if (campos.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(campos.email)) fail('E-mail inválido.');
      return mutate(() => {
        if (ex) {
          const mud = Object.keys(campos).filter(k => ex[k] !== campos[k]);
          Object.assign(ex, campos, { updatedAt: nowISO() });
          log('pessoa.atualizada', 'pessoa', ex.id, `"${nome}": ${mud.join(', ') || 'sem mudanças'}.`);
          queue('financeiro.pessoa.salva', { id: ex.id, tipo: ex.tipo });
          return ex;
        }
        const p = stamp(campos, 'pes');
        state.pessoas.push(p);
        log('pessoa.criada', 'pessoa', p.id, `"${nome}" (${d.tipo}) cadastrado.`);
        queue('financeiro.pessoa.salva', { id: p.id, tipo: p.tipo });
        return p;
      });
    }

    function salvarProjeto(d, o = {}) {
      guard('projeto.salvar');
      const nome = String(d.nome || '').trim();
      if (!nome) fail('Informe o nome do serviço/projeto.');
      if (d.clienteId && !byId('pessoas', d.clienteId)) fail('Cliente não encontrado.');
      const ex = d.id ? byId('projetos', d.id) : null;
      if (d.id && !ex) fail('Serviço/projeto não encontrado.');
      if (!o.confirmar) {
        const dup = state.projetos.find(p => p.id !== d.id && norm(p.nome) === norm(nome) && (p.clienteId || '') === (d.clienteId || ''));
        if (dup) fail(`Já existe o serviço/projeto "${dup.nome}" para este cliente. Salvar mesmo assim?`, 'DUPLICIDADE');
      }
      const campos = { nome, clienteId: d.clienteId || null, codigo: String(d.codigo || '').trim(), status: ['ativo', 'concluido', 'cancelado'].includes(d.status) ? d.status : 'ativo', descricao: String(d.descricao || '').trim(), ativo: d.ativo !== false };
      return mutate(() => {
        if (ex) {
          const mud = Object.keys(campos).filter(k => ex[k] !== campos[k]);
          Object.assign(ex, campos, { updatedAt: nowISO() });
          log('projeto.atualizado', 'projeto', ex.id, `"${nome}": ${mud.join(', ') || 'sem mudanças'}.`);
          queue('financeiro.projeto.salvo', { id: ex.id });
          return ex;
        }
        const p = stamp(campos, 'prj');
        state.projetos.push(p);
        log('projeto.criado', 'projeto', p.id, `Serviço/projeto "${nome}" cadastrado.`);
        queue('financeiro.projeto.salvo', { id: p.id });
        return p;
      });
    }

    function salvarCategoria(d) {
      guard('categoria.salvar');
      const nome = String(d.nome || '').trim();
      if (!nome) fail('Informe o nome da categoria.');
      if (!['receita', 'despesa'].includes(d.tipo)) fail('Tipo de categoria inválido.');
      const ex = d.id ? byId('categorias', d.id) : null;
      if (d.id && !ex) fail('Categoria não encontrada.');
      if (ex && ex.tipo !== d.tipo && state.titulos.some(t => t.categoriaId === ex.id)) fail('Não é possível trocar o tipo de uma categoria já usada em lançamentos.');
      if (state.categorias.some(c => c.id !== d.id && c.tipo === d.tipo && norm(c.nome) === norm(nome))) fail('Já existe uma categoria com este nome.');
      return mutate(() => {
        if (ex) {
          const antes = `${ex.nome}${ex.ativa ? '' : ' (inativa)'}`;
          Object.assign(ex, { nome, tipo: d.tipo, ativa: d.ativa !== false, updatedAt: nowISO() });
          log('categoria.atualizada', 'categoria', ex.id, `${antes} → ${ex.nome}${ex.ativa ? '' : ' (inativa)'}.`);
          return ex;
        }
        const c = stamp({ nome, tipo: d.tipo, ativa: d.ativa !== false }, 'cat');
        state.categorias.push(c);
        log('categoria.criada', 'categoria', c.id, `Categoria de ${d.tipo} "${nome}" criada.`);
        return c;
      });
    }

    function salvarConta(d) {
      guard('conta.salvar');
      const nome = String(d.nome || '').trim();
      if (!nome) fail('Informe o nome da conta.');
      if (!['banco', 'caixa', 'aplicacao'].includes(d.tipo)) fail('Tipo de conta inválido.');
      if (!Number.isInteger(d.saldoInicial)) fail('Saldo inicial inválido.');
      if (!Dates.valid(d.dataSaldoInicial)) fail('Informe a data do saldo inicial.');
      const ex = d.id ? byId('contas', d.id) : null;
      if (d.id && !ex) fail('Conta não encontrada.');
      if (state.contas.some(c => c.id !== d.id && norm(c.nome) === norm(nome))) fail('Já existe uma conta com este nome.');
      const ativa = d.ativa !== false;
      if (ex) {
        const movs = movimentos({ contaId: ex.id, interno: true });
        const anterior = movs.find(m => m.data < d.dataSaldoInicial);
        if (anterior) fail(`Há movimentação nesta conta em ${Dates.fmt(anterior.data)}, antes da nova data do saldo inicial. Ajuste a data.`);
        if (!ativa && ex.ativa) {
          const s = saldoConta(ex.id);
          if (s) fail(`A conta tem saldo de ${Money.fmt(s)}. Transfira o saldo antes de inativar.`);
        }
      }
      return mutate(() => {
        if (ex) {
          const mud = [];
          if (ex.nome !== nome) mud.push('nome'); if (ex.tipo !== d.tipo) mud.push('tipo');
          if (ex.saldoInicial !== d.saldoInicial) mud.push(`saldo inicial ${Money.fmt(ex.saldoInicial)}→${Money.fmt(d.saldoInicial)}`);
          if (ex.dataSaldoInicial !== d.dataSaldoInicial) mud.push(`data do saldo ${Dates.fmt(ex.dataSaldoInicial)}→${Dates.fmt(d.dataSaldoInicial)}`);
          if (ex.ativa !== ativa) mud.push(ativa ? 'reativada' : 'inativada');
          Object.assign(ex, { nome, tipo: d.tipo, saldoInicial: d.saldoInicial, dataSaldoInicial: d.dataSaldoInicial, ativa, updatedAt: nowISO() });
          log('conta.atualizada', 'conta', ex.id, `Conta "${nome}": ${mud.join(', ') || 'sem mudanças'}.`);
          return ex;
        }
        const c = stamp({ nome, tipo: d.tipo, saldoInicial: d.saldoInicial, dataSaldoInicial: d.dataSaldoInicial, ativa }, 'cta');
        state.contas.push(c);
        log('conta.criada', 'conta', c.id, `Conta "${nome}" criada com saldo inicial de ${Money.fmt(d.saldoInicial)} em ${Dates.fmt(d.dataSaldoInicial)}.`);
        return c;
      });
    }

    /* ---------- títulos (contas a receber / a pagar) ---------- */
    const pago = t => idx().pagoPor.get(t.id) || 0;
    const aberto = t => (t.cancelado ? 0 : Math.max(0, t.valor - pago(t)));
    function status(t, h) {
      h = h || hoje();
      const pg = pago(t), ab = aberto(t);
      const quit = t.tipo === 'receber' ? 'Recebido' : 'Pago';
      if (t.cancelado) return { codigo: 'cancelado', rotulo: 'Cancelado', parcial: false };
      if (ab === 0) return { codigo: 'quitado', rotulo: quit, parcial: false };
      if (t.vencimento < h) return { codigo: 'vencido', rotulo: pg > 0 ? 'Vencido (parcial)' : 'Vencido', parcial: pg > 0 };
      if (pg > 0) return { codigo: 'parcial', rotulo: 'Parcial', parcial: true };
      return { codigo: 'aberto', rotulo: 'Em aberto', parcial: false };
    }
    const clienteDe = t => (t.tipo === 'receber' ? t.pessoaId : (t.clienteId || (byId('projetos', t.projetoId) || {}).clienteId || null));
    const efetivo = b => {
      const t = byId('titulos', b.tituloId);
      return t && t.tipo === 'pagar' ? b.principal + b.juros - b.desconto + b.taxa : b.principal + b.juros - b.desconto - b.taxa;
    };

    function validarTitulo(d, ex) {
      if (!['receber', 'pagar'].includes(d.tipo)) fail('Tipo de lançamento inválido.');
      const rot = d.tipo === 'receber' ? 'cliente' : 'fornecedor ou favorecido';
      const p = byId('pessoas', d.pessoaId);
      if (!p) fail(`Informe o ${rot}.`);
      if (!p.ativo && (!ex || ex.pessoaId !== d.pessoaId)) fail(`O ${rot} selecionado está inativo.`);
      if (!String(d.descricao || '').trim()) fail('Informe a descrição.');
      if (!Number.isInteger(d.valor) || d.valor <= 0) fail('Informe um valor maior que zero.');
      if (!Dates.valid(d.vencimento)) fail('Informe uma data de vencimento válida.');
      if (!Dates.valid(d.competencia)) fail('Informe uma data de competência válida.');
      const c = byId('categorias', d.categoriaId);
      const tipoCat = d.tipo === 'receber' ? 'receita' : 'despesa';
      if (!c || c.tipo !== tipoCat) fail(`Informe uma categoria de ${tipoCat}.`);
      if (!c.ativa && (!ex || ex.categoriaId !== d.categoriaId)) fail('A categoria selecionada está inativa.');
      const ct = byId('contas', d.contaId);
      if (!ct) fail(d.tipo === 'receber' ? 'Informe a conta de recebimento.' : 'Informe a conta de pagamento.');
      if (!ct.ativa && (!ex || ex.contaId !== d.contaId)) fail('A conta selecionada está inativa.');
      if (d.projetoId && !byId('projetos', d.projetoId)) fail('Serviço/projeto não encontrado.');
      if (d.clienteId && !byId('pessoas', d.clienteId)) fail('Cliente vinculado não encontrado.');
      if (d.formaPagamento && !FORMAS_PAGAMENTO.includes(d.formaPagamento)) fail('Forma de pagamento inválida.');
      (d.anexos || []).forEach(a => { if (!a || !a.nome || !(DATA_URL.test(String(a.dataUrl || '')) || anexoReferenciaValido(a))) fail('Anexo inválido.'); });
    }

    /** Anexo por referência: PDF na pasta do módulo na nuvem, ou link https. Não guarda conteúdo. */
    function anexoReferenciaValido(a) {
      if (!a || !a.nome) return false;
      if (a.nuvem) return /^financeiro\/[a-z0-9-]+\.pdf$/.test(String(a.nuvem)) && (a.tamanho > 0 && a.tamanho <= LIMITE_PDF);
      if (a.url) return /^https?:\/\/\S+$/i.test(String(a.url));
      return false;
    }
    const LIMITE_PDF = 25 * 1024 * 1024;
    /** Acrescenta anexos (PDF na nuvem ou link) a um lançamento, sem apagar os existentes. Mesma permissão de editar lançamento. */
    function acrescentarAnexosTitulo(id, lista) {
      guard('titulo.editar');
      const t = byId('titulos', id);
      if (!t) fail('Lançamento não encontrado.');
      if (!Array.isArray(lista) || !lista.length) fail('Nenhum anexo para incluir.');
      const u = user();
      const novos = lista.map(a => {
        const nome = String((a && a.nome) || '').trim();
        if (!nome) fail('Anexo sem nome.');
        const base = { id: uid('anx'), nome, ts: nowISO(), autor: u ? u.nome : '' };
        if (a.nuvem) {
          if (!anexoReferenciaValido(a)) fail(`O arquivo "${nome}" não está na pasta deste módulo ou passa de 25 MB.`);
          return Object.assign(base, { tipo: 'application/pdf', tamanho: a.tamanho, nuvem: String(a.nuvem) });
        }
        if (a.url) {
          if (!anexoReferenciaValido(a)) fail(`O link do anexo "${nome}" deve começar com http:// ou https://.`);
          return Object.assign(base, { url: String(a.url) });
        }
        fail(`O anexo "${nome}" precisa de um arquivo na nuvem ou de um link.`);
      });
      return mutate(() => {
        t.anexos = (t.anexos || []).concat(novos);
        t.updatedAt = nowISO();
        log('titulo.anexo', 'titulo', t.id, `${novos.length} anexo(s) incluído(s): ${novos.map(a => a.nome).join('; ')}`);
        return { id, quantidade: novos.length };
      });
    }
    const CAMPOS_TITULO = ['pessoaId', 'descricao', 'categoriaId', 'contaId', 'projetoId', 'clienteId', 'proposta', 'notaFiscal', 'formaPagamento', 'competencia', 'vencimento', 'valor', 'obs', 'anexos'];
    function limparTitulo(d) {
      return {
        tipo: d.tipo, pessoaId: d.pessoaId || null, descricao: String(d.descricao || '').trim(), categoriaId: d.categoriaId || null, contaId: d.contaId || null,
        projetoId: d.projetoId || null, clienteId: d.tipo === 'pagar' ? (d.clienteId || null) : null, proposta: String(d.proposta || '').trim(), notaFiscal: String(d.notaFiscal || '').trim(),
        formaPagamento: d.formaPagamento || '', competencia: d.competencia || d.vencimento, vencimento: d.vencimento, valor: d.valor, obs: String(d.obs || '').trim(),
        anexos: (d.anexos || []).map(a => Object.assign({ id: a.id || uid('anx'), nome: a.nome, tipo: a.tipo || '', tamanho: a.tamanho || 0 }, a.dataUrl ? { dataUrl: a.dataUrl } : {}, a.nuvem ? { nuvem: String(a.nuvem) } : {}, a.url ? { url: String(a.url) } : {}))
      };
    }

    function verificarDuplicidade(d, ignorarIds) {
      const ign = new Set(ignorarIds || []);
      // NF diferente entre dois lançamentos = dois documentos distintos, mesmo com cliente, valor e vencimento iguais: não é duplicidade.
      // Sem NF (em um dos dois), vale a comparação de valor e vencimento; com NF nos dois, a NF decide.
      const nfDiferente = t => d.notaFiscal && t.notaFiscal && norm(t.notaFiscal) !== norm(d.notaFiscal);
      const dup = state.titulos.find(t => !t.cancelado && !ign.has(t.id) && t.tipo === d.tipo && t.pessoaId === d.pessoaId &&
        (d.notaFiscal && t.notaFiscal ? norm(t.notaFiscal) === norm(d.notaFiscal) : (!nfDiferente(t) && t.valor === d.valor && t.vencimento === d.vencimento)));
      if (dup) {
        const p = byId('pessoas', dup.pessoaId);
        fail(`Possível duplicidade: já existe "${dup.descricao}" para ${p ? p.nome : '—'}, ${Money.fmt(dup.valor)}, vencimento ${Dates.fmt(dup.vencimento)}${dup.notaFiscal ? ', NF ' + dup.notaFiscal : ''}. Lançar mesmo assim?`, 'DUPLICIDADE', { id: dup.id });
      }
    }

    function criarTitulo(dados, o = {}) {
      guard('titulo.criar');
      const d = limparTitulo(dados);
      validarTitulo(d);
      const parcelas = dados.parcelas == null || dados.parcelas === '' ? 1 : Number(dados.parcelas);
      const recorrencia = dados.recorrencia == null || dados.recorrencia === '' ? 0 : Number(dados.recorrencia);
      if (!Number.isInteger(parcelas) || parcelas < 1 || parcelas > 120) fail('Número de parcelas deve ser de 1 a 120.');
      if (!Number.isInteger(recorrencia) || recorrencia < 0 || recorrencia > 60 || recorrencia === 1) fail('Recorrência deve ter de 2 a 60 ocorrências mensais (ou nenhuma).');
      if (recorrencia && d.tipo !== 'pagar') fail('Recorrência está disponível para contas a pagar. Para receitas, use parcelamento.');
      if (recorrencia && parcelas > 1) fail('Use parcelamento ou recorrência, não os dois no mesmo lançamento.');
      if (parcelas > 1 && d.valor < parcelas) fail('Valor insuficiente para o número de parcelas.');
      if (!o.confirmar) verificarDuplicidade(Object.assign({}, d, { valor: parcelas > 1 ? Money.split(d.valor, parcelas)[0] : d.valor }));
      return mutate(() => {
        const criados = [];
        if (parcelas > 1) {
          const grupoId = uid('grp');
          const valores = Money.split(d.valor, parcelas);
          valores.forEach((v, i) => {
            const t = stamp(Object.assign({}, d, { valor: v, vencimento: Dates.addMonths(d.vencimento, i), grupoId, parcela: i + 1, totalParcelas: parcelas, valorTotalOriginal: d.valor, cancelado: false, anexos: i === 0 ? d.anexos : [] }), 'tit');
            state.titulos.push(t); criados.push(t);
          });
          log('titulo.criado', 'titulo', criados[0].id, `${d.tipo === 'receber' ? 'Receita' : 'Despesa'} "${d.descricao}" de ${Money.fmt(d.valor)} parcelada em ${parcelas}x (${valores.map(Money.fmt).join(' + ')}).`);
        } else if (recorrencia) {
          const recorrenciaId = uid('rec');
          state.recorrencias.push(stamp({ id: recorrenciaId, descricao: d.descricao, frequencia: 'mensal', inicio: d.vencimento, ocorrencias: recorrencia, encerrada: false }, 'rec'));
          for (let i = 0; i < recorrencia; i++) {
            const t = stamp(Object.assign({}, d, { vencimento: Dates.addMonths(d.vencimento, i), competencia: Dates.addMonths(d.competencia, i), recorrenciaId, ocorrencia: i + 1, totalOcorrencias: recorrencia, cancelado: false, anexos: i === 0 ? d.anexos : [] }), 'tit');
            state.titulos.push(t); criados.push(t);
          }
          log('titulo.criado', 'titulo', criados[0].id, `Despesa recorrente "${d.descricao}" de ${Money.fmt(d.valor)}/mês, ${recorrencia} ocorrências a partir de ${Dates.fmt(d.vencimento)}.`);
        } else {
          const t = stamp(Object.assign({}, d, { cancelado: false }), 'tit');
          state.titulos.push(t); criados.push(t);
          log('titulo.criado', 'titulo', t.id, `${d.tipo === 'receber' ? 'Receita' : 'Despesa'} "${d.descricao}" de ${Money.fmt(d.valor)}, vencimento ${Dates.fmt(d.vencimento)}.`);
        }
        criados.forEach(t => queue('financeiro.titulo.criado', { id: t.id, tipo: t.tipo, valor: t.valor, vencimento: t.vencimento }));
        return criados.map(t => Object.assign({}, t));
      });
    }

    function serie(t) {
      if (t.grupoId) return state.titulos.filter(x => x.grupoId === t.grupoId).sort((a, b) => a.parcela - b.parcela);
      if (t.recorrenciaId) return state.titulos.filter(x => x.recorrenciaId === t.recorrenciaId).sort((a, b) => a.ocorrencia - b.ocorrencia);
      return [t];
    }
    const ordem = t => t.parcela || t.ocorrencia || 1;

    function descreverMudanca(antes, depois) {
      const out = [];
      const rot = { pessoaId: 'pessoa', descricao: 'descrição', categoriaId: 'categoria', contaId: 'conta', projetoId: 'projeto', clienteId: 'cliente vinculado', proposta: 'proposta', notaFiscal: 'nota fiscal', formaPagamento: 'forma de pagamento', competencia: 'competência', vencimento: 'vencimento', valor: 'valor', obs: 'observações', anexos: 'anexos' };
      for (const k of CAMPOS_TITULO) {
        const a = antes[k], b = depois[k];
        if (k === 'anexos') { if ((a || []).length !== (b || []).length) out.push(`anexos ${(a || []).length}→${(b || []).length}`); continue; }
        if ((a || '') === (b || '')) continue;
        if (k === 'valor') out.push(`valor ${Money.fmt(a)}→${Money.fmt(b)}`);
        else if (k === 'vencimento' || k === 'competencia') out.push(`${rot[k]} ${Dates.fmt(a)}→${Dates.fmt(b)}`);
        else out.push(rot[k]);
      }
      return out.join(', ');
    }

    /**
     * Edita um título. escopo 'este' (padrão) ou 'proximos' (recorrência: esta e as próximas ocorrências).
     * Ocorrências com pagamento registrado nunca são alteradas pelo escopo 'proximos'.
     */
    function editarTitulo(id, campos, o = {}) {
      guard('titulo.editar');
      const t = byId('titulos', id);
      if (!t) fail('Lançamento não encontrado.');
      if (t.cancelado) fail('Lançamento cancelado não pode ser editado.');
      const escopo = o.escopo === 'proximos' ? 'proximos' : 'este';
      if (escopo === 'proximos' && !t.recorrenciaId) fail('"Esta e as próximas" vale apenas para despesas recorrentes.');
      const novo = limparTitulo(Object.assign({}, t, campos, { tipo: t.tipo }));
      validarTitulo(novo, t);
      if (novo.valor < pago(t)) fail(`O valor não pode ser menor que o já ${t.tipo === 'receber' ? 'recebido' : 'pago'} (${Money.fmt(pago(t))}).`);
      if (!o.confirmar && (novo.valor !== t.valor || novo.vencimento !== t.vencimento || novo.pessoaId !== t.pessoaId || novo.notaFiscal !== t.notaFiscal)) verificarDuplicidade(novo, serie(t).map(x => x.id));
      let alvos = [t], ignorados = [];
      if (escopo === 'proximos') {
        const prox = serie(t).filter(x => ordem(x) > ordem(t) && !x.cancelado);
        ignorados = prox.filter(x => pago(x) > 0);
        alvos = [t, ...prox.filter(x => pago(x) === 0)];
      }
      const mudouVenc = novo.vencimento !== t.vencimento, mudouComp = novo.competencia !== t.competencia;
      return mutate(() => {
        for (const alvo of alvos) {
          const antes = Object.assign({}, alvo);
          const delta = ordem(alvo) - ordem(t);
          const aplicar = {};
