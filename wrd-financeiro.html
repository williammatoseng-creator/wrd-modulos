      if (f.pessoaId && m.pessoaId !== f.pessoaId) return false;
      return true;
    }

    function fluxoMensal(de, ate, f = {}) {
      guard('ler');
      const meses = Dates.meses(de, ate).map(ym => ({ mes: ym, prevEntradas: 0, prevSaidas: 0, realEntradas: 0, realSaidas: 0, abertoEntradas: 0, abertoSaidas: 0, aportes: 0, retiradas: 0 }));
      const by = new Map(meses.map(m => [m.mes, m]));
      for (const t of filtrarTitulos(Object.assign({}, f, { vencDe: de, vencAte: ate, situacao: '' }))) {
        if (t.cancelado) continue;
        const m = by.get(t.vencimento.slice(0, 7)); if (!m) continue;
        if (t.tipo === 'receber') { m.prevEntradas += t.valor; m.abertoEntradas += aberto(t); } else { m.prevSaidas += t.valor; m.abertoSaidas += aberto(t); }
      }
      const semFiltroTitulo = !f.categoriaId && !f.projetoId && !f.clienteId && !f.fornecedorId && !f.pessoaId;
      for (const mv of movimentos({ de, ate, interno: true })) {
        const m = by.get(mv.data.slice(0, 7)); if (!m) continue;
        if (mv.tipo === 'recebimento' && aplicaFiltroMov(mv, f)) m.realEntradas += mv.entrada;
        else if (mv.tipo === 'pagamento' && aplicaFiltroMov(mv, f)) m.realSaidas += mv.saida;
        else if (semFiltroTitulo && (!f.contaId || mv.contaId === f.contaId)) { if (mv.tipo === 'aporte') m.aportes += mv.entrada; if (mv.tipo === 'retirada') m.retiradas += mv.saida; }
      }
      meses.forEach(m => { m.prevResultado = m.prevEntradas - m.prevSaidas; m.realResultado = m.realEntradas - m.realSaidas; });
      return meses;
    }

    function porCategoria(de, ate, f = {}) {
      guard('ler');
      const linhas = new Map(state.categorias.map(c => [c.id, { categoriaId: c.id, nome: c.nome, tipo: c.tipo, ativa: c.ativa, previsto: 0, realizado: 0, emAberto: 0, qtd: 0 }]));
      for (const t of filtrarTitulos(Object.assign({}, f, { vencDe: de, vencAte: ate, situacao: '' }))) {
        if (t.cancelado) continue;
        const l = linhas.get(t.categoriaId); if (!l) continue;
        l.previsto += t.valor; l.emAberto += aberto(t); l.qtd++;
      }
      for (const mv of movimentos({ de, ate, interno: true })) {
        if ((mv.tipo !== 'recebimento' && mv.tipo !== 'pagamento') || !aplicaFiltroMov(mv, f)) continue;
        const l = linhas.get(mv.categoriaId); if (!l) continue;
        l.realizado += mv.entrada + mv.saida;
      }
      const todas = [...linhas.values()].filter(l => l.previsto || l.realizado || (l.ativa && !f.categoriaId) || l.categoriaId === f.categoriaId).filter(l => !f.categoriaId || l.categoriaId === f.categoriaId);
      return { receitas: todas.filter(l => l.tipo === 'receita'), despesas: todas.filter(l => l.tipo === 'despesa') };
    }

    function novoBalde(id, nome) { return { id, nome, receitaPrevista: 0, receitaRecebida: 0, custoPrevisto: 0, custoPago: 0, aReceber: 0, aPagar: 0, qtdReceitas: 0, qtdCustos: 0 }; }
    function fecharBalde(b) {
      b.resultadoPrevisto = b.receitaPrevista - b.custoPrevisto;
      b.resultadoRealizado = b.receitaRecebida - b.custoPago;
      b.margemPrevista = b.receitaPrevista > 0 ? b.resultadoPrevisto / b.receitaPrevista * 100 : null;
      b.margemRealizada = b.receitaRecebida > 0 ? b.resultadoRealizado / b.receitaRecebida * 100 : null;
      return b;
    }
    /** Resultado direto (sem rateio de despesas administrativas). Acumulado de todos os lançamentos não cancelados. */
    function resultadoDireto(f = {}) {
      guard('ler');
      const projs = new Map(), clis = new Map();
      const semVinculo = novoBalde(null, 'Despesas sem vínculo a cliente ou serviço (administrativas)');
      const recSemProjeto = new Map();
      const efetivoPorTitulo = new Map();
      for (const b of state.baixas) if (!b.estornada) efetivoPorTitulo.set(b.tituloId, (efetivoPorTitulo.get(b.tituloId) || 0) + b.valorEfetivo);
      for (const t of state.titulos) {
        if (t.cancelado) continue;
        const cid = clienteDe(t);
        if (f.clienteId && cid !== f.clienteId) continue;
        if (f.projetoId && t.projetoId !== f.projetoId) continue;
        if (f.categoriaId && t.categoriaId !== f.categoriaId) continue;
        if (f.contaId && t.contaId !== f.contaId) continue;
        if (f.fornecedorId && !(t.tipo === 'pagar' && t.pessoaId === f.fornecedorId)) continue;
        const ef = efetivoPorTitulo.get(t.id) || 0, ab = aberto(t);
        const alvos = [];
        if (t.projetoId) { if (!projs.has(t.projetoId)) { const p = byId('projetos', t.projetoId); projs.set(t.projetoId, Object.assign(novoBalde(t.projetoId, p ? p.nome : '—'), { codigo: p ? p.codigo : '', clienteId: p ? p.clienteId : null })); } alvos.push(projs.get(t.projetoId)); }
        if (cid) { if (!clis.has(cid)) { const p = byId('pessoas', cid); clis.set(cid, novoBalde(cid, p ? p.nome : '—')); } alvos.push(clis.get(cid)); }
        if (!t.projetoId && !cid && t.tipo === 'pagar') alvos.push(semVinculo);
        for (const b of alvos) {
          if (t.tipo === 'receber') { b.receitaPrevista += t.valor; b.receitaRecebida += ef; b.aReceber += ab; b.qtdReceitas++; }
          else { b.custoPrevisto += t.valor; b.custoPago += ef; b.aPagar += ab; b.qtdCustos++; }
        }
        if (t.tipo === 'receber' && !t.projetoId) recSemProjeto.set(cid, (recSemProjeto.get(cid) || 0) + t.valor);
      }
      if (!f.clienteId && !f.projetoId && !f.fornecedorId && (!f.categoriaId || f.categoriaId === 'cat_d_tarifas')) {
        for (const b of state.baixas) if (!b.estornada && b.taxaSeparada && (!f.contaId || b.contaId === f.contaId)) { semVinculo.custoPrevisto += b.taxaSeparada; semVinculo.custoPago += b.taxaSeparada; semVinculo.qtdCustos++; }
      }
      const ord = (a, b) => a.nome.localeCompare(b.nome, 'pt-BR');
      return { projetos: [...projs.values()].map(fecharBalde).sort(ord), clientes: [...clis.values()].map(fecharBalde).sort(ord), semVinculo: fecharBalde(semVinculo) };
    }

    function inadimplencia(f = {}) {
      guard('ler');
      const h = hoje();
      const por = new Map();
      for (const t of filtrarTitulos(Object.assign({}, f, { tipo: 'receber', situacao: 'vencido' }))) {
        const ab = aberto(t); if (ab <= 0) continue;
        const dias = Dates.diffDays(t.vencimento, h);
        if (!por.has(t.pessoaId)) { const p = byId('pessoas', t.pessoaId); por.set(t.pessoaId, { pessoaId: t.pessoaId, nome: p ? p.nome : '—', qtd: 0, total: 0, maiorAtraso: 0, f1_30: 0, f31_60: 0, f61_90: 0, f90: 0, titulos: [] }); }
        const r = por.get(t.pessoaId);
        r.qtd++; r.total += ab; r.maiorAtraso = Math.max(r.maiorAtraso, dias);
        if (dias <= 30) r.f1_30 += ab; else if (dias <= 60) r.f31_60 += ab; else if (dias <= 90) r.f61_90 += ab; else r.f90 += ab;
        r.titulos.push(Object.assign(enriquecer(t), { diasAtraso: dias }));
      }
      return [...por.values()].sort((a, b) => b.total - a.total);
    }

    function resumoMensal(de, ate) {
      guard('ler');
      return Dates.meses(de, ate).map(ym => {
        const ini = ym + '-01', fim = Dates.fimMes(ini), antes = Dates.addDays(ini, -1);
        const saldoAntes = state.contas.reduce((s, c) => s + (saldoConta(c.id, antes) || 0), 0);
        const iniciais = state.contas.filter(c => c.dataSaldoInicial >= ini && c.dataSaldoInicial <= fim).reduce((s, c) => s + c.saldoInicial, 0);
        const r = { mes: ym, saldoInicio: saldoAntes, saldosIniciaisIncluidos: iniciais, recebimentos: 0, pagamentos: 0, aportes: 0, retiradas: 0, transfEntradas: 0, transfSaidas: 0 };
        for (const m of movimentos({ de: ini, ate: fim, interno: true })) {
          if (m.tipo === 'recebimento') r.recebimentos += m.entrada;
          else if (m.tipo === 'pagamento') r.pagamentos += m.saida;
          else if (m.tipo === 'aporte') r.aportes += m.entrada;
          else if (m.tipo === 'retirada') r.retiradas += m.saida;
          else if (m.tipo === 'transferencia') { r.transfEntradas += m.entrada; r.transfSaidas += m.saida; }
        }
        r.resultadoCaixa = r.recebimentos - r.pagamentos;
        r.saldoFim = state.contas.reduce((s, c) => s + (saldoConta(c.id, fim) || 0), 0);
        r.conferencia = r.saldoFim === r.saldoInicio + r.saldosIniciaisIncluidos + r.resultadoCaixa + r.aportes - r.retiradas + (r.transfEntradas - r.transfSaidas);
        return r;
      });
    }

    function historico(f = {}) {
      guard('ler');
      const b = norm(f.busca);
      return state.historico.filter(h => (!f.entidadeId || h.entidadeId === f.entidadeId) && (!f.entidade || h.entidade === f.entidade) && (!f.usuario || h.usuario === f.usuario) && (!b || norm(h.detalhe + ' ' + h.acao + ' ' + h.usuario).includes(b)))
        .slice().sort((x, y) => y.ts.localeCompare(x.ts));
    }

    function lista(coll) {
      guard('ler');
      if (!['contas', 'pessoas', 'projetos', 'categorias', 'recorrencias'].includes(coll)) fail('Coleção não disponível.');
      return state[coll].map(x => Object.assign({}, x));
    }
    /** Dados brutos usados pelo Método PRIME (_comum/quadro-prime.js). Mesmo cálculo usado no painel. */
    function dadosPrime() { guard('ler'); return { titulos: state.titulos, baixas: state.baixas, movimentosSocios: state.movimentosSocios }; }
    function get(coll, id) { guard('ler'); const x = byId(coll, id); return x && coll !== 'users' ? Object.assign({}, x) : null; }
    function config() { guard('ler'); return Object.assign({}, state.config); }

    /* ---------- exportação / importação ---------- */
    function snapshot(o = {}) {
      guard(o.completo ? 'dados.importar' : 'exportar');
      const s = JSON.parse(JSON.stringify(state));
      if (!o.completo) {
        s.users = s.users.map(u => ({ id: u.id, nome: u.nome, login: u.login, perfil: u.perfil, ativo: u.ativo }));
        if (o.semAnexos) s.titulos.forEach(t => { t.anexos = (t.anexos || []).map(a => ({ id: a.id, nome: a.nome, tipo: a.tipo, tamanho: a.tamanho })); });
      }
      s.exportadoEm = nowISO();
      s.exportadoPor = user().login;
      s.tipoExportacao = o.completo ? 'backup-completo' : 'dados';
      return s;
    }
    function importarJSON(texto) {
      guard('dados.importar');
      let s;
      try { s = typeof texto === 'string' ? JSON.parse(texto) : texto; } catch (e) { fail('O arquivo não é um JSON válido.'); }
      s = validarEstrutura(JSON.parse(JSON.stringify(s)));
      for (const t of s.titulos) {
        if (!t || !t.id || !['receber', 'pagar'].includes(t.tipo) || !Number.isInteger(t.valor)) fail('Arquivo inválido: lançamento com dados incompletos.');
        t.anexos = (t.anexos || []).filter(a => a && (DATA_URL.test(String(a.dataUrl || '')) || anexoReferenciaValido(a)));
      }
      for (const b of s.baixas) if (!b || !b.id || !b.tituloId || !Number.isInteger(b.principal) || !Number.isInteger(b.valorEfetivo)) fail('Arquivo inválido: baixa com dados incompletos.');
      if (!!s.demo !== demo) fail(demo ? 'Este arquivo contém dados reais. Importe-o fora do modo demonstração.' : 'Este arquivo é de DEMONSTRAÇÃO e não pode ser importado nos dados reais.');
      const usuariosValidos = s.users.length && s.users.every(u => u.salt && u.hash) && s.users.some(u => u.perfil === 'admin' && u.ativo);
      const atual = user();
      return mutate(() => {
        const usersAtuais = state.users;
        state = s;
        state.demo = demo;
        if (!usuariosValidos) state.users = usersAtuais;
        if (!state.users.some(u => u.id === atual.userId && u.ativo)) state.users.push(usersAtuais.find(u => u.id === atual.userId));
        ver++;
        log('dados.importados', 'dados', null, `Dados importados (${state.titulos.length} lançamentos, ${state.baixas.length} baixas). Usuários ${usuariosValidos ? 'do arquivo' : 'atuais mantidos'}.`);
        queue('financeiro.dados.importados', { titulos: state.titulos.length });
        return { titulos: state.titulos.length, baixas: state.baixas.length, usuariosDoArquivo: !!usuariosValidos };
      });
    }
    function apagarTudo(confirmacao) {
      guard('dados.apagar');
      if (confirmacao !== 'APAGAR') fail('Digite APAGAR para confirmar.');
      const usuarios = state.users;
      return mutate(() => {
        const cfg = state.config;
        state = emptyState();
        state.users = usuarios;
        state.config = Object.assign(state.config, { empresa: cfg.empresa, cnpj: cfg.cnpj, timezone: cfg.timezone, responsavel: cfg.responsavel });
        ver++;
        log('dados.apagados', 'dados', null, 'Todos os lançamentos e cadastros foram apagados pelo administrador. Usuários mantidos.');
        return true;
      });
    }

    return {
      SCHEMA_VERSION, demo,
      on, emit, hoje, dadosPrime,
      hasUsers, setupAdmin, login, logout, usuariosDemo, entrarDemo, entrarPelaNuvem, user, can, listarUsuarios, salvarUsuario, alterarSenha,
      salvarConfig, config, emitirNumeroRelatorio,
      salvarPessoa, salvarProjeto, salvarCategoria, salvarConta,
      criarTitulo, editarTitulo, cancelarTitulo, registrarBaixa, estornarBaixa,
      criarTransferencia, estornarTransferencia, criarMovSocio, estornarMovSocio,
      lista, get, titulo, listarTitulos, baixasDoTitulo, serieDe, movimentos, saldoConta: (id, ate) => { guard('ler'); return saldoConta(id, ate); }, saldos,
      kpis, projecao, fluxoMensal, porCategoria, resultadoDireto, inadimplencia, resumoMensal, historico,
      snapshot, importarJSON, apagarTudo, acrescentarAnexosTitulo
    };
  }

  return { createCore, MODOS_TAXA, Money, Dates, sha256, PERFIS, FORMAS_PAGAMENTO, CATEGORIAS_INICIAIS, SCHEMA_VERSION, MODULO_ID, uid, REGRAS, STATUS_REGRA };
})();
/*CORE-END*/

</script>
<script>
/* =====================================================================
   INTERFACE — usa somente a API do núcleo (WRDCore). Permissões são
   checadas no núcleo; a interface apenas esconde o que o perfil não pode.
   ===================================================================== */
(function () {
  'use strict';
  const { createCore, Money, Dates, PERFIS, FORMAS_PAGAMENTO, MODOS_TAXA } = WRDCore;
  const NS_REAL = 'wrd.financeiro', NS_DEMO = 'wrd.financeiro.demo';

  /* ---------- adaptador de armazenamento (padrão: localStorage, isolado por namespace) ---------- */
  let armazenamentoVolatil = false;
  function adaptador(area, ns) {
    const mem = new Map();
    let s = null;
    try { s = window[area]; const k = ns + ':__teste'; s.setItem(k, '1'); s.removeItem(k); } catch (e) { s = null; if (area === 'localStorage') armazenamentoVolatil = true; }
    return {
      get: k => (s ? s.getItem(ns + ':' + k) : (mem.has(k) ? mem.get(k) : null)),
      set: (k, v) => (s ? s.setItem(ns + ':' + k, v) : mem.set(k, v)),
      remove: k => (s ? s.removeItem(ns + ':' + k) : mem.delete(k))
    };
  }
  const prefs = adaptador('localStorage', NS_REAL + '.prefs');
  let modo = null;
  try { const m = sessionStorage.getItem(NS_REAL + '.modo'); if (m === 'real' || m === 'demo') modo = m; } catch (e) { /* aba privada */ }
  let core = null, erroCarga = null;

  let storageAtual = null;
  /* Dentro do painel integrado, "Sair" devolve o controle ao painel; a conexão com a nuvem continua valendo. */
  function voltarAoPainel(modulo) {
    try { if (window.parent && window.parent !== window) { window.parent.postMessage({ wrd: 'voltar', modulo }, '*'); return true; } } catch (e) { /* fora do painel */ }
    return false;
  }
  // Com a conta da nuvem já conectada, o módulo entra no perfil correspondente sem pedir a senha de novo. Se não houver perfil, cai na tela de login.
  function entrarNaNuvem() {
    if (!core || core.user() || !NV || !NV.usuarioEmail) return;
    const email = NV.usuarioEmail() || '';
    try { core.entrarPelaNuvem(email); return; } catch (e) { /* sem perfil correspondente */ }
    if (core.hasUsers() || !email) return;
    // Módulo vazio: cria o administrador com o e-mail da conta da nuvem. A senha é aleatória; o acesso passa a ser pelo painel.
    const base = email.split('@')[0].split('').map(c => (/[A-Za-z0-9.]/.test(c) ? c : '.')).join('').slice(0, 30);
    const login = base.length >= 3 ? base : 'admin';
    const senha = Array.from(crypto.getRandomValues(new Uint8Array(24))).map(b => b.toString(36)).join('');
    try { core.setupAdmin({ nome: login, login, senha, email }); } catch (e) { /* segue para o formulário de primeiro acesso */ }
  }
  function iniciarCore(storage) {
    const ns = modo === 'demo' ? NS_DEMO : NS_REAL;
    erroCarga = null;
    storageAtual = storage || adaptador('localStorage', ns);
    try {
      core = createCore({ storage: storageAtual, sessionStore: adaptador('sessionStorage', ns), demo: modo === 'demo' });
      core.on('*', (payload, evt) => NEXO.emit(evt, payload));
    } catch (e) { core = null; erroCarga = e; }
  }

  /* ---------- utilidades de tela ---------- */
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => [...el.querySelectorAll(s)];
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const R = c => Money.fmt(c);
  const D = s => Dates.fmt(s);
  const pct = v => (v == null ? '—' : v.toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + '%');
  const opt = (v, r, sel) => `<option value="${esc(v)}"${String(v) === String(sel == null ? '' : sel) ? ' selected' : ''}>${esc(r)}</option>`;
  const stBadge = (codigo, rotulo) => `<span class="st st-${codigo}">${esc(rotulo)}</span>`;
  const agoraBR = () => new Date().toLocaleString('pt-BR', { timeZone: core.config().timezone, day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });

  function toast(msg, tipo) {
    const el = document.createElement('div');
    el.className = 'toast ' + (tipo || '');
    el.setAttribute('role', tipo === 'erro' ? 'alert' : 'status');
    el.textContent = msg;
    $('#toasts').appendChild(el);
    setTimeout(() => el.remove(), tipo === 'erro' ? 7000 : 3500);
  }

  /** Executa ação do núcleo tratando duplicidade (pede confirmação) e erros. */
  async function executar(fn, msgOk) {
    try {
      const r = fn(false);
      if (msgOk) toast(msgOk, 'ok');
      return { ok: true, r };
    } catch (e) {
      if (e.code === 'DUPLICIDADE') {
        if (await confirmar('Possível duplicidade', e.message, 'Lançar mesmo assim')) {
          try { const r = fn(true); if (msgOk) toast(msgOk, 'ok'); return { ok: true, r }; } catch (e2) { return { ok: false, erro: e2 }; }
        }
        return { ok: false, cancelado: true };
      }
      return { ok: false, erro: e };
    }
  }
  function mostrarErro(res, alvo) {
    if (res.ok || res.cancelado) return;
    if (alvo) { alvo.textContent = res.erro.message; alvo.scrollIntoView({ block: 'nearest' }); }
    else toast(res.erro.message, 'erro');
    if (res.erro.code === 'AUTH') { render(); }
  }

  /* ---------- modais ---------- */
  function abrirModal({ titulo, corpo, rodape, tamanho, aoAbrir }) {
    const raiz = document.createElement('div');
    raiz.className = 'modal-fundo';
    raiz.innerHTML = `<div class="modal ${tamanho || ''}" role="dialog" aria-modal="true" aria-label="${esc(titulo)}">
      <div class="modal-cab"><h2>${esc(titulo)}</h2><button class="fechar" data-fechar aria-label="Fechar">×</button></div>
      <div class="modal-corpo">${corpo}</div>${rodape ? `<div class="modal-rod">${rodape}</div>` : ''}</div>`;
    raiz.addEventListener('mousedown', e => { if (e.target === raiz) raiz._fora = true; });
    raiz.addEventListener('mouseup', e => { if (e.target === raiz && raiz._fora) fecharModal(raiz); raiz._fora = false; });
    raiz.addEventListener('click', e => { if (e.target.closest('[data-fechar]')) fecharModal(raiz); });
    document.body.appendChild(raiz);
    document.body.style.overflow = 'hidden';
    const prim = raiz.querySelector('input:not([type=hidden]):not([readonly]), select, textarea');
    if (prim && window.innerWidth > 760) setTimeout(() => prim.focus(), 30);
    if (aoAbrir) aoAbrir(raiz);
    return raiz;
  }
  function fecharModal(raiz) {
    (raiz || $$('.modal-fundo').pop())?.remove();
    if (!$('.modal-fundo')) document.body.style.overflow = '';
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('.modal-fundo')) fecharModal(); });

  /* ---------- nuvem (Supabase "WRD Sistemas", ../_comum/nuvem.js): mesmos dados no computador e no celular ---------- */
  const NV = typeof WRDNuvem !== 'undefined' ? WRDNuvem.integrar({
    modulo: 'financeiro', titulo: 'WRD Financeiro', nomeModulo: 'Financeiro', ns: NS_REAL, logo: LOGO_AZUL,
    storageReal: () => adaptador('localStorage', NS_REAL),
    toast: (m, t) => toast(m, t), confirmar: (t, m, b) => confirmar(t, m, b),
    abrirModal: (t, h) => { const el = abrirModal({ titulo: t, corpo: h }); return { el, fechar: () => fecharModal(el) }; },
    fmtTs: ts => new Date(ts).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }),
    aoPronto: storage => { iniciarCore(storage); entrarNaNuvem(); render(); },
    aoRecarregar: info => {
      if (!core || modo !== 'real') return;
      iniciarCore(storageAtual); render();
      if (!info.mesclado) toast(`Dados atualizados${info.origem ? ' (alterados no ' + info.origem.toLowerCase() + ')' : ''}.`, 'ok');
    },
    aoDesconectar: () => { core = null; render(); },
    aoVoltar: () => { modo = null; core = null; erroCarga = null; try { sessionStorage.removeItem(NS_REAL + '.modo'); } catch (e) { /* aba privada */ } render(); },
    render: () => { core = null; render(); }
  }) : null;

  function confirmar(titulo, msg, rotuloOk, perigo) {
    return new Promise(res => {
      const m = abrirModal({
        titulo, tamanho: 'estreito',
        corpo: `<p class="u-m0">${esc(msg)}</p>`,
        rodape: `<button class="btn" data-r="0">Voltar</button><button class="btn ${perigo ? 'btn-perigo' : 'btn-primario'}" data-r="1">${esc(rotuloOk || 'Confirmar')}</button>`
      });
      m.addEventListener('click', e => { const b = e.target.closest('[data-r]'); if (b) { fecharModal(m); res(b.dataset.r === '1'); } });
      const obs = new MutationObserver(() => { if (!document.body.contains(m)) { obs.disconnect(); res(false); } });
      obs.observe(document.body, { childList: true });
    });
  }
  function pedirTexto(titulo, msg, rotulo, rotuloOk) {
    return new Promise(res => {
      const m = abrirModal({
        titulo, tamanho: 'estreito',
        corpo: `<p class="u-m0">${esc(msg)}</p><label class="campo"><span>${esc(rotulo)} <span class="req">*</span></span><textarea id="pedir-txt" maxlength="300"></textarea></label><div class="erro-form" id="pedir-erro"></div>`,
        rodape: `<button class="btn" data-r="0">Voltar</button><button class="btn btn-primario" data-r="1">${esc(rotuloOk || 'Confirmar')}</button>`
      });
      let feito = false;
      m.addEventListener('click', e => {
        const b = e.target.closest('[data-r]'); if (!b) return;
        if (b.dataset.r === '1') { const v = $('#pedir-txt', m).value.trim(); if (!v) { $('#pedir-erro', m).textContent = 'Este campo é obrigatório.'; return; } feito = true; fecharModal(m); res(v); }
        else { feito = true; fecharModal(m); res(null); }
      });
      const obs = new MutationObserver(() => { if (!document.body.contains(m)) { obs.disconnect(); if (!feito) res(null); } });
      obs.observe(document.body, { childList: true });
    });
  }

  /* ---------- campos de valor ---------- */
  function moedaInput(nome, valorCent, extra) {
    return `<input type="text" inputmode="decimal" name="${nome}" class="in-moeda" autocomplete="off" placeholder="0,00" value="${valorCent != null && valorCent !== '' ? Money.num(valorCent) : ''}" ${extra || ''}>`;
  }
  document.addEventListener('blur', e => {
    if (e.target.classList && e.target.classList.contains('in-moeda') && e.target.value.trim()) {
      const v = Money.parse(e.target.value);
      if (!Number.isNaN(v)) { e.target.value = Money.num(v); e.target.classList.remove('invalido'); } else e.target.classList.add('invalido');
    }
  }, true);
  function lerForm(form) {
    const o = {};
    for (const el of form.elements) {
      if (!el.name) continue;
      if (el.type === 'checkbox') o[el.name] = el.checked;
      else if (el.classList.contains('in-moeda')) o[el.name] = el.value.trim() === '' ? (el.dataset.vazio === 'zero' ? 0 : NaN) : Money.parse(el.value);
      else if (el.type === 'file') continue;
      else o[el.name] = el.value;
    }
    return o;
  }

  /* ---------- estado da interface ---------- */
  const hojeISO = () => core.hoje();
  const ui = {
    aba: 'visao', subCad: 'pessoas', subRel: 'relatorios',
    periodo: null,
    filtros: { receber: {}, pagar: {} },
    extrato: {}, proj: 30,
    rel: { tipo: 'contas', f: {} }, relNumero: null,
    hist: {}
  };
  function periodoPreset(p) {
    const h = hojeISO();
    if (p === 'mes') return { preset: p, de: Dates.inicioMes(h), ate: Dates.fimMes(h) };
    if (p === 'prox') { const n = Dates.addMonths(Dates.inicioMes(h), 1, 1); return { preset: p, de: n, ate: Dates.fimMes(n) }; }
    if (p === 'ant') { const n = Dates.addMonths(Dates.inicioMes(h), -1, 1); return { preset: p, de: n, ate: Dates.fimMes(n) }; }
    if (p === '30') return { preset: p, de: h, ate: Dates.addDays(h, 30) };
    if (p === 'ano') return { preset: p, de: h.slice(0, 4) + '-01-01', ate: h.slice(0, 4) + '-12-31' };
    return { preset: 'mes', de: Dates.inicioMes(h), ate: Dates.fimMes(h) };
  }
  try { const salvo = JSON.parse(prefs.get('ui') || 'null'); if (salvo && salvo.aba) { ui.aba = salvo.aba; ui.proj = salvo.proj || 30; } } catch (e) { /* preferências opcionais */ }
  function limparEstadoUI() { Object.assign(ui, { subCad: 'pessoas', subRel: 'relatorios', periodo: null, filtros: { receber: {}, pagar: {} }, extrato: {}, rel: { tipo: 'contas', f: {} }, hist: {}, filtroPessoas: null }); }
  const salvarPrefs = () => { try { prefs.set('ui', JSON.stringify({ aba: ui.aba, proj: ui.proj })); } catch (e) { /* opcional */ } };

  /* Método PRIME: mesmo cálculo do painel (_comum/quadro-prime.js), sempre sobre o mês corrente. */
  function htmlPrime() {
    const mes = core.hoje().slice(0, 7);
    const q = QuadroPrime.calcular(core.dadosPrime(), mes);
    const cartoes = q.cortes.map(c => {
      const uso = c.realizado === null ? '' : `<div class="prime-uso ${c.situacao}"><span>${c.id === 'operacao' ? 'Gasto na operação' : 'Retirado como pró-labore'}: <b>${R(c.realizado)}</b></span><span>${c.saldo >= 0 ? 'restam ' + R(c.saldo) : 'passou ' + R(-c.saldo)}</span></div>`;
      return `<div class="prime-corte prime-${c.id}"><div class="prime-rot">${c.pct}% · ${c.tipo === 'teto' ? 'teto' : 'reserva'}</div><div class="prime-nome">${esc(c.rotulo)}</div><div class="prime-val num">${R(c.valor)}</div><div class="prime-regra">${esc(c.regra)}</div>${uso}</div>`;
    }).join('');
    return `<section class="cartao prime-bloco"><div class="cab"><h2><span class="prime-selo">PRIME</span> Quatro cortes do faturamento</h2><span class="xs muted">${Dates.nomeMes(mes)}</span></div>
      <p class="prime-faturamento">Faturamento do mês: <b>${R(q.faturamento)}</b> <span class="xs muted">principal recebido no mês</span></p>
      <div class="prime-grade">${cartoes}</div>
      <p class="xs muted">Conta tradicional (faturamento − despesas pagas): <b>${R(q.tradicional.lucroSobra)}</b>, ou seja, o lucro só aparece se sobrar. No método PRIME, <b>${R(q.prime.lucroSeparado)}</b> de lucro sai antes de qualquer gasto.</p>
    </section>`;
  }

  function graficoES(de, ate) {
    const dias = Dates.diffDays(de, ate) + 1;
    const baldes = [];
    if (dias <= 62) { for (let d = de; d <= ate; d = Dates.addDays(d, 7)) { const fim = Dates.addDays(d, 6) > ate ? ate : Dates.addDays(d, 6); baldes.push({ de: d, ate: fim, rot: D(d).slice(0, 5) }); } }
    else { Dates.meses(de, ate).forEach(ym => { const i = ym + '-01'; baldes.push({ de: i < de ? de : i, ate: Dates.fimMes(i) > ate ? ate : Dates.fimMes(i), rot: Dates.nomeMes(ym) }); }); }
    const movs = core.movimentos({ de, ate });
    const tits = core.listarTitulos({ situacao: 'abertos', vencDe: de, vencAte: ate });
    baldes.forEach(b => {
      b.er = movs.filter(m => m.tipo === 'recebimento' && m.data >= b.de && m.data <= b.ate).reduce((s, m) => s + m.entrada, 0);
      b.sr = movs.filter(m => m.tipo === 'pagamento' && m.data >= b.de && m.data <= b.ate).reduce((s, m) => s + m.saida, 0);
      b.ep = tits.filter(t => t.tipo === 'receber' && t.vencimento >= b.de && t.vencimento <= b.ate).reduce((s, t) => s + t.aberto, 0);
      b.sp = tits.filter(t => t.tipo === 'pagar' && t.vencimento >= b.de && t.vencimento <= b.ate).reduce((s, t) => s + t.aberto, 0);
    });
    const max = Math.max(1, ...baldes.map(b => Math.max(b.er + b.ep, b.sr + b.sp)));
    const W = 560, H = 220, L = 58, B = 26, T = 10, larg = (W - L - 8) / baldes.length, bw = Math.max(4, Math.min(26, larg / 2 - 4));
    const y = v => T + (H - T - B) * (1 - v / max);
    const ticks = [0, .25, .5, .75, 1].map(f => max * f);
    const compact = v => (v / 100 >= 1000 ? (v / 100000).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mil' : Math.round(v / 100).toLocaleString('pt-BR'));
    let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de entradas e saídas por ${dias <= 62 ? 'semana' : 'mês'}">
      <defs><pattern id="h-ent" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect class="u-fill-pri-clara" width="5" height="5"/><rect class="u-fill-entrada" width="2" height="5"/></pattern>
      <pattern id="h-sai" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect class="u-fill-sec-clara" width="5" height="5"/><rect class="u-fill-saida" width="2" height="5"/></pattern></defs>`;
    ticks.forEach(v => { svg += `<line class="grade-y" x1="${L}" x2="${W - 4}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${compact(v)}</text>`; });
    baldes.forEach((b, i) => {
      const x0 = L + i * larg + larg / 2 - bw - 2, x1 = L + i * larg + larg / 2 + 2;
      const barra = (x, real, prev, cor, pat, nome) => {
        let s = '';
        if (real) s += `<rect x="${x}" y="${y(real)}" width="${bw}" height="${y(0) - y(real)}" style="fill:var(${cor})"><title>${nome} realizadas ${b.rot}: ${R(real)}</title></rect>`;
        if (prev) s += `<rect x="${x}" y="${y(real + prev)}" width="${bw}" height="${y(real) - y(real + prev)}" fill="url(#${pat})" style="stroke:var(${cor});stroke-width:.6"><title>${nome} previstas em aberto ${b.rot}: ${R(prev)}</title></rect>`;
        return s;
      };
      svg += barra(x0, b.er, b.ep, '--entrada', 'h-ent', 'Entradas') + barra(x1, b.sr, b.sp, '--saida', 'h-sai', 'Saídas');
      if (baldes.length <= 14 || i % Math.ceil(baldes.length / 14) === 0) svg += `<text x="${L + i * larg + larg / 2}" y="${H - 8}" text-anchor="middle">${b.rot}</text>`;
    });
    svg += `<line class="eixo" x1="${L}" x2="${W - 4}" y1="${y(0)}" y2="${y(0)}"/></svg>`;
    return `<div class="grafico">${svg}<div class="legenda"><span><i class="leg-ent-real"></i>Entradas realizadas</span><span><i class="leg-ent-prev"></i>Entradas previstas (em aberto)</span><span><i class="leg-sai-real"></i>Saídas realizadas</span><span><i class="leg-sai-prev"></i>Saídas previstas (em aberto)</span></div><p class="xs muted u-mt1">Valores em R$. Barras ${dias <= 62 ? 'por semana a partir de ' + D(de) : 'por mês'}.</p></div>`;
  }

  /* =================================================================
     CONTAS A RECEBER / A PAGAR
     ================================================================= */
  function opcoesPessoas(tipo, sel, comVazio, incluirInativos) {
    const ps = core.lista('pessoas').filter(p => (incluirInativos || p.ativo || p.id === sel) && (!tipo || p.tipo === tipo || p.tipo === 'ambos')).sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
    return (comVazio ? opt('', comVazio, sel) : '') + ps.map(p => opt(p.id, p.nome + (p.ativo ? '' : ' (inativo)'), sel)).join('');
  }
  function opcoesCategorias(tipo, sel, comVazio) {
    const cs = core.lista('categorias').filter(c => c.tipo === tipo && (c.ativa || c.id === sel));
    return (comVazio ? opt('', comVazio, sel) : '') + cs.map(c => opt(c.id, c.nome + (c.ativa ? '' : ' (inativa)'), sel)).join('');
  }
  function opcoesContas(sel, comVazio, todas) { return (comVazio ? opt('', comVazio, sel) : '') + core.lista('contas').filter(c => todas || c.ativa || c.id === sel).map(c => opt(c.id, c.nome + (c.ativa ? '' : ' (inativa)'), sel)).join(''); }
  function opcoesProjetos(sel, comVazio, clienteId) {
    const ps = core.lista('projetos').filter(p => (p.ativo || p.id === sel) && (!clienteId || !p.clienteId || p.clienteId === clienteId || p.id === sel)).sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
    return (comVazio ? opt('', comVazio, sel) : '') + ps.map(p => opt(p.id, (p.codigo ? p.codigo + ' — ' : '') + p.nome, sel)).join('');
  }

  /** Anexos em lote: cada PDF vai para o lançamento cuja nota fiscal ou proposta aparece no nome do arquivo. */

    NV.anexarLote({ alvos, aceitaCaminho: false, depois: () => render(), gravar: (id, lista) => { core.acrescentarAnexosTitulo(id, lista); } });
  }

    c.innerHTML = `
      <div class="cab"><h1 class="titulo-tela u-m0">${rec ? 'Contas a receber' : 'Contas a pagar'}</h1>
        <div class="linha no-print">${core.can('titulo.criar') ? `<button class="btn so-desktop ${rec ? 'btn-receita' : 'btn-despesa'}" data-act="novo-titulo" data-tipo="${tipo}">+ ${rec ? 'Nova receita' : 'Nova despesa'}</button>` : ''}
        ${typeof NV !== 'undefined' && NV && NV.pdfNaNuvem() && core.can('titulo.editar') ? `<button class="btn" data-act="anexar-lote" data-tipo="${tipo}">Anexar PDFs em lote</button>` : ''}
        <button class="btn" data-act="csv-titulos" data-tipo="${tipo}">Exportar CSV</button><button class="btn" data-act="imprimir-tela">Imprimir</button></div></div>
      <form class="filtros" id="filtros-tit" data-tipo="${tipo}" onsubmit="return false">
        <label class="campo busca">Busca<input type="search" name="busca" value="${esc(f.busca || '')}" placeholder="descrição, ${rec ? 'cliente' : 'fornecedor'}, NF, valor..."></label>
        <label class="campo">Situação<select name="situacao">${[['', 'Todas'], ['abertos', 'Em aberto (todos)'], ['aberto', 'Em aberto (no prazo)'], ['parcial', 'Parcial'], ['vencido', 'Vencido'], ['quitado', rec ? 'Recebido' : 'Pago'], ['cancelado', 'Cancelado']].map(([v, r]) => opt(v, r, f.situacao)).join('')}</select></label>
        <details class="filtros-mais" ${window.innerWidth > 760 || f.pessoaId || f.categoriaId || f.projetoId || f.contaId || f.vencDe || f.vencAte ? 'open' : ''}><summary>Mais filtros</summary><div class="filtros-mais-in">
        <label class="campo">${rec ? 'Cliente' : 'Fornecedor/favorecido'}<select name="pessoaId">${opcoesPessoas(null, f.pessoaId, 'Todos', true)}</select></label>
        <label class="campo">Categoria<select name="categoriaId">${opcoesCategorias(rec ? 'receita' : 'despesa', f.categoriaId, 'Todas')}</select></label>
        <label class="campo">Serviço/projeto<select name="projetoId">${opcoesProjetos(f.projetoId, 'Todos')}</select></label>
        <label class="campo">Conta<select name="contaId">${opcoesContas(f.contaId, 'Todas', true)}</select></label>
        <label class="campo">Vencimento de<input type="date" name="vencDe" value="${f.vencDe || ''}"></label>
        <label class="campo">Vencimento até<input type="date" name="vencAte" value="${f.vencAte || ''}"></label>
        <button type="button" class="btn" data-act="limpar-filtros" data-tipo="${tipo}">Limpar filtros</button>
        </div></details>
      </form>
      <div id="lista-tit">${tabelaTitulos(lista, {})}</div>`;
    const form = $('#filtros-tit');
    let tmr;
    const aplicar = () => { ui.filtros[tipo] = lerForm(form); $('#lista-tit').innerHTML = tabelaTitulos(core.listarTitulos(Object.assign({ tipo }, ui.filtros[tipo])), {}); };
    form.addEventListener('input', e => { clearTimeout(tmr); tmr = setTimeout(aplicar, e.target.type === 'search' ? 220 : 0); });
    form.addEventListener('change', aplicar);
  }

  function tabelaTitulos(lista, o) {
    const tot = lista.reduce((s, t) => ({ valor: s.valor + (t.cancelado ? 0 : t.valor), pago: s.pago + t.pago, aberto: s.aberto + t.aberto }), { valor: 0, pago: 0, aberto: 0 });
    const linhas = lista.map(t => {
      const podeBaixar = t.aberto > 0 && core.can('baixa.registrar');
      return `<tr class="clicavel ${t.cancelado ? 'riscado' : ''}" data-act="detalhe" data-id="${t.id}">
        <td data-l="Vencimento" class="num">${D(t.vencimento)}</td>
        ${o.mostrarTipo ? `<td data-l="Tipo">${t.tipo === 'receber' ? 'Receber' : 'Pagar'}</td>` : ''}
        <td data-l="${t.tipo === 'receber' ? 'Cliente' : 'Fornecedor'}">${esc(t.pessoaNome)}</td>
        <td data-l="Descrição">${esc(t.descricao)}${t.serieRotulo ? ` <span class="muted xs">(${t.serieRotulo})</span>` : ''}${t.projetoNome ? `<div class="xs muted">${esc(t.projetoNome)}</div>` : ''}</td>
        ${o.mostrarTipo ? '' : `<td data-l="Categoria" class="peq">${esc(t.categoriaNome)}</td>`}
        <td data-l="Valor" class="num">${R(t.valor)}</td>
        <td data-l="${t.tipo === 'receber' ? 'Recebido' : 'Pago'}" class="num">${t.pago ? R(t.pago) : '—'}</td>
        <td data-l="Em aberto" class="num"><b>${R(t.aberto)}</b></td>
        <td data-l="Situação">${stBadge(t.status, t.statusRotulo)}</td>
        <td class="acoes no-print">${podeBaixar ? `<button class="btn btn-sm btn-primario" data-act="baixar" data-id="${t.id}">${t.tipo === 'receber' ? 'Receber' : 'Pagar'}</button>` : ''}</td>
      </tr>`;
    }).join('');
    const cols = o.mostrarTipo ? 9 : 9;
    return `<div class="tabela-wrap"><table class="tab resp"><thead><tr><th class="num">Vencimento</th>${o.mostrarTipo ? '<th>Tipo</th>' : ''}<th>${o.mostrarTipo ? 'Pessoa' : (lista[0] && lista[0].tipo === 'pagar') || ui.aba === 'pagar' ? 'Fornecedor/favorecido' : 'Cliente'}</th><th>Descrição</th>${o.mostrarTipo ? '' : '<th>Categoria</th>'}<th class="num">Valor</th><th class="num">Pago/recebido</th><th class="num">Em aberto</th><th>Situação</th><th class="no-print"></th></tr></thead>
      <tbody>${linhas || `<tr><td colspan="${cols}" class="vazio">${o.vazio || 'Nenhum lançamento encontrado com estes filtros.'}</td></tr>`}</tbody>
      ${!o.semTotais && lista.length ? `<tfoot><tr><td data-l="Total">${lista.length} lançamento(s)</td><td colspan="${o.mostrarTipo ? 2 : 3}" class="no-resp"></td><td data-l="Valor (sem cancelados)" class="num">${R(tot.valor)}</td><td data-l="Pago/recebido" class="num">${R(tot.pago)}</td><td data-l="Em aberto" class="num">${R(tot.aberto)}</td><td colspan="2"></td></tr></tfoot>` : ''}
    </table></div>`;
  }

  /* ---------- formulário de lançamento ---------- */
  function formTitulo(tipo, t) {
    const rec = tipo === 'receber';
    const edit = !!t;
    const contas = core.lista('contas').filter(c => c.ativa);
    if (!edit && !contas.length) {
      return abrirModal({ titulo: rec ? 'Nova receita' : 'Nova despesa', tamanho: 'estreito', corpo: `<div class="aviso aviso-alerta">Cadastre pelo menos uma conta bancária ou caixa antes de lançar. ${core.can('conta.salvar') ? '' : 'Peça ao administrador.'}</div>`, rodape: core.can('conta.salvar') ? '<button class="btn btn-primario" data-act="nova-conta" data-fechar>Cadastrar conta</button>' : '<button class="btn" data-fechar>Fechar</button>' });
    }
    t = t || { tipo, competencia: hojeISO(), vencimento: hojeISO(), contaId: contas[0].id, anexos: [] };
    const recorrente = edit && !!t.recorrenciaId;
    let anexos = (t.anexos || []).slice();
    const corpo = `<form id="form-tit" novalidate class="grade">
      <div class="grade g2">
        <label class="campo"><span>${rec ? 'Cliente' : 'Fornecedor ou favorecido'} <span class="req">*</span></span>
          <div class="linha u-nowrap"><select name="pessoaId" required>${opcoesPessoas(null, t.pessoaId, 'Selecione...')}</select>${core.can('pessoa.salvar') ? '<button type="button" class="btn btn-sm" data-act="pessoa-rapida" title="Cadastrar novo">+ Novo</button>' : ''}</div></label>
        <label class="campo"><span>Descrição <span class="req">*</span></span><input type="text" name="descricao" required maxlength="160" value="${esc(t.descricao || '')}" placeholder="${rec ? 'Ex.: Laudo de inspeção — unidade Centro' : 'Ex.: Combustível visita técnica'}"></label>
        <label class="campo"><span>${edit ? 'Valor' : 'Valor total'} <span class="req">*</span></span>${moedaInput('valor', t.valor, 'required')}</label>
        <label class="campo"><span>${edit ? 'Vencimento' : 'Vencimento (1ª parcela)'} <span class="req">*</span></span><input type="date" name="vencimento" required value="${t.vencimento}"></label>
        <label class="campo"><span>Categoria <span class="req">*</span></span><select name="categoriaId" required>${opcoesCategorias(rec ? 'receita' : 'despesa', t.categoriaId, 'Selecione...')}</select></label>
        <label class="campo"><span>${rec ? 'Conta de recebimento' : 'Conta de pagamento'} <span class="req">*</span></span><select name="contaId" required>${opcoesContas(t.contaId)}</select></label>
      </div>
      ${!edit ? `<div class="grade g2">
        <label class="campo">Parcelas<input type="number" name="parcelas" min="1" max="120" step="1" value="1"><span class="ajuda" id="ajuda-parc">À vista (1 parcela).</span></label>
        ${!rec ? '<label class="campo">Recorrência mensal (nº de meses)<input type="number" name="recorrencia" min="0" max="60" step="1" value="0"><span class="ajuda">0 = não recorrente. Ex.: 12 gera 12 despesas mensais.</span></label>' : '<div></div>'}
      </div>` : ''}
      <details class="mais" ${t.projetoId || t.proposta || t.notaFiscal || t.obs || (t.anexos || []).length || (edit && t.competencia !== t.vencimento) ? 'open' : ''}><summary>Mais informações (opcional)</summary>
        <div class="grade g2">
          ${!rec ? `<label class="campo">Cliente vinculado<select name="clienteId">${opcoesPessoas(null, t.clienteId, 'Nenhum (despesa administrativa)')}</select><span class="ajuda">Use para custo direto de um cliente.</span></label>` : ''}
          <label class="campo">Serviço/projeto<div class="linha u-nowrap"><select name="projetoId">${opcoesProjetos(t.projetoId, 'Nenhum')}</select>${core.can('projeto.salvar') ? '<button type="button" class="btn btn-sm" data-act="projeto-rapido">+ Novo</button>' : ''}</div></label>
          <label class="campo">Data de competência<input type="date" name="competencia" value="${t.competencia || ''}"><span class="ajuda">Mês a que se refere o serviço/despesa. Padrão: hoje.</span></label>
          <label class="campo">Forma de pagamento ${rec ? 'prevista' : ''}<select name="formaPagamento">${opt('', '—', t.formaPagamento)}${FORMAS_PAGAMENTO.map(fp => opt(fp, fp, t.formaPagamento)).join('')}</select></label>
          ${rec ? `<label class="campo">Nº da proposta<input type="text" name="proposta" maxlength="40" value="${esc(t.proposta || '')}"></label>` : ''}
          <label class="campo">Nº da nota fiscal<input type="text" name="notaFiscal" maxlength="40" value="${esc(t.notaFiscal || '')}"></label>
          <label class="campo span2">Observações<textarea name="obs" maxlength="1000">${esc(t.obs || '')}</textarea></label>
          <div class="campo span2"><span>Anexos <span class="ajuda">(até 400 KB cada; ficam salvos neste navegador)</span></span><input type="file" id="in-anexos" multiple><div id="lista-anexos" class="peq"></div></div>
        </div>
      </details>
      ${recorrente ? `<div class="aviso aviso-info"><b>Despesa recorrente</b> (ocorrência ${t.ocorrencia}/${t.totalOcorrencias}). Aplicar a alteração em:<div class="linha u-mt15"><label><input type="radio" name="escopo" value="este" checked> somente esta ocorrência</label><label><input type="radio" name="escopo" value="proximos"> esta e as próximas</label></div><span class="xs">Ocorrências já pagas nunca são alteradas.</span></div>` : ''}
      ${edit && t.pago > 0 ? `<div class="aviso aviso-alerta">Já ${rec ? 'recebido' : 'pago'} ${R(t.pago)}. O valor não pode ficar abaixo disso.</div>` : ''}
      <div class="erro-form" id="tit-erro" role="alert"></div>
    </form>`;
    const m = abrirModal({
      titulo: edit ? `Editar ${rec ? 'receita' : 'despesa'}` : rec ? 'Nova receita' : 'Nova despesa', tamanho: 'largo', corpo,
      rodape: `<button class="btn" data-fechar>Cancelar</button><button class="btn btn-primario" id="salvar-tit">${edit ? 'Salvar alterações' : 'Lançar'}</button>`
    });
    const form = $('#form-tit', m);
    const desenharAnexos = () => {
      $('#lista-anexos', m).innerHTML = anexos.map((a, i) => `<div class="linha"><span>📎 ${esc(a.nome)} <span class="muted xs">${Math.round((a.tamanho || 0) / 1024)} KB</span></span><button type="button" class="btn-link" data-rm-anexo="${i}">remover</button></div>`).join('') || '<span class="muted xs">Nenhum anexo.</span>';
    };
    desenharAnexos();
    m.addEventListener('click', e => { const b = e.target.closest('[data-rm-anexo]'); if (b) { anexos.splice(+b.dataset.rmAnexo, 1); desenharAnexos(); } });
    $('#in-anexos', m).addEventListener('change', async e => {
      for (const f of e.target.files) {
        if (f.size > 400 * 1024) { toast(`"${f.name}" tem mais de 400 KB e não foi anexado.`, 'erro'); continue; }
        const dataUrl = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); });
        anexos.push({ nome: f.name, tipo: f.type, tamanho: f.size, dataUrl });
      }
      e.target.value = ''; desenharAnexos();
    });
    const atualizarAjuda = () => {
      const ap = $('#ajuda-parc', m); if (!ap) return;
      const n = parseInt(form.parcelas.value, 10) || 1, v = Money.parse(form.valor.value);
      if (n <= 1) { ap.textContent = 'À vista (1 parcela).'; return; }
      if (Number.isNaN(v) || v <= 0) { ap.textContent = `${n} parcelas mensais.`; return; }
      const p = Money.split(v, n);
      ap.textContent = `${n}x mensais: ${p[0] === p[n - 1] ? n + ' × ' + R(p[0]) : R(p[0]) + (p.filter(x => x === p[0]).length > 1 ? ' (×' + p.filter(x => x === p[0]).length + ')' : '') + ' + ' + R(p[n - 1]) + ' (×' + p.filter(x => x === p[n - 1]).length + ')'} = ${R(v)}`;
    };
    form.addEventListener('input', atualizarAjuda);
    if (form.recorrencia) form.addEventListener('input', e => { if (e.target.name === 'recorrencia' && +e.target.value > 0) form.parcelas.value = 1; if (e.target.name === 'parcelas' && +e.target.value > 1) form.recorrencia.value = 0; });
    if (form.clienteId) form.clienteId.addEventListener('change', () => { const sel = form.projetoId.value; form.projetoId.innerHTML = opcoesProjetos(sel, 'Nenhum', form.clienteId.value || null); });
    if (rec) form.pessoaId.addEventListener('change', () => { const sel = form.projetoId.value; form.projetoId.innerHTML = opcoesProjetos(sel, 'Nenhum', form.pessoaId.value || null); });
    m.addEventListener('click', async e => {
      if (e.target.closest('[data-act="pessoa-rapida"]')) {
        const p = await formPessoa(null, rec ? 'cliente' : 'fornecedor');
        if (p) { form.pessoaId.innerHTML = opcoesPessoas(null, p.id, 'Selecione...'); if (form.clienteId) form.clienteId.innerHTML = opcoesPessoas(null, form.clienteId.value, 'Nenhum (despesa administrativa)'); }
      }
      if (e.target.closest('[data-act="projeto-rapido"]')) {
        const p = await formProjeto(null, rec ? form.pessoaId.value : (form.clienteId.value || ''));
        if (p) form.projetoId.innerHTML = opcoesProjetos(p.id, 'Nenhum');
      }
    });
    $('#salvar-tit', m).addEventListener('click', async () => {
      const d = lerForm(form), erro = $('#tit-erro', m);
      $$('.invalido', form).forEach(x => x.classList.remove('invalido'));
      const marcar = n => form[n] && form[n].classList.add('invalido');
      const faltas = [];
      if (!d.pessoaId) { marcar('pessoaId'); faltas.push(rec ? 'cliente' : 'fornecedor'); }
      if (!d.descricao.trim()) { marcar('descricao'); faltas.push('descrição'); }
      if (Number.isNaN(d.valor) || d.valor <= 0) { marcar('valor'); faltas.push('valor'); }
      if (!d.vencimento) { marcar('vencimento'); faltas.push('vencimento'); }
      if (!d.categoriaId) { marcar('categoriaId'); faltas.push('categoria'); }
      if (faltas.length) { erro.textContent = 'Preencha: ' + faltas.join(', ') + '.'; return; }
      d.tipo = tipo; d.anexos = anexos;
      if (!d.competencia) d.competencia = edit ? t.competencia : hojeISO();
      d.parcelas = d.parcelas ? parseInt(d.parcelas, 10) : 1;
      d.recorrencia = d.recorrencia ? parseInt(d.recorrencia, 10) : 0;
      const res = edit
        ? await executar(conf => core.editarTitulo(t.id, d, { escopo: d.escopo, confirmar: conf }))
        : await executar(conf => core.criarTitulo(d, { confirmar: conf }));
      if (!res.ok) return mostrarErro(res, erro);
      fecharModal(m);
      if (edit) toast(res.r.preservados ? `${res.r.alterados} ocorrência(s) alterada(s); ${res.r.preservados} já paga(s) preservada(s).` : 'Alterações salvas.', 'ok');
      else toast(res.r.length > 1 ? `${res.r.length} lançamentos criados.` : 'Lançamento criado.', 'ok');
      renderAba();
    });
    return m;
  }

  /* ---------- baixa ---------- */
  function formBaixa(id) {
    const t = core.titulo(id);
    if (!t || t.aberto <= 0) return toast('Este lançamento não tem saldo em aberto.', 'erro');
    const rec = t.tipo === 'receber';
    const m = abrirModal({
      titulo: rec ? 'Registrar recebimento' : 'Registrar pagamento', tamanho: '',
      corpo: `<div class="aviso aviso-info"><b>${esc(t.descricao)}</b>${t.serieRotulo ? ' (' + t.serieRotulo + ')' : ''} — ${esc(t.pessoaNome)}<br>Valor ${R(t.valor)} · já ${rec ? 'recebido' : 'pago'} ${R(t.pago)} · <b>em aberto ${R(t.aberto)}</b> · vencimento ${D(t.vencimento)}</div>
      <form id="form-bx" class="grade" novalidate>
        <div class="grade g2">
          <label class="campo"><span>Data do ${rec ? 'recebimento' : 'pagamento'} <span class="req">*</span></span><input type="date" name="data" value="${hojeISO()}" max="${hojeISO()}" required></label>
          <label class="campo"><span>Conta <span class="req">*</span></span><select name="contaId">${opcoesContas(core.get('contas', t.contaId) && core.get('contas', t.contaId).ativa ? t.contaId : '')}</select></label>
          <label class="campo"><span>Valor abatido do título <span class="req">*</span></span>${moedaInput('principal', t.aberto, 'required')}<span class="ajuda">Quanto do saldo em aberto esta baixa quita. Menor que o aberto = baixa parcial.</span></label>
          <label class="campo">Forma de pagamento<select name="formaPagamento">${opt('', '—', t.formaPagamento)}${FORMAS_PAGAMENTO.map(fp => opt(fp, fp, t.formaPagamento)).join('')}</select></label>
          <label class="campo">Juros / multa${moedaInput('juros', '', 'data-vazio="zero"')}</label>
          <label class="campo">Desconto concedido${moedaInput('desconto', '', 'data-vazio="zero"')}</label>
          <label class="campo">${rec ? 'Taxa (tarifa, cartão, boleto)' : 'Taxa/tarifa do pagamento'}${moedaInput('taxa', '', 'data-vazio="zero"')}</label>
          <label class="campo span2" id="bx-modo-taxa">Como tratar a taxa<select name="modoTaxa">${Object.entries(MODOS_TAXA).map(([k, v]) => opt(k, v.rotulo, core.config().modoTaxa || 'liquido')).join('')}</select><span class="ajuda" id="bx-modo-ajuda"></span></label>
          <label class="campo">Observação<input type="text" name="obs" maxlength="200"></label>
        </div>
        <div class="resumo-valores" id="bx-resumo"></div>
        <div class="erro-form" id="bx-erro" role="alert"></div>
      </form>`,
      rodape: `<button class="btn" data-fechar>Cancelar</button><button class="btn btn-primario" id="salvar-bx">Confirmar ${rec ? 'recebimento' : 'pagamento'}</button>`
    });
    const form = $('#form-bx', m);
    const calc = () => {
      const d = lerForm(form);
      const p = Number.isNaN(d.principal) ? 0 : d.principal, j = d.juros || 0, de = d.desconto || 0, tx = d.taxa || 0;
      const separada = d.modoTaxa === 'separado';
      const bruto = p + j - de;
      const ef = separada ? bruto : rec ? bruto - tx : bruto + tx;
      const liquidoConta = rec ? bruto - tx : bruto + tx;
      $('#bx-modo-ajuda', m).textContent = MODOS_TAXA[d.modoTaxa].ajuda;
      $('#bx-resumo', m).innerHTML = `<div><span>${rec ? 'Recebimento registrado' : 'Pagamento registrado'}${separada ? ' (bruto)' : ''}</span><b>${R(ef)}</b></div>${separada && tx ? `<div><span>Tarifa lançada à parte</span><b>${R(tx)}</b></div>` : ''}<div><span>Efeito líquido na conta</span><b>${rec ? '+' : '−'} ${R(liquidoConta)}</b></div><div><span>Saldo em aberto após</span><b>${R(Math.max(0, t.aberto - p))}</b></div><div><span>Situação após</span><b>${t.aberto - p <= 0 ? (rec ? 'Recebido' : 'Pago') : 'Parcial'}</b></div>`;
    };
    form.addEventListener('input', calc); form.addEventListener('change', calc); calc();
    $('#salvar-bx', m).addEventListener('click', async () => {
      const d = lerForm(form), erro = $('#bx-erro', m);
      if (Number.isNaN(d.principal)) { erro.textContent = 'Informe o valor abatido.'; return; }
      for (const k of ['juros', 'desconto', 'taxa']) if (Number.isNaN(d[k])) { erro.textContent = 'Valor inválido em ' + k + '.'; return; }
      const res = await executar(() => core.registrarBaixa(t.id, d));
      if (!res.ok) return mostrarErro(res, erro);
      fecharModal(m);
      toast(`${rec ? 'Recebimento' : 'Pagamento'} registrado: ${R(res.r.valorEfetivo)}.`, 'ok');
      $$('.modal-fundo').forEach(x => x.remove()); document.body.style.overflow = '';
      renderAba();
    });
  }

  const RELATORIOS = {
    contas: { nome: 'Contas a pagar e a receber por período', filtros: ['periodo', 'cliente', 'fornecedor', 'categoria', 'conta', 'projeto', 'situacao'] },
    inadimplencia: { nome: 'Inadimplência por cliente', filtros: ['cliente', 'categoria', 'conta', 'projeto'] },
    fluxo: { nome: 'Fluxo de caixa previsto e realizado', filtros: ['periodo', 'cliente', 'fornecedor', 'categoria', 'conta', 'projeto'] },
    categorias: { nome: 'Receitas e despesas por categoria', filtros: ['periodo', 'cliente', 'fornecedor', 'categoria', 'conta', 'projeto'] },
    resultado: { nome: 'Resultado direto por cliente e serviço/projeto', filtros: ['cliente', 'fornecedor', 'categoria', 'conta', 'projeto'] },
    mensal: { nome: 'Resumo financeiro mensal', filtros: ['periodo'] }
  };
  const SIT_ROT = { '': 'Todas', abertos: 'Em aberto (todos)', aberto: 'Em aberto (no prazo)', parcial: 'Parcial', vencido: 'Vencido', quitado: 'Recebido/pago', cancelado: 'Cancelado' };

  function montarRelatorio(tipo, f) {
    const de = f.de || ui.periodo.de, ate = f.ate || ui.periodo.ate;
    const nomePes = id => (core.get('pessoas', id) || {}).nome, nomeCat = id => (core.get('categorias', id) || {}).nome, nomeCta = id => (core.get('contas', id) || {}).nome, nomePrj = id => (core.get('projetos', id) || {}).nome;
    const filtrosTxt = [];
    const usa = RELATORIOS[tipo].filtros;
    if (usa.includes('periodo')) filtrosTxt.push(`Período: ${D(de)} a ${D(ate)}`);
    if (f.clienteId && usa.includes('cliente')) filtrosTxt.push('Cliente: ' + nomePes(f.clienteId));
    if (f.fornecedorId && usa.includes('fornecedor')) filtrosTxt.push('Fornecedor: ' + nomePes(f.fornecedorId));
    if (f.categoriaId && usa.includes('categoria')) filtrosTxt.push('Categoria: ' + nomeCat(f.categoriaId));
    if (f.contaId && usa.includes('conta')) filtrosTxt.push('Conta: ' + nomeCta(f.contaId));
    if (f.projetoId && usa.includes('projeto')) filtrosTxt.push('Serviço/projeto: ' + nomePrj(f.projetoId));
    if (f.situacao && usa.includes('situacao')) filtrosTxt.push('Situação: ' + SIT_ROT[f.situacao]);
    const fil = { clienteId: f.clienteId || '', fornecedorId: f.fornecedorId || '', categoriaId: f.categoriaId || '', contaId: f.contaId || '', projetoId: f.projetoId || '' };
    const r = { tipo, titulo: RELATORIOS[tipo].nome, periodo: usa.includes('periodo') ? `${D(de)} a ${D(ate)}` : `posição em ${D(hojeISO())}`, filtros: filtrosTxt.length ? filtrosTxt.join(' · ') : 'Nenhum filtro aplicado', secoes: [], notas: [] };
    const C = (rot, tp) => ({ rot, tp: tp || 'txt' });

    if (tipo === 'contas') {
      for (const tp of ['receber', 'pagar']) {
        if (fil.fornecedorId && tp === 'receber') continue;
        const ff = Object.assign({}, fil, { tipo: tp, vencDe: de, vencAte: ate, situacao: f.situacao || '' });
        if (tp === 'pagar' && fil.fornecedorId) { ff.pessoaId = fil.fornecedorId; }
        delete ff.fornecedorId;
        const l = core.listarTitulos(ff);
        r.secoes.push({
          titulo: tp === 'receber' ? 'Contas a receber' : 'Contas a pagar',
          colunas: [C('Vencimento', 'data'), C(tp === 'receber' ? 'Cliente' : 'Fornecedor/favorecido'), C('Descrição'), C('Categoria'), C('Serviço/projeto'), C('Valor', 'moeda'), C(tp === 'receber' ? 'Recebido' : 'Pago', 'moeda'), C('Em aberto', 'moeda'), C('Situação')],
          linhas: l.map(t => [t.vencimento, t.pessoaNome, t.descricao + (t.serieRotulo ? ` (${t.serieRotulo})` : ''), t.categoriaNome, t.projetoNome, t.cancelado ? 0 : t.valor, t.pago, t.aberto, t.statusRotulo]),
          total: ['Total', `${l.length} lançamento(s)`, '', '', '', l.reduce((s, t) => s + (t.cancelado ? 0 : t.valor), 0), l.reduce((s, t) => s + t.pago, 0), l.reduce((s, t) => s + t.aberto, 0), '']
        });
      }

  function fmtCel(v, tp) {
    if (v == null || v === '') return '';
    if (tp === 'moeda') return R(v);
    if (tp === 'data') return D(v);
    if (tp === 'pct') return pct(v);
    if (tp === 'num') return String(v);
    return String(v);
  }

  function relCSV(r) {
    const linhas = [[r.titulo], ['Referência', r.periodo], ['Filtros', r.filtros], ['Emitido em', agoraBR()], []];
    for (const s of r.secoes) {
      linhas.push([s.titulo]);
      linhas.push(s.colunas.map(c => c.rot));
      s.linhas.forEach(l => linhas.push(l.map((v, i) => csvVal(v, s.colunas[i].tp))));
      if (s.total) linhas.push(s.total.map((v, i) => (i === 0 ? v : csvVal(v, s.colunas[i].tp))));
      linhas.push([]);
    }
    r.notas.forEach(n => linhas.push([n]));
    return toCSV(linhas);
  }
  function relTexto(r, numero) {
    const cfg = core.config();
    let t = `${cfg.empresa.toUpperCase()} — ${r.titulo}\nNº ${numero || 'prévia'} · Emissão ${agoraBR()} · Responsável ${cfg.responsavel || core.user().nome}\nReferência: ${r.periodo}\nFiltros: ${r.filtros}\n`;
    for (const s of r.secoes) {
      t += `\n${s.titulo.toUpperCase()}\n`;
      s.linhas.forEach(l => { t += '- ' + l.map((v, i) => fmtCel(v, s.colunas[i].tp)).filter(Boolean).join(' | ') + '\n'; });
      if (!s.linhas.length) t += '- Sem registros.\n';
      if (s.total && s.linhas.length) t += '= ' + s.total.map((v, i) => (i === 0 ? v : fmtCel(v, s.colunas[i].tp))).filter(Boolean).join(' | ') + '\n';
    }
    t += '\n' + r.notas.map(n => '* ' + n).join('\n');
    return t;
  }

  function csvVal(v, tp) {
    if (v == null) return '';

  }
  function toCSV(linhas) { return '﻿' + linhas.map(l => l.map(v => { const s = String(v == null ? '' : v); return /[;"\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(';')).join('\r\n'); }
  function baixar(nome, conteudo, mime) {
    const blob = new Blob([conteudo], { type: mime });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = nome;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }

    'exportar-json': () => baixar(`wrd-financeiro-dados-${carimbo()}.json`, JSON.stringify(core.snapshot({}), null, 1), 'application/json'),
    'salvar-config': async () => { const res = await executar(() => core.salvarConfig(lerForm($('#form-cfg'))), 'Configurações salvas.'); if (!res.ok) return mostrarErro(res, $('#cfg-erro')); render(); },
    'trocar-senha': async () => { const d = lerForm($('#form-senha')); if (d.nova !== d.nova2) { $('#senha-erro').textContent = 'As novas senhas não conferem.'; return; } const res = await executar(() => core.alterarSenha(d.atual, d.nova), 'Senha alterada.'); if (!res.ok) return mostrarErro(res, $('#senha-erro')); $('#form-senha').reset(); $('#senha-erro').textContent = ''; },
    'nova-categoria': el => formCategoria(null, el.dataset.tipo),
    'editar-categoria': el => formCategoria(el.dataset.id),
    'alternar-categoria': async el => { const c = core.get('categorias', el.dataset.id); const res = await executar(() => core.salvarCategoria(Object.assign({}, c, { ativa: !c.ativa })), c.ativa ? 'Categoria inativada.' : 'Categoria reativada.'); if (!res.ok) return mostrarErro(res); renderAba(); },
    'novo-usuario': () => formUsuario(),
    'editar-usuario': el => formUsuario(el.dataset.id),
    'apagar-tudo': async () => { const txt = await pedirTexto('Apagar todos os dados', 'Esta ação não pode ser desfeita. Faça um backup antes. Para confirmar, digite APAGAR.', 'Digite APAGAR', 'Apagar definitivamente'); if (!txt) return; const res = await executar(() => core.apagarTudo(txt.trim()), 'Dados apagados.'); if (!res.ok) return mostrarErro(res); render(); },
    modo: el => { modo = el.dataset.modo; try { sessionStorage.setItem(NS_REAL + '.modo', modo); } catch (e) { /* aba privada */ } limparEstadoUI(); if (modo === 'real' && NV && NV.abrir()) return; iniciarCore(); if (modo === 'demo' && core && !core.hasUsers()) semearDemo(); render(); window.scrollTo(0, 0); },
    'trocar-modo': () => { if (NV) NV.parar(); if (core && core.user()) core.logout(); modo = null; core = null; erroCarga = null; try { sessionStorage.removeItem(NS_REAL + '.modo'); } catch (e) { /* aba privada */ } render(); },
    'entrar-demo': el => { core.entrarDemo(el.dataset.login); render(); },
    'recriar-demo': async () => { if (!(await confirmar('Recriar demonstração', 'Apagar a demonstração atual e gerar novamente os dados fictícios?', 'Recriar'))) return; for (const k of ['state']) adaptador('localStorage', NS_DEMO).remove(k); adaptador('sessionStorage', NS_DEMO).remove('session'); iniciarCore(); semearDemo(); render(); },
    'baixar-bruto': () => { const ns = modo === 'demo' ? NS_DEMO : NS_REAL; baixar(`wrd-financeiro-BRUTO-${new Date().toISOString().slice(0, 10)}.txt`, localStorage.getItem(ns + ':state') || '', 'text/plain'); },
    'descartar-corrompido': async () => { if (!(await confirmar('Descartar dados', 'Os dados ilegíveis serão apagados deste navegador. Baixou a cópia bruta?', 'Descartar', true))) return; const ns = modo === 'demo' ? NS_DEMO : NS_REAL; localStorage.removeItem(ns + ':state'); iniciarCore(); render(); }
  };
  function formCategoria(id, tipo) {
    const c = id ? core.get('categorias', id) : { tipo, ativa: true };
    const m = abrirModal({
      titulo: id ? 'Editar categoria' : 'Nova categoria', tamanho: 'estreito',
      corpo: `<form id="form-cat" class="grade" novalidate><label class="campo"><span>Nome <span class="req">*</span></span><input type="text" name="nome" maxlength="80" value="${esc(c.nome || '')}"></label>
        <label class="campo">Tipo<select name="tipo">${opt('receita', 'Receita', c.tipo)}${opt('despesa', 'Despesa', c.tipo)}</select></label><div class="erro-form" id="cat-erro"></div></form>`,
      rodape: `<button class="btn" data-fechar>Cancelar</button><button class="btn btn-primario" id="salvar-cat">Salvar</button>`
    });
    $('#salvar-cat', m).addEventListener('click', async () => {
      const d = Object.assign({}, c, lerForm($('#form-cat', m)));
      const res = await executar(() => core.salvarCategoria(d), 'Categoria salva.');
      if (!res.ok) return mostrarErro(res, $('#cat-erro', m));
      fecharModal(m); renderAba();
    });
  }

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el || el.tagName === 'SELECT' || el.tagName === 'INPUT') return;
    const fn = ACOES[el.dataset.act];
    if (!fn) return;
    if (el.tagName === 'A') e.preventDefault();
    Promise.resolve().then(() => fn(el, e)).catch(er => { console.error(er); toast(er.message, 'erro'); if (er.code === 'AUTH') render(); });
  });
  document.addEventListener('change', e => {
    const el = e.target;
    if (!el.dataset || !el.dataset.act) return;
    if (el.dataset.act === 'per-de' || el.dataset.act === 'per-ate') {
      if (!Dates.valid(el.value)) return;
      ui.periodo = Object.assign({}, ui.periodo, { preset: 'custom' }, el.dataset.act === 'per-de' ? { de: el.value } : { ate: el.value });
      if (ui.periodo.de > ui.periodo.ate) { toast('A data inicial é posterior à final.', 'erro'); return; }
      ui.extrato.de = null; ui.rel.f.de = null; renderAba(); return;
    }
    const fn = ACOES[el.dataset.act]; if (fn) fn(el, e);
  });

  /* =================================================================
     DEMONSTRAÇÃO — dados FICTÍCIOS, em armazenamento separado
     ================================================================= */
  const senhaAleatoria = () => 'D' + Math.random().toString(36).slice(2) + Date.now().toString(36);
  function semearDemo() {
    const h = core.hoje(), d = n => Dates.addDays(h, n);
    // Senhas aleatórias: na demonstração se entra escolhendo o perfil (core.entrarDemo), sem senha escrita no código.
    core.setupAdmin({ nome: 'Administrador (DEMO)', login: 'admin', senha: senhaAleatoria() });
    core.salvarUsuario({ nome: 'Operador (DEMO)', login: 'operador', perfil: 'operador', senha: senhaAleatoria() });
    core.salvarUsuario({ nome: 'Consulta (DEMO)', login: 'consulta', perfil: 'consulta', senha: senhaAleatoria() });
    core.salvarConfig({ empresa: 'WRD Soluções — DEMONSTRAÇÃO', responsavel: 'Administrador (DEMO)' });
    const banco = core.salvarConta({ nome: 'Banco Exemplo (DEMO)', tipo: 'banco', saldoInicial: 1500000, dataSaldoInicial: d(-90) });
    const caixa = core.salvarConta({ nome: 'Caixa (DEMO)', tipo: 'caixa', saldoInicial: 30000, dataSaldoInicial: d(-90) });
    const alfa = core.salvarPessoa({ tipo: 'cliente', nome: 'Cliente Exemplo Alfa (DEMO)', contato: 'Contato fictício' });
    const beta = core.salvarPessoa({ tipo: 'cliente', nome: 'Cliente Exemplo Beta (DEMO)' });
    const forn = core.salvarPessoa({ tipo: 'fornecedor', nome: 'Fornecedor Exemplo (DEMO)' });
    const soft = core.salvarPessoa({ tipo: 'fornecedor', nome: 'Software Exemplo (DEMO)' });
    const proj = core.salvarProjeto({ nome: 'PPCI Galpão Exemplo (DEMO)', clienteId: alfa.id, codigo: 'DEMO-001' });
    const proj2 = core.salvarProjeto({ nome: 'Treinamento de brigada (DEMO)', clienteId: beta.id, codigo: 'DEMO-002' });
    const parc = core.criarTitulo({ tipo: 'receber', pessoaId: alfa.id, descricao: 'Projeto de incêndio (DEMO)', projetoId: proj.id, categoriaId: 'cat_r_incendio', valor: 1000000, competencia: d(-40), vencimento: d(-30), contaId: banco.id, parcelas: 3, proposta: 'DEMO-P-01' }, { confirmar: true });
    core.registrarBaixa(parc[0].id, { data: d(-28), contaId: banco.id, principal: 200000, taxa: 250, formaPagamento: 'PIX' });
    const dv = core.criarTitulo({ tipo: 'pagar', pessoaId: forn.id, descricao: 'Desenhista terceirizado (DEMO)', projetoId: proj.id, clienteId: alfa.id, categoriaId: 'cat_d_prestadores', valor: 150000, competencia: d(-25), vencimento: d(-20), contaId: banco.id }, { confirmar: true });
    core.registrarBaixa(dv[0].id, { data: d(-19), contaId: banco.id, principal: 150000 });
    const art = core.criarTitulo({ tipo: 'pagar', pessoaId: forn.id, descricao: 'ART do projeto (DEMO)', projetoId: proj.id, clienteId: alfa.id, categoriaId: 'cat_d_art', valor: 26000, competencia: d(-10), vencimento: d(-5), contaId: banco.id }, { confirmar: true });
    const rec = core.criarTitulo({ tipo: 'pagar', pessoaId: soft.id, descricao: 'Sistema de gestão (DEMO)', categoriaId: 'cat_d_sistemas', valor: 9900, competencia: d(-60), vencimento: d(-60), contaId: banco.id, recorrencia: 12 }, { confirmar: true });
    core.registrarBaixa(rec[0].id, { data: d(-60), contaId: banco.id, principal: 9900 });
    core.registrarBaixa(rec[1].id, { data: Dates.addMonths(d(-60), 1) <= h ? Dates.addMonths(d(-60), 1) : h, contaId: banco.id, principal: 9900 });
    const b1 = core.criarTitulo({ tipo: 'receber', pessoaId: beta.id, descricao: 'Treinamento NR-23 (DEMO)', projetoId: proj2.id, categoriaId: 'cat_r_treinamento', valor: 450000, competencia: d(-80), vencimento: d(-70), contaId: banco.id }, { confirmar: true });
    const b2 = core.criarTitulo({ tipo: 'receber', pessoaId: beta.id, descricao: 'Laudo de inspeção (DEMO)', categoriaId: 'cat_r_inspecao', valor: 80000, competencia: d(-20), vencimento: d(-15), contaId: banco.id }, { confirmar: true });
    const bx = core.registrarBaixa(b2[0].id, { data: d(-14), contaId: banco.id, principal: 80000 });
    core.estornarBaixa(bx.id, 'Exemplo de estorno — pagamento devolvido (DEMO)');
    core.criarTitulo({ tipo: 'receber', pessoaId: alfa.id, descricao: 'Manutenção de extintores (DEMO)', categoriaId: 'cat_r_manutencao', valor: 120000, competencia: h, vencimento: h, contaId: banco.id }, { confirmar: true });
    core.criarTitulo({ tipo: 'pagar', pessoaId: forn.id, descricao: 'Aluguel da sala (DEMO)', categoriaId: 'cat_d_estrutura', valor: 180000, competencia: d(5), vencimento: d(10), contaId: banco.id }, { confirmar: true });
    core.criarTransferencia({ origemId: banco.id, destinoId: caixa.id, valor: 30000, data: d(-10), descricao: 'Reforço de caixa (DEMO)' });
    core.criarMovSocio({ tipo: 'aporte', contaId: banco.id, valor: 100000, data: d(-50), socio: 'Sócio Exemplo (DEMO)' });
    core.criarMovSocio({ tipo: 'retirada', contaId: banco.id, valor: 50000, data: d(-3), socio: 'Sócio Exemplo (DEMO)' });
    void art; void b1;
    core.logout(); // a demonstração começa pela escolha do perfil
  }

  /* =================================================================
     CONTRATO DE PLUG — window.NEXO_MODULE (nexo-plug/1)
     Comunicação externa somente por window.parent.postMessage.
     ================================================================= */
  const extListeners = {};
  const NEXO = {
    manifest: MANIFEST,
    getState() {
      try { return core.snapshot({ semAnexos: true }); } catch (e) { return { erro: e.message, codigo: e.code || 'ERRO' }; }
    },
    getKPIs(de, ate) {
      try {
        const h = core.hoje(); de = de || Dates.inicioMes(h); ate = ate || Dates.fimMes(h);
        const k = core.kpis(de, ate);
        const v = c => Math.round(c) / 100;
        const valores = { saldo_consolidado: k.saldoAtual, a_receber_periodo: k.aReceber, a_pagar_periodo: k.aPagar, receber_em_atraso: k.atrasoReceber, pagar_em_atraso: k.atrasoPagar, recebido_periodo: k.recebido, pago_periodo: k.pago, resultado_caixa_periodo: k.resultadoCaixa, saldo_projetado_30d: k.saldoProjetado30 };
        return { periodo: { de, ate }, geradoEm: new Date().toISOString(), demo: core.demo, indicadores: MANIFEST.indicadores.map(i => Object.assign({}, i, { valor: v(valores[i.id]) })) };
      } catch (e) { return { erro: e.message, codigo: e.code || 'ERRO' }; }
    },
    export(formato) {
      try {
        if (formato === 'json') return JSON.stringify(core.snapshot({ semAnexos: true }));
        if (formato === 'csv') { const l = core.listarTitulos({}); return toCSV([['id', 'tipo', 'vencimento', 'pessoa', 'descricao', 'categoria', 'valor', 'pago', 'aberto', 'situacao'], ...l.map(t => [t.id, t.tipo, t.vencimento, t.pessoaNome, t.descricao, t.categoriaNome, Money.num(t.valor), Money.num(t.pago), Money.num(t.aberto), t.status])]); }
        if (formato === 'pdf') { ACOES['rel-imprimir'](); return true; }
        return { erro: 'Formato não suportado. Use: ' + MANIFEST.exporta.join(', ') };
      } catch (e) { return { erro: e.message, codigo: e.code || 'ERRO' }; }
    },
    on(evento, fn) { (extListeners[evento] = extListeners[evento] || []).push(fn); return () => { extListeners[evento] = extListeners[evento].filter(f => f !== fn); }; },
    emit(evento, payload) {
      const msg = { contrato: MANIFEST.contrato, modulo: MANIFEST.id, versao: MANIFEST.versao, evento, payload: payload || {}, demo: core ? core.demo : false, ts: new Date().toISOString() };
      [...(extListeners[evento] || []), ...(extListeners['*'] || [])].forEach(fn => { try { fn(msg.payload, evento); } catch (e) { console.error(e); } });
      try { if (window.parent && window.parent !== window) window.parent.postMessage(msg, '*'); } catch (e) { /* sem painel */ }
    }
  };
  window.NEXO_MODULE = NEXO;
  // Pedidos do painel (somente leitura): { contrato:'nexo-plug/1', pedido:'manifest'|'getKPIs'|'getState'|'export', args:[], id }
  window.addEventListener('message', e => {
    if (e.source !== window.parent || window.parent === window) return;
    const d = e.data || {};
    if (d.contrato !== MANIFEST.contrato || !d.pedido) return;
    const mapa = { manifest: () => MANIFEST, getKPIs: () => NEXO.getKPIs(...(d.args || [])), getState: () => NEXO.getState(), export: () => (d.args && d.args[0] === 'pdf' ? { erro: 'PDF só pela interface.' } : NEXO.export(...(d.args || []))) };
    const fn = mapa[d.pedido];
    window.parent.postMessage({ contrato: MANIFEST.contrato, modulo: MANIFEST.id, resposta: d.pedido, id: d.id, dados: fn ? fn() : { erro: 'Pedido desconhecido.' } }, '*');
  });

  /* ---------- inicialização ---------- */
  if (modo === 'real' && NV && NV.abrir()) { /* a nuvem desenha a tela e cria o núcleo quando os dados chegarem */ }
  else if (modo) iniciarCore();
  if (modo === 'demo' && core && !core.hasUsers()) { try { semearDemo(); } catch (e) { console.error(e); } }
  render();
  NEXO.emit('financeiro.modulo.pronto', { demo: modo === 'demo' });
})();

</script>
</body>
</html>
