.chip-btn { border: var(--borda) solid var(--n-300); background: var(--n-0); border-radius: var(--raio-pilula); padding: var(--esp-1) var(--esp-3); cursor: pointer; font-size: var(--fs-sm); font-weight: var(--peso-medio); color: var(--n-700); min-height: var(--toque-sm); }

.chips { display: flex; flex-wrap: wrap; gap: var(--esp-2); }
.tabela-wrap { overflow-x: auto; border: var(--borda) solid var(--n-200); border-radius: var(--raio); background: var(--n-0); }
table.tab { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
table.tab th { background: var(--n-100); text-align: left; font-weight: var(--peso-medio); color: var(--n-700); padding: var(--esp-2); border-bottom: var(--borda) solid var(--n-200); white-space: nowrap; }
table.tab td { padding: var(--esp-2); border-bottom: var(--borda) solid var(--n-100); vertical-align: top; }
table.tab tr.clicavel { cursor: pointer; }
table.tab tr.clicavel:hover td { background: var(--cor-primaria-suave); }
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--min-kpi), 1fr)); gap: var(--esp-3); margin-bottom: var(--esp-4); }
.kpi { text-align: left; background: var(--n-0); border: var(--borda) solid var(--n-200); border-left: var(--borda-destaque) solid var(--cor-primaria); border-radius: var(--raio-lg); padding: var(--esp-3) var(--esp-4); box-shadow: var(--sombra); display: flex; flex-direction: column; gap: var(--esp-0); }
.kpi .rot { font-size: var(--fs-sm); color: var(--n-700); font-weight: var(--peso-medio); }
.kpi .val { font-size: var(--fs-2xl); font-weight: var(--peso-forte); font-variant-numeric: tabular-nums; }
.kpi .det { font-size: var(--fs-xs); color: var(--n-500); }
.kpi.atencao { border-left-color: var(--critico); }
.kpi.atencao .val { color: var(--critico); }

/* ---------- modal e avisos ---------- */
.modal-fundo { position: fixed; inset: 0; background: var(--sobreposicao); z-index: var(--z-modal); display: flex; align-items: flex-start; justify-content: center; padding: var(--margem-modal) var(--esp-3); overflow-y: auto; }
.modal { background: var(--n-0); border-radius: var(--raio-lg); box-shadow: var(--sombra-lg); width: 100%; max-width: var(--largura-modal); }
.modal.largo { max-width: var(--largura-modal-largo); }
.modal-cab { display: flex; align-items: center; justify-content: space-between; gap: var(--esp-2); padding: var(--esp-3) var(--esp-4); border-bottom: var(--borda) solid var(--n-200); position: sticky; top: 0; background: var(--n-0); border-radius: var(--raio-lg) var(--raio-lg) 0 0; z-index: var(--z-meio); }
.modal-cab h2 { margin: 0; font-size: var(--fs-lg); }
.modal-corpo { padding: var(--esp-4); }
.modal-rodape { display: flex; gap: var(--esp-2); justify-content: flex-end; flex-wrap: wrap; padding: var(--esp-3) var(--esp-4); border-top: var(--borda) solid var(--n-200); position: sticky; bottom: 0; background: var(--n-0); }
.toasts { position: fixed; right: var(--esp-4); bottom: var(--esp-4); display: grid; gap: var(--esp-2); z-index: var(--z-aviso); max-width: min(var(--largura-toast), calc(var(--largura-tela) - var(--esp-6))); }
.toast { padding: var(--esp-3) var(--esp-4); border-radius: var(--raio); box-shadow: var(--sombra-lg); background: var(--n-900); color: var(--n-0); font-size: var(--fs-sm); white-space: pre-wrap; }
.toast.ok { background: var(--ok); }
.toast.erro { background: var(--critico); }
.carregando { padding: var(--esp-6); text-align: center; color: var(--n-500); }
.progresso-barra { height: var(--esp-2); background: var(--n-100); border-radius: var(--raio-pilula); overflow: hidden; }
.progresso-barra span { display: block; height: 100%; background: var(--cor-primaria); width: var(--p); }

/* ---------- entrada (igual ao padrão WRD) ---------- */
.entrada { min-height: var(--altura-tela); display: flex; align-items: center; justify-content: center; padding: var(--esp-4); background: linear-gradient(160deg, var(--cor-primaria-suave), var(--n-50)); }
.entrada-box { background: var(--n-0); border-radius: var(--raio-lg); box-shadow: var(--sombra-lg); padding: var(--esp-6) var(--esp-5); width: 100%; max-width: var(--largura-entrada); text-align: center; }
.entrada-box form, .entrada-box .grade { text-align: left; }
.logo-entrada { height: var(--logo-entrada); margin-bottom: var(--esp-2); }
.entrada h1 { margin: 0 0 var(--esp-2); font-size: var(--fs-xl); }

/* ---------- barra de contexto permanente (cliente › unidade › área) ---------- */
.ctx { position: sticky; top: var(--altura-controle-lg); z-index: var(--z-busca); background: var(--cor-primaria-suave); border-bottom: var(--borda) solid var(--cor-primaria-clara); }
.ctx-in { max-width: var(--largura-max); margin: 0 auto; padding: var(--esp-1) var(--esp-4); display: flex; gap: var(--esp-3); align-items: center; flex-wrap: wrap; font-size: var(--fs-sm); }
.ctx-in b { color: var(--cor-primaria-escura); }
.ctx .progresso-barra { flex: 1 1 120px; min-width: var(--largura-progresso); }
.ctx-salvo { font-size: var(--fs-xs); color: var(--n-500); }

/* ---------- vistoria (tela principal) ---------- */
.areas { display: flex; gap: var(--esp-2); overflow-x: auto; padding-bottom: var(--esp-2); margin-bottom: var(--esp-2); }
.area-btn { flex: none; border: var(--borda) solid var(--n-300); background: var(--n-0); border-radius: var(--raio); padding: var(--esp-2) var(--esp-3); cursor: pointer; text-align: left; min-height: var(--toque); min-width: var(--largura-campo-curto); }
.area-btn b { display: block; font-size: var(--fs-sm); }
.area-btn span { font-size: var(--fs-xs); color: var(--n-500); }
.area-btn[aria-pressed="true"] { border-color: var(--cor-primaria); background: var(--cor-primaria-suave); box-shadow: inset 0 calc(var(--borda-aba) * var(--neg)) 0 var(--cor-primaria); }
.area-btn.nova { border-style: dashed; color: var(--cor-primaria); font-weight: var(--peso-forte); }
.lista-itens { max-width: var(--largura-lista-item); }
.sis { background: var(--n-0); border: var(--borda) solid var(--n-200); border-radius: var(--raio-lg); margin-bottom: var(--esp-3); }
.sis > summary { padding: var(--esp-3) var(--esp-4); cursor: pointer; font-weight: var(--peso-forte); color: var(--cor-primaria-escura); display: flex; gap: var(--esp-2); align-items: center; justify-content: space-between; min-height: var(--toque); }
.item { border-top: var(--borda) solid var(--n-100); padding: var(--esp-3) var(--esp-4); }
.item.foco { background: var(--cor-primaria-suave); }
.item-cab { display: flex; gap: var(--esp-2); align-items: flex-start; justify-content: space-between; }
.item-txt { flex: 1; min-width: 0; cursor: pointer; }
.item-cod { font-size: var(--fs-xs); font-weight: var(--peso-forte); color: var(--cor-primaria); }
.item-ref { font-size: var(--fs-xs); color: var(--n-500); }
.item-meta { display: flex; gap: var(--esp-2); flex-wrap: wrap; margin-top: var(--esp-1); }
.sit { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--esp-2); margin-top: var(--esp-2); }
.sit button { min-height: var(--toque); border: var(--borda-forte) solid var(--n-300); background: var(--n-0); border-radius: var(--raio); font-weight: var(--peso-forte); font-size: var(--fs-lg); cursor: pointer; color: var(--n-700); }
.sit button[data-s="C"][aria-pressed="true"] { background: var(--sit-c); border-color: var(--sit-c); color: var(--n-0); }
.sit button[data-s="NC"][aria-pressed="true"] { background: var(--sit-nc); border-color: var(--sit-nc); color: var(--n-0); }
.sit button[data-s="NA"][aria-pressed="true"] { background: var(--sit-na); border-color: var(--sit-na); color: var(--n-0); }
.sit button[data-s="NV"][aria-pressed="true"] { background: var(--sit-nv); border-color: var(--sit-nv); color: var(--n-0); }
.sit button[disabled] { cursor: not-allowed; opacity: var(--op-desabilitado); }
.btn-cam { min-width: var(--toque); min-height: var(--toque); font-size: var(--fs-icone); }
.pend { color: var(--alerta); font-weight: var(--peso-forte); font-size: var(--fs-xs); }
.contagens { display: flex; gap: var(--esp-2); flex-wrap: wrap; font-size: var(--fs-sm); }
.acoes-fixas { position: sticky; bottom: 0; background: var(--n-0); border-top: var(--borda) solid var(--n-200); padding: var(--esp-2) var(--esp-3); display: flex; gap: var(--esp-2); z-index: var(--z-acima); margin: 0 calc(var(--esp-4) * var(--neg)); }
.acoes-fixas .btn { flex: 1; min-height: var(--toque); }

/* ---------- fotos ---------- */
.fotos { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--mini), 1fr)); gap: var(--esp-2); }
.foto { position: relative; border: var(--borda) solid var(--n-200); border-radius: var(--raio); overflow: hidden; background: var(--n-100); cursor: pointer; padding: 0; text-align: left; }
.foto img { display: block; width: 100%; aspect-ratio: var(--proporcao-quadrada); object-fit: cover; background: var(--n-100); }
.foto img.sem-arquivo { object-fit: contain; }
.foto .selo { position: absolute; left: var(--esp-1); top: var(--esp-1); }
.foto .env { position: absolute; right: var(--esp-1); top: var(--esp-1); }
.foto .leg { display: block; font-size: var(--fs-2xs); padding: var(--esp-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: var(--n-0); }
.foto.fora { opacity: var(--op-fechado); }
.foto-acoes { display: flex; gap: var(--esp-2); flex-wrap: wrap; margin: var(--esp-2) 0; }
.foto-acoes .btn { min-height: var(--toque); flex: 1 1 auto; }
.foto-grande { width: 100%; max-height: var(--anot-max); object-fit: contain; background: var(--n-900); border-radius: var(--raio); display: block; }
.camera { position: fixed; inset: 0; background: var(--n-900); z-index: var(--z-aviso); display: flex; flex-direction: column; }
.camera video { flex: 1; min-height: 0; width: 100%; object-fit: contain; background: var(--n-900); }
.camera-barra { display: flex; align-items: center; justify-content: space-between; gap: var(--esp-3); padding: var(--esp-3); color: var(--n-0); }
.camera-disparo { width: var(--camera-botao); height: var(--camera-botao); border-radius: var(--raio-pilula); border: var(--borda-destaque) solid var(--n-0); background: var(--critico); cursor: pointer; }
.camera .btn { min-height: var(--toque); }
.camera-mini { display: flex; gap: var(--esp-1); overflow-x: auto; padding: 0 var(--esp-3) var(--esp-2); }
.camera-mini img { height: var(--mini-sm); border-radius: var(--raio-sm); }
.anotador { position: relative; background: var(--n-900); border-radius: var(--raio); overflow: auto; max-height: var(--anot-max); touch-action: none; }
.anotador canvas { display: block; max-width: 100%; margin: 0 auto; touch-action: none; }
.fila-lista { max-height: var(--altura-lista-busca); overflow: auto; }
.estado-envio { white-space: nowrap; }

/* ---------- relatórios (tela) ---------- */
.rel-grade { display: grid; grid-template-columns: minmax(var(--rel-cfg-min), var(--rel-cfg-max)) 1fr; gap: var(--esp-4); align-items: start; }
.rel-prev { min-width: 0; overflow-x: auto; }
.doc { background: var(--n-0); border: var(--borda) solid var(--n-200); box-shadow: var(--sombra); padding: var(--doc-pad-v) var(--doc-pad-h); font-size: var(--doc-fs); color: var(--pci-texto); }
.doc-cab { display: flex; align-items: center; gap: var(--esp-4); border-bottom: var(--borda-aba) solid var(--pci-marinho); padding-bottom: var(--esp-3); margin-bottom: var(--esp-3); }
.doc-cab img { height: var(--logo-doc); }
.doc-tit { font-size: var(--doc-fs-titulo); font-weight: var(--peso-forte); color: var(--pci-marinho); }
.doc-meta { font-size: var(--fs-xs); color: var(--pci-rotulo); }
.doc h2 { color: var(--pci-marinho); font-size: var(--rel-fs-h2); border-bottom: var(--borda-forte) solid var(--pci-marinho); padding-bottom: var(--esp-1); margin: var(--esp-5) 0 var(--esp-2); }
.doc h3 { color: var(--pci-marinho); font-size: var(--rel-fs-h3); margin: var(--esp-4) 0 var(--esp-2); }
.doc h4 { color: var(--pci-texto); font-size: var(--rel-fs-h4); margin: var(--esp-3) 0 var(--esp-1); }
.rel-tab { width: 100%; border-collapse: collapse; margin: var(--esp-2) 0 var(--esp-3); font-size: var(--rel-fs-sm); }
.rel-tab th, .rel-tab td { border: var(--borda) solid var(--pci-linha); padding: var(--esp-1) var(--esp-2); vertical-align: top; text-align: left; }
.rel-tab thead th, .rel-kv th, .rel-legal th { background: var(--pci-fundo-cab); color: var(--pci-marinho); }
.rel-kv th, .rel-legal th { width: var(--rel-th-larg); }
.rel-tab-wrap { overflow-x: auto; }
.cl { display: inline-block; padding: var(--esp-0) var(--esp-2); border-radius: var(--raio-sm); font-size: var(--rel-fs-xs); font-weight: var(--peso-forte); color: var(--pci-texto); white-space: nowrap; }
.cl-ncl, .cel-ncl { background: var(--classe-ncl); }
.cl-ver, .cel-ver { background: var(--classe-ver); }
.cl-rec, .cel-rec { background: var(--classe-rec); }
.cl-conf, .cel-conf { background: var(--classe-conf); }
.cl-na, .cel-na { background: var(--classe-na); }
.rel-status { font-size: var(--rel-fs-xs); font-weight: var(--peso-forte); padding: 0 var(--esp-1); border-radius: var(--raio-sm); white-space: nowrap; }
.st-confirmado { background: var(--ok-fundo); color: var(--ok); }
.st-avalidar, .st-hipótese, .st-hipotese { background: var(--alerta-fundo); color: var(--alerta); }
.st-nãoinformado, .st-naoinformado { background: var(--critico-fundo); color: var(--critico); }
.rel-ni { color: var(--critico); font-weight: var(--peso-forte); font-size: var(--rel-fs-xs); }
.rel-nota { color: var(--pci-rotulo); font-size: var(--rel-fs-xs); }
.rel-onde { font-weight: var(--peso-normal); color: var(--pci-rotulo); font-size: var(--rel-fs-sm); }
.rel-prio { display: inline-block; font-size: var(--rel-fs-xs); font-weight: var(--peso-forte); color: var(--pci-marinho); }
.rel-aviso { border: var(--borda-forte) solid var(--alerta); background: var(--alerta-fundo); color: var(--alerta); padding: var(--esp-2) var(--esp-3); margin: var(--esp-2) 0 var(--esp-3); }
.rel-apont { border-left: var(--borda-destaque) solid var(--pci-marinho); padding-left: var(--esp-3); margin: var(--esp-3) 0 var(--esp-4); }
.rel-apont p { margin: var(--esp-1) 0; }
.rel-fotos { display: grid; gap: var(--rel-gap); margin: var(--esp-2) 0; break-inside: avoid; }
.rel-fotos.f-h { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.rel-fotos.f-v { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.rel-foto { margin: 0; break-inside: avoid; border: var(--borda) solid var(--pci-linha); padding: var(--esp-1); }
.rel-foto img { display: block; width: 100%; height: auto; }
.rel-foto figcaption { font-size: var(--rel-fs-xs); color: var(--pci-texto); margin-top: var(--esp-1); }
.rel-sem-arq { padding: var(--esp-5) var(--esp-2); text-align: center; background: var(--classe-na); font-size: var(--rel-fs-xs); }
.rel-crono td, .rel-crono th { text-align: center; }
.rel-crono td:first-child, .rel-crono th:first-child { text-align: left; }
.cr-marca { background: var(--pci-marinho); color: var(--n-0); }
.rel-assin { margin-top: var(--rel-assin-esp); width: var(--rel-assin-larg); text-align: center; font-size: var(--rel-fs-sm); }
.rel-linha-assin { border-top: var(--borda) solid var(--pci-texto); margin-bottom: var(--esp-1); }

/* ---------- capa do relatório (padrão WRD aprovado em 21/10/2026) ---------- */
.capa { width: var(--capa-larg); max-width: 100%; display: grid; grid-template-rows: var(--capa-h-logos) var(--capa-h-bloco) var(--capa-h-filete) auto auto var(--capa-h-rodape); background: var(--n-0); color: var(--pci-texto); margin: 0 auto var(--esp-5); border: var(--borda) solid var(--pci-linha); }
.capa-logos { display: flex; align-items: center; padding: 0 var(--capa-pad); border-bottom: var(--borda) solid var(--pci-linha); }
.capa-logo { height: var(--capa-logo-h); }
.capa-bloco { position: relative; overflow: hidden; background: repeating-linear-gradient(135deg, var(--capa-hachura) 0, var(--capa-hachura) var(--borda), transparent var(--borda), transparent var(--esp-3)), linear-gradient(160deg, var(--pci-marinho), var(--pci-marinho-escuro)); color: var(--n-0); padding: var(--capa-pad-topo) var(--capa-pad) var(--capa-pad); display: flex; flex-direction: column; justify-content: flex-start; }
.capa-diamantes { position: absolute; right: var(--capa-diam-dir); top: var(--capa-pad); width: var(--capa-diam); height: var(--capa-diam); }
.capa-diamantes polygon { fill: none; stroke: var(--capa-diamante); stroke-width: var(--borda-forte); }
.capa-barra { width: var(--capa-barra-l); height: var(--capa-barra-h); background: var(--pci-vermelho); margin-bottom: var(--capa-gap); }
.capa-sobre { font-size: var(--capa-sobre-fs); letter-spacing: var(--capa-ls); color: var(--pci-texto-claro); }
.capa-tit { font-size: var(--capa-tit-fs); line-height: var(--capa-tit-lh); color: var(--n-0); margin: var(--capa-gap) 0; font-weight: var(--peso-forte); position: relative; }
.capa-sub { font-size: var(--capa-sub-fs); color: var(--pci-texto-claro); margin: 0 var(--capa-recuo-sub) var(--capa-gap) 0; position: relative; }
.capa-cli { font-size: var(--capa-cli-fs); font-weight: var(--peso-forte); margin-top: auto; position: relative; }
.capa-cli2 { font-size: var(--capa-cli2-fs); color: var(--pci-texto-claro); position: relative; }
.capa-filete { background: var(--pci-vermelho); }
.capa-dados { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--capa-gap); padding: var(--capa-gap) var(--capa-pad) 0; }
.capa-cel { border-top: var(--capa-filete-cel) solid var(--pci-marinho); padding-top: var(--esp-1); }
.capa-rot { font-size: var(--capa-rot-fs); font-weight: var(--peso-forte); color: var(--pci-rotulo); letter-spacing: var(--ls-md); }
.capa-val { font-size: var(--capa-val-fs); font-weight: var(--peso-forte); color: var(--pci-marinho); }
.capa-comp { font-size: var(--capa-comp-fs); color: var(--pci-rotulo); }
.capa-rt { padding: var(--capa-gap) var(--capa-pad); }
.capa-rt-nome { font-size: var(--capa-rt-fs); font-weight: var(--peso-forte); color: var(--pci-marinho); }
.capa-rodape { background: var(--pci-rodape); display: flex; align-items: center; justify-content: space-between; padding: 0 var(--capa-pad); font-size: var(--capa-comp-fs); color: var(--pci-rotulo); }
.capa-rodape b { color: var(--pci-marinho); }

/* ---------- responsivo (celular primeiro na vistoria) ---------- */
@media (max-width: 1100px) {
  .g3 { grid-template-columns: 1fr 1fr; }
  .rel-grade { grid-template-columns: 1fr; }
}
@media (max-width: 760px) {
  .topo-in { padding: var(--esp-2) var(--esp-3); gap: var(--esp-2); }
  .topo .modulo { display: none; }
  .topo .usuario span { display: none; }
  main { padding: var(--esp-2) var(--esp-3) var(--esp-7); }
  .g2, .g3 { grid-template-columns: 1fr; }
  .kpis { grid-template-columns: 1fr 1fr; }
  .kpi { padding: var(--esp-2) var(--esp-3); }
  .kpi .val { font-size: var(--fs-xl); }
  .modal-fundo { padding: 0; }
  .modal, .modal.largo { max-width: none; min-height: var(--altura-tela); border-radius: 0; }
  .modal-cab { border-radius: 0; }
  .modal-corpo { padding: var(--esp-3); }
  .ctx-in { padding: var(--esp-1) var(--esp-3); }
  .item { padding: var(--esp-3); }
  .acoes-fixas { margin: 0 calc(var(--esp-3) * var(--neg)); }
  .doc { padding: var(--esp-3); }
  .cab-tela h1 { font-size: var(--fs-lg); }
}

/* ---------- impressão ---------- */
/* exceção: @page e suas margens não aceitam variáveis CSS; o texto do cabeçalho/rodapé é injetado pelo relatório */
@page { size: A4; margin: 18mm 14mm 16mm 14mm; }
@page capa { margin: 0; }
@page corpo { margin: 18mm 14mm 16mm 14mm;
  @top-left { font-size: 8pt; color: #143884; font-weight: bold; }
  @top-right { font-size: 8pt; color: #6B7686; }
  @bottom-left { font-size: 8pt; color: #6B7686; }
  @bottom-right { font-size: 8pt; color: #6B7686; }
}
@page paisagem { size: A4 landscape; margin: 14mm 12mm 14mm 12mm;
  @top-left { font-size: 8pt; color: #143884; font-weight: bold; }
  @top-right { font-size: 8pt; color: #6B7686; }
  @bottom-left { font-size: 8pt; color: #6B7686; }
  @bottom-right { font-size: 8pt; color: #6B7686; }
}
@media print {
  body { background: var(--n-0); }
  body.imprimindo-doc #app, body.imprimindo-doc #toasts, body.imprimindo-doc .modal-fundo, body.imprimindo-doc .camera { display: none !important; }
  body.imprimindo-doc #area-impressao { display: block; }
  body:not(.imprimindo-doc) #area-impressao { display: none; }
  .doc { border: 0; box-shadow: none; padding: 0; font-size: var(--rel-fs); }
  .capa { page: capa; width: var(--capa-larg); height: var(--capa-alt); border: 0; margin: 0; break-after: page; }
  .rel-corpo, .tipo-nc, .tipo-fotografico { page: corpo; }
  .doc-ppci:not(.tipo-completo) { page: corpo; }
  .pag-paisagem { page: paisagem; break-before: page; }
  .rel-corpo + .pag-paisagem + .rel-corpo { break-before: page; }
  .rel-tab tr, .rel-apont h3, .rel-foto { break-inside: avoid; }
  .rel-tab thead { display: table-header-group; }
  .doc h2, .doc h3, .doc h4 { break-after: avoid; }
  .capa, .capa *, .rel-tab th, .rel-tab td, .cl, .cr-marca, .rel-aviso, .rel-status { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
#area-impressao { display: none; }

/* ---------- comentários do item ---------- */
.com { border-left: var(--borda-forte) solid var(--n-200); padding: var(--esp-1) 0 var(--esp-1) var(--esp-2); margin-bottom: var(--esp-2); }
.com .meta { display: flex; gap: var(--esp-2); flex-wrap: wrap; align-items: center; font-size: var(--fs-xs); color: var(--n-500); }
.com .txt { margin: var(--esp-1) 0; white-space: pre-wrap; overflow-wrap: anywhere; }

/* ---------- indicadores: linhas com barra ---------- */
.sc-row { display: grid; grid-template-columns: minmax(var(--sc-rotulo), 1.2fr) minmax(var(--sc-barra), 2fr) var(--sc-valor); gap: var(--esp-1) var(--esp-2); align-items: center; font-size: var(--fs-sm); margin: var(--esp-2) 0; }
.sc-row .lbl { overflow-wrap: anywhere; }
.sc-row .val { text-align: right; font-variant-numeric: tabular-nums; font-weight: var(--peso-medio); }
.sc-row .note { grid-column: 1 / -1; font-size: var(--fs-xs); color: var(--n-500); }
.trk { height: var(--esp-2); background: var(--n-100); border-radius: var(--raio-pilula); overflow: hidden; }
.trk .fill { display: block; height: 100%; background: var(--cor-primaria); border-radius: var(--raio-pilula); }
.trk .fill.nc { background: var(--critico); }
.clicavel { cursor: pointer; }
.clicavel:hover td { background: var(--cor-primaria-suave); }
.tab td.n, .tab th.n { text-align: right; font-variant-numeric: tabular-nums; }
@media (max-width: 760px) { .sc-row { grid-template-columns: 1fr 1fr; } .sc-row .val { text-align: left; } }
.indice-valor { font-family: var(--cond); font-size: var(--fs-2xl); color: var(--cor-primaria); font-variant-numeric: tabular-nums; }

/* ---------- rolagem horizontal também no topo da tabela ---------- */
.rolagem-topo { overflow-x: auto; overflow-y: hidden; height: var(--esp-4); margin-bottom: var(--esp-1); }
.rolagem-topo > div { height: var(--borda); }

/* ---------- PPCI Simplificado: estados documentais (sempre com texto, nunca só cor) ---------- */
.st { display: inline-block; padding: var(--esp-0) var(--esp-2); border-radius: var(--raio-pilula); font-size: var(--fs-xs); font-weight: var(--peso-medio); border: var(--borda) solid var(--n-200); white-space: nowrap; }
.st-sol { background: var(--n-100); color: var(--n-700); }
.st-agu { background: var(--alerta-fundo); color: var(--alerta); }
.st-val { background: var(--cor-primaria-clara); color: var(--cor-primaria-escura); }
.st-ok { background: var(--ok-fundo); color: var(--ok); }
.st-ref { background: var(--critico-fundo); color: var(--critico); }
.st-pen { background: var(--interno-fundo); color: var(--alerta); border-style: dashed; }
.st-na { background: var(--n-50); color: var(--n-500); border-style: dotted; }
.st-ind { background: var(--n-0); color: var(--n-500); border-style: dashed; }
.mapa td.cel { text-align: center; padding: var(--esp-1); }
.mapa th.cat { writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; font-size: var(--fs-xs); vertical-align: bottom; padding: var(--esp-2) var(--esp-1); }
.mapa td.uni { white-space: nowrap; }
.btn-celula { font-family: inherit; margin: 0; cursor: pointer; min-width: 2.6em; }
.btn-celula:hover { text-decoration: underline; }
.btn-celula:focus-visible { outline: 2px solid var(--cor-primaria-escura); outline-offset: 2px; }
.legenda { display: flex; flex-wrap: wrap; gap: var(--esp-2) var(--esp-4); font-size: var(--fs-xs); margin: var(--esp-2) 0; }
.legenda span { display: inline-flex; gap: var(--esp-1); align-items: center; }
.bloqueio { white-space: pre-wrap; }
.acoes-doc { display: flex; flex-wrap: wrap; gap: var(--esp-2); }
.filtros { display: flex; flex-wrap: wrap; gap: var(--esp-2); align-items: end; margin-bottom: var(--esp-3); }
.filtros > * { min-width: var(--min-filtro); flex: 1; }
.filtros input[type=search] { width: 100%; }
.proc-cab { display: flex; flex-wrap: wrap; gap: var(--esp-2); align-items: center; justify-content: space-between; margin-bottom: var(--esp-3); }
.proc-cab h1 { margin: 0; font-size: var(--fs-xl); }
.doc-lic .rel-tab td, .doc-lic .rel-tab th { font-size: var(--rel-fs-xs); }
.doc-lic .rel-tab .st { font-size: var(--rel-fs-xs); }
.doc-rodape { margin-top: var(--esp-5); border-top: var(--borda) solid var(--pci-linha); padding-top: var(--esp-2); font-size: var(--fs-xs); color: var(--pci-rotulo); }
@media print {
  .doc-lic { page: paisagem; }
  .doc-lic .rel-tab tr { break-inside: avoid; }
  .st, .mapa td.cel { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}

@media (max-width: 760px) {
  .filtros > .campo, .filtros > label { min-width: 100%; flex: 1 1 100%; }
}

</style>

  }, 'nor'), stamp({

ue usa residência unifamiliar como endereço de contato; propriedade agrossilvipastoril (exceto silos e armazéns); residência unifamiliar em ocupação mista de até dois pavimentos com acesso independente; torre de transmissão sem local de trabalho permanente. Parágrafo único: essas ocupações não estão sujeitas a licenciamento ou fiscalização. Art. 4º (médio risco): critérios cumulativos, entre eles: (I, a) não ter atividade de alto risco conforme o Anexo; (I, b) lotação potencial de até 100 pessoas; (I, c) não utilizar, manipular, armazenar ou comercializar produtos perigosos à saúde, ao meio ambiente ou ao patrimônio. Alto risco: definido no Anexo da portaria, não lido nesta cópia. Altura em metros: não consta.","norma":"Portaria nº 067, de 12/12/2019, do Comando do Corpo de Bombeiros Militar do Paraná","item":"Portaria 067/2019: arts. 3º e 4º, inciso I, alíneas a a c; Anexo (alto risco, não lido)","url":"","trecho":"Art. 3º, parágrafo único (cópia do acervo): « As ocupações e atividades econômicas referidas neste artigo não estão sujeitas a licenciamento ou fiscalização do Corpo de Bombeiros Militar. »","consultadoEm":"2026-10-26","status":"condicional","duvidaVigencia":"Cópia do acervo, sem URL oficial registrada (fontes/PR/portaria-067-2019-classificacao-risco.pdf). Confirmar vigência no Comando do CBPR e se houve alteração posterior.","documentosExigidos":[],"observacoes":"Critério de risco do PR. O procedimento de regularização (PSS, NPT 001 Parte 5) segue no registro separado, condicional."}, 'nor'), stamp({"uf":"PR","nomeLicenca":"Lei 19.449/2018 (poder de polícia do Corpo de Bombeiros e normas gerais de prevenção e combate a incêndio)","modalidade":"Base legal do PR: poder de polícia do CB, CLCB e tramitação simplificada para atividade de baixo risco","criterios":"Ementa: regula o exercício do poder de polícia administrativa pelo Corpo de Bombeiros Militar e institui normas gerais para medidas de prevenção e combate a incêndio e a desastres. Art. 11: o CLCB é /* ---------- datas ---------- */
/* Aceita só data completa: AAAA-MM-DD ou DD/MM/AAAA. Qualquer outra coisa = incompleta. */
function dataCompleta(v) {
  const s = txt(v); let m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/); let a, me, d;
  if (m) { a = +m[1]; me = +m[2]; d = +m[3]; } else { m = s.match(/^(\d{2})\/(\d{2})\/(\d{4})$/); if (!m) return null; d = +m[1]; me = +m[2]; a = +m[3]; }
  const dt = new Date(Date.UTC(a, me - 1, d)); if (dt.getUTCFullYear() !== a || dt.getUTCMonth() !== me - 1 || dt.getUTCDate() !== d) return null;
  return `${a}-${String(me).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
}
const diasEntre = (a, b) => Math.round((Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 86400000);
/* Situação registrada à parte, como no mapa do cliente (vencida / ano / sem data). Só vale sem validade completa. */
function situacaoLicencaMapa(l) {
  if (l.situacaoMapa === 'vencida') return { cod: 'vencida', rot: 'Vencida (sem data de validade)', cls: 'st-ref' };
  if (l.situacaoMapa === 'ano') return { cod: 'a_confirmar', rot: txt(l.anoMapa) ? `Validade em ${txt(l.anoMapa)} (sem dia)` : 'Validade por ano, ano não informado', cls: 'st-agu' };
  return { cod: 'a_confirmar', rot: 'Sem data de validade', cls: 'st-pen' };
}
function situacaoLicenca(p, hoje) {
  const h = hoje || hojeISO(); const l = p.licenca || {};
  if (l.situacaoMapa && !dataCompleta(l.validade)) return situacaoLicencaMapa(l);
  if (!txt(l.numero) && !txt(l.validade)) return { cod: 'sem_registro', rot: 'Sem licença registrada', cls: 'st-pen' };
  const v = dataCompleta(l.validade);
  if (!v) return { cod: 'a_confirmar', rot: `A confirmar (validade "${txt(l.validade) || 'sem data'}")`, cls: 'st-agu' };
  const d = diasEntre(h, v);
  if (d < 0) return { cod: 'vencida', rot: `Vencida em ${v.split('-').reverse().join('/')}`, cls: 'st-ref', dias: d };
  if (d <= 60) return { cod: 'vencendo', rot: `Vigente — vence em ${d} dia(s)`, cls: 'st-val', dias: d };
  return { cod: 'vigente', rot: `Vigente até ${v.split('-').reverse().join('/')}`, cls: 'st-ok', dias: d };
}

/* =====================================================================
   NÚCLEO
   ===================================================================== */
function criarNucleo(opts) {
  const { namespace, demo } = opts;
  const store = opts.armazenamento || adaptadorLocalStorage(namespace);
  let state = null;
  try { state = JSON.parse(store.get('state') || 'null'); } catch (e) { state = null; }
  const novo = !state;
  if (state && state.schemaVersion > SCHEMA_VERSION) fail('Os dados foram gravados por uma versão mais nova do módulo. Atualize o arquivo do módulo.', 'VERSAO');
  state = normalizar(state || {});
  if (novo) state.normas = normasSemente();

  function normalizar(s) {
    s.schemaVersion = SCHEMA_VERSION; s.criadoEm = s.criadoEm || nowISO();
    ['usuarios', 'clientes', 'processos', 'documentos', 'pendencias', 'normas', 'relatorios', 'historico', 'falhas'].forEach(k => { s[k] = Array.isArray(s[k]) ? s[k] : []; });
    s.config = Object.assign({ seq: {}, inicioRelatorio: 800001, responsavelPadrao: '', integracoes: {} }, s.config || {});
    Object.keys(INTEGRACOES).forEach(k => { s.config.integracoes[k] = s.config.integracoes[k] || { situacao: k === 'drive' || k === 'email' ? 'depende_conexao' : 'depende_dev', obs: '' }; });
    return s;

  const ouvintes = [];

  /* ---------- persistência ---------- */

    clearTimeout(timer); timer = null;
    try { store.set('state', JSON.stringify(state)); ultimoSalvo = nowISO(); erroSalvar = null; emitir('nucleo.salvo', { em: ultimoSalvo }); }
    catch (e) { erroSalvar = e; registrarFalha('gravacao', 'Falha ao gravar no aparelho: ' + e.message, null); emitir('nucleo.erro_salvar', { mensagem: e.message }); }
  }
  function agendar() { clearTimeout(timer); timer = setTimeout(salvarAgora, 200); }
  if (novo) salvarAgora();

  /* ---------- sessão e permissões ---------- */
  function user() {
    if (!session) return null;
    const u = state.usuarios.find(x => x.id === session.userId && x.ativo); if (!u) { session = null; return null; }
    return { userId: u.id, nome: u.nome, login: u.login, perfil: u.perfil, perfilRotulo: PERFIS[u.perfil].rotulo, cargo: u.cargo || '', registro: u.registro || '' };
  }
  const can = acao => { const u = user(); if (!u) return false; const p = PERFIS[u.perfil]; return !!p && (p.acoes === '*' || p.acoes.includes(acao)); };
  function guard(acao) { const u = user(); if (!u) fail('Acesso negado: faça login para continuar.', 'AUTH'); if (!can(acao)) fail(`Acesso negado: o perfil "${PERFIS[u.perfil].rotulo}" não permite esta ação.`, 'PERMISSAO'); return u; }
  function log(acao, entidade, ent, detalhe) {
    const u = user();
    state.historico.push(stamp({ em: nowISO(), por: u ? u.nome : 'sistema', acao, entidade, entidadeId: ent ? ent.id : null, processoId: ent ? (entidade === 'processo' ? ent.id : ent.processoId || null) : null, detalhe }, 'his'));
    if (state.historico.length > 20000) state.historico.splice(0, state.historico.length - 20000);
  }
  function mut(fn, evento, payload) { const r = fn(); agendar(); if (evento) emitir(evento, typeof payload === 'function' ? payload(r) : (payload || r)); return r; }
  function guardarSessao() { try { if (session) sessionStorage.setItem('wrd.' + namespace + '.sessao', JSON.stringify(session)); else sessionStorage.removeItem('wrd.' + namespace + '.sessao'); } catch (e) { /* sem sessionStorage */ } }
  function registrarFalha(tipo, mensagem, conteudo) { state.falhas.push(stamp({ tipo, mensagem, conteudo: conteudo == null ? null : String(conteudo).slice(0, 2000000), situacao: 'aberta', tentativas: 0 }, 'fal')); }

  /* ---------- usuários ---------- */
  const hashSenha = (salt, senha) => { let h = salt + ':' + senha; for (let i = 0; i < 500; i++) h = sha256Texto(h + ':' + salt); return h; };
  function validarUsuario(d, ex) {
    const nome = txt(d.nome), login = norm(d.login).replace(/\s/g, '');
    if (!nome) fail('Informe o nome do usuário.');
    if (!/^[a-z0-9._-]{3,30}$/.test(login)) fail('Login deve ter de 3 a 30 caracteres: letras, números, ponto, hífen ou sublinhado.');
    if (state.usuarios.some(u => u.login === login && (!ex || u.id !== ex.id))) fail('Já existe um usuário com este login.');
    if (!PERFIS[d.perfil]) fail('Perfil inválido.');
    if (!ex || d.senha) { if (String(d.senha || '').length < 6) fail('A senha deve ter pelo menos 6 caracteres.'); }
    return { nome, login };
  }
  const hasUsers = () => state.usuarios.some(u => u.ativo);
  function setupAdmin(d) {

    const { nome, login } = validarUsuario(Object.assign({}, d, { perfil: 'admin' }));
    const salt = uid('s');

  }
  function login(lg, senha) {
    const u = state.usuarios.find(x => x.login === norm(lg).replace(/\s/g, '') && x.ativo);
    if (!u || hashSenha(u.salt, String(senha || '')) !== u.hash) fail('Usuário ou senha inválidos.', 'AUTH');
    session = { userId: u.id, inicio: nowISO() }; guardarSessao(); return user();
  }
  function logout() { session = null; guardarSessao(); }
  function usuariosDemo() { if (!demo) fail('Disponível só na demonstração.', 'PERMISSAO'); return state.usuarios.filter(u => u.ativo).map(u => ({ login: u.login, nome: u.nome, perfil: PERFIS[u.perfil].rotulo })); }
  function entrarDemo(lg) {
    if (!demo) fail('Entrada sem senha só existe na demonstração.', 'PERMISSAO');

  }
  function listarUsuarios() { guard('ler'); return state.usuarios.map(u => ({ id: u.id, nome: u.nome, login: u.login, perfil: u.perfil, perfilRotulo: PERFIS[u.perfil].rotulo, cargo: u.cargo || '', registro: u.registro || '', ativo: u.ativo })); }
  function salvarUsuario(d) {
    guard('usuario.salvar');
    const ex = d.id ? state.usuarios.find(u => u.id === d.id) : null;
    const { nome, login: lg } = validarUsuario(d, ex);
    return mut(() => {
      if (ex) {
        if (ex.id === (user() || {}).userId && d.perfil !== 'admin') fail('Você não pode retirar o seu próprio perfil de administrador.');
        Object.assign(ex, { nome, login: lg, perfil: d.perfil, cargo: txt(d.cargo), registro: txt(d.registro), ativo: d.ativo !== false });
        if (d.senha) { ex.salt = uid('s'); ex.hash = hashSenha(ex.salt, d.senha); }

      }
      const salt = uid('s');
      const u = stamp({ nome, login: lg, perfil: d.perfil, cargo: txt(d.cargo), registro: txt(d.registro), salt, hash: hashSenha(salt, d.senha), ativo: true }, 'usr');
      state.usuarios.push(u); log('usuario.criado', 'usuario', u, `Usuário "${lg}" criado.`); return u.id;
    });
  }
  function alterarSenha(atual, nova) {
    const u0 = guard('senha.propria'); const u = state.usuarios.find(x => x.id === u0.userId);
    if (hashSenha(u.salt, String(atual || '')) !== u.hash) fail('Senha atual incorreta.', 'AUTH');
    if (String(nova || '').length < 6) fail('A nova senha deve ter pelo menos 6 caracteres.');
    mut(() => { u.salt = uid('s'); u.hash = hashSenha(u.salt, nova); toque(u); log('usuario.senha', 'usuario', u, 'Senha alterada.'); });
  }

  /* ---------- clientes ---------- */
  const cliente = id => state.clientes.find(c => c.id === id) || null;
  function listarClientes() { guard('ler'); return state.clientes.filter(c => !c.arquivado).sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR')); }
  function salvarCliente(d) {
    guard('cliente.salvar'); const nome = txt(d.nome); if (!nome) fail('Informe o nome do cliente.');
    if (state.clientes.some(c => semAcento(c.nome) === semAcento(nome) && c.id !== d.id && !c.arquivado)) fail('Já existe um cliente com este nome.');
    return mut(() => {
      const ex = d.id ? cliente(d.id) : null;
      const dados = { nome, cnpj: txt(d.cnpj), contato: txt(d.contato), email: txt(d.email), telefone: txt(d.telefone) };
      if (ex) { Object.assign(ex, dados); toque(ex); log('cliente.alterado', 'cliente', ex, `Cliente "${nome}" alterado.`); return ex.id; }
      const c = stamp(dados, 'cli'); state.clientes.push(c); log('cliente.criado', 'cliente', c, `Cliente "${nome}" criado.`); return c.id;
    }, d.id ? 'cliente.alterado' : 'cliente.criado', id => ({ id }));
  }

  /* ---------- processos (um por unidade) ---------- */
  const processo = id => state.processos.find(p => p.id === id) || null;
  const chaveProcesso = d => [semAcento(cliente(d.clienteId) ? cliente(d.clienteId).nome : d.clienteId), semAcento(d.codigoUnidade || 'unica'), txt(d.uf).toUpperCase()].join('|');
  const soDigitos = s => txt(s).replace(/\D/g, '');
  /** Duplicidades a confirmar antes de criar (R13): mesma chave; mesmo CNPJ + endereço. */
  function duplicidades(d) {
    const ch = chaveProcesso(d), cnpj = soDigitos(d.cnpj), end = semAcento(d.endereco);
    return state.processos.filter(p => p.id !== d.id && !p.arquivado && (p.chave === ch || (cnpj && soDigitos(p.cnpj) === cnpj && end && semAcento(p.endereco) === end)))
      .map(p => ({ id: p.id, rotulo: rotuloProcesso(p), motivo: p.chave === ch ? 'mesma chave (cliente + código + UF)' : 'mesmo CNPJ e endereço' }));
  }
  function rotuloProcesso(p) { const c = cliente(p.clienteId); return `${c ? c.nome : '?'}${p.codigoUnidade ? ' · ' + p.codigoUnidade : ''} · ${p.municipio || '?'}/${p.uf || '?'}`; }
  function listarProcessos(f) {

      .filter(p => (!f.clienteId || p.clienteId === f.clienteId) && (!f.uf || p.uf === f.uf) && (!f.etapa || p.etapa === f.etapa) && (!f.enquadramento || p.enquadramento === f.enquadramento))
      .filter(p => !b || semAcento([rotuloProcesso(p), p.cnpj, p.endereco, p.atividade, p.cnaes].join(' ')).includes(b))

  function salvarProcesso(d, o) {
    guard('processo.salvar');

    const ex = d.id ? processo(d.id) : null;
    return mut(() => {
      const dados = { clienteId: d.clienteId, uf, finalidade: d.finalidade };
      CAMPOS_PROC.forEach(k => { dados[k] = txt(d[k]); });
      if (ex) {
        const mudouUF = ex.uf !== uf;
        Object.assign(ex, dados); ex.chave = chaveProcesso(ex);
        if (mudouUF) { // R03

          log('processo.uf_alterada', 'processo', ex, `UF alterada para ${uf}: norma desligada e enquadramento voltou para "A verificar" (regras de outra UF não são reaproveitadas).`);
        }
        toque(ex); log('processo.alterado', 'processo', ex, 'Dados da unidade alterados.'); return ex.id;
      }
      const p = stamp(Object.assign(dados, { etapa: 'levantamento', enquadramento: 'a_verificar', enquadramentoFundamento: '', normaId: null, licenca: { numero: '', validade: '', tipo: '', emissao: '' }, checagens: {}, protocolo: { numero: '', data: '' }, arquivado: false }), 'pro');
      p.chave = chaveProcesso(p);
      state.processos.push(p); log('processo.criado', 'processo', p, `Processo criado: ${rotuloProcesso(p)}.`); return p.id;
    }, ex ? 'processo.alterado' : 'processo.criado', id => ({ id }));
  }
  function salvarLicenca(id, d) {
    guard('processo.salvar'); const p = processo(id); if (!p) fail('Processo não encontrado.');
    const sm = txt(d.situacaoMapa), am = txt(d.anoMapa);

    if (sm === 'ano' && !/^\d{4}$/.test(am)) fail('Informe o ano com 4 dígitos (ex.: 2026).');
    mut(() => { p.licenca = { numero: txt(d.numero), validade: txt(d.validade), tipo: txt(d.tipo), emissao: txt(d.emissao), origem: txt(d.origem), situacaoMapa: sm, anoMapa: sm === 'ano' ? am : '' }; toque(p); log('processo.licenca', 'processo', p, `Licença registrada: ${p.licenca.numero || 'sem número'} · validade "${p.licenca.validade || 'sem data'}" → ${situacaoLicenca(p).rot}.`); }, 'processo.alterado', { id });

      p.enquadramento = d.enquadramento; p.enquadramentoFundamento = txt(d.fundamento); p.normaId = n ? n.id : null;

      else if (p.etapa === 'levantamento' || p.etapa === 'fora_escopo') p.etapa = 'enquadramento';
      toque(p); log('processo.enquadramento', 'processo', p, `Enquadramento: ${ENQUADRAMENTO[p.enquadramento]}${n ? ' · norma: ' + n.norma : ''}. Fundamento: ${p.enquadramentoFundamento || '—'}`);

      ${ed ? `<form id="form-enq" class="grade"><div class="g2">${campo('Enquadramento', sel('enquadramento', opts(ENQUADRAMENTO, p.enquadramento)))}${campo('Norma da UF ' + esc(p.uf), sel('normaId', opt('', 'Nenhuma', p.normaId) + ns.map(n => opt(n.id, `${n.norma} (${STATUS_FONTE[n.status]})`, p.normaId)).join('')))}</div>

  /* ---------- documento: ações ---------- */
  function modalDocEditar(pid, id) {
    const d = id ? core.documento(id) : { natureza: '', responsavel: 'cliente' };
    modalForm(id ? 'Editar documento' : 'Novo documento', `<div class="g2">${campo('Categoria / documento', inp('categoria', d.categoria), { req: true, cls: 'span2' })}
      ${campo('Natureza', sel('natureza', opts(NATUREZA, d.natureza, 'Escolha…')), { req: true })}${campo('Quem entrega', sel('responsavel', opts(RESPONSAVEL, d.responsavel)), { req: true })}
      ${campo('Fonte normativa ou requisito administrativo', inp('fonte', d.fonte), { cls: 'span2', ajuda: 'Norma/item da UF, exigência do portal, ou "apoio WRD".' })}
      ${campo('Obrigatoriedade', inp('obrigatoriedade', d.obrigatoriedade), { ajuda: 'Obrigatório, condicional (quando…), opcional.' })}${campo('Emissor esperado', inp('emissor', d.emissor))}
      ${campo('Providência solicitada ao responsável', area('providencia', d.providencia), { cls: 'span2' })}
      ${campo('Prazo acordado', inp('prazoAcordado', d.prazoAcordado, { type: 'date' }))}${campo('Impacto no protocolo', inp('impacto', d.impacto))}
      ${campo('Observação para o cliente', area('observacaoCliente', d.observacaoCliente), { cls: 'span2', ajuda: 'Aparece no relatório do cliente.' })}
      ${campo('Nota interna', area('notaInterna', d.notaInterna), { cls: 'span2', ajuda: 'Nunca aparece no relatório do cliente.' })}</div>`,
    f => { const dd = { id, processoId: pid }; ['categoria', 'natureza', 'responsavel', 'fonte', 'obrigatoriedade', 'emissor', 'providencia', 'prazoAcordado', 'impacto', 'observacaoCliente', 'notaInterna'].forEach(k => { dd[k] = fv(f, k); }); core.salvarDocumento(dd); toast('Documento salvo.', 'ok'); }, { largo: true });
  }
  function modalDoc(id) {
    const d = core.documento(id), p = core.processo(d.processoId), ed = core.can('documento.salvar');
    const bt = (act, rot, cls) => `<button class="btn ${cls || ''}" data-dact="${act}">${rot}</button>`;
    const acoes = !ed ? '' : [
      bt('editar', 'Editar dados'),
      d.aplicavel !== 'sim' ? bt('aplic-sim', 'Confirmar: aplicável') : '',
      d.aplicavel !== 'nao' ? bt('aplic-nao', 'Não se aplica…') : '',
      d.aplicavel !== 'indefinido' && d.estado !== 'validado' ? bt('aplic-ind', 'Voltar para indefinida') : '',
      d.aplicavel !== 'nao' && d.responsavel !== 'wrd' && !['validado', 'em_validacao'].includes(d.estado) ? bt('solicitar', d.solicitacoes.length ? 'Registrar nova cobrança enviada' : 'Registrar solicitação enviada', 'btn-primario') : '',
      d.aplicavel !== 'nao' ? bt('receber', 'Registrar arquivo recebido', d.estado === 'aguardando_cliente' || d.estado === 'refazer' ? 'btn-primario' : '') : '',
      d.aplicavel !== 'nao' && d.estado !== 'validado' ? bt('validar', 'Validar', d.estado === 'em_validacao' ? 'btn-primario' : '') : '',
      d.aplicavel !== 'nao' && d.estado !== 'nao_se_aplica' ? bt('refazer', 'Pedir correção…') : '',
      d.aplicavel !== 'nao' && d.estado !== 'validado' ? bt('pendente', 'Marcar pendente…') : '',
      bt('remover', 'Remover da lista…', 'btn-perigo')
    ].join('');
    const m = modal(`${d.categoria} — ${core.rotuloProcesso(p)}`, `<p>${chipAplic(d.aplicavel)} ${chipEstado(d.estado)} <span class="st st-sol">Entrega: ${esc(RESPONSAVEL[d.responsavel])}</span></p>
      <table class="tab"><tbody><tr><th>Natureza</th><td>${esc(NATUREZA[d.natureza])}</td></tr><tr><th>Fonte</th><td>${ni(d.fonte)}</td></tr><tr><th>Obrigatoriedade</th><td>${ni(d.obrigatoriedade)}</td></tr><tr><th>Emissor</th><td>${ni(d.emissor)}</td></tr><tr><th>Validade do documento</th><td>${ni(d.validade)}</td></tr><tr><th>Providência</th><td>${ni(d.providencia)}</td></tr><tr><th>Prazo acordado</th><td>${ni(dataBR(d.prazoAcordado))}</td></tr><tr><th>Analisado por</th><td>${ni(d.analisadoPor)}${d.validadoEm ? ' em ' + dataHoraBR(d.validadoEm) : ''}</td></tr>${d.motivo ? `<tr><th>Motivo</th><td class="txt-critico">${esc(d.motivo)}</td></tr>` : ''}${d.notaInterna ? `<tr><th>Nota interna</th><td>${esc(d.notaInterna)}</td></tr>` : ''}</tbody></table>
      <h3>Versões recebidas (${d.versoes.length})</h3>${d.versoes.length ? `<ul class="peq">${d.versoes.map(v => `<li>v${v.versao} · ${esc(v.arquivo)} ${v.link ? `<a href="${esc(v.link)}" target="_blank" rel="noopener noreferrer">link</a>` : ''} · recebido ${dataBR(v.recebidoEm)}${v.origem ? ' · ' + esc(v.origem) : ''}${v.hash ? ' · hash ' + esc(v.hash.slice(0, 12)) + '…' : ''}</li>`).join('')}</ul>` : '<p class="peq muted">Nenhum arquivo recebido.</p>'}
      <h3>Solicitações enviadas (${d.solicitacoes.length})</h3>${d.solicitacoes.length ? `<ul class="peq">${d.solicitacoes.map(s => `<li>${dataBR(s.em)} · ${esc(s.meio)}${s.evidencia ? ' · ' + esc(s.evidencia) : ''}</li>`).join('')}</ul>` : '<p class="peq muted">Nenhuma solicitação com envio comprovado.</p>'}
      <details class="mais"><summary>Histórico do documento</summary><ul class="xs">${(d.historico || []).slice().reverse().map(h => `<li>${dataHoraBR(h.em)} · ${esc(h.por)} · ${esc(h.texto)}</li>`).join('')}</ul></details>
      ${acoes ? `<div class="acoes-doc">${acoes}</div>` : ''}`, { largo: true });
    m.addEventListener('click', e => { const b = e.target.closest('[data-dact]'); if (!b) return; m.fechar(); acaoDoc(b.dataset.dact, d); });
  }
  function acaoDoc(a, d) {
    const hoje = hojeISO();

    if (a === 'ficha') return modalDoc(d.id);
    if (a === 'aplic-sim') return tentar(() => { core.definirAplicabilidade(d.id, 'sim'); renderTela(); });
    if (a === 'aplic-ind') return tentar(() => { core.definirAplicabilidade(d.id, 'indefinido'); renderTela(); });
    if (a === 'aplic-nao') return modalForm('Não se aplica — ' + d.categoria, campo('Justificativa', area('j', '', { rows: 3 }), { req: true, ajuda: 'Por que este item não se aplica a este processo (regra da UF, característica da unidade…).' }), f => core.definirAplicabilidade(d.id, 'nao', fv(f, 'j')));
    if (a === 'solicitar') return modalForm('Solicitação enviada — ' + d.categoria, `<p class="peq">Registre somente uma solicitação <b>já enviada</b>. Rascunho preparado não conta.</p><div class="g2">${campo('Data do envio', inp('data', hoje, { type: 'date' }), { req: true })}${campo('Meio', inp('meio', '', { extra: ' list="meios"' }), { req: true })}<datalist id="meios"><option value="E-mail"><option value="WhatsApp"><option value="Reunião"><option value="Portal do cliente"><option value="Telefone"></datalist>
      ${campo('Evidência do envio', inp('evidencia', ''), { cls: 'span2', ajuda: 'Assunto do e-mail, data/hora da mensagem, ata…' })}${campo('Prazo acordado', inp('prazo', d.prazoAcordado, { type: 'date' }))}</div>`,
    f => { core.registrarSolicitacao(d.id, { data: fv(f, 'data'), meio: fv(f, 'meio'), evidencia: fv(f, 'evidencia'), prazo: fv(f, 'prazo') }); toast('Solicitação registrada: aguardando o cliente.', 'ok'); }, { ok: 'Registrar envio' });
    if (a === 'receber') return modalForm('Arquivo recebido — ' + d.categoria, `<div class="g2">${campo('Nome do arquivo', inp('arquivo', ''))}${campo('Link restrito (Drive etc.)', inp('link', '', { type: 'url' }))}
      ${campo('Data de recebimento', inp('recebidoEm', hoje, { type: 'date' }))}${campo('Origem', inp('origem', ''), { ajuda: 'E-mail de …, WhatsApp, pasta do Drive…' })}
      ${campo('Emissor do documento', inp('emissor', d.emissor))}${campo('Validade do documento', inp('validade', d.validade))}
      ${campo('Loja/CNPJ/endereço identificados no arquivo', inp('identificacao', ''), { cls: 'span2' })}
      ${campo('Hash do arquivo (opcional)', inp('hash', ''), { cls: 'span2', ajuda: 'Ou escolha o arquivo abaixo para o módulo calcular o hash (o arquivo não é guardado).' })}
      <label class="campo span2"><span>Calcular hash a partir do arquivo</span><input type="file" name="arq"></label></div><p class="xs muted">Arquivo recebido não significa documento validado: ele entra como "Recebido / em validação". O mesmo arquivo reenviado não cria nova versão.</p>`,
    f => { const r = core.registrarRecebimento(d.id, { arquivo: fv(f, 'arquivo'), link: fv(f, 'link'), recebidoEm: fv(f, 'recebidoEm'), origem: fv(f, 'origem'), emissor: fv(f, 'emissor'), validade: fv(f, 'validade'), identificacao: fv(f, 'identificacao'), hash: fv(f, 'hash') }); toast(r.duplicado ? `Arquivo já registrado (versão ${r.versao}): nada foi duplicado.` : `Versão ${r.versao} registrada: em validação.`, r.duplicado ? '' : 'ok'); }, { ok: 'Registrar recebimento' })
      .querySelector('[name=arq]').addEventListener('change', async e => { const fi = e.target.files[0]; if (!fi) return; const f = e.target.form; if (!fv(f, 'arquivo')) f.querySelector('[name=arquivo]').value = fi.name; const buf = new Uint8Array(await fi.arrayBuffer()); f.querySelector('[name=hash]').value = sha256Bytes(buf); });
    if (a === 'validar') { const av = core.avisosValidacao(d); return modalForm('Validar — ' + d.categoria, `${av.map(x => `<div class="msg-aviso">${esc(x)}</div>`).join('')}<p class="peq">Confirme a conferência do arquivo para a finalidade:</p>
      <label class="chk-f"><input type="checkbox" name="legivel"> Legível e completo</label><label class="chk-f"><input type="checkbox" name="identidade"> Loja / CNPJ / endereço conferem com esta unidade</label><label class="chk-f"><input type="checkbox" name="escopo"> Assinatura, validade e escopo adequados à categoria</label>${campo('Observação', area('obs', ''))}`,
    f => { core.validarDocumento(d.id, { legivel: fv(f, 'legivel'), identidade: fv(f, 'identidade'), escopo: fv(f, 'escopo'), obs: fv(f, 'obs') }); toast('Documento validado: cobrança encerrada.', 'ok'); }, { ok: 'Validar' }); }
    if (a === 'refazer') return modalForm('Pedir correção — ' + d.categoria, `${campo('Motivo da rejeição', area('motivo', ''), { req: true })}${campo('Providência solicitada', area('prov', d.providencia), { req: true })}`, f => core.pedirCorrecao(d.id, fv(f, 'motivo'), fv(f, 'prov')));
    if (a === 'pendente') return modalForm('Pendente — ' + d.categoria, campo('Motivo explícito', area('motivo', ''), { req: true, ajuda: 'Use só se nenhum estado mais preciso couber.' }), f => core.marcarPendente(d.id, fv(f, 'motivo')));
    if (a === 'remover') return modalForm('Remover da lista — ' + d.categoria, campo('Motivo', area('motivo', ''), { req: true }), f => core.removerDocumento(d.id, fv(f, 'motivo')), { ok: 'Remover' });

  /* ---------- pendências ---------- */

      ${l.map(pn => { const p = core.processo(pn.processoId), venc = pn.situacao === 'aberta' && dataCompleta(pn.prazoAcordado) && pn.prazoAcordado < hoje, dias = core.diasEmAberto(pn);
        return `<tr>${comUnidade ? `<td><button class="btn-link" data-act="abrir-proc" data-id="${p.id}">${esc(core.rotuloProcesso(p))}</button></td>` : ''}<td>${esc(pn.descricao)}</td><td>${esc(RESPONSAVEL[pn.responsavel])}</td><td>${ni(pn.solicitante)}</td><td>${ni(dataBR(pn.primeiraSolicitacao))}</td><td>${ni(dataBR(pn.ultimaCobranca))}${pn.cobrancas > 1 ? ` <span class="xs muted">(${pn.cobrancas} envios)</span>` : ''}</td>

        <td>${pn.situacao === 'aberta' ? (pn.recebidoEm ? '<span class="st st-val">Recebido / em validação</span>' : '<span class="st st-agu">Aberta</span>') : `<span class="st ${pn.situacao === 'resolvida' ? 'st-ok' : 'st-na'}">${pn.situacao === 'resolvida' ? 'Resolvida' : 'Cancelada'}</span><div class="xs muted">${esc(pn.evidenciaResolucao)}</div>`}</td>

  }

  function dadosMapa(ps, soAplicaveis) {
    const cats = [];
    ps.forEach(p => core.docsDo(p.id).forEach(d => { if (soAplicaveis && d.aplicavel === 'nao') return; if (!cats.includes(d.categoria)) cats.push(d.categoria); }));
    const ordem = LISTA_BASE.map(b => b.categoria);
    cats.sort((a, b) => { const ia = ordem.indexOf(a), ib = ordem.indexOf(b); return (ia < 0 ? 999 : ia) - (ib < 0 ? 999 : ib) || a.localeCompare(b, 'pt-BR'); });
    return cats;
  }
  /* Célula do mapa: na tela (interativa) a sigla é botão que abre a escolha do estado; no PDF é só texto */
  function celulaMapa(p, cat, interativo) {
    const d = core.docsDo(p.id).find(x => x.categoria === cat);
    if (!d) return '<td class="cel"><span class="muted" title="Não listado neste processo">—</span></td>';
    const s = d.aplicavel === 'indefinido' && d.estado === 'a_solicitar' ? { cls: 'st-ind', sigla: 'IND', rot: 'Aplicabilidade indefinida' } : ESTADOS_DOC[d.estado];
    const tit = `${s.rot}${d.motivo ? ' — ' + d.motivo : ''}`;
    if (!interativo || !podeEditar()) return `<td class="cel"><span class="st ${s.cls}" title="${esc(tit)}">${s.sigla}</span></td>`;
    return `<td class="cel"><button type="button" class="st ${s.cls} btn-celula" data-act="mapa-doc" data-id="${d.id}" title="${esc(tit)} · clique para mudar o estado">${s.sigla}</button></td>`;
  }
  const legendaHTML = () => `<div class="legenda">${Object.values(ESTADOS_DOC).map(s => `<span><span class="st ${s.cls}">${s.sigla}</span> ${esc(s.rot)}: ${esc(s.desc)}</span>`).join('')}<span><span class="st st-ind">IND</span> Aplicabilidade indefinida (a confirmar na norma da UF).</span><span><span class="muted">—</span> Não listado para a unidade.</span></div>`;
  function telaMapa(el) {
    const f = UI.fMapa, ps = core.listarProcessos({ clienteId: f.clienteId, uf: f.uf }), cats = dadosMapa(ps);
    el.innerHTML = `<div class="cab-tela"><h1>Mapa documental</h1></div><div class="cartao"><div class="filtros" id="filtros-mapa">${campo('Cliente', sel('clienteId', opt('', 'Todos', f.clienteId) + core.listarClientes().map(c => opt(c.id, c.nome, f.clienteId)).join('')))}${campo('UF', sel('uf', optUF(f.uf, 'Todas')))}</div>
      <p class="xs muted">Uma linha por unidade/processo, uma coluna por categoria documental. Base ${esc(core.versaoBase(f.clienteId || null))} · ${dataHoraBR(new Date().toISOString())}.</p><div class="linha"><button class="btn btn-primario" data-act="imprimir-mapa">Imprimir / salvar PDF do mapa</button></div><p class="xs muted">Escolha um cliente no filtro para gerar o PDF. O número é atribuído ao imprimir e fica no histórico de relatórios.</p>${legendaHTML()}
      ${ps.length ? `<div class="tabela-wrap"><table class="tab mapa"><thead><tr><th>Unidade</th><th>Etapa</th><th>Licença</th><th>Progresso</th>${cats.map(c => `<th class="cat">${esc(c)}</th>`).join('')}</tr></thead><tbody>
      ${ps.map(p => { const pr = core.progresso(p.id); return `<tr class="clicavel" data-act="abrir-proc" data-id="${p.id}"><td class="uni"><b>${esc(core.cliente(p.clienteId).nome)}</b>${p.codigoUnidade ? ' · ' + esc(p.codigoUnidade) : ''}<div class="xs muted">${esc(p.municipio)}/${esc(p.uf)}${p.cnpj ? ' · ' + esc(p.cnpj) : ''}</div></td><td class="xs">${esc(ETAPAS[p.etapa])}</td><td>${chipLic(p)}</td><td class="num">${pr.prontos}/${pr.base}${pr.indefinidos ? `<div class="xs txt-alerta">+${pr.indefinidos} ind.</div>` : ''}</td>${cats.map(c => celulaMapa(p, c, true)).join('')}</tr>`; }).join('')}</tbody></table></div>` : '<p class="muted">Nenhum processo.</p>'}</div>`;
    $('#filtros-mapa').addEventListener('change', e => { UI.fMapa[e.target.name] = e.target.value; renderTela(); });
  }
  /* Escolha do estado a partir do mapa: cada opção leva à mesma tela da ficha do documento, que exige os dados do estado */
  function modalMapaEstado(id) {

  function montarRelatorio(cliId, o) {
    o = o || {};
    const c = core.cliente(cliId), u = core.user(), agora = new Date().toISOString(), base = core.versaoBase(cliId);
    const ps = core.listarProcessos({ clienteId: cliId }), cats = dadosMapa(ps, true);
    const codigo = o.codigo || '(número atribuído ao emitir)';
    const itens = [], recebidos = []; let emAnalise = 0;
    ps.forEach(p => {
      core.docsDo(p.id).forEach(d => {
        if (d.aplicavel === 'nao') return;

        if (!o.interno && d.responsavel !== 'cliente') return;
        const lin = { p, item: d.categoria, prov: d.providencia || (d.estado === 'refazer' ? '' : 'Enviar o documento'), resp: RESPONSAVEL[d.responsavel], prazo: dataBR(d.prazoAcordado), obs: [d.estado === 'refazer' ? 'Correção: ' + d.motivo : '', d.observacaoCliente].filter(Boolean).join(' · '), estado: d.estado };

    const html = `<style>@page paisagem { @top-left { content: "${cab.replace(/"/g, "'")}"; } @top-right { content: "${(c.nome + ' · ' + dataHoraBR(agora)).replace(/"/g, "'")}"; } @bottom-left { content: "Base ${base} · Responsável: ${u.nome.replace(/"/g, "'")}"; } @bottom-right { content: "Página " counter(page) " de " counter(pages); } }</style>
    <div class="doc doc-lic"><div class="doc-cab"><img src="${LOGO_AZUL}" alt="WRD Soluções"><div><div class="doc-tit">${o.interno ? 'Controle documental — uso interno' : 'Relatório de pendências documentais'}</div>
      <div class="doc-meta">WRD SOLUÇÕES · Licenciamento simplificado do Corpo de Bombeiros<br>Nº <b>${esc(codigo)}</b> · Cliente: <b>${esc(c.nome)}</b> · Emitido em ${dataHoraBR(agora)} · Versão da base: <b>${base}</b><br>Responsável: ${esc(u.nome)}${u.registro ? ' · ' + esc(u.registro) : ''}${u.cargo ? ' · ' + esc(u.cargo) : ''}</div></div></div>
      <h2>1. Mapa geral por unidade</h2>
      ${ps.length ? `<table class="rel-tab mapa"><thead><tr><th>Unidade</th><th>Etapa</th><th>Situação da licença</th><th>Progresso documental</th>${cats.map(x => `<th class="cat">${esc(x)}</th>`).join('')}</tr></thead><tbody>${ps.map(p => { const pr = core.progresso(p.id); return `<tr><td>${uni(p)}${p.cnpj ? `<div>${esc(p.cnpj)}</div>` : ''}</td><td>${esc(ETAPAS[p.etapa])}</td><td>${esc(situacaoLicenca(p).rot)}</td><td>${pr.validados} de ${pr.aplicaveis} validados${pr.indefinidos ? ` · ${pr.indefinidos} em análise` : ''}</td>${cats.map(x => celulaMapa(p, x)).join('')}</tr>`; }).join('')}</tbody></table>` : '<p>Nenhuma unidade.</p>'}
      <h3>Legenda</h3>${legendaHTML()}

      <h2>3. Observações</h2><ul><li>Arquivo recebido não significa documento validado.</li><li>Controle documental completo não equivale a prontidão para protocolo, conformidade técnica ou licença emitida.</li><li>Situação da licença com data ausente ou incompleta permanece "A confirmar".</li><li>Prazos de análise do Corpo de Bombeiros são do órgão, não da WRD.</li><li>Este relatório reflete a base ${base} no momento da emissão; alterações posteriores não estão incluídas.</li></ul>

    return { html, texto, msg, base, processos: ps.map(p => p.id) };

  /* =================================================================
     CONTRATO DE PLUG — window.NEXO_MODULE (nexo-plug/1)
     Comunicação externa somente por window.parent.postMessage e JSON.
     ================================================================= */
  const extListeners = {};
  const semCore = () => ({ erro: 'Módulo sem sessão: abra o módulo e faça login.', codigo: 'AUTH' });
  const NEXO = {
    manifest: MANIFEST,
    getState() { if (!core || !core.user()) return semCore(); try { return core.snapshot(); } catch (e) { return { erro: e.message, codigo: e.code || 'ERRO' }; } },
    getKPIs() {
      if (!core || !core.user()) return semCore();
      try { const k = core.indicadores(); return { geradoEm: new Date().toISOString(), demo: core.demo, versaoBase: core.versaoBase(null), indicadores: MANIFEST.indicadores.map(i => Object.assign({}, i, { valor: k[i.id] == null ? null : k[i.id] })) }; }
      catch (e) { return { erro: e.message, codigo: e.code || 'ERRO' }; }
    },
    export(formato) {
      if (!core || !core.user()) return semCore();
      try {
        if (formato === 'json') return JSON.stringify(core.snapshot());
        if (formato === 'csv') return core.csvDocumentos();
        if (formato === 'csv-pendencias') return core.csvPendencias();
        if (formato === 'pdf') { UI.tela = 'relatorios'; renderTela(); return { ok: true, mensagem: 'Abra o relatório e use "Imprimir / salvar PDF".' }; }
        return { erro: 'Formato não suportado. Use: ' + MANIFEST.exporta.join(', ') };
      } catch (e) { return { erro: e.message, codigo: e.code || 'ERRO' }; }
    },
    on(evento, fn) { (extListeners[evento] = extListeners[evento] || []).push(fn); return () => { extListeners[evento] = (extListeners[evento] || []).filter(f => f !== fn); }; },
    emit(evento, payload) {
      const msg = { contrato: MANIFEST.contrato, modulo: MANIFEST.id, versao: MANIFEST.versao, evento, payload: payload || {}, demo: core ? core.demo : false, ts: new Date().toISOString() };
      [...(extListeners[evento] || []), ...(extListeners['*'] || [])].forEach(fn => { try { fn(msg.payload, evento); } catch (e) { console.error(e); } });
      try { if (window.parent && window.parent !== window) window.parent.postMessage(msg, '*'); } catch (e) { /* sem painel */ }
    }
  };
  window.NEXO_MODULE = NEXO;
  window.addEventListener('message', e => {
    if (window.parent === window || e.source !== window.parent) return;
    const d = e.data || {}; if (d.contrato !== MANIFEST.contrato || !d.pedido) return;
    const mapa = { manifest: () => MANIFEST, getKPIs: () => NEXO.getKPIs(), getState: () => NEXO.getState(), export: () => (d.args && d.args[0] === 'pdf' ? { erro: 'PDF só pela interface do módulo.' } : NEXO.export(...(d.args || []))) };
    const fn = mapa[d.pedido];
    window.parent.postMessage({ contrato: MANIFEST.contrato, modulo: MANIFEST.id, resposta: d.pedido, id: d.id, dados: fn ? fn() : { erro: 'Pedido desconhecido.' } }, '*');
  });
  /* Diagnóstico para testes automatizados (somente leitura). */
  window.__ppcis = { get core() { return core; }, UI, abrirModo, renderTela, montarRelatorio };
