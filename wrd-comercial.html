.sit-resolvida, .sit-concluida { background: var(--ok-fundo); color: var(--ok); }
.sit-cancelada { background: var(--n-100); color: var(--n-500); text-decoration: line-through; }
.vis-cliente { background: var(--cor-primaria-suave); color: var(--cor-primaria); border-color: var(--cor-primaria-media); }
.vis-interna { background: var(--alerta-fundo); color: var(--alerta); }
.bloco { border: var(--borda) solid var(--n-200); border-radius: var(--raio); padding: var(--esp-3); background: var(--n-50); margin-bottom: var(--esp-3); }
.bloco h3 { margin-top: 0; }
.bloco.ok { border-color: var(--ok); background: var(--ok-fundo); }
.bloco.interno { border-color: var(--alerta); background: var(--interno-fundo); }
.bloco.compartilhavel { border-color: var(--cor-primaria-media); background: var(--cor-primaria-suave); }

/* ---------- tabelas ---------- */
.tabela-wrap { overflow-x: auto; border: var(--borda) solid var(--n-200); border-radius: var(--raio); background: var(--n-0); }
table.tab { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); }
table.tab th { background: var(--n-100); text-align: left; font-weight: var(--peso-medio); color: var(--n-700); padding: var(--esp-2); border-bottom: var(--borda) solid var(--n-200); white-space: nowrap; }
table.tab td { padding: var(--esp-2); border-bottom: var(--borda) solid var(--n-100); vertical-align: top; }
table.tab tr.clicavel { cursor: pointer; }
table.tab tr.clicavel:hover td { background: var(--cor-primaria-suave); }
table.tab tr.fechada td { color: var(--n-500); }
table.tab .acoes { text-align: right; white-space: nowrap; }

/* ---------- filtros ---------- */
.filtros-box { background: var(--n-0); border: var(--borda) solid var(--n-200); border-radius: var(--raio-lg); padding: var(--esp-2) var(--esp-3); margin-bottom: var(--esp-3); }
.filtros-box > summary { cursor: pointer; font-weight: var(--peso-medio); color: var(--cor-primaria); padding: var(--esp-1) 0; }
.filtros { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--min-filtro), 1fr)); gap: var(--esp-2) var(--esp-3); margin: var(--esp-2) 0; align-items: end; }
.filtros .busca { grid-column: span 2; }
.campo-periodo { border: 0; padding: 0; margin: 0; display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: var(--esp-1); grid-column: span 2; min-width: 0; }
.campo-periodo legend { grid-column: 1 / -1; }
.filtros-acoes { border-top: var(--borda) solid var(--n-100); padding-top: var(--esp-2); }
.filtros-acoes select { width: auto; min-height: var(--altura-controle-sm); }

/* ---------- visão geral ---------- */
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--min-kpi), 1fr)); gap: var(--esp-3); margin-bottom: var(--esp-4); }
.kpi { text-align: left; background: var(--n-0); border: var(--borda) solid var(--n-200); border-left: var(--borda-destaque) solid var(--cor-primaria); border-radius: var(--raio-lg); padding: var(--esp-3) var(--esp-4); cursor: pointer; box-shadow: var(--sombra); display: flex; flex-direction: column; gap: var(--esp-0); }
.kpi:hover { border-color: var(--cor-primaria); }
.kpi .rot { font-size: var(--fs-sm); color: var(--n-700); font-weight: var(--peso-medio); }
.kpi .val { font-size: var(--fs-2xl); font-weight: var(--peso-forte); font-variant-numeric: tabular-nums; }
.kpi .det { font-size: var(--fs-xs); color: var(--n-500); }
.kpi.atencao { border-left-color: var(--critico); }
.kpi.atencao .val { color: var(--critico); }
.periodo-vg input { width: auto; }
.barras { display: grid; gap: var(--esp-2); }
.barra-l { display: grid; grid-template-columns: minmax(var(--min-rotulo-barra), 38%) 1fr auto; align-items: center; gap: var(--esp-2); background: none; border: 0; padding: var(--esp-0) 0; cursor: pointer; text-align: left; font-size: var(--fs-sm); }
.barra-l:hover .b-rot { color: var(--cor-primaria); text-decoration: underline; }
.b-trilho { height: var(--fs-icone-sm); background: var(--n-100); border-radius: var(--raio-sm); overflow: hidden; }
.b-val { display: block; height: 100%; background: var(--cor-primaria); border-radius: var(--raio-sm); min-width: var(--esp-0); }
.b-n { font-variant-numeric: tabular-nums; font-weight: var(--peso-medio); white-space: nowrap; }
.lista-simples { list-style: none; padding: 0; margin: 0; }
.lista-simples li { padding: var(--esp-2) 0; border-bottom: var(--borda) solid var(--n-100); }

/* ---------- kanban ---------- */
.alternar { display: inline-flex; border: var(--borda) solid var(--n-300); border-radius: var(--raio); overflow: hidden; }
.alternar button { border: 0; background: var(--n-0); padding: 0 var(--esp-4); min-height: var(--altura-busca); cursor: pointer; font-weight: var(--peso-medio); color: var(--n-700); }
.alternar button[aria-pressed="true"] { background: var(--cor-primaria); color: var(--n-0); }
.alternar.largo { display: flex; }
.alternar.largo button { flex: 1; }
.kanban { display: grid; grid-template-columns: repeat(6, minmax(var(--min-coluna-kanban), 1fr)); gap: var(--esp-3); overflow-x: auto; padding-bottom: var(--esp-3); }
.col { background: var(--n-100); border-radius: var(--raio-lg); padding: var(--esp-2); min-height: var(--min-coluna); display: flex; flex-direction: column; }
.col.alvo { outline: var(--borda-forte) dashed var(--cor-primaria); background: var(--cor-primaria-suave); }
.col h2 { font-size: var(--fs-sm); text-transform: uppercase; letter-spacing: var(--ls-md); margin: var(--esp-1) var(--esp-1) var(--esp-2); display: flex; justify-content: space-between; align-items: center; }
.col-corpo { display: grid; gap: var(--esp-2); align-content: start; flex: 1; }
.vazio-col { color: var(--n-500); font-size: var(--fs-sm); text-align: center; padding: var(--esp-4) 0; margin: 0; }
.card { background: var(--n-0); border: var(--borda) solid var(--n-200); border-left: var(--borda-destaque) solid var(--cor-primaria-media); border-radius: var(--raio); padding: var(--esp-2) var(--esp-3); cursor: pointer; box-shadow: var(--sombra); font-size: var(--fs-sm); }
.card:hover { border-color: var(--cor-primaria); }
.card.atras { border-left-color: var(--critico); }
.card.bloq { border-left-color: var(--critico); background: repeating-linear-gradient(135deg, var(--n-0), var(--n-0) var(--esp-3), var(--critico-fundo) var(--esp-3), var(--critico-fundo) calc(var(--esp-3) + var(--esp-0))); }
.card.arrastando { opacity: var(--op-desabilitado); }
.card h3 { font-size: var(--fs-md); margin: var(--esp-1) 0; color: var(--n-900); line-height: var(--lh-titulo); }
.card-top { display: flex; justify-content: space-between; align-items: center; gap: var(--esp-2); }
.card .cod { font-weight: var(--peso-forte); color: var(--cor-primaria); font-size: var(--fs-xs); letter-spacing: var(--ls-sm); }
.card-l { color: var(--n-700); line-height: var(--lh-cartao); }
.card-badges { display: flex; flex-wrap: wrap; gap: var(--esp-1); margin-top: var(--esp-2); }

/* ---------- modal ---------- */
.modal-fundo { position: fixed; inset: 0; background: var(--sobreposicao); z-index: var(--z-modal); display: flex; align-items: flex-start; justify-content: center; padding: var(--margem-modal) var(--esp-3); overflow-y: auto; }
.modal { background: var(--n-0); border-radius: var(--raio-lg); box-shadow: var(--sombra-lg); width: 100%; max-width: var(--largura-modal); }
.modal.largo { max-width: var(--largura-modal-largo); }
.modal-cab { display: flex; align-items: center; justify-content: space-between; gap: var(--esp-2); padding: var(--esp-3) var(--esp-4); border-bottom: var(--borda) solid var(--n-200); position: sticky; top: 0; background: var(--n-0); border-radius: var(--raio-lg) var(--raio-lg) 0 0; z-index: var(--z-meio); }
.modal-cab h2 { margin: 0; font-size: var(--fs-lg); }
.modal-corpo { padding: var(--esp-4); }
.det-cab { display: flex; justify-content: space-between; gap: var(--esp-3); flex-wrap: wrap; align-items: center; margin-bottom: var(--esp-3); }
.det-cab .campo-inline select { min-height: var(--altura-controle-sm); }
.sub-abas { display: flex; gap: var(--esp-1); flex-wrap: wrap; margin-bottom: var(--esp-3); }
.sub-abas button { border: var(--borda) solid var(--n-300); background: var(--n-0); border-radius: var(--raio-pilula); padding: var(--esp-1) var(--esp-3); cursor: pointer; font-size: var(--fs-sm); font-weight: var(--peso-medio); color: var(--n-700); }
.sub-abas button[aria-pressed="true"] { background: var(--cor-primaria); border-color: var(--cor-primaria); color: var(--n-0); }
.kvs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--esp-2) var(--esp-4); margin: 0 0 var(--esp-3); }
.kv dt { font-size: var(--fs-xs); color: var(--n-500); text-transform: uppercase; letter-spacing: var(--ls-md); }
.kv dd { margin: 0; }
.anexos { border: var(--borda) solid var(--n-200); border-radius: var(--raio); padding: var(--esp-2) var(--esp-3); }
.rot-anexos { font-size: var(--fs-sm); font-weight: var(--peso-medio); color: var(--n-700); margin-bottom: var(--esp-1); }
.lista-anexos { margin: 0 0 var(--esp-2); padding-left: var(--esp-4); font-size: var(--fs-sm); }
.coments { list-style: none; padding: 0; margin: 0 0 var(--esp-3); display: grid; gap: var(--esp-2); }
.coment { border: var(--borda) solid var(--n-200); border-radius: var(--raio); padding: var(--esp-2) var(--esp-3); }
.coment.cliente { border-color: var(--cor-primaria-media); background: var(--cor-primaria-suave); }
.coment.interna { background: var(--interno-fundo); }
.coment p { margin: var(--esp-1) 0 0; }
.sec-coment { border-top: var(--borda) solid var(--n-200); margin-top: var(--esp-4); }
.prog { display: inline-block; width: var(--largura-progresso); height: var(--esp-2); background: var(--n-100); border-radius: var(--raio-sm); overflow: hidden; vertical-align: middle; }
.prog span { display: block; height: 100%; background: var(--cor-primaria); }

/* ---------- toasts ---------- */
.toasts { position: fixed; right: var(--esp-4); bottom: var(--esp-4); display: grid; gap: var(--esp-2); z-index: var(--z-aviso); max-width: min(var(--largura-toast), calc(var(--largura-tela) - var(--esp-6))); }
.toast { padding: var(--esp-3) var(--esp-4); border-radius: var(--raio); box-shadow: var(--sombra-lg); background: var(--n-900); color: var(--n-0); font-size: var(--fs-sm); }
.toast.ok { background: var(--ok); }
.toast.erro { background: var(--critico); }

/* ---------- entrada ---------- */
.entrada { min-height: var(--altura-tela); display: flex; align-items: center; justify-content: center; padding: var(--esp-4); background: linear-gradient(160deg, var(--cor-primaria-suave), var(--n-50)); }
.entrada-box { background: var(--n-0); border-radius: var(--raio-lg); box-shadow: var(--sombra-lg); padding: var(--esp-6) var(--esp-5); width: 100%; max-width: var(--largura-entrada); text-align: center; }
.entrada-box form, .entrada-box .grade { text-align: left; }
.logo-entrada { height: var(--logo-entrada); margin-bottom: var(--esp-2); }
.entrada h1 { margin: 0 0 var(--esp-2); font-size: var(--fs-xl); }

/* ---------- clientes ---------- */
.lista-cli .cartao.arquivado { opacity: var(--op-arquivado); }
.lista-uni { margin: var(--esp-1) 0 0; padding-left: var(--esp-4); }

/* ---------- relatórios ---------- */
.rel-grade { display: grid; grid-template-columns: minmax(var(--rel-cfg-min), var(--rel-cfg-max)) 1fr; gap: var(--esp-4); align-items: start; }
.rel-cfg h2 { font-size: var(--fs-md); margin: var(--esp-4) 0 var(--esp-2); }
.rel-cfg h2:first-child { margin-top: 0; }
.campos-rel { padding-left: var(--esp-5); margin: 0 0 var(--esp-3); display: grid; gap: var(--esp-0); }
.campos-rel li { display: flex; justify-content: space-between; align-items: center; gap: var(--esp-2); }
.campos-rel li.bloqueado { color: var(--n-500); }
.prev-aviso { background: var(--cor-primaria-suave); border: var(--borda) solid var(--cor-primaria-clara); color: var(--cor-primaria-escura); padding: var(--esp-2) var(--esp-3); border-radius: var(--raio); margin-bottom: var(--esp-3); font-size: var(--fs-sm); font-weight: var(--peso-medio); }
.rel-prev { min-width: 0; }
.doc { background: var(--n-0); border: var(--borda) solid var(--n-200); box-shadow: var(--sombra); padding: var(--doc-pad-v) var(--doc-pad-h); font-size: var(--doc-fs); color: var(--n-900); overflow-x: auto; }
.doc-cab { display: flex; align-items: center; gap: var(--esp-4); border-bottom: var(--borda-aba) solid var(--cor-primaria); padding-bottom: var(--esp-3); margin-bottom: var(--esp-3); }
.doc-cab img { height: var(--logo-doc); }
.doc-tit { font-size: var(--doc-fs-titulo); font-weight: var(--peso-forte); color: var(--cor-primaria-escura); }
.doc-emp { color: var(--n-500); }
.doc-selo { margin-left: auto; border: var(--borda-forte) solid var(--alerta); color: var(--alerta); font-weight: var(--peso-forte); padding: var(--esp-0) var(--esp-3); border-radius: var(--raio-sm); letter-spacing: var(--ls-lg); }
.doc h2 { font-size: var(--doc-fs-secao); margin: var(--esp-4) 0 var(--esp-1); color: var(--cor-primaria-escura); border-bottom: var(--borda) solid var(--n-200); padding-bottom: var(--raio-xs); }
.doc-meta { width: 100%; border-collapse: collapse; margin-bottom: var(--esp-2); }
.doc-meta th { text-align: left; color: var(--n-500); font-weight: var(--peso-medio); width: 14%; padding: var(--raio-xs) var(--esp-1); vertical-align: top; }
.doc-meta td { padding: var(--raio-xs) var(--esp-1); vertical-align: top; }
.doc-tab { width: 100%; border-collapse: collapse; margin-bottom: var(--esp-1); }
.doc-tab th { background: var(--cor-primaria); color: var(--n-0); text-align: left; padding: var(--esp-1) var(--esp-1); font-weight: var(--peso-medio); font-size: var(--doc-fs-cab-tabela); }
.doc-tab td { border-bottom: var(--borda) solid var(--n-200); padding: var(--esp-1) var(--esp-1); vertical-align: top; }
.doc-tab tr:nth-child(even) td { background: var(--n-50); }
.doc-rod { margin-top: var(--esp-5); border-top: var(--borda) solid var(--n-200); padding-top: var(--esp-1); color: var(--n-500); font-size: var(--doc-fs-rodape); text-align: center; }
#area-impressao { display: none; }
.texto-copia { width: 100%; font-family: var(--fonte-mono); font-size: var(--fs-sm); margin: var(--esp-2) 0; }
.carregando { padding: var(--esp-7) var(--esp-4); text-align: center; color: var(--n-500); font-size: var(--fs-lg); }
.carregando::before { content: ""; display: block; width: var(--icone-carregando); height: var(--icone-carregando); margin: 0 auto var(--esp-3); border: var(--borda-aba) solid var(--cor-primaria-clara); border-top-color: var(--cor-primaria); border-radius: var(--raio-pilula); animation: girar var(--dur-giro) linear infinite; }
@keyframes girar { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .carregando::before { animation: none; } }

/* ---------- responsivo ---------- */
@media (max-width: 1100px) {
  .g3 { grid-template-columns: 1fr; }
  .rel-grade { grid-template-columns: 1fr; }
}
@media (max-width: 760px) {
  .topo-in { flex-wrap: wrap; padding: var(--esp-2) var(--esp-3); gap: var(--esp-2); }
  .topo .modulo { display: none; }
  .busca-global { order: 5; flex-basis: 100%; max-width: none; }
  .topo .usuario { margin-left: auto; }
  main { padding: var(--esp-2) var(--esp-3) var(--esp-6); }
  .g2, .kvs { grid-template-columns: 1fr; }
  .filtros { grid-template-columns: 1fr 1fr; }
  .filtros .busca, .campo-periodo { grid-column: 1 / -1; }
  .kanban { grid-template-columns: repeat(6, 82vw); scroll-snap-type: x mandatory; }
  .col { scroll-snap-align: start; }
  .kpis { grid-template-columns: 1fr 1fr; }
  .kpi { padding: var(--esp-2) var(--esp-3); }
  .kpi .val { font-size: var(--fs-xl); }
  .modal-fundo { padding: 0; }
  .modal, .modal.largo { max-width: none; min-height: var(--altura-tela); border-radius: 0; }
  .modal-cab { border-radius: 0; }
  .modal-corpo { padding: var(--esp-3); }
  .ed-linha { flex-wrap: wrap; }
  .ed-linha input { flex: 1 1 40%; }
  .doc { padding: var(--esp-4); }
  .cab-tela h1 { font-size: var(--fs-lg); }
  .barra-l { grid-template-columns: minmax(var(--min-rotulo-barra), 40%) 1fr auto; }
}

/* ---------- impressão ---------- */
/* exceção: @page e suas margens não aceitam variáveis CSS */
@page { margin: 12mm 12mm 16mm 12mm;
  @bottom-left { content: "WRD Soluções · Módulo Comercial"; font-size: 8pt; color: #737881; }
  @bottom-right { content: "Página " counter(page) " de " counter(pages); font-size: 8pt; color: #737881; }
}
@media print {
  body { background: var(--n-0); }
  body.imprimindo-doc #app, body.imprimindo-doc #toasts, body.imprimindo-doc .modal-fundo { display: none !important; }
  body.imprimindo-doc #area-impressao { display: block; }
  body:not(.imprimindo-doc) .topo, body:not(.imprimindo-doc) .nav, body:not(.imprimindo-doc) .filtros-box, body:not(.imprimindo-doc) .btn, body:not(.imprimindo-doc) #toasts { display: none !important; }
  .doc { border: 0; box-shadow: none; padding: 0; font-size: var(--doc-fs-impressao); overflow: visible; }
  .doc-tab tr { page-break-inside: avoid; }
  .doc-tab thead { display: table-header-group; }
  .doc h2 { page-break-after: avoid; }
  .doc-tab th, .doc-tab td, .doc-cab { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
/* ---------- específicos do Comercial (só variáveis do :root) ---------- */
.col-total { font-size: var(--fs-xs); color: var(--n-700); font-weight: var(--peso-medio); margin: 0 var(--esp-1) var(--esp-2); font-variant-numeric: tabular-nums; }
.card-acao { margin-top: var(--esp-1); font-size: var(--fs-xs); font-weight: var(--peso-medio); color: var(--cor-primaria-escura); }
.card.ganha { border-left-color: var(--ok); }
.card.perdida { border-left-color: var(--n-300); opacity: var(--op-perdida); }
.card[draggable="true"] { cursor: grab; }
.agenda-grade { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: var(--esp-4); align-items: start; }
.lista-agenda { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--esp-2); }
.item-agenda { display: grid; grid-template-columns: var(--largura-progresso) minmax(0, 1fr) auto; gap: var(--esp-3); align-items: center; border: var(--borda) solid var(--n-200); border-left: var(--borda-destaque) solid var(--cor-primaria-media); border-radius: var(--raio); padding: var(--esp-2) var(--esp-3); background: var(--n-0); }
.item-agenda.atras { border-left-color: var(--critico); background: var(--critico-fundo); }
.ia-data { display: flex; flex-direction: column; font-size: var(--fs-sm); line-height: var(--lh-compacta); }
.ia-corpo { min-width: 0; }
.ia-acoes { justify-content: flex-end; }
.tres-valores { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--esp-3); margin-bottom: var(--esp-4); }
.valor-card { background: var(--n-0); border: var(--borda) solid var(--n-200); border-top: var(--borda-destaque) solid var(--cor-primaria-media); border-radius: var(--raio-lg); padding: var(--esp-3) var(--esp-4); display: flex; flex-direction: column; gap: var(--esp-1); box-shadow: var(--sombra); }
.valor-card.vendido { border-top-color: var(--ok); }
.valor-card.recebido { border-top-color: var(--cor-secundaria); background: var(--n-50); }
.valor-card .rot { font-size: var(--fs-sm); font-weight: var(--peso-forte); color: var(--n-700); }
.valor-card .val { font-size: var(--fs-2xl); font-weight: var(--peso-forte); font-variant-numeric: tabular-nums; color: var(--cor-primaria-escura); }
.valor-card.vendido .val { color: var(--ok); }
.valor-card.recebido .val { color: var(--n-500); font-size: var(--fs-xl); }
.valor-card .det { font-size: var(--fs-xs); color: var(--n-500); }
.prop-rascunho { background: var(--n-100); color: var(--n-700); }
.prop-enviada { background: var(--cor-primaria-suave); color: var(--cor-primaria); border-color: var(--cor-primaria-clara); }
.prop-em_revisao { background: var(--alerta-fundo); color: var(--alerta); }
.prop-aprovada { background: var(--ok-fundo); color: var(--ok); }
.prop-recusada { background: var(--n-100); color: var(--n-500); text-decoration: line-through; }
.prop-vencida { background: var(--critico-fundo); color: var(--critico); }
.alerta-critico > span:first-child { color: var(--critico); font-weight: var(--peso-medio); }
.alerta-alerta > span:first-child { color: var(--alerta); }
.alerta-n { background: var(--critico); color: var(--n-0); }
.doc { font-family: var(--fonte-doc); }
.doc-tab th.num, .doc-tab td.num { text-align: right; white-space: nowrap; }
.doc-selo.interno { border-color: var(--cor-primaria); color: var(--cor-primaria); }
.doc-aviso { background: var(--alerta-fundo); color: var(--alerta); padding: var(--esp-1) var(--esp-2); border-radius: var(--raio-sm); font-weight: var(--peso-medio); }
.lista-simples li.linha { flex-wrap: nowrap; }
.lista-simples li.linha > span:first-child { min-width: 0; }
@media (max-width: 1100px) { .agenda-grade { grid-template-columns: 1fr; } }
@media (max-width: 760px) {
  .tres-valores { grid-template-columns: 1fr; }
  .item-agenda { grid-template-columns: var(--largura-progresso) minmax(0, 1fr); }
  .ia-acoes { grid-column: 1 / -1; justify-content: flex-start; }
  .kanban { grid-template-columns: none !important; grid-auto-flow: column; grid-auto-columns: var(--coluna-kanban-celular); }
  .lista-simples li.linha { flex-wrap: wrap; }
}
@media print { .doc { font-size: var(--doc-fs-impressao); } }
/* ---------- farol "marca d'água" ---------- */
.card.farol-verde, .item-agenda.farol-verde { background-color: var(--farol-verde-fundo); border-left-color: var(--farol-verde-borda); }
.card.farol-amarelo, .item-agenda.farol-amarelo { background-color: var(--farol-amarelo-fundo); border-left-color: var(--farol-amarelo-borda); }
.card.farol-vermelho, .item-agenda.farol-vermelho { background-color: var(--farol-vermelho-fundo); border-left-color: var(--farol-vermelho-borda); }
table.tab tr.farol-verde td:first-child { box-shadow: inset var(--borda-aba) 0 0 var(--farol-verde-borda); }
table.tab tr.farol-amarelo td:first-child { box-shadow: inset var(--borda-aba) 0 0 var(--farol-amarelo-borda); }
table.tab tr.farol-vermelho td:first-child { box-shadow: inset var(--borda-aba) 0 0 var(--farol-vermelho-borda); }
table.tab tr.farol-verde td { background-color: var(--farol-verde-fundo); }
table.tab tr.farol-amarelo td { background-color: var(--farol-amarelo-fundo); }
table.tab tr.farol-vermelho td { background-color: var(--farol-vermelho-fundo); }
.legenda-farol { display: flex; flex-wrap: wrap; gap: var(--esp-1) var(--esp-4); font-size: var(--fs-xs); color: var(--n-500); margin: 0 0 var(--esp-2); }
.lf { display: inline-flex; align-items: center; gap: var(--esp-1); }
.lf::before { content: ""; width: var(--farol-ponto); height: var(--farol-ponto); border-radius: var(--raio-pilula); border: var(--borda) solid var(--farol-verde-borda); background: var(--farol-verde-fundo); }
.lf.farol-amarelo::before { border-color: var(--farol-amarelo-borda); background: var(--farol-amarelo-fundo); }
.lf.farol-vermelho::before { border-color: var(--farol-vermelho-borda); background: var(--farol-vermelho-fundo); }
.data-inline { width: auto; display: inline-block; }
/* ---------- padrão dos módulos (WRD Operacoes/src/app.css) ---------- */
.cresce { flex: 1; }
.form-estreito { max-width: var(--largura-form-sm); }
.th-rotulo { width: var(--doc-col-rotulo); }
.th-metade { width: var(--doc-col-metade); }
.st-confirmado { background: var(--ok-fundo); color: var(--ok); }
.st-a-validar { background: var(--alerta-fundo); color: var(--alerta); }
.st-hipotese { background: var(--cor-primaria-suave); color: var(--cor-primaria); border-color: var(--cor-primaria-clara); }
.st-nao-informado { background: var(--n-100); color: var(--n-700); }

</style>

<script>
/* =====================================================================
   WRD NUVEM — sincronização dos módulos WRD (Operações, Comercial, Financeiro) com o Supabase "WRD Sistemas".
   Arquivo compartilhado: cada build.js inclui este arquivo. Sem DOM no cliente e no sincronizador.
   - Login por e-mail e senha (Supabase Auth), uma vez por aparelho; o login do módulo continua como antes.
   - Cada módulo guarda UM estado (tabela estado_modulo); só membros do módulo leem; só a função
     salvar_estado grava, com controle de versão (quem estiver desatualizado recebe CONFLITO e mescla).
   - Mesclagem: registros (listas com id) pelo mais recente (updatedAt); contadores pelo maior valor;
     o resto pelo estado gravado por último. Os módulos não excluem registros (arquivam), então juntar não perde dados.
   A chave abaixo é a chave PUBLICÁVEL do projeto (feita para ficar no navegador); a proteção é feita pelas regras do banco.
   ===================================================================== */
const WRDNuvem = (function () {
  'use strict';
  const CONFIG = { url: 'https://dqaejvkfudewwudghezp.supabase.co', chave: 'sb_publishable_CpC0CZAsU_yDqxvtRgUdsQ_vD9r-pWQ', projeto: 'WRD Sistemas' };
  const clone = o => JSON.parse(JSON.stringify(o));
  const ehObj = o => o && typeof o === 'object' && !Array.isArray(o);
  const carimbo = x => String((x && (x.updatedAt || x.ts || x.createdAt)) || '');
  function erro(msg, code) { const e = new Error(msg); e.code = code; return e; }
  const MSG = {
    'Invalid login credentials': 'E-mail ou senha incorretos.',
    'Email not confirmed': 'Confirme o e-mail: abra a mensagem enviada pelo Supabase e clique no link.',
    'User already registered': 'Este e-mail já tem acesso. Use "Entrar".',
    SEM_ACESSO: 'Seu acesso a este módulo ainda não foi liberado. Peça ao administrador.',
    CONFLITO: 'Os dados mudaram em outro aparelho.'
  };

  /* ---------- cliente REST (Auth + PostgREST), sem biblioteca externa ---------- */
  function cliente(o) {
    const modulo = o.modulo, guarda = o.guarda, guardaSessao = o.guardaSessao || o.guarda, f = o.fetchFn || ((...a) => fetch(...a)), agora = o.agora || (() => Date.now());
    let sessao = null; try { sessao = JSON.parse(guardaSessao.get('nuvem.sessao') || 'null'); } catch (e) { sessao = null; }
    const gravarSessao = s => { sessao = s; if (s) guardaSessao.set('nuvem.sessao', JSON.stringify(s)); else guardaSessao.remove('nuvem.sessao'); };
    const deResposta = j => ({ access_token: j.access_token, refresh_token: j.refresh_token, expires_at: j.expires_at ? j.expires_at * 1000 : agora() + (j.expires_in || 3600) * 1000, user: { id: j.user && j.user.id, email: j.user && j.user.email } });
    async function http(caminho, opc, autenticar) {
      const h = { apikey: CONFIG.chave, 'Content-Type': 'application/json' };
      if (autenticar) { await garantirToken(); h.Authorization = 'Bearer ' + sessao.access_token; }
      let r;
      try { r = await f(CONFIG.url + caminho, Object.assign({ headers: h }, opc)); } catch (e) { throw erro('Sem conexão com a nuvem.', 'OFFLINE'); }
      const txt = await r.text(); let j = null; try { j = txt ? JSON.parse(txt) : null; } catch (e) { j = txt; }
      if (!r.ok) {
        const m = (j && (j.message || j.msg || j.error_description || j.error)) || ('HTTP ' + r.status);
        const code = /CONFLITO/.test(m) ? 'CONFLITO' : /SEM_ACESSO/.test(m) ? 'SEM_ACESSO' : /USUARIO_NAO_CADASTRADO/.test(m) ? 'USUARIO_NAO_CADASTRADO' : r.status === 401 ? 'AUTH' : 'NUVEM';
        if (code === 'AUTH' && autenticar) gravarSessao(null);
        throw erro(MSG[code] || MSG[m] || m, code);
      }
      return j;
    }
    async function garantirToken() {
      if (!sessao) throw erro('Entre com o seu e-mail para usar a nuvem.', 'AUTH');
      if (sessao.expires_at - agora() > 60000) return;
      try { gravarSessao(deResposta(await http('/auth/v1/token?grant_type=refresh_token', { method: 'POST', body: JSON.stringify({ refresh_token: sessao.refresh_token }) }, false))); }
      catch (e) { if (e.code !== 'OFFLINE') gravarSessao(null); throw e; }
    }
    return {
      modulo,
      conectado: () => !!sessao,
      usuario: () => (sessao ? sessao.user : null),
      async entrar(email, senha) { gravarSessao(deResposta(await http('/auth/v1/token?grant_type=password', { method: 'POST', body: JSON.stringify({ email: String(email).trim(), password: senha }) }, false))); return sessao.user; },
      async cadastrar(email, senha) {
        if (String(senha || '').length < 8) throw erro('A senha da nuvem precisa de pelo menos 8 caracteres.', 'SENHA');
        const j = await http('/auth/v1/signup', { method: 'POST', body: JSON.stringify({ email: String(email).trim(), password: senha }) }, false);
        if (j && j.access_token) { gravarSessao(deResposta(j)); return { entrou: true }; }
        return { confirmar: true };
      },
      async sair() { try { if (sessao) await http('/auth/v1/logout', { method: 'POST' }, true); } catch (e) { /* sai mesmo sem conexão */ } gravarSessao(null); },
      async acesso() { const l = await http('/rest/v1/membros?select=modulo,papel', { method: 'GET' }, true); return (l || []).find(x => x.modulo === modulo) || null; },
      async ler() { const l = await http(`/rest/v1/estado_modulo?modulo=eq.${modulo}&select=dados,versao,atualizado_em,aparelho`, { method: 'GET' }, true); return l && l[0] ? l[0] : null; },
      async salvar(dados, versao, aparelho) { return http('/rest/v1/rpc/salvar_estado', { method: 'POST', body: JSON.stringify({ p_modulo: modulo, p_dados: dados, p_versao: versao, p_aparelho: aparelho || null }) }, true); },
      async uso() { return http('/rest/v1/rpc/uso_modulos', { method: 'POST', body: '{}' }, true); },
      /** Envia um PDF ao bucket privado "documentos" (pasta do módulo). Devolve o caminho guardado no registro. */
      async enviarPdf(blob) {
        await garantirToken();
        const caminho = modulo + '/' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10) + '.pdf';
        let r;
        try { r = await f(CONFIG.url + '/storage/v1/object/documentos/' + caminho, { method: 'POST', headers: { apikey: CONFIG.chave, Authorization: 'Bearer ' + sessao.access_token, 'Content-Type': 'application/pdf' }, body: blob }); }
        catch (e) { throw erro('Sem conexão com a nuvem.', 'OFFLINE'); }
        if (!r.ok) { const t = await r.text(); throw erro(/exceeded|too large|size/i.test(t) ? 'O PDF passa do limite de 25 MB.' : 'Não foi possível enviar o arquivo (' + r.status + ').', 'ENVIO'); }
        return caminho;
      },
      /** Link temporário (1 hora) para abrir um PDF do bucket privado. */
      async linkPdf(caminho) { const j = await http('/storage/v1/object/sign/documentos/' + caminho, { method: 'POST', body: JSON.stringify({ expiresIn: 3600 }) }, true); return CONFIG.url + '/storage/v1' + j.signedURL; },
      /** Publica um evento na tabela eventos (somente de inserção). Quem grava é o próprio usuário logado. */
      async publicarEvento(tipo, entidadeId, payload) {
        const uid = sessao && sessao.user ? sessao.user.id : null;
        return http('/rest/v1/eventos', { method: 'POST', headers: { Prefer: 'return=minimal' }, body: JSON.stringify({ tipo, modulo, entidade_id: entidadeId ? String(entidadeId) : null, payload: payload || {}, criado_por: uid }) }, true);
      },
      async adicionarMembro(email, papel) { return http('/rest/v1/rpc/adicionar_membro', { method: 'POST', body: JSON.stringify({ p_email: email, p_modulo: modulo, p_papel: papel || 'membro' }) }, true); }
    };
  }

  /* ---------- mesclagem de dois estados do mesmo módulo ---------- */
  function mesclarValor(L, R, chave, localMaisNovo) {
    if (Array.isArray(L) && Array.isArray(R) && L.concat(R).every(x => ehObj(x) && x.id != null)) {
      const m = new Map(R.map(x => [x.id, x]));
      for (const x of L) { const y = m.get(x.id); if (!y || carimbo(x) > carimbo(y)) m.set(x.id, x); }
      return [...m.values()];
    }
    if (ehObj(L) && ehObj(R)) {
      const out = {};
      for (const k of new Set([...Object.keys(R), ...Object.keys(L)])) out[k] = k in L ? (k in R ? mesclarValor(L[k], R[k], k, localMaisNovo) : L[k]) : R[k];
      if (/^(seq|contadores|sequencias)$/.test(chave)) for (const k of Object.keys(out)) if (typeof L[k] === 'number' && typeof R[k] === 'number') out[k] = Math.max(L[k], R[k]);
      return out;
    }
    if (chave === 'ultimoOficial' && /^\d+$/.test(L) && /^\d+$/.test(R)) return String(Math.max(+L, +R));
    return localMaisNovo ? L : R;
  }
  /** Junta o estado local (com alterações ainda não enviadas) e o remoto. */
  function mesclar(local, remoto) {
    if (!remoto) return clone(local);
    if (!local) return clone(remoto);
    const out = mesclarValor(clone(local), clone(remoto), '', carimbo(local) > carimbo(remoto));
    out.updatedAt = [carimbo(local), carimbo(remoto)].sort().pop() || out.updatedAt;
    return out;
  }

  /* ---------- sincronizador: estado local (localStorage) <-> nuvem ---------- */
  function sincronizador(o) {
    const cli = o.cliente, local = o.local, aparelho = o.aparelho || '', avisar = o.aoStatus || (() => {}), recarregar = o.aoRecarregar || (() => {});
    const lerMeta = () => { try { return JSON.parse(local.get('nuvem.meta') || 'null') || { versao: 0, pendente: false }; } catch (e) { return { versao: 0, pendente: false }; } };
    const gravarMeta = m => local.set('nuvem.meta', JSON.stringify(m));
    let meta = lerMeta(), enviando = null, geracao = 0, tmr = null, repetir = null, ultimo = null;
    const status = (s, extra) => { const st = Object.assign({ situacao: s, pendente: meta.pendente, versao: meta.versao, ultimo }, extra || {}); avisar(st); return st; };
    const estadoLocal = () => { const r = local.get('state'); return r ? JSON.parse(r) : null; };
    async function puxar() {
      if (enviando) await enviando.catch(() => {});
      status('sincronizando');
      let r; try { r = await cli.ler(); } catch (e) { return falha(e); }
      meta = lerMeta();
      const loc = estadoLocal();
      if (!r) { if (loc) { meta.pendente = true; gravarMeta(meta); return enviar(); } ultimo = new Date(); return status('ok'); }
      if (r.versao === meta.versao) { if (meta.pendente) return enviar(); ultimo = new Date(); return status('ok'); }
      // primeiro uso deste aparelho com dados já guardados nele: junta, nunca substitui
      if (meta.versao === 0 && loc) meta.pendente = true;
      if (!meta.pendente || !loc) {
        local.set('state', JSON.stringify(r.dados)); meta = { versao: r.versao, pendente: false }; gravarMeta(meta); ultimo = new Date();
        recarregar({ origem: r.aparelho || '', atualizadoEm: r.atualizado_em }); return status('ok', { recebido: true });
      }
      local.set('state', JSON.stringify(mesclar(loc, r.dados))); meta = { versao: r.versao, pendente: true }; gravarMeta(meta);
      recarregar({ mesclado: true }); return enviar();
    }
    // Dentro do painel integrado, avisa que a nuvem mudou para o painel atualizar os indicadores.
    function avisarPainel() { try { if (window.parent && window.parent !== window) window.parent.postMessage({ wrd: 'nuvem', modulo: cli.modulo }, '*'); } catch (e) { /* sem painel */ } }

  ];
  const STATUS_REGRA = ['CONFIRMADO', 'A VALIDAR', 'HIPÓTESE', 'NÃO INFORMADO'];

  /* =================================================================== */
  function createCore(opts) {
    const storage = opts.storage;
    const sessStore = opts.sessionStore || null;
    const clock = opts.clock || (() => new Date());
    const demo = !!opts.demo;
    const listeners = {};
    let pend = [], ver = 0, cache = { ver: -1 };
    const nowISO = () => clock().toISOString();

    function emptyState() {
      const ts = nowISO();
      const st = o => Object.assign({ id: uid('x'), createdAt: ts, updatedAt: ts, schemaVersion: SCHEMA_VERSION }, o);
      return {
        schemaVersion: SCHEMA_VERSION, modulo: MODULO_ID, demo, createdAt: ts, updatedAt: ts,
        config: {
          empresa: 'WRD Soluções', timezone: 'America/Sao_Paulo',
          diasParada: 15, diasSemContato: 90, diasAvisoValidade: 5, diasRetornoProposta: 3, antecedenciaRenovacao: 60, diasLembreteBackup: 7,
          automacoes: { lembretes: true, validade: true, parada: true, retorno: true, checklist: true, semContato: true, renovacao: true, backup: true },
          etapas: ETAPAS_INICIAIS.map((e, i) => Object.assign({ ordem: i, ativo: true }, e)),
          origens: ORIGENS.slice(), segmentos: SEGMENTOS.slice(), motivosPerda: MOTIVOS_PERDA.slice(), checklistPassagem: CHECKLIST_PASSAGEM.slice(),
          seq: {}, ultimoBackup: '',
          /* CONFIRMADO em 20/10/2026: último arquivo em G:\Meu Drive\WRD Engenharia\Propostas Comerciais\Propostas Comerciais 2026 = 201103-1.
             O sistema não lê a pasta: se alguém emitir proposta fora do sistema, atualize em Configurações › Numeração. */
          numeracao: { ultimoOficial: '201103', fonte: 'Pasta Propostas Comerciais 2026 (Drive): último arquivo 201103-1, consultada em 20/10/2026', atualizadoEm: '2026-10-20T12:00:00.000Z', por: 'Implantação' }
        },
        users: [],
        servicos: CATALOGO_INICIAL.map(([categoria, nome]) => st({ id: uid('srv'), categoria, nome, ativo: true, origem: 'Catálogo Mestre v2' })),
        clientes: [], unidades: [], contatos: [], oportunidades: [], atividades: [], propostas: [], vencimentos: [], historico: [], silenciados: []
      };
    }
    const COLECOES = ['users', 'servicos', 'clientes', 'unidades', 'contatos', 'oportunidades', 'atividades', 'propostas', 'vencimentos', 'historico', 'silenciados'];
    function validarEstrutura(s) {
      if (!s || typeof s !== 'object') fail('Arquivo inválido: não é um objeto JSON.');
      if (s.modulo !== MODULO_ID) fail('Arquivo inválido: não pertence ao WRD Comercial.');
      if (typeof s.schemaVersion !== 'number' || s.schemaVersion > SCHEMA_VERSION) fail(`Versão de dados não suportada (${s.schemaVersion}).`);
      for (const k of COLECOES) if (!Array.isArray(s[k])) fail(`Arquivo inválido: falta a lista "${k}".`);
      const base = emptyState().config;
      s.config = Object.assign(base, s.config || {});
      s.config.automacoes = Object.assign({}, base.automacoes, s.config.automacoes || {});
      return s;
    }
    function load() {
      const raw = storage.get('state');
      if (!raw) return emptyState();
      let s;
      try { s = JSON.parse(raw); } catch (e) { fail('Os dados salvos neste navegador estão corrompidos e não puderam ser lidos. Restaure o último backup JSON.', 'CORROMPIDO'); }
      return validarEstrutura(s);
    }
    let state = load();
    let session = null;

    /* ---------- eventos e transação ---------- */
    function on(evt, fn) { (listeners[evt] = listeners[evt] || []).push(fn); return () => { listeners[evt] = (listeners[evt] || []).filter(f => f !== fn); }; }
    function emit(evt, p) { [...(listeners[evt] || []), ...(evt !== 'change' ? (listeners['*'] || []) : [])].forEach(fn => { try { fn(p, evt); } catch (e) { console.error(e); } }); }
    /** Toda gravação é atômica: se algo falhar no meio, o estado volta ao que era e nada é salvo. */
    function mutate(fn) {
      const snap = JSON.stringify(state);
      pend = []; ver++;
      try {
        const r = fn();
        state.updatedAt = nowISO();
        storage.set('state', JSON.stringify(state));
        ver++;
        const ev = pend; pend = [];
        ev.forEach(([e, p]) => emit(e, p));
        emit('change', {});
        return r;
      } catch (e) {
        state = JSON.parse(snap); pend = []; ver++;
        if (e && (e.name === 'QuotaExceededError' || e.code === 22)) throw AppError('O espaço de armazenamento do navegador acabou. Exporte um backup e remova anexos grandes (prefira links do Drive).', 'ARMAZENAMENTO');
        throw e;
      }
    }
    const queue = (evt, p) => pend.push([evt, p]);
    function stamp(obj, prefix) { const ts = nowISO(); return Object.assign({ id: uid(prefix), createdAt: ts, updatedAt: ts, schemaVersion: SCHEMA_VERSION }, obj); }
    function proxCodigo(prefixo) {
      const ano = hoje().slice(0, 4), k = prefixo + '-' + ano;
      state.config.seq[k] = (state.config.seq[k] || 0) + 1;
      return `${prefixo}-${ano}-${String(state.config.seq[k]).padStart(4, '0')}`;
    }
    function idx() {
      if (cache.ver === ver) return cache;
      const by = {};
      for (const k of COLECOES) by[k] = new Map(state[k].map(x => [x.id, x]));
      cache = { ver, by };
      return cache;
    }
    const byId = (coll, id) => (id ? idx().by[coll].get(id) || null : null);
    function hoje() { return Dates.hojeEm(state.config.timezone || 'America/Sao_Paulo', clock()); }
    function dataLocal(ts) { return ts ? Dates.hojeEm(state.config.timezone || 'America/Sao_Paulo', new Date(ts)) : ''; }

    /* ---------- autenticação ---------- */
    function hashSenha(salt, senha) { let h = salt + ':' + senha; for (let i = 0; i < 500; i++) h = sha256(h + ':' + salt); return h; }
    function restoreSession() {
      if (!sessStore) return null;
      try {
        const s = JSON.parse(sessStore.get('session') || 'null');
        if (!s) return null;
        const u = state.users.find(x => x.id === s.userId && x.ativo);
        return u ? { userId: u.id, inicio: s.inicio } : null;
      } catch (e) { return null; }
    }
    session = restoreSession();
    function user() {
      if (!session) return null;
      const u = state.users.find(x => x.id === session.userId && x.ativo);
      if (!u) { session = null; return null; }
      return { userId: u.id, nome: u.nome, login: u.login, perfil: u.perfil, perfilRotulo: PERFIS[u.perfil].rotulo, cargo: u.cargo || '' };
    }
    function can(acao) {
      const u = user(); if (!u) return false;
      const p = PERFIS[u.perfil];
      return !!p && (p.acoes === '*' || p.acoes.includes(acao));
    }
    function guard(acao) {
      const u = user();
      if (!u) fail('Acesso negado: faça login para continuar.', 'AUTH');
      if (!can(acao)) fail(`Acesso negado: o perfil "${PERFIS[u.perfil].rotulo}" não permite esta ação.`, 'PERMISSAO');
      return u;
    }
    const isAdmin = () => { const u = user(); return !!u && u.perfil === 'admin'; };
    /** O perfil Comercial edita só o que é dele (responsável ou criador). Administrador edita tudo. */
    function dono(obj, u) { u = u || user(); return !!u && (u.perfil === 'admin' || obj.responsavelId === u.userId || obj.criadoPor === u.userId); }
    function guardDono(acao, obj, rot) {
      const u = guard(acao);
      if (SO_PROPRIOS.includes(acao) && !dono(obj, u)) fail(`Acesso negado: ${rot || 'este item'} está sob responsabilidade de outra pessoa. Peça ao responsável ou a um administrador.`, 'PERMISSAO');
      return u;
    }
    function validarUsuario(d, ex) {
      const nome = txt(d.nome), login = norm(d.login).replace(/\s/g, '');
      if (!nome) fail('Informe o nome do usuário.');
      if (!/^[a-z0-9._-]{3,30}$/.test(login)) fail('Login deve ter de 3 a 30 caracteres: letras, números, ponto, hífen ou sublinhado.');
      if (state.users.some(u => u.login === login && (!ex || u.id !== ex.id))) fail('Já existe um usuário com este login.');
      if (!PERFIS[d.perfil]) fail('Perfil inválido.');
      if (!ex || d.senha) { if (String(d.senha || '').length < 6) fail('A senha deve ter pelo menos 6 caracteres.'); }
      return { nome, login };
    }
    function hasUsers() { return state.users.some(u => u.ativo); }
    function setupAdmin(d) {
      if (state.users.length) fail('O administrador inicial já foi criado. Faça login.');
      const { nome, login: lg } = validarUsuario(Object.assign({}, d, { perfil: 'admin' }));
      const salt = uid('s');
      const u = stamp({ nome, login: lg, perfil: 'admin', cargo: txt(d.cargo), email: txt(d.email), salt, hash: hashSenha(salt, d.senha), ativo: true }, 'usr');
      state.users.push(u);
      session = { userId: u.id, inicio: nowISO() };
      try { mutate(() => log({ acao: 'usuario.criado', entidade: 'usuario', entidadeId: u.id, detalhe: `Administrador inicial "${lg}" criado.` })); }
      catch (e) { state.users = state.users.filter(x => x.id !== u.id); session = null; throw e; }
      if (sessStore) sessStore.set('session', JSON.stringify(session));
      return user();
    }
    function login(lg, senha) {
      const u = state.users.find(x => x.login === norm(lg).replace(/\s/g, '') && x.ativo);
      if (!u || hashSenha(u.salt, String(senha || '')) !== u.hash) fail('Usuário ou senha inválidos.', 'AUTH');
      session = { userId: u.id, inicio: nowISO() };
      if (sessStore) sessStore.set('session', JSON.stringify(session));
      return user();
    }
    function logout() { session = null; if (sessStore) sessStore.remove('session'); }
    /** Só na DEMONSTRAÇÃO (dados fictícios, armazenamento separado): entrar escolhendo o usuário, sem senha gravada no código. */
    function usuariosDemo() { if (!demo) fail('Disponível só na demonstração.', 'PERMISSAO'); return state.users.filter(u => u.ativo).map(u => ({ login: u.login, nome: u.nome, perfil: PERFIS[u.perfil].rotulo, cargo: u.cargo || '' })); }
    function entrarDemo(lg) {
      if (!demo) fail('Entrada sem senha só existe na demonstração.', 'PERMISSAO');
      const u = state.users.find(x => x.login === lg && x.ativo); if (!u) fail('Usuário de demonstração não encontrado.', 'AUTH');
      session = { userId: u.id, inicio: nowISO() }; if (sessStore) sessStore.set('session', JSON.stringify(session)); return user();
    }
    /** Entrada pela conta da nuvem: quem entrou no painel com o e-mail de um perfil deste módulo entra direto, sem nova senha. Só no modo real. Se o módulo tiver um único perfil ativo, ele é usado. */
    function entrarPelaNuvem(email) {
      if (demo) fail('Entrada pela nuvem só existe no modo real.', 'PERMISSAO');
      const e = String(email || '').trim().toLowerCase();
      const ativos = state.users.filter(x => x.ativo);
      const u = (e && ativos.find(x => String(x.email || '').trim().toLowerCase() === e)) || (ativos.length === 1 ? ativos[0] : null);
      if (!u) fail('Nenhum perfil deste módulo tem o e-mail da sua conta. Informe o e-mail no perfil em Configurações › Usuários.', 'AUTH');
      session = { userId: u.id, inicio: nowISO() }; if (sessStore) sessStore.set('session', JSON.stringify(session)); return user();
    }
    function listarUsuarios() { guard('usuario.salvar'); return state.users.map(u => ({ id: u.id, nome: u.nome, login: u.login, perfil: u.perfil, cargo: u.cargo || '', email: u.email || '', ativo: u.ativo, updatedAt: u.updatedAt })); }
    function equipe(incluirInativos) { guard('ler'); return state.users.filter(u => incluirInativos || u.ativo).map(u => ({ id: u.id, nome: u.nome, cargo: u.cargo || '', perfil: u.perfil, ativo: u.ativo })).sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR')); }
    function salvarUsuario(d) {
      guard('usuario.salvar');
      const ex = d.id ? state.users.find(u => u.id === d.id) : null;
      if (d.id && !ex) fail('Usuário não encontrado.');
      const { nome, login: lg } = validarUsuario(d, ex);
      const ativo = d.ativo !== false;
      if (ex && ex.perfil === 'admin' && ex.ativo && (d.perfil !== 'admin' || !ativo) && state.users.filter(u => u.perfil === 'admin' && u.ativo).length <= 1) fail('É preciso manter pelo menos um administrador ativo.');
      return mutate(() => {
        if (ex) {
          const mud = [];
          if (ex.nome !== nome) mud.push('nome'); if (ex.login !== lg) mud.push('login'); if (ex.perfil !== d.perfil) mud.push(`perfil ${ex.perfil}→${d.perfil}`); if (ex.ativo !== ativo) mud.push(ativo ? 'reativado' : 'inativado');
          Object.assign(ex, { nome, login: lg, perfil: d.perfil, cargo: txt(d.cargo), email: txt(d.email), ativo, updatedAt: nowISO() });
          if (d.senha) { ex.salt = uid('s'); ex.hash = hashSenha(ex.salt, d.senha); mud.push('senha redefinida'); }
          log({ acao: 'usuario.atualizado', entidade: 'usuario', entidadeId: ex.id, detalhe: `Usuário "${lg}": ${mud.join(', ') || 'dados atualizados'}.` });
          return { id: ex.id };
        }
        const salt = uid('s');
        const u = stamp({ nome, login: lg, perfil: d.perfil, cargo: txt(d.cargo), email: txt(d.email), salt, hash: hashSenha(salt, d.senha), ativo }, 'usr');
        state.users.push(u);
        log({ acao: 'usuario.criado', entidade: 'usuario', entidadeId: u.id, detalhe: `Usuário "${lg}" (${PERFIS[d.perfil].rotulo}) criado.` });
        return { id: u.id };
      });
    }
    function alterarSenha(atual, nova) {
      const s = guard('senha.propria');
      const u = state.users.find(x => x.id === s.userId);
      if (hashSenha(u.salt, String(atual || '')) !== u.hash) fail('Senha atual incorreta.');
      if (String(nova || '').length < 6) fail('A nova senha deve ter pelo menos 6 caracteres.');
      mutate(() => { u.salt = uid('s'); u.hash = hashSenha(u.salt, nova); u.updatedAt = nowISO(); log({ acao: 'usuario.senha', entidade: 'usuario', entidadeId: u.id, detalhe: 'Senha alterada pelo próprio usuário.' }); });
    }

    /* ---------- histórico (autor e data de cada alteração) ---------- */
    function log(h) {
      const u = user();
      const reg = Object.assign({ id: uid('his'), ts: nowISO(), usuario: u ? u.login : 'sistema', usuarioNome: u ? u.nome : 'Sistema', schemaVersion: SCHEMA_VERSION }, h);
      state.historico.push(reg);
      if (EVENTOS[reg.acao]) queue(EVENTOS[reg.acao], Object.assign({ modulo: MODULO_ID, entidade: reg.entidade, id: reg.entidadeId || null, codigo: reg.codigo || null, ts: reg.ts }, h.payload || {}));
    }
    const nomeUser = id => { const u = byId('users', id); return u ? u.nome : ''; };
    const fD = v => (v ? Dates.fmt(v) : '—');

    /* ---------- relatórios ---------- */
    function descreverFiltros(f) {

        const linhas = l.map(p => [p.ref, p.vigente ? 'Sim' : 'Não', p.clienteNome, p.oportunidadeCodigo, p.escopo, fM(p.valor), fD(p.emissao), fD(p.envio), fD(p.validade), p.prazoExecucao, p.situacaoRotulo]);

        for (const p of listarPropostas(Object.assign({ situacao: 'vencida' }, b)).filter(p => p.oportunidadeAberta)) linhas.push(['Proposta vencida sem resposta', p.clienteNome, p.ref, p.responsavelNome, fD(p.validade), 'renovar validade ou nova revisão']);

      for (const p of state.propostas) if (norm(p.numero + '-' + p.revisao + ' ' + p.escopo).includes(b)) r.push({ tipo: 'oportunidade', id: p.oportunidadeId, titulo: `Proposta ${p.numero}-${p.revisao}`, sub: SIT_PROP[p.situacao] });
      return r.slice(0, 25);
    }
    /** Maior número de proposta já cadastrado aqui — só referência; NÃO é a sequência oficial. */
    /** Próximo número SUGERIDO = maior entre o último oficial registrado e o maior cadastrado aqui, + 1. Sempre conferir na pasta. */
    function numeracao() {

      const semBin = l => (l || []).map(a => ({ id: a.id, nome: a.nome, url: a.url || '', tamanho: a.tamanho || 0 }));
      for (const o of s.oportunidades) { o.anexos = semBin(o.anexos); if (o.ganho) o.ganho.evidenciaAnexos = semBin(o.ganho.evidenciaAnexos); }

    }

    return {
      MODULO_ID, SCHEMA_VERSION, demo, TIPOS_ATIV, SIT_ATIV, SIT_PROP, PRIORIDADES, SIT_VENC, PERFIS, BASES_PERIODO, UFS,
      Dates, Money, hoje, dataLocal, on, emitir: (e, p) => emit(e, p),
      hasUsers, setupAdmin, login, logout, usuariosDemo, entrarDemo, entrarPelaNuvem, user, can, isAdmin, listarUsuarios, salvarUsuario, alterarSenha, equipe,
      config, salvarConfig, salvarEtapas, etapas: () => { guard('ler'); return clone(etapas()); }, servicos, salvarServico,
      verificarDuplicidade, salvarCliente, definirCondicao, salvarUnidade, salvarContato, arquivar, clientes, clienteDetalhe,
      salvarOportunidade, moverEtapa, ganhar, perder, reabrir, listarOportunidades, oportunidadeDetalhe, kanban,
      atualizarPassagem, resumoPassagem,
      salvarAtividade, concluirAtividade, cancelarAtividade, listarAtividades,
      salvarProposta, novaRevisao, sugestaoRetorno, listarPropostas, maiorNumeroProposta,
      salvarVencimento, listarVencimentos, oportunidadeDeVencimento, numeracao, salvarNumeracao, preverLote, importarLote, COLS_LOTE,
      silenciar, alertas, agenda, indicadores, getKPIs,

  }

  return { createCore, Dates, Money, cnpjValido, SCHEMA_VERSION, MODULO_ID, REGRAS, STATUS_REGRA };

  /* ---------- importação em lote ---------- */
  function modeloCSV() {
    const cab = ['Empresa', 'Nome fantasia', 'CNPJ', 'Cidade', 'UF', 'Unidade', 'Endereço', 'Contato', 'Cargo', 'Telefone', 'WhatsApp', 'E-mail', 'Serviço', 'Necessidade', 'Origem', 'Responsável', 'Valor estimado', 'Previsão de fechamento', 'Prioridade', 'Próxima ação', 'Data da próxima ação'];
    const ex = ['EXEMPLO Indústria Ltda (apague esta linha)', 'EXEMPLO', '', 'Guarulhos', 'SP', 'Fábrica 1', 'Rua Exemplo, 100', 'Fulano', 'Compras', '11 3000-0000', '11 99999-0000', 'fulano@exemplo.com', 'AVCB', 'Pedido de orçamento para renovar AVCB', 'Site', core.user().login, '15.000,00', '30/11/2026', 'Alta', 'Ligar para entender o escopo', '22/10/2026'];
    const q = v => (/[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v);
    return '\uFEFF' + [cab, ex].map(r => r.map(q).join(';')).join('\r\n');
  }

      p2.addEventListener('change', e => { if (e.target.matches('[data-imp-todos]')) $$('[data-imp-inc]:not(:disabled)', p2).forEach(x => { x.checked = e.target.checked; }); contar(); });

        ${o.propostas.length ? o.propostas.map(p => `<div class="bloco ${p.vigente ? 'compartilhavel' : ''}"><div class="linha entre"><b>${esc(p.ref)}</b> ${p.vigente ? '<span class="chip etapa">Vigente</span>' : ''} ${chipProp(p)} ${p.vigente && o.aberta && pode ? `<button class="btn btn-sm" data-act="editar-prop" data-id="${p.id}">Editar / registrar envio</button>` : ''}</div>
          <dl class="kvs"><div class="kv"><dt>Valor</dt><dd>${fm(p.valor)}</dd></div><div class="kv"><dt>Emissão · envio</dt><dd>${fd(p.emissao)} · ${fd(p.envio)}</dd></div><div class="kv"><dt>Validade</dt><dd>${fd(p.validade)}${p.vigente && p.aguardando && p.diasParaVencer != null ? ` <span class="${p.diasParaVencer <= core.config().diasAvisoValidade ? 'txt-alerta' : 'muted'}">(${p.diasParaVencer} dia(s))</span>` : ''}</dd></div><div class="kv"><dt>Prazo de execução</dt><dd>${esc(p.prazoExecucao || '—')}</dd></div><div class="kv"><dt>Condições de pagamento</dt><dd>${esc(p.condicoesPagamento || '—')}</dd></div></dl>
          <p class="pre peq">${esc(p.escopo || '')}</p>${p.obs ? `<p class="peq muted pre">${esc(p.obs)}</p>` : ''}${listaAnexos(p.anexos)}</div>`).join('') : '<p class="vazio">Nenhuma proposta registrada.</p>'}`;
    }
    if (aba === 'fechamento') {
      if (o.aberta) corpo = `<p>Para fechar, registre o resultado. Os requisitos de cada caminho estão no formulário.</p><div class="linha">${pode ? `<button class="btn btn-primario" data-act="ganhar">Marcar como ganha</button><button class="btn btn-perigo" data-act="perder">Marcar como perdida</button>` : '<p class="muted">Só o responsável ou um administrador fecha esta oportunidade.</p>'}</div>`;
      else if (o.tipoEtapa === 'perdida') corpo = `<div class="bloco"><h3>Perdida em ${fd(o.perda.data)}</h3><p><b>Motivo:</b> ${esc(o.perda.motivo)}</p>${o.perda.obs ? `<p class="pre">${esc(o.perda.obs)}</p>` : ''}${o.perda.concorrente ? `<p>Concorrente: ${esc(o.perda.concorrente)}</p>` : ''}<p class="muted xs">Registrado por ${esc(o.perda.registradoPor)}.</p></div>${pode ? '<button class="btn" data-act="reabrir">Reabrir</button>' : ''}`;
      else {
        const g = o.ganho, p = o.passagem, r = core.resumoPassagem(o.id);
        corpo = `<div class="bloco ok"><h3>Ganha em ${fd(g.data)} — ${fm(g.valor)}</h3><p>Proposta: <b>${esc(g.propostaRef || 'sem número')}</b> · Contato: <b>${esc(g.contatoNome)}</b></p><p class="pre peq">Escopo: ${esc(g.escopo)}</p><p class="peq">Evidência do aceite: ${esc(g.evidencia || '—')}</p>${listaAnexos(g.evidenciaAnexos)}<p class="muted xs">Venda registrada por ${esc(g.registradoPor)}. Não indica serviço executado nem valor recebido.</p></div>
          <div class="bloco ${p.situacao === 'concluida' ? 'ok' : 'interno'}"><div class="linha entre"><h3>Passagem para Operações — ${p.situacao === 'concluida' ? 'CONCLUÍDA' : 'PENDENTE'}</h3>${p.concluidaEm ? `<span class="muted xs">por ${esc(p.concluidaPor)} em ${esc(D.fmtTs(p.concluidaEm))}</span>` : ''}</div>
          <form data-passagem class="grade"><div class="grade">${p.checklist.map((c, i) => `<label class="chk-f"><input type="checkbox" name="c${i}" ${c.ok ? 'checked' : ''} ${p.situacao === 'concluida' && !adm ? 'disabled' : ''}> ${esc(c.item)}</label>`).join('')}</div>
          <label class="campo">Pendências para a Operação<textarea name="pendencias" ${p.situacao === 'concluida' && !adm ? 'disabled' : ''}>${esc(p.pendencias)}</textarea></label>
          ${p.justificativa ? `<p class="peq">Justificativa registrada: ${esc(p.justificativa)}</p>` : ''}
          ${pode && (p.situacao !== 'concluida' || adm) ? `<div class="linha"><button type="button" class="btn" data-act="pass-salvar">Salvar checklist</button>${p.situacao !== 'concluida' ? '<button type="button" class="btn btn-primario" data-act="pass-concluir">Concluir passagem</button>' : '<button type="button" class="btn" data-act="pass-reabrir">Voltar a pendente</button>'}</div>` : ''}</form></div>
          <h3>Resumo para a operação</h3><textarea class="texto-copia" rows="12" readonly data-resumo>${esc(r.texto)}</textarea>
          <div class="linha"><button class="btn" data-act="copiar-resumo">Copiar texto</button><button class="btn" data-act="pdf-passagem">Imprimir / PDF</button>${adm ? '<button class="btn" data-act="reabrir">Reabrir venda</button>' : ''}</div>`;
      }
      if (o.fechamentosAnteriores.length) corpo += `<h3>Fechamentos anteriores</h3><ul class="lista-simples">${o.fechamentosAnteriores.map(x => `<li>${x.tipo === 'ganha' ? 'Ganha ' + fm(x.ganho.valor) + ' em ' + fd(x.ganho.data) : 'Perdida (' + esc(x.perda.motivo) + ') em ' + fd(x.perda.data)} — reaberta por ${esc(x.reabertoPor)} em ${esc(D.fmtTs(x.reabertoEm))}: ${esc(x.motivo)}</li>`).join('')}</ul>`;
    }
    if (aba === 'historico') corpo = `<h3>Mudanças de etapa</h3><div class="tabela-wrap"><table class="tab"><thead><tr><th>Quando</th><th>De</th><th>Para</th><th>Quem</th><th>Obs.</th></tr></thead><tbody>${o.etapaHistRotulos.slice().reverse().map(h => `<tr><td class="nowrap">${esc(D.fmtTs(h.ts))}</td><td>${esc(h.deRotulo)}</td><td>${esc(h.paraRotulo)}</td><td>${esc(h.usuario)}</td><td>${esc(h.obs || '')}</td></tr>`).join('')}</tbody></table></div>
      <h3>Registro de alterações</h3>${tabelaHistorico(o.historico)}`;
    $('[data-det]', detModal.el).innerHTML = `<div class="det-cab"><div class="linha">${mover}<span class="chip prio-${o.prioridade}">${esc(o.prioridadeRotulo)}</span>${o.incompleta ? '<span class="chip sit-aguardando">Rascunho</span>' : ''}</div>
      <div class="linha">${pode && (o.aberta || adm) ? '<button class="btn btn-sm" data-act="editar-op">Editar</button>' : ''}${o.aberta && pode ? '<button class="btn btn-sm btn-primario" data-act="ganhar">Ganha</button><button class="btn btn-sm btn-perigo" data-act="perder">Perdida</button>' : ''}${!o.aberta && pode && (o.tipoEtapa === 'perdida' || adm) ? '<button class="btn btn-sm" data-act="reabrir">Reabrir</button>' : ''}${adm ? `<button class="btn btn-sm" data-act="arquivar-op">${o.arquivado ? 'Restaurar' : 'Arquivar'}</button>` : ''}</div></div>
      ${o.arquivado ? '<p class="msg-aviso">Oportunidade arquivada.</p>' : ''}
      <div class="sub-abas" role="tablist">${abas.map(([k, r]) => `<button type="button" data-det-aba="${k}" aria-pressed="${aba === k}">${esc(r)}</button>`).join('')}</div>${corpo}`;
  }
  function tabelaAtividades(l, semCliente) {
    if (!l.length) return '<p class="vazio">Nenhuma atividade.</p>';
    return `<div class="tabela-wrap"><table class="tab"><thead><tr><th>Data</th><th>Tipo</th><th>Descrição</th>${semCliente ? '' : '<th>Empresa</th>'}<th>Responsável</th><th>Situação / resultado</th><th></th></tr></thead><tbody>${l.map(a => `<tr class="${a.situacao !== 'pendente' ? 'fechada' : ''} ${a.farol ? 'farol-' + a.farol : ''}"><td class="nowrap">${fd(a.prazo)}${a.hora ? ' ' + esc(a.hora) : ''}</td><td>${esc(a.tipoRotulo)}</td><td>${esc(a.descricao)}${a.origemAuto ? ' <span class="chip">sugerida</span>' : ''}</td>${semCliente ? '' : `<td>${esc(a.clienteNome)}</td>`}<td>${esc(a.responsavelNome)}</td>
      <td>${a.situacao === 'pendente' ? (a.atrasada ? `<span class="chip sit-vencida">${a.diasAtraso} dia(s) de atraso</span>` : '<span class="chip sit-aberta">Pendente</span>') : `<span class="chip sit-${a.situacao}">${esc(a.situacaoRotulo)}</span> ${esc(a.resultado)}${a.concluidaEm ? ' <span class="muted xs">(' + fd(a.concluidaEm) + ')</span>' : ''}`}</td>
      <td class="acoes">${a.situacao === 'pendente' && a.podeEditar ? `<button class="btn btn-sm btn-primario" data-act="concluir" data-id="${a.id}">Concluir</button><button class="btn btn-sm" data-act="editar-atv" data-id="${a.id}">Editar</button><button class="btn btn-sm" data-act="cancelar-atv" data-id="${a.id}">Cancelar</button>` : ''}</td></tr>`).join('')}</tbody></table></div>`;
  }
  function tabelaHistorico(l) {
    if (!l.length) return '<p class="vazio">Sem registros.</p>';
    return `<div class="tabela-wrap"><table class="tab"><thead><tr><th>Quando</th><th>Quem</th><th>O quê</th></tr></thead><tbody>${l.map(h => `<tr><td class="nowrap">${esc(D.fmtTs(h.ts))}</td><td>${esc(h.usuarioNome)}</td><td>${h.campo ? `<b>${esc(h.campo)}</b>: ${esc(h.de)} → ${esc(h.para)}${h.detalhe ? ' — ' + esc(h.detalhe) : ''}` : esc(h.detalhe || h.acao)}${h.codigo ? ` <span class="muted xs">${esc(h.codigo)}</span>` : ''}</td></tr>`).join('')}</tbody></table></div>`;
  }

  /* ---------- detalhe do cliente ---------- */
  let cliModal = null, cliId = null;
  function abrirCliente(id) { cliId = id; if (cliModal) cliModal.fechar(); cliModal = modal('Empresa', '<div data-cli></div>', { largo: true, aoFechar: () => { cliModal = null; cliId = null; } }); pintarCliente(); }
  function pintarCliente() {
    if (!cliModal) return;
    const c = core.clienteDetalhe(cliId), adm = core.isAdmin();
    $('.modal-cab h2', cliModal.el).textContent = `${c.codigo} · ${c.razaoSocial}`;
    $('[data-cli]', cliModal.el).innerHTML = `<div class="det-cab"><div class="linha"><span class="chip ${c.condicao === 'cliente' ? 'sit-concluida' : 'sit-aberta'}">${c.condicaoRotulo}</span>${c.clienteDesde ? `<span class="muted xs">desde ${fd(c.clienteDesde)}${c.condicaoOrigem ? ' · ' + esc(c.condicaoOrigem) : ''}</span>` : ''}${c.arquivado ? '<span class="chip sit-cancelada">Arquivada</span>' : ''}</div>
      <div class="linha"><button class="btn btn-sm btn-primario" data-act="nova-op-cli">+ Oportunidade</button><button class="btn btn-sm" data-act="registrar-cli">Registrar contato</button><button class="btn btn-sm" data-act="editar-cli">Editar</button>${c.condicao === 'prospect' ? '<button class="btn btn-sm" data-act="marcar-cliente">Marcar como cliente</button>' : adm ? '<button class="btn btn-sm" data-act="marcar-prospect">Voltar a prospect</button>' : ''}${adm ? `<button class="btn btn-sm" data-act="arquivar-cli">${c.arquivado ? 'Restaurar' : 'Arquivar'}</button>` : ''}</div></div>
      <dl class="kvs"><div class="kv"><dt>Nome fantasia</dt><dd>${esc(c.nomeFantasia || '—')}</dd></div><div class="kv"><dt>CNPJ</dt><dd>${esc(c.cnpj || 'NÃO INFORMADO')}</dd></div><div class="kv"><dt>Segmento</dt><dd>${esc(c.segmento || '—')}</dd></div><div class="kv"><dt>Cidade / UF</dt><dd>${esc([c.cidade, c.uf].filter(Boolean).join('/') || '—')}</dd></div><div class="kv"><dt>Responsável comercial</dt><dd>${esc(c.responsavelNome)}</dd></div><div class="kv"><dt>Origem</dt><dd>${esc(c.origem || '—')}</dd></div><div class="kv"><dt>Último contato</dt><dd>${c.ultimoContato ? fd(c.ultimoContato) + ` (${c.diasSemContato} dia(s))` : 'nenhum registrado'}</dd></div><div class="kv"><dt>Vendido (total)</dt><dd>${fm(c.valorVendido)}</dd></div></dl>
      ${c.obs ? `<p class="pre peq">${esc(c.obs)}</p>` : ''}
      <div class="linha entre"><h3>Unidades e endereços</h3><button class="btn btn-sm" data-act="nova-uni">+ Unidade</button></div>
      ${c.unidades.length ? `<ul class="lista-simples">${c.unidades.map(u => `<li><b>${esc(u.nome)}</b> ${esc([u.endereco, u.cidade, u.uf].filter(Boolean).join(' — '))} <button class="btn-link" data-act="editar-uni" data-id="${u.id}">editar</button></li>`).join('')}</ul>` : '<p class="muted peq">Nenhuma unidade.</p>'}
      <div class="linha entre"><h3>Contatos</h3><button class="btn btn-sm" data-act="novo-ct">+ Contato</button></div>
      ${c.contatos.length ? `<ul class="lista-simples">${c.contatos.map(k => `<li class="linha entre"><span><b>${esc(k.nome)}</b>${k.cargo ? ' · ' + esc(k.cargo) : ''}${k.principal ? ' <span class="chip etapa">principal</span>' : ''}${k.ativo === false ? ' <span class="chip sit-cancelada">saiu</span>' : ''}<br><span class="peq muted">${esc([k.telefone, k.whatsapp && 'WhatsApp ' + k.whatsapp, k.email].filter(Boolean).join(' · '))}</span></span><span class="linha">${contatoLinks(k)}<button class="btn btn-sm" data-act="editar-ct" data-id="${k.id}">Editar</button></span></li>`).join('')}</ul>` : '<p class="muted peq">Nenhum contato.</p>'}
      <h3>Oportunidades</h3>${tabelaOports(c.oportunidades)}
      ${c.complementares.length ? `<h3>Serviços complementares a oferecer</h3><p class="ajuda">Serviços da mesma área do que o cliente já contratou e que ainda não foram negociados.</p><div class="linha">${c.complementares.slice(0, 12).map(s => `<button class="btn btn-sm" data-act="op-complementar" data-id="${s.id}">+ ${esc(s.nome)}</button>`).join('')}</div>` : ''}
      <div class="linha entre"><h3>Vencimentos e renovações</h3><button class="btn btn-sm" data-act="novo-venc-cli">+ Vencimento</button></div>${tabelaVenc(c.vencimentos)}
      <h3>Atividades</h3>${tabelaAtividades(c.atividades)}
      <h3>Histórico</h3>${tabelaHistorico(c.historico)}`;
  }
  function tabelaOports(l) {
    if (!l.length) return '<p class="vazio">Nenhuma oportunidade.</p>';
    return `<div class="tabela-wrap"><table class="tab"><thead><tr><th>Código</th><th>Empresa</th><th>Título / serviço</th><th>Etapa</th><th>Responsável</th><th class="num">Valor</th><th>Próxima ação</th></tr></thead><tbody>${l.map(o => `<tr class="clicavel ${o.aberta ? '' : 'fechada'} ${o.farol ? 'farol-' + o.farol : ''}" data-act="abrir-op" data-id="${o.id}" tabindex="0"><td class="nowrap">${esc(o.codigo)}</td><td>${esc(o.clienteNome)}</td><td>${esc(o.titulo)}${o.incompleta ? ' <span class="chip sit-aguardando">rascunho</span>' : ''}<br><span class="muted xs">${esc(o.servicoNome)}</span></td><td>${chipEtapa(o)}</td><td>${esc(o.responsavelNome)}</td><td class="num">${fm(o.valorFunil)}<br><span class="muted xs">${esc(o.baseValor)}</span></td>
      <td>${o.proxima ? `<span class="${o.acaoAtrasada ? 'txt-critico' : ''}">${fd(o.proxima.prazo)}</span> ${esc(o.proxima.descricao)}` : o.aberta ? '<span class="txt-critico">sem próxima ação</span>' : fd(o.dataFechamento)}</td></tr>`).join('')}</tbody></table></div>`;
  }
  function tabelaVenc(l) {
    if (!l.length) return '<p class="vazio">Nenhum vencimento registrado.</p>';
    return `<div class="tabela-wrap"><table class="tab"><thead><tr><th>Vencimento</th><th>O que vence</th><th>Empresa / unidade</th><th>Lembrete</th><th>Data</th><th>Situação</th><th></th></tr></thead><tbody>${l.map(v => `<tr class="${v.situacao !== 'ativo' ? 'fechada' : ''} ${v.farol ? 'farol-' + v.farol : ''}"><td class="nowrap ${v.vencido ? 'txt-critico' : v.aTratar ? 'txt-alerta' : ''}">${fd(v.dataVencimento)}${v.situacao === 'ativo' ? `<br><span class="xs">${v.vencido ? 'vencido' : v.diasParaVencer + ' dia(s)'}</span>` : ''}</td><td>${esc(v.descricao)}<br><span class="muted xs">${esc(v.servicoNome)}</span></td><td>${esc(v.clienteNome)}${v.unidadeNome ? '<br><span class="muted xs">' + esc(v.unidadeNome) + '</span>' : ''}</td><td class="nowrap">${fd(v.lembreteEm)}</td>
      <td>${v.conferido ? `<span class="chip sit-concluida" title="${esc(v.fonte)}">CONFIRMADO</span>` : '<span class="chip sit-aguardando">A VALIDAR</span>'}</td><td>${esc(v.situacaoRotulo)}${v.oportunidadeCodigo ? `<br><button class="btn-link" data-act="abrir-op" data-id="${v.oportunidadeId}">${esc(v.oportunidadeCodigo)}</button>` : ''}</td>
      <td class="acoes">${v.situacao === 'ativo' && !v.oportunidadeAberta ? `<button class="btn btn-sm btn-primario" data-act="op-venc" data-id="${v.id}">Abrir oportunidade</button>` : ''}<button class="btn btn-sm" data-act="editar-venc" data-id="${v.id}">Editar</button></td></tr>`).join('')}</tbody></table></div>`;
  }

  /* ---------- telas ---------- */
  function linhaAtv(a) {
    return `<li class="item-agenda ${a.farol ? 'farol-' + a.farol : ''}"><div class="ia-data">${a.atrasada ? `<b class="txt-critico">${fd(a.prazo)}</b><span class="xs txt-critico">${a.diasAtraso} dia(s)</span>` : `<b>${a.prazo === core.hoje() ? 'Hoje' : fd(a.prazo)}</b>`}${a.hora ? `<span class="xs">${esc(a.hora)}</span>` : ''}</div>
      <div class="ia-corpo"><div><span class="chip">${esc(a.tipoRotulo)}</span>${a.origemAuto ? ' <span class="chip">sugerida</span>' : ''} <b>${esc(a.descricao)}</b></div><div class="peq muted">${esc(a.clienteNome)}${a.oportunidadeCodigo ? ` · <button class="btn-link" data-act="abrir-op" data-id="${a.oportunidadeId}">${esc(a.oportunidadeCodigo + ' ' + a.oportunidadeTitulo)}</button>` : ''}${UI.agendaTodos ? ' · ' + esc(a.responsavelNome) : ''}${a.contato ? ' · ' + esc(a.contato.nome) : ''}</div></div>
      <div class="ia-acoes linha">${contatoLinks(a.contato)}${a.podeEditar ? `<button class="btn btn-sm btn-primario" data-act="concluir" data-id="${a.id}">Concluir</button><button class="btn btn-sm" data-act="editar-atv" data-id="${a.id}">Reagendar</button>` : ''}</div></li>`;
  }
  function telaAgenda() {
    const ag = core.agenda({ todos: UI.agendaTodos });
    const sec = (tit, n, html, cls) => `<section class="cartao ${cls || ''}"><div class="cab"><h2>${esc(tit)} <span class="chip-n">${n}</span></h2></div>${html}</section>`;
    const lista = l => (l.length ? `<ul class="lista-agenda">${l.map(linhaAtv).join('')}</ul>` : '<p class="vazio">Nada aqui.</p>');
    return `<div class="cab-tela"><h1>${UI.agendaTodos ? 'Agenda comercial da equipe' : 'Minha agenda comercial'}</h1>
      <div class="linha"><div class="alternar" role="group" aria-label="Escopo"><button data-act="ag-escopo" data-v="0" aria-pressed="${!UI.agendaTodos}">Minha</button><button data-act="ag-escopo" data-v="1" aria-pressed="${UI.agendaTodos}">Equipe</button></div>
      <button class="btn btn-primario" data-act="registrar">+ Registrar contato</button><button class="btn" data-act="nova-op">+ Oportunidade</button></div></div>
      <p class="legenda-farol" aria-label="Legenda do farol"><span class="lf farol-verde">em dia</span><span class="lf farol-amarelo">atenção (hoje, rascunho, parada, vence logo, passagem pendente)</span><span class="lf farol-vermelho">atrasado, sem próxima ação ou proposta vencida</span></p>
      <div class="kpis">
        <button class="kpi ${ag.atrasadas.length ? 'atencao' : ''}" data-act="rolar" data-alvo="sec-atras"><span class="rot">Atrasadas</span><span class="val">${ag.atrasadas.length}</span></button>
        <button class="kpi" data-act="rolar" data-alvo="sec-hoje"><span class="rot">Hoje</span><span class="val">${ag.hoje.length}</span></button>
        <button class="kpi" data-act="rolar" data-alvo="sec-prox"><span class="rot">Próximos 7 dias</span><span class="val">${ag.proximas.length}</span></button>
        <button class="kpi ${ag.semAcao.length ? 'atencao' : ''}" data-act="rolar" data-alvo="sec-sem"><span class="rot">Oportunidades sem próxima ação</span><span class="val">${ag.semAcao.length}</span></button>
        <button class="kpi" data-act="rolar" data-alvo="sec-prop"><span class="rot">Propostas aguardando retorno</span><span class="val">${ag.aguardando.length}</span></button></div>
      <div class="agenda-grade"><div>
      <div id="sec-atras">${sec('Atrasadas', ag.atrasadas.length, lista(ag.atrasadas), ag.atrasadas.length ? 'erro-tela' : '')}</div>
      <div id="sec-hoje">${sec('Hoje', ag.hoje.length, lista(ag.hoje))}</div>

  function imprimir(html) {
    $('#area-impressao').innerHTML = html;
    document.body.classList.add('imprimindo-doc');
    const fim = () => { document.body.classList.remove('imprimindo-doc'); window.removeEventListener('afterprint', fim); };

    setTimeout(() => { window.print(); setTimeout(fim, 1500); }, 60);
  }
  function baixar(nome, conteudo, tipo) {
    const b = new Blob([conteudo], { type: tipo }); const a = document.createElement('a');

  }

    try { await navigator.clipboard.writeText(texto); toast('Texto copiado.', 'ok'); }
    catch (e) { const t = document.createElement('textarea'); t.value = texto; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); toast('Texto copiado.', 'ok'); } catch (er) { toast('Não foi possível copiar: selecione o texto manualmente.', 'erro'); } t.remove(); }
