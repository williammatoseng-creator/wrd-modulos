      render(); return;
    }
    if (t.dataset.pp) { const f = UI.F.painel; f.periodo = Object.assign({ de: D.inicioMes(core.hoje()), ate: core.hoje() }, f.periodo || {}); f.periodo[t.dataset.pp] = t.value; render(); return; }
    if (t.closest('[data-rel]')) {
      const f = UI.rel.f;
      if (t.dataset.rf) f[t.dataset.rf] = t.type === 'checkbox' ? t.checked : t.value;
      if (t.dataset.rp) { f.periodo = Object.assign({ base: UI.rel.tipo === 'propostas' ? 'envio' : 'criacao' }, f.periodo || {}); f.periodo[t.dataset.rp] = t.value; }
      for (const k of Object.keys(f)) if (f[k] === '' || f[k] === false) delete f[k];
      render(); return;
    }
    if (t.matches('[data-imp]')) {
      const arq = t.files[0]; if (!arq) return;
      if (!(await confirmar('Importar backup', 'Os dados atuais deste navegador serão SUBSTITUÍDOS pelos do arquivo. Exporte um backup antes, se precisar.', 'Substituir'))) { t.value = ''; return; }
      const txt = await arq.text(); const r = await executar(() => core.importarJSON(txt), {}, 'Backup importado.'); t.value = ''; if (r.ok) render();
    }
  });
  let tBusca = null;
  document.addEventListener('input', e => {
    if (e.target.matches('[data-busca]')) {
      clearTimeout(tBusca); const v = e.target.value;
      tBusca = setTimeout(() => {
        const box = $('[data-busca-res]'); const r = v.trim().length >= 2 ? core.busca(v) : [];
        box.classList.toggle('oculto', v.trim().length < 2);
        box.innerHTML = r.length ? r.map(x => `<button class="res" data-res data-tipo="${x.tipo}" data-id="${x.id}"><span class="res-tipo">${x.tipo === 'cliente' ? 'Empresa' : 'Oportunidade'}</span><br><b>${esc(x.titulo)}</b> <span class="muted peq">${esc(x.sub)}</span></button>`).join('') : '<p class="muted">Nada encontrado.</p>';
      }, 180);
    }
    if (e.target.matches('[data-f="busca"]')) { clearTimeout(tBusca); const t = e.target; tBusca = setTimeout(() => { const tela = t.closest('[data-filtros]').dataset.filtros; UI.F[tela].busca = t.value; render(); const n = $(`[data-filtros="${tela}"] [data-f="busca"]`); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }, 350); }
    if (e.target.matches('[data-hbusca]')) { clearTimeout(tBusca); const t = e.target; tBusca = setTimeout(() => { UI.hbusca = t.value; render(); const n = $('[data-hbusca]'); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }, 350); }
  });
  document.addEventListener('submit', async e => {
    const f = e.target;
    if (f.matches('[data-passagem]')) { e.preventDefault(); return; }
    if (f.matches('[data-setup]')) { e.preventDefault(); const r = await executar(() => core.setupAdmin(dadosForm(f)), {}, 'Administrador criado.'); if (r.ok) render(); }
    else if (f.matches('[data-login]')) { e.preventDefault(); const d = dadosForm(f); try { core.login(d.login, d.senha); lerNav(); render(); } catch (er) { toast(er.message, 'erro'); } }
    else if (f.matches('[data-senha]')) { e.preventDefault(); const d = dadosForm(f); const r = await executar(() => core.alterarSenha(d.atual, d.nova), {}, 'Senha alterada.'); if (r.ok) f.reset(); }
    else if (f.matches('[data-etapas]')) {
      e.preventDefault();
      const l = $$('.ed-linha[data-eid]', f).map(x => ({ id: x.dataset.eid || undefined, rotulo: $('[data-erot]', x).value, ativo: $('[data-eativo]', x) ? $('[data-eativo]', x).checked : true }));
      const r = await executar(() => core.salvarEtapas(l), {}, 'Etapas salvas.'); if (r.ok) render();
    } else if (f.matches('[data-numeracao]')) { e.preventDefault(); const r = await executar(() => core.salvarNumeracao(dadosForm(f)), {}, 'Numeração salva.'); if (r.ok) render();
    } else if (f.matches('[data-listas]')) {
      e.preventDefault(); const d = dadosForm(f), sp = s => s.split(/\r?\n/).map(x => x.trim()).filter(Boolean);
      const r = await executar(() => core.salvarConfig({ origens: sp(d.origens), segmentos: sp(d.segmentos), motivosPerda: sp(d.motivosPerda), checklistPassagem: sp(d.checklistPassagem) }), {}, 'Listas salvas.'); if (r.ok) render();
    } else if (f.matches('[data-auto]')) {
      e.preventDefault(); const d = dadosForm(f), A = {};
      for (const k of Object.keys(core.config().automacoes)) A[k] = !!d['a_' + k];
      const r = await executar(() => core.salvarConfig(Object.assign({ automacoes: A }, ...['diasParada', 'diasAvisoValidade', 'diasRetornoProposta', 'diasSemContato', 'antecedenciaRenovacao', 'diasLembreteBackup'].map(k => ({ [k]: d[k] })))), {}, 'Automações salvas.'); if (r.ok) render();
    }
  });

  /* ---------- contrato de plug (nexo-plug/1) ---------- */
  const Plug = (function () {
    const ouvintes = {};
    function postar(evento, payload) { try { if (window.parent && window.parent !== window) window.parent.postMessage({ contrato: MANIFEST.contrato, modulo: MANIFEST.id, versao: MANIFEST.versao, evento, payload: payload || {}, demo: core ? core.demo : false, ts: new Date().toISOString() }, '*'); } catch (e) { /* sem painel */ } }
    // Eventos que também vão para a nuvem (tabela eventos), para o painel e as automações. Demonstração não publica.
    const EVENTOS_NUVEM = ['comercial.oportunidade.ganha'];
    function publicarNuvem(evento, payload) {
      if (!EVENTOS_NUVEM.includes(evento) || !NV || !core || core.demo) return;
      const id = payload && (payload.oportunidadeId || payload.id);
      NV.publicarEvento(evento, id, payload || {}).catch(e => console.warn('Evento não publicado na nuvem:', e.message));
    }
    function local(evento, payload) { [...(ouvintes[evento] || []), ...(ouvintes['*'] || [])].forEach(fn => { try { fn(payload, evento); } catch (e) { console.error(e); } }); }
    return {
      repassar(evento, payload) { if (!MANIFEST.eventos_emitidos.includes(evento)) return; local(evento, payload); postar(evento, payload); publicarNuvem(evento, payload); },
      on(evento, fn) { (ouvintes[evento] = ouvintes[evento] || []).push(fn); return () => { ouvintes[evento] = ouvintes[evento].filter(f => f !== fn); }; },
      emit(evento, payload) { if (!MANIFEST.eventos_emitidos.includes(evento)) return { erro: `Evento "${evento}" não declarado no MANIFEST.`, codigo: 'EVENTO' }; local(evento, payload); postar(evento, payload); publicarNuvem(evento, payload); return true; }
    };
  })();
  // Mesmo formato de resposta do WRD Operações: em erro, devolve { erro, codigo } em vez de lançar exceção.
  const semCore = () => ({ erro: 'Módulo sem sessão: abra o módulo e faça login.', codigo: 'AUTH' });
  const tentar = fn => { if (!core || !core.user()) return semCore(); try { return fn(core); } catch (e) { return { erro: e.message, codigo: e.code || 'ERRO' }; } };
  const NEXO = {
    manifest: MANIFEST,
    getState: () => tentar(c => c.getState()),
    getKPIs: () => tentar(c => c.getKPIs()),
    export: formato => tentar(c => {
      if (!MANIFEST.exporta.includes(formato)) return { erro: 'Formato não suportado. Use: ' + MANIFEST.exporta.join(', ') };
      if (formato === 'pdf') { if (!c.can('exportar')) return { erro: 'Acesso negado: o perfil não permite exportar.', codigo: 'PERMISSAO' }; UI.rel = { tipo: 'oportunidades', f: {} }; pdfRelatorio(); return true; }
      return c.exportar(formato);
    }),
    on: Plug.on,
    emit: Plug.emit
  };
  window.NEXO_MODULE = NEXO;
  // Pedidos do painel (somente leitura): { contrato:'nexo-plug/1', pedido:'manifest'|'getKPIs'|'getState'|'export', args:[], id }
  window.addEventListener('message', e => {
    if (window.parent === window || e.source !== window.parent) return;
    const d = e.data || {};
    if (d.contrato !== MANIFEST.contrato || !d.pedido) return;
    const mapa = { manifest: () => MANIFEST, getKPIs: () => NEXO.getKPIs(), getState: () => NEXO.getState(), export: () => (d.args && d.args[0] === 'pdf' ? { erro: 'PDF só pela interface do módulo.' } : NEXO.export(...(d.args || []))) };
    const fn = mapa[d.pedido];
    window.parent.postMessage({ contrato: MANIFEST.contrato, modulo: MANIFEST.id, resposta: d.pedido, id: d.id, dados: fn ? fn() : { erro: 'Pedido desconhecido.' } }, '*');
  });

  /* ---------- início ---------- */
  let m0 = sess.get('modo');
  if (m0 === 'real' || m0 === 'demo') abrirModo(m0); else render();
  if (core) Plug.repassar('comercial.modulo.pronto', { modulo: MANIFEST.id, versao: MANIFEST.versao });
})();

</script>
</body>
